      const updateFile = (idx, patch) => {
        setFiles((prev) => prev.map((f, i) => (i === idx ? { ...f, ...patch } : f)));
      };

      const processFiles = async (rawFiles) => {
        const validFiles = Array.from(rawFiles).filter((f) => isPdfFile(f) || isImageFile(f));
        if (validFiles.length === 0) {
          setError("Solo PDFs e imágenes (PNG, JPG). ¿Otro formato? Convíertelo primero.");
          setStage("error");
          return;
        }

        const initialState = validFiles.map((f) => ({
          name: f.name,
          type: isPdfFile(f) ? "pdf" : "image",
          status: "pending",
          progress: 0,
          text: "",
          error: "",
        }));
        setFiles(initialState);
        setStage("processing");

        const allTexts = [];
        const fileDebug = [];
        for (let i = 0; i < validFiles.length; i++) {
          const file = validFiles[i];
          updateFile(i, { status: "processing", progress: 0 });
          try {
            let text;
            let debugInfo = null;
            if (isPdfFile(file)) {
              text = await extractPdfText(file);
              updateFile(i, { progress: 100 });
            } else {
              const result = await extractImageText(file, (pct) => updateFile(i, { progress: pct }));
              text = result.text;
              debugInfo = {
                name: file.name,
                wordCount: result.wordCount,
                gridSuccess: !!result.gridText,
                rawText: result.rawText,
                gridText: result.gridText,
              };
            }
            updateFile(i, { status: "done", text, progress: 100 });
            allTexts.push(text);
            if (debugInfo) fileDebug.push(debugInfo);
          } catch (e) {
            console.error("[horario] error procesando archivo:", e);
            updateFile(i, { status: "error", error: e.message || String(e) });
          }
        }

        // unir todos los textos extraídos y parsear como uno solo
        const combined = allTexts.join("\n\n--- ARCHIVO ---\n\n");

        // construir rawText extendido con info de debug
        let debugReport = combined;
        if (fileDebug.length > 0) {
          debugReport = "=== INFO DE OCR ===\n";
          fileDebug.forEach((d, idx) => {
            debugReport += `\nArchivo ${idx + 1}: ${d.name}\n`;
            debugReport += `Palabras detectadas: ${d.wordCount}\n`;
            debugReport += `Reconstrucción de rejilla: ${d.gridSuccess ? "✓ ÉXITO" : "✗ FALLÓ"}\n`;
            if (window.__horarioDebug?.gridLog?.length) {
              debugReport += "Log de reconstrucción:\n";
              window.__horarioDebug.gridLog.forEach((l) => debugReport += "  - " + l + "\n");
            }
          });
          debugReport += "\n=== TEXTO QUE SE PASÓ AL PARSER ===\n" + combined;
          if (fileDebug.some(d => !d.gridSuccess)) {
            debugReport += "\n\n=== TEXTO BRUTO DEL OCR (sin reconstruir) ===\n";
            fileDebug.forEach((d) => {
              if (!d.gridSuccess && d.rawText) debugReport += d.rawText + "\n\n";
            });
          }
        }
        setRawText(debugReport);

        if (allTexts.length === 0) {
          setError("No se pudo leer ningún archivo. Revisa que sean PDFs válidos o imágenes legibles.");
          setStage("error");
          return;
        }

        const classes = parseTecSchedule(combined);
        if (classes.length === 0) {
          // Fallback: extraer materias candidatas para asignación manual
          const candList = extractCandidateSubjects(combined);
          if (candList.length > 0) {
            setCandidates(candList);
            setStage("assign");
            return;
          }
          setError("No se detectaron eventos en los archivos. Revisa el debug abajo para ver qué leyó el OCR.");
          setStage("error");
          return;
        }

        // Dedup: si dos archivos tienen la misma clase (mismo code o mismo nombre+horario), conservar una
        const seen = new Set();
        const dedupClasses = [];
        for (const c of classes) {
          const key = c.code || `${c.name}-${c.schedule.map(s => `${s.day}${s.start}`).join(",")}`;
          if (seen.has(key)) continue;
          seen.add(key);
          dedupClasses.push(c);
        }

        setParsed(dedupClasses);
        setStage("preview");
      };

      const handleFiles = (fileList) => {
        if (!fileList || fileList.length === 0) return;
        processFiles(fileList);
      };

      const onDrop = (e) => {
        e.preventDefault();
        setDragging(false);
        handleFiles(e.dataTransfer.files);
      };

      const reset = () => {
        setStage("upload");
        setRawText("");
        setShowRaw(false);
        setFiles([]);
        setError("");
        setParsed([]);
        setCandidates([]);
      };

      return (
        <div className="ht-modal-bg" onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div className="ht-modal">
            <div className="ht-modal-header">
              <div className="ht-modal-title">Importar desde archivo</div>
              <button className="ht-modal-close" onClick={onClose}>×</button>
            </div>
            <div className="ht-modal-body">
              {stage === "upload" && (
                <>
                  <p style={{ color: "var(--fg-2)", fontSize: "0.9rem", marginTop: 0, marginBottom: 16, lineHeight: 1.5 }}>
                    Sube uno o varios archivos (PDF o imágenes) que contengan tu horario o lista de eventos. Se intentará detectar materias, horarios, salones o títulos automáticamente.
                  </p>
                  <div
                    className={`ht-drop ${dragging ? "dragging" : ""}`}
                    onClick={() => fileInputRef.current?.click()}
                    onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
                    onDragLeave={() => setDragging(false)}
                    onDrop={onDrop}
                  >
                    <div className="ht-drop-icon">📄🖼️</div>
                    <div className="ht-drop-title">Suelta tus archivos aquí</div>
                    <div className="ht-drop-sub">PDFs e imágenes (PNG, JPG) — uno o varios a la vez</div>
                  </div>
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept="application/pdf,.pdf,image/*"
                    multiple
                    style={{ display: "none" }}
                    onChange={(e) => handleFiles(e.target.files)}
                  />
                  <div className="ht-ocr-warning">
                    Las imágenes usan OCR (lectura por reconocimiento óptico). Tarda 5-20 segundos por imagen y la primera vez baja ~10 MB de datos. Funciona mejor con capturas claras y de alta resolución; las fotos a una pantalla con reflejos dan resultados regulares.
                  </div>
                </>
              )}

              {stage === "processing" && (
                <>
                  <p style={{ color: "var(--fg-2)", fontSize: "0.9rem", marginTop: 0, marginBottom: 4, fontFamily: "var(--body)", fontSize: "1.1rem" }}>
                    Procesando archivos…
                  </p>
                  <p style={{ color: "var(--fg-3)", fontSize: "0.75rem", marginTop: 0, marginBottom: 16 }}>
                    Las imágenes pueden tardar varios segundos. No cierres la ventana.
                  </p>
                  <div className="ht-file-list">
                    {files.map((f, i) => (
                      <div key={i} className="ht-file-row" style={{ flexDirection: "column", alignItems: "stretch", gap: 6 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                          <span className="ht-file-icon">{f.type === "pdf" ? "📄" : "🖼️"}</span>
                          <span className="ht-file-name">{f.name}</span>
                          <span className={`ht-file-status ${f.status === "done" ? "done" : f.status === "error" ? "error" : f.status === "processing" ? "processing" : ""}`}>
                            {f.status === "pending" && "esperando"}
                            {f.status === "processing" && (f.type === "image" ? `${f.progress}%` : "leyendo…")}
                            {f.status === "done" && "✓ listo"}
                            {f.status === "error" && "✗ error"}
                          </span>
                        </div>
                        {f.status === "processing" && f.type === "image" && (
                          <div className="ht-progress-bar">
                            <div className="ht-progress-fill" style={{ width: `${f.progress}%` }} />
                          </div>
                        )}
                        {f.status === "error" && f.error && (
                          <div style={{ fontSize: "0.7rem", color: "#C97268", marginLeft: 32 }}>{f.error}</div>
                        )}
                      </div>
                    ))}
                  </div>
                </>
              )}

              {stage === "error" && (
                <>
                  <div className="ht-alert" style={{ background: "rgba(201,114,104,0.1)", borderColor: "rgba(201,114,104,0.3)", color: "#E89588" }}>
                    {error}
                  </div>
                  {files.length > 0 && (
                    <div className="ht-file-list">
                      {files.map((f, i) => (
                        <div key={i} className="ht-file-row">
                          <span className="ht-file-icon">{f.type === "pdf" ? "📄" : "🖼️"}</span>
                          <span className="ht-file-name">{f.name}</span>
                          <span className={`ht-file-status ${f.status === "done" ? "done" : "error"}`}>
                            {f.status === "done" ? "✓" : "✗"}
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                  {rawText && (
                    <div style={{ marginBottom: 12 }}>
                      <button className="ht-btn ht-btn-ghost" onClick={() => setShowRaw(!showRaw)} style={{ fontSize: "0.8rem" }}>
                        {showRaw ? "▾ Ocultar" : "▸ Ver"} texto extraído (debug)
                      </button>
                      {showRaw && (
                        <pre style={{ fontFamily: "var(--mono)", fontSize: "0.7rem", color: "var(--fg-3)", background: "var(--bg-3)", padding: 12, borderRadius: 8, maxHeight: 240, overflow: "auto", whiteSpace: "pre-wrap", marginTop: 8 }}>
                          {rawText}
                        </pre>
                      )}
                    </div>
                  )}
                  <button className="ht-btn ht-btn-secondary" onClick={reset} style={{ width: "100%" }}>
                    Intentar de nuevo
                  </button>
                </>
              )}

              {stage === "preview" && (
                <>
                  <p style={{ color: "var(--fg-2)", fontSize: "0.9rem", marginTop: 0, marginBottom: 4 }}>
                    Se detectaron <strong style={{ color: "var(--fg)" }}>{parsed.length} evento{parsed.length !== 1 ? "s" : ""}</strong> en {files.length} archivo{files.length !== 1 ? "s" : ""}. Revisa que esté bien:
                  </p>
                  {files.some(f => f.type === "image") && (
                    <p style={{ color: "var(--fg-3)", fontSize: "0.72rem", marginTop: 0, marginBottom: 12 }}>
                      Las imágenes pueden tener errores de OCR — verifica horarios con cuidado y edita después si algo está mal.
                    </p>
                  )}
                  <div className="ht-preview-list">
                    {parsed.map((c, i) => (
                      <div key={i} className="ht-preview-item">
                        <span className="ht-cat-dot" style={{ background: CATEGORIES[c.category]?.color }} />
                        <div className="ht-preview-name">
                          {c.name}
                          <div className="ht-preview-meta" style={{ marginTop: 2 }}>
                            {c.schedule.map((s) => `${DAYS[s.day]} ${s.start}-${s.end}`).join(" · ")}
                            {c.room && ` · ${c.room}`}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                  {rawText && (
                    <div style={{ marginBottom: 8 }}>
                      <button className="ht-btn ht-btn-ghost" onClick={() => setShowRaw(!showRaw)} style={{ fontSize: "0.75rem", padding: "4px 8px" }}>
                        {showRaw ? "▾ Ocultar" : "▸ Ver"} texto extraído (debug)
                      </button>
                      {showRaw && (
                        <pre style={{ fontFamily: "var(--mono)", fontSize: "0.65rem", color: "var(--fg-3)", background: "var(--bg-3)", padding: 10, borderRadius: 8, maxHeight: 180, overflow: "auto", whiteSpace: "pre-wrap", marginTop: 6 }}>
                          {rawText}
                        </pre>
                      )}
                    </div>
                  )}
                  {hasExisting && (
                    <div className="ht-alert" style={{ marginBottom: 12 }}>
                      Ya tienes clases guardadas. Elige cómo combinarlas:
                    </div>
                  )}
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12 }}>
                    <button className="ht-btn ht-btn-ghost" onClick={onClose}>Cancelar</button>
                    {hasExisting && (
                      <button className="ht-btn ht-btn-secondary" onClick={() => onImport(parsed, "merge")}>
                        Agregar las nuevas
                      </button>
                    )}
                    <button className="ht-btn ht-btn-primary" onClick={() => onImport(parsed, "replace")} style={{ marginLeft: "auto" }}>
                      {hasExisting ? "Reemplazar todo" : `Importar ${parsed.length}`}
                    </button>
                  </div>
                </>
              )}

              {stage === "assign" && (
                <AssignSubjects
                  candidates={candidates}
                  rawText={rawText}
                  showRaw={showRaw}
                  setShowRaw={setShowRaw}
                  hasExisting={hasExisting}
                  onCancel={onClose}
                  onRetry={reset}
                  onSubmit={(classes, mode) => onImport(classes, mode)}
                />
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    //  AssignSubjects — editor de asignación manual
    //  Cuando el OCR detecta materias pero no logra leer los
    //  horarios, el usuario los asigna a mano de forma rápida
    // ============================================================
    function AssignSubjects({ candidates, rawText, showRaw, setShowRaw, hasExisting, onCancel, onRetry, onSubmit }) {
      // estado: para cada candidato, su info (selected, name, days, start, end, category, room)
      const [items, setItems] = useState(() => candidates.map((name) => ({
        id: uid(),
        selected: true, // por defecto todas seleccionadas
        name,
        days: [], // ej: [1, 3, 5] = lun, mié, vie
        start: "08:00",
        end: "09:00",
        category: "academica",
        room: "",
      })));

      const updateItem = (idx, patch) => {
        setItems((prev) => prev.map((it, i) => i === idx ? { ...it, ...patch } : it));
      };

      const toggleDay = (idx, day) => {
        setItems((prev) => prev.map((it, i) => {
          if (i !== idx) return it;
          const days = it.days.includes(day) ? it.days.filter(d => d !== day) : [...it.days, day].sort();
          return { ...it, days };
        }));
      };

      const removeItem = (idx) => {
        setItems((prev) => prev.filter((_, i) => i !== idx));
      };

      const addCustomItem = () => {
        setItems((prev) => [...prev, {
          id: uid(),
          selected: true,
          name: "",
          days: [],
          start: "08:00",
          end: "09:00",
          category: "academica",
          room: "",
        }]);
      };

      const finish = (mode) => {
        // construir clases finales: solo las seleccionadas con nombre + días + horas válidas
        const classes = [];
        for (const it of items) {
          if (!it.selected) continue;
          if (!it.name.trim()) continue;
          if (it.days.length === 0) continue;
          if (toMin(it.start) >= toMin(it.end)) continue;
          classes.push({
            id: it.id,
            name: it.name.trim(),
            room: it.room.trim(),
            category: it.category,
            description: "",
            schedule: it.days.map(d => ({ day: d, start: it.start, end: it.end })),
          });
        }
        if (classes.length === 0) {
          alert("Asigna al menos una clase con nombre, días y horario válido.");
          return;
        }
        onSubmit(classes, mode);
      };

      const validCount = items.filter(it => it.selected && it.name.trim() && it.days.length > 0 && toMin(it.start) < toMin(it.end)).length;

      return (
        <>
          <div className="ht-alert" style={{ background: "rgba(91,155,213,0.08)", borderColor: "rgba(91,155,213,0.3)", color: "#A5C8E8", marginBottom: 16 }}>
            <strong style={{ color: "#C5DDF0" }}>No se pudieron leer los horarios.</strong> Pero sí se detectaron los nombres. Asígnales sus días y horas abajo — es rápido. Desmarca las que no necesites o ajusta nombres rotos por el OCR.
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 10, maxHeight: "55vh", overflowY: "auto", marginBottom: 16, paddingRight: 4 }}>
            {items.map((it, idx) => (
              <div key={it.id} style={{
                background: it.selected ? "var(--bg-3)" : "transparent",
                border: "1px solid var(--line)",
                borderRadius: 12,
                padding: "12px 14px",
                opacity: it.selected ? 1 : 0.5,
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                  <input
                    type="checkbox"
                    checked={it.selected}
                    onChange={(e) => updateItem(idx, { selected: e.target.checked })}
                    style={{ accentColor: "var(--accent)", cursor: "pointer", flexShrink: 0 }}
                  />
                  <input
                    className="ht-input"
                    value={it.name}
                    onChange={(e) => updateItem(idx, { name: e.target.value })}
                    placeholder="Nombre de la materia"
                    style={{ flex: 1, padding: "8px 12px", fontSize: "0.9rem" }}
                  />
                  <button
                    onClick={() => removeItem(idx)}
                    style={{ background: "transparent", border: "none", color: "var(--fg-3)", cursor: "pointer", fontSize: "1.1rem", padding: "4px 8px" }}
                    title="Eliminar de la lista"
                  >×</button>
                </div>

                {it.selected && (
                  <>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginBottom: 10 }}>
                      {["L", "M", "M", "J", "V", "S", "D"].map((dl, di) => {
                        // di: 0=L=1, 1=M=2, 2=M=3, 3=J=4, 4=V=5, 5=S=6, 6=D=0
                        const dayNum = di === 6 ? 0 : di + 1;
                        const active = it.days.includes(dayNum);
                        return (
                          <button
                            key={di}
                            onClick={() => toggleDay(idx, dayNum)}
                            style={{
                              padding: "6px 10px",
                              borderRadius: 6,
                              background: active ? "var(--accent)" : "var(--bg-2)",
                              color: active ? "var(--bg)" : "var(--fg-2)",
                              border: "1px solid " + (active ? "var(--accent)" : "var(--line)"),
                              fontSize: "0.75rem",
                              fontFamily: "var(--mono)",
                              fontWeight: 600,
                              cursor: "pointer",
                              minWidth: 32,
                            }}
                          >{dl}</button>
                        );
                      })}
                    </div>

                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 8 }}>
                      <input
                        type="time"
                        className="ht-input"
                        value={it.start}
                        onChange={(e) => updateItem(idx, { start: e.target.value })}
                        style={{ padding: "8px", fontSize: "0.85rem" }}
                      />
                      <input
                        type="time"
                        className="ht-input"
                        value={it.end}
                        onChange={(e) => updateItem(idx, { end: e.target.value })}
                        style={{ padding: "8px", fontSize: "0.85rem" }}
                      />
                      <input
                        className="ht-input"
                        value={it.room}
                        onChange={(e) => updateItem(idx, { room: e.target.value })}
                        placeholder="Salón"
                        style={{ padding: "8px", fontSize: "0.85rem" }}
                      />
                    </div>

                    <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                      {Object.entries(CATEGORIES).map(([key, c]) => (
                        <button
                          key={key}
                          onClick={() => updateItem(idx, { category: key })}
                          style={{
                            padding: "4px 10px",
                            borderRadius: 999,
                            background: it.category === key ? c.soft : "transparent",
                            color: it.category === key ? c.color : "var(--fg-3)",
                            border: "1px solid " + (it.category === key ? c.color : "var(--line)"),
                            fontSize: "0.7rem",
                            cursor: "pointer",
                            display: "inline-flex",
                            alignItems: "center",
                            gap: 4,
                          }}
                        >
                          <span style={{ width: 6, height: 6, borderRadius: "50%", background: c.color }} />
                          {c.label}
                        </button>
                      ))}
                    </div>
                  </>
                )}
              </div>
            ))}
          </div>

          <button
            onClick={addCustomItem}
            style={{
              background: "transparent",
              border: "1px dashed var(--line-strong)",
              color: "var(--fg-2)",
              padding: "10px",
              borderRadius: 10,
              width: "100%",
              cursor: "pointer",
              fontSize: "0.85rem",
              marginBottom: 16,
            }}
          >+ Agregar materia que no está en la lista</button>

          {rawText && (
            <div style={{ marginBottom: 12 }}>
              <button className="ht-btn ht-btn-ghost" onClick={() => setShowRaw(!showRaw)} style={{ fontSize: "0.75rem", padding: "4px 8px" }}>
                {showRaw ? "▾ Ocultar" : "▸ Ver"} texto extraído (debug)
              </button>
              {showRaw && (
                <pre style={{ fontFamily: "var(--mono)", fontSize: "0.65rem", color: "var(--fg-3)", background: "var(--bg-3)", padding: 10, borderRadius: 8, maxHeight: 180, overflow: "auto", whiteSpace: "pre-wrap", marginTop: 6 }}>
                  {rawText}
                </pre>
              )}
            </div>
          )}

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, paddingTop: 12, borderTop: "1px solid var(--line)" }}>
            <span style={{ fontSize: "0.8rem", color: "var(--fg-3)", fontFamily: "var(--mono)" }}>
              {validCount} de {items.length} listas
            </span>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button className="ht-btn ht-btn-ghost" onClick={onCancel}>Cancelar</button>
              <button className="ht-btn ht-btn-secondary" onClick={onRetry}>Otro archivo</button>
              {hasExisting && (
                <button className="ht-btn ht-btn-secondary" onClick={() => finish("merge")} disabled={validCount === 0}>
                  Agregar
                </button>
              )}
              <button className="ht-btn ht-btn-primary" onClick={() => finish("replace")} disabled={validCount === 0}>
                {hasExisting ? "Reemplazar todo" : `Importar ${validCount}`}
              </button>
            </div>
          </div>
        </>
      );
    }

    // ============================================================
    //  TaskRow — fila de tarea/evento en lista
    // ============================================================
    function TaskRow({ task, onEdit, onToggle, now, overdue }) {
      const due = task.dueDate ? new Date(task.dueDate) : null;
      const dueMs = due ? due.getTime() : null;
      const nowMs = now.getTime();
      const typeInfo = TASK_TYPES[task.type] || TASK_TYPES.task;

      let timeLabel = "";
      let detail = "";
      if (due && !isNaN(dueMs)) {
        const diff = dueMs - nowMs;
        const absH = Math.abs(diff) / (1000 * 60 * 60);
        if (overdue) {
          if (absH < 24) timeLabel = `hace ${Math.round(absH)} h`;
          else timeLabel = `hace ${Math.round(absH / 24)} d`;
        } else {
          if (diff < 0) timeLabel = "ahora";
          else if (absH < 1) timeLabel = `en ${Math.round(absH * 60)} min`;
          else if (absH < 24) timeLabel = `en ${Math.round(absH)} h`;
          else timeLabel = `en ${Math.round(absH / 24)} d`;
        }
        const dayLabel = due.toLocaleDateString("es-MX", { weekday: "short", day: "numeric", month: "short" });
        const timeLabelOnly = due.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", hour12: false });
        detail = `${dayLabel} · ${timeLabelOnly}`;
      }

      return (
        <div className={`ht-task-row ${task.completed ? "completed" : ""} ${overdue ? "overdue" : ""}`} onClick={onEdit}>
          <button
            className="ht-task-check"
            onClick={(e) => { e.stopPropagation(); onToggle(); }}
            aria-label={task.completed ? "Marcar como pendiente" : "Marcar completa"}
          >
            {task.completed ? "✓" : ""}
          </button>
          <div className="ht-task-body">
            <div className="ht-task-title">
              <span className="ht-task-type-dot" style={{ background: typeInfo.color }} />
              {task.title}
            </div>
            {(detail || task.description) && (
              <div className="ht-task-detail">
                {detail}
                {task.description ? (detail ? " · " : "") + task.description : ""}
              </div>
            )}
          </div>
          {timeLabel && (
            <div className={`ht-task-when ${overdue ? "overdue" : ""}`}>{timeLabel}</div>
          )}
        </div>
      );
    }

    // ============================================================
    //  FabMenu — botón flotante con menú expandible
    // ============================================================
    function FabMenu({ currentView, onNewClass, onNewTask, onNewNote }) {
      const [open, setOpen] = useState(false);
      useEffect(() => {
        if (!open) return;
        const onEsc = (e) => { if (e.key === "Escape") setOpen(false); };
        document.addEventListener("keydown", onEsc);
        return () => document.removeEventListener("keydown", onEsc);
      }, [open]);

      // Si está en vista notes, atajo directo a nueva nota
      if (currentView === "notes") {
        return (
          <div className="ht-fab-wrap">
            <button className="ht-fab" onClick={onNewNote} aria-label="Nueva nota">
              <span style={{ fontSize: "1.3rem" }}>+</span>
            </button>
          </div>
        );
      }

      return (
        <>
          {open && <div className="ht-fab-backdrop" onClick={() => setOpen(false)} />}
          <div className={`ht-fab-wrap ${open ? "open" : ""}`}>
            {open && (
              <div className="ht-fab-menu">
                <button className="ht-fab-item" onClick={() => { setOpen(false); onNewNote(); }}>
                  <span className="ht-fab-item-icon">✎</span>
                  Nueva nota
                </button>
                <button className="ht-fab-item" onClick={() => { setOpen(false); onNewTask(); }}>
                  <span className="ht-fab-item-icon">→</span>
                  Nueva tarea o recordatorio
                </button>
                <button className="ht-fab-item" onClick={() => { setOpen(false); onNewClass(); }}>
                  <span className="ht-fab-item-icon">+</span>
                  Nuevo evento recurrente
                </button>
              </div>
            )}
            <button className="ht-fab" onClick={() => setOpen(!open)} aria-label={open ? "Cerrar menú" : "Agregar"}>
              <span style={{ fontSize: "1.3rem", transform: open ? "rotate(45deg)" : "none", transition: "transform 0.2s", display: "inline-block" }}>+</span>
            </button>
          </div>
        </>
      );
    }

    // ============================================================
    //  TaskEditor — modal para crear/editar tarea o evento
    // ============================================================
    function TaskEditor({ initial, settings, onUpdateSettings, onSave, onDelete, onClose }) {
      const [title, setTitle] = useState(initial?.title || "");
      const [type, setType] = useState(initial?.type || "task");
      const [description, setDescription] = useState(initial?.description || "");
      const [category, setCategory] = useState(initial?.category || "");

      const userCategories = settings?.categories || [];
      const allCategories = [...DEFAULT_CATEGORIES, ...userCategories.filter(c => !DEFAULT_CATEGORIES.some(d => d.id === c.id))];

      // Para fecha/hora: si no hay initial, default a "hoy + 1h"
      const defaultDue = useMemo(() => {
        if (initial?.dueDate) {
          const d = new Date(initial.dueDate);
          if (!isNaN(d.getTime())) {
            const pad = (n) => String(n).padStart(2, "0");
            return {
              date: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
              time: `${pad(d.getHours())}:${pad(d.getMinutes())}`,
            };
          }
        }
        const d = new Date();
        d.setHours(d.getHours() + 1, 0, 0, 0);
        const pad = (n) => String(n).padStart(2, "0");
        return {
          date: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
          time: `${pad(d.getHours())}:${pad(d.getMinutes())}`,
        };
      }, [initial]);

      const [dueDate, setDueDate] = useState(defaultDue.date);
      const [dueTime, setDueTime] = useState(defaultDue.time);
      const [error, setError] = useState("");

      const handleSave = () => {
        setError("");
        if (!title.trim()) { setError("Pon un título."); return; }
        if (!dueDate) { setError("Elige una fecha."); return; }
        const isoDate = new Date(`${dueDate}T${dueTime || "09:00"}:00`).toISOString();
        onSave({
          id: initial?.id || uid(),
          type,
          title: title.trim(),
          description: description.trim(),
          category: category || null,
          dueDate: isoDate,
          completed: initial?.completed || false,
          completedAt: initial?.completedAt || null,
          createdAt: initial?.createdAt || new Date().toISOString(),
        });
      };

      const handleDelete = () => {
        if (!initial?.id) return;
        if (window.confirm(`¿Eliminar "${initial.title}"?`)) onDelete(initial.id);
      };

      // botones de relativo
      const quickDates = [
        { label: "Hoy", offset: 0 },
        { label: "Mañana", offset: 1 },
        { label: "En 3 días", offset: 3 },
        { label: "En 1 semana", offset: 7 },
      ];
      const setQuick = (offset) => {
        const d = new Date();
        d.setDate(d.getDate() + offset);
        const pad = (n) => String(n).padStart(2, "0");
        setDueDate(`${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`);
      };

      return (
        <div className="ht-modal-bg" onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div className="ht-modal">
            <div className="ht-modal-header">
              <div className="ht-modal-title">{initial ? "Editar" : "Nueva tarea o evento"}</div>
              <button className="ht-modal-close" onClick={onClose}>×</button>
            </div>
            <div className="ht-modal-body">
              {error && <div className="ht-alert" style={{ background: "rgba(201,114,104,0.1)", borderColor: "rgba(201,114,104,0.3)", color: "var(--danger)" }}>{error}</div>}

              <div className="ht-field">
                <label className="ht-label">Tipo</label>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {Object.entries(TASK_TYPES).map(([key, info]) => (
                    <button
                      key={key}
                      type="button"
                      onClick={() => setType(key)}
                      className={`ht-type-btn ${type === key ? "active" : ""}`}
                      style={type === key ? { borderColor: info.color, color: info.color } : {}}
                    >
                      <span className="ht-cat-dot" style={{ background: info.color }} />
                      {info.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="ht-field">
                <label className="ht-label">Título</label>
                <input className="ht-input" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Entregar ensayo, cumple de Ana, junta..." autoFocus />
              </div>

              <div className="ht-field">
                <label className="ht-label">Cuándo</label>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
                  {quickDates.map((q) => (
                    <button key={q.offset} type="button" className="ht-btn ht-btn-secondary" onClick={() => setQuick(q.offset)} style={{ fontSize: "0.78rem", padding: "6px 12px" }}>
                      {q.label}
                    </button>
                  ))}
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1.5fr 1fr", gap: 8 }}>
                  <input type="date" className="ht-input" value={dueDate} onChange={(e) => setDueDate(e.target.value)} />
                  <input type="time" className="ht-input" value={dueTime} onChange={(e) => setDueTime(e.target.value)} />
                </div>
              </div>

              <div className="ht-field">
                <label className="ht-label">Categoría <span style={{ color: "var(--fg-3)", fontWeight: 400 }}>(opcional)</span></label>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                  <button
                    type="button"
                    className={`ht-cat-btn ${!category ? "active" : ""}`}
                    onClick={() => setCategory("")}
                    style={{ fontSize: "0.78rem", padding: "6px 12px" }}
                  >
                    Ninguna
                  </button>
                  {allCategories.map((c) => (
                    <button
                      key={c.id}
                      type="button"
                      className={`ht-cat-btn ${category === c.id ? "active" : ""}`}
                      onClick={() => setCategory(c.id)}
                      style={Object.assign(
                        { fontSize: "0.78rem", padding: "6px 12px" },
                        category === c.id ? { borderColor: c.color, color: c.color } : {}
                      )}
                    >
                      <span className="ht-cat-dot" style={{ background: c.color }} />{c.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="ht-field">
                <label className="ht-label">Notas (opcional)</label>
                <input className="ht-input" value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Lugar, detalles, etc." />
              </div>

              <div className="ht-form-actions">
                {initial && <button className="ht-btn ht-btn-danger" type="button" onClick={handleDelete}>Eliminar</button>}
                <div style={{ display: "flex", gap: 8, marginLeft: "auto" }}>
                  <button className="ht-btn ht-btn-ghost" type="button" onClick={onClose}>Cancelar</button>
                  <button className="ht-btn ht-btn-primary" type="button" onClick={handleSave}>Guardar</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    //  AgendaView — vista de próximos N días con tareas y clases
    // ============================================================
    function AgendaView({ tasks, classes, now, onEditTask, onNewTask, onToggleTask, settings }) {
      const [showCompleted, setShowCompleted] = useState(false);

      const nowMs = now.getTime();

      // construir lista combinada de items, agrupados por día
      const days = useMemo(() => {
        const result = {}; // YYYY-MM-DD → { date, items: [] }
        const horizon = 14; // próximos 14 días

        // tareas/eventos
        const filteredTasks = settings.hideCompletedTasks && !showCompleted
          ? tasks.filter(t => !t.completed)
          : tasks;

        for (const t of filteredTasks) {
          if (!t.dueDate) continue;
          const d = new Date(t.dueDate);
          if (isNaN(d.getTime())) continue;
          const key = d.toISOString().slice(0, 10);
          if (!result[key]) result[key] = { date: d, items: [] };
          result[key].items.push({ kind: "task", task: t, when: d });
        }

        // próximas clases en horizonte
        for (let off = 0; off < horizon; off++) {
          const checkDate = new Date(now);
          checkDate.setDate(checkDate.getDate() + off);
          checkDate.setHours(0, 0, 0, 0);
          const dayNum = checkDate.getDay();
          for (const cls of classes) {
            for (const s of cls.schedule) {
              if (s.day !== dayNum) continue;
              const [h, m] = s.start.split(":").map(Number);
              const when = new Date(checkDate);
              when.setHours(h, m, 0, 0);
              if (when.getTime() < nowMs - 2 * 60 * 60 * 1000) continue;
              const key = when.toISOString().slice(0, 10);
              if (!result[key]) result[key] = { date: when, items: [] };
              result[key].items.push({ kind: "class", cls, schedule: s, when });
            }
          }
        }

        // ordenar items dentro de cada día
        for (const k of Object.keys(result)) {
          result[k].items.sort((a, b) => a.when.getTime() - b.when.getTime());
        }

        // devolver array ordenado por fecha
        return Object.entries(result)
          .map(([k, v]) => ({ key: k, ...v }))
          .sort((a, b) => a.date.getTime() - b.date.getTime());
      }, [tasks, classes, now, settings.hideCompletedTasks, showCompleted]);

      const totalCompleted = tasks.filter(t => t.completed).length;
      const hasAnyItems = days.length > 0;

      const fmtDayHeader = (d) => {
        const today = new Date(now);
        today.setHours(0, 0, 0, 0);
        const dDay = new Date(d);
        dDay.setHours(0, 0, 0, 0);
        const diff = Math.round((dDay.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
        if (diff === 0) return "Hoy";
        if (diff === 1) return "Mañana";
        if (diff === -1) return "Ayer";
        return d.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
      };

      return (
        <>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
            <div className="ht-section-label" style={{ margin: 0 }}>
              {tasks.filter(t => !t.completed).length} pendiente{tasks.filter(t => !t.completed).length !== 1 ? "s" : ""}
              {totalCompleted > 0 && ` · ${totalCompleted} completada${totalCompleted !== 1 ? "s" : ""}`}
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {totalCompleted > 0 && (
                <button className="ht-btn ht-btn-ghost" onClick={() => setShowCompleted(!showCompleted)} style={{ fontSize: "0.8rem" }}>
                  {showCompleted ? "Ocultar" : "Ver"} completadas
                </button>
              )}
              <button className="ht-btn ht-btn-primary" onClick={onNewTask} style={{ fontSize: "0.85rem", padding: "8px 16px" }}>
                Nueva tarea
              </button>
            </div>
          </div>

          {!hasAnyItems && (
            <div className="ht-empty" style={{ padding: "40px 24px" }}>
              <div className="ht-empty-title" style={{ fontSize: "1.2rem" }}>Sin pendientes en los próximos 14 días</div>
              <p className="ht-empty-sub" style={{ marginBottom: 0 }}>
                Agrega tareas, eventos o recordatorios. Aparecerán aquí ordenados por fecha.
              </p>
            </div>
          )}

          {days.map((day) => (
            <div key={day.key} className="ht-day-section" style={{ marginTop: 24 }}>
              <div className="ht-section-label" style={{ marginBottom: 10 }}>
                {fmtDayHeader(day.date)}
              </div>
              <div className="ht-day-list">
                {day.items.map((item, i) => {
                  if (item.kind === "task") {
                    const overdue = item.when.getTime() < nowMs - 12 * 60 * 60 * 1000 && !item.task.completed;
                    return (
                      <TaskRow key={`t-${item.task.id}`} task={item.task} onEdit={() => onEditTask(item.task)} onToggle={() => onToggleTask(item.task.id)} now={now} overdue={overdue} />
                    );
                  }
                  // class
                  const c = item.cls;
                  const s = item.schedule;
                  return (
                    <div key={`c-${c.id}-${i}`} className="ht-day-item" style={{ cursor: "default" }}>
                      <div className="ht-day-time">{s.start}<div className="ht-day-time-sep">↓</div>{s.end}</div>
                      <div>
                        <div className="ht-day-name">{c.name}</div>
                        <div className="ht-day-room">
                          <span className="ht-cat-dot" style={{ background: CATEGORIES[c.category]?.color }} />
                          {c.room || "sin lugar"}
                        </div>
                      </div>
                      <div><CategoryPill cat={c.category} /></div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </>
      );
    }

    // ============================================================
    //  CalendarView — calendario mensual con festivos y eventos
    // ============================================================
    function CalendarView({ now, classes, tasks, settings, onSelectDate, onEditTask }) {
      const [viewMonth, setViewMonth] = useState(new Date(now.getFullYear(), now.getMonth(), 1));
      const [selectedDate, setSelectedDate] = useState(null);

      const country = settings?.countryHolidays || "mx";
      const holidays = useMemo(() => {
        if (country === "none") return [];
        return getHolidaysForYear(viewMonth.getFullYear(), country);
      }, [viewMonth, country]);

      const monthName = viewMonth.toLocaleDateString("es-MX", { month: "long", year: "numeric" });
      const firstDay = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1);
      const lastDay = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0);
      const daysInMonth = lastDay.getDate();
      const firstDayOfWeek = firstDay.getDay(); // 0=domingo

      // Construir grid de 6 semanas (42 celdas)
      const cells = [];
      // padding antes del día 1
      for (let i = 0; i < firstDayOfWeek; i++) {
        const prevDate = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), -firstDayOfWeek + i + 1);
        cells.push({ date: prevDate, outside: true });
      }
      // días del mes
      for (let d = 1; d <= daysInMonth; d++) {
        cells.push({ date: new Date(viewMonth.getFullYear(), viewMonth.getMonth(), d), outside: false });
      }
      // padding después
      while (cells.length < 42) {
        const last = cells[cells.length - 1].date;
        const next = new Date(last);
        next.setDate(last.getDate() + 1);
        cells.push({ date: next, outside: true });
      }

      // Helper: ¿tiene festivo o evento este día?
      const isSameDay = (a, b) =>
        a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

      const getDayInfo = (date) => {
        const result = { holidays: [], tasks: [], classes: [] };
        for (const h of holidays) if (isSameDay(h.date, date)) result.holidays.push(h);
        for (const t of tasks) {
          if (!t.dueDate) continue;
          const d = new Date(t.dueDate);
          if (!isNaN(d.getTime()) && isSameDay(d, date)) result.tasks.push(t);
        }
        // clases (eventos recurrentes) en este día de la semana
        const dayNum = date.getDay();
        for (const c of classes) {
          for (const s of c.schedule) {
            if (s.day === dayNum) {
              result.classes.push({ cls: c, schedule: s });
              break;
            }
          }
        }
        return result;
      };

      const today = new Date(now);
      today.setHours(0, 0, 0, 0);

      const goPrev = () => setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1));
      const goNext = () => setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1));
      const goToday = () => {
        setViewMonth(new Date(now.getFullYear(), now.getMonth(), 1));
        setSelectedDate(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
      };

      const selectedInfo = selectedDate ? getDayInfo(selectedDate) : null;

      return (
        <>
          <div className="ht-cal-header">
            <button className="ht-icon-btn" onClick={goPrev} aria-label="Mes anterior">‹</button>
            <div className="ht-cal-title-wrap">
              <div className="ht-cal-title">{monthName.charAt(0).toUpperCase() + monthName.slice(1)}</div>
              <button className="ht-btn ht-btn-ghost" onClick={goToday} style={{ fontSize: "0.78rem", padding: "4px 10px" }}>Hoy</button>
            </div>
            <button className="ht-icon-btn" onClick={goNext} aria-label="Mes siguiente">›</button>
          </div>

          <div className="ht-cal-weekdays">
            {["D", "L", "M", "M", "J", "V", "S"].map((d, i) => (
              <div key={i} className="ht-cal-weekday">{d}</div>
            ))}
          </div>

          <div className="ht-cal-grid">
            {cells.map((cell, i) => {
              const info = getDayInfo(cell.date);
              const isToday = isSameDay(cell.date, today);
              const isSelected = selectedDate && isSameDay(cell.date, selectedDate);
              const isSunday = cell.date.getDay() === 0;
              const hasHoliday = info.holidays.length > 0;
              const hasTask = info.tasks.length > 0;
              const hasClass = info.classes.length > 0;

              return (
                <button
                  key={i}
                  className={`ht-cal-cell ${cell.outside ? "outside" : ""} ${isToday ? "today" : ""} ${isSelected ? "selected" : ""} ${isSunday ? "sunday" : ""}`}
                  onClick={() => setSelectedDate(cell.date)}
                >
                  <div className="ht-cal-num">{cell.date.getDate()}</div>
                  <div className="ht-cal-dots">
                    {hasHoliday && <span className="ht-cal-dot" style={{ background: "var(--warn)" }} />}
                    {hasTask && <span className="ht-cal-dot" style={{ background: "var(--accent)" }} />}
                    {hasClass && <span className="ht-cal-dot" style={{ background: "var(--success)" }} />}
                  </div>
                </button>
              );
            })}
          </div>

          <div className="ht-cal-legend">
            <span className="ht-cal-legend-item"><span className="ht-cal-dot" style={{ background: "var(--warn)" }} /> Festivo</span>
            <span className="ht-cal-legend-item"><span className="ht-cal-dot" style={{ background: "var(--accent)" }} /> Tarea</span>
            <span className="ht-cal-legend-item"><span className="ht-cal-dot" style={{ background: "var(--success)" }} /> Evento</span>
          </div>

          {selectedDate && selectedInfo && (
            <div className="ht-cal-day-detail">
              <div className="ht-cal-day-header">
                <div className="ht-cal-day-title">
                  {selectedDate.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" })}
                </div>
                <button
                  className="ht-btn ht-btn-primary"
                  onClick={() => {
                    const d = new Date(selectedDate);
                    d.setHours(9, 0, 0, 0);
                    onSelectDate(d);
                  }}
                  style={{ fontSize: "0.78rem", padding: "6px 14px" }}
                >
                  + Nueva tarea
                </button>
              </div>

              {selectedInfo.holidays.length > 0 && (
                <div className="ht-cal-day-section">
                  <div className="ht-section-label" style={{ marginBottom: 6 }}>Festivos</div>
                  {selectedInfo.holidays.map((h, i) => (
                    <div key={i} className="ht-cal-holiday">
                      <span className="ht-cal-dot" style={{ background: "var(--warn)" }} />
                      {h.label}
                    </div>
                  ))}
                </div>
              )}

              {selectedInfo.tasks.length > 0 && (
                <div className="ht-cal-day-section">
                  <div className="ht-section-label" style={{ marginBottom: 6 }}>Tareas / eventos</div>
                  {selectedInfo.tasks.map((t) => (
                    <TaskRow key={t.id} task={t} onEdit={() => onEditTask(t)} onToggle={() => {}} now={now} />
                  ))}
                </div>
              )}

              {selectedInfo.classes.length > 0 && (
                <div className="ht-cal-day-section">
                  <div className="ht-section-label" style={{ marginBottom: 6 }}>Eventos recurrentes</div>
                  {selectedInfo.classes.map((item, i) => (
                    <div key={i} className="ht-cal-class-item">
                      <span className="ht-cat-dot" style={{ background: (CATEGORIES[item.cls.category]?.color) || "#9B9890" }} />
                      <div style={{ flex: 1 }}>
                        <div style={{ color: "var(--fg)", fontSize: "0.9rem" }}>{item.cls.name}</div>
                        <div style={{ color: "var(--fg-3)", fontSize: "0.75rem", fontFamily: "var(--mono)" }}>
                          {item.schedule.start}–{item.schedule.end}{item.cls.room ? ` · ${item.cls.room}` : ""}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {selectedInfo.holidays.length === 0 && selectedInfo.tasks.length === 0 && selectedInfo.classes.length === 0 && (
                <div style={{ color: "var(--fg-3)", fontSize: "0.85rem", padding: "12px 0" }}>
                  Nada agendado este día.
                </div>
              )}
            </div>
          )}
        </>
      );
    }

    // ============================================================
    //  NotesView — lista de notas rápidas
    // ============================================================
    function NotesView({ notes, onEdit, onNew }) {
      const sortedNotes = useMemo(() => {
        return [...notes].sort((a, b) => {
          const aTime = new Date(a.updatedAt || a.createdAt || 0).getTime();
          const bTime = new Date(b.updatedAt || b.createdAt || 0).getTime();
          return bTime - aTime;
        });
      }, [notes]);

      if (notes.length === 0) {
        return (
          <div className="ht-empty">
            <div className="ht-empty-title">Notas rápidas</div>
            <p className="ht-empty-sub">
              Apuntes cortos, ideas, listas — lo que necesites recordar sin que tenga fecha. Cada nota puede tener texto y un dibujo simple.
            </p>
            <button className="ht-btn ht-btn-primary" onClick={onNew}>
              Nueva nota
            </button>
          </div>
        );
      }

      const fmtDate = (iso) => {
        if (!iso) return "";
        const d = new Date(iso);
        if (isNaN(d.getTime())) return "";
        const now = new Date();
        const diffH = (now.getTime() - d.getTime()) / (1000 * 60 * 60);
        if (diffH < 1) return "hace un momento";
        if (diffH < 24) return `hace ${Math.round(diffH)} h`;
        if (diffH < 168) return `hace ${Math.round(diffH / 24)} d`;
        return d.toLocaleDateString("es-MX", { day: "numeric", month: "short" });
      };

      return (
        <>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
            <div className="ht-section-label" style={{ margin: 0 }}>
              {notes.length} nota{notes.length !== 1 ? "s" : ""}
            </div>
            <button className="ht-btn ht-btn-primary" onClick={onNew} style={{ fontSize: "0.85rem", padding: "8px 16px" }}>
              Nueva nota
            </button>
          </div>

          <div className="ht-notes-grid">
            {sortedNotes.map((note) => (
              <div key={note.id} className="ht-note-card" onClick={() => onEdit(note)}>
                {note.drawing && (
                  <div className="ht-note-drawing-preview">
                    <img src={note.drawing} alt="" />
                  </div>
                )}
                {note.title && <div className="ht-note-title">{note.title}</div>}
                {note.body && <div className="ht-note-body">{note.body}</div>}
                {!note.title && !note.body && !note.drawing && (
                  <div className="ht-note-body" style={{ color: "var(--fg-3)" }}>Nota vacía</div>
                )}
                <div className="ht-note-meta">
                  {fmtDate(note.updatedAt || note.createdAt)}
                </div>
              </div>
            ))}
          </div>
        </>
      );
    }

    // ============================================================
    //  NoteEditor — modal para crear/editar nota
    //  Texto libre + canvas opcional para dibujo simple
    // ============================================================
    function NoteEditor({ initial, onSave, onDelete, onClose }) {
      const [title, setTitle] = useState(initial?.title || "");
      const [body, setBody] = useState(initial?.body || "");
      const [drawing, setDrawing] = useState(initial?.drawing || null);
      const [drawingOpen, setDrawingOpen] = useState(false);

      const handleSave = () => {
        if (!title.trim() && !body.trim() && !drawing) {
          if (!window.confirm("La nota está vacía. ¿Guardar de todas formas?")) return;
        }
        const noteData = {
          id: initial?.id || uid(),
          title: title.trim(),
          body: body.trim(),
          drawing,
          createdAt: initial?.createdAt || new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        };
        onSave(noteData);
      };

      const handleDelete = () => {
        if (!initial?.id) return;
        if (window.confirm("¿Eliminar esta nota?")) onDelete(initial.id);
      };

      return (
        <div className="ht-modal-bg" onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div className="ht-modal">
            <div className="ht-modal-header">
              <div className="ht-modal-title">{initial ? "Editar nota" : "Nueva nota"}</div>
              <button className="ht-modal-close" onClick={onClose}>×</button>
            </div>
            <div className="ht-modal-body">
              <div className="ht-field">
                <input
                  className="ht-input"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  placeholder="Título (opcional)"
                  style={{ fontSize: "1.05rem", fontWeight: 500 }}
                  autoFocus
                />
              </div>

              <div className="ht-field">
                <textarea
                  className="ht-input"
                  value={body}
                  onChange={(e) => setBody(e.target.value)}
                  placeholder="Escribe aquí..."
                  rows={6}
                  style={{ resize: "vertical", minHeight: 120, fontFamily: "var(--body)" }}
                />
              </div>

              {drawing && !drawingOpen && (
                <div className="ht-field">
                  <label className="ht-label">Dibujo</label>
                  <div style={{ position: "relative", background: "var(--bg-3)", borderRadius: 10, padding: 8 }}>
                    <img src={drawing} alt="Dibujo" style={{ width: "100%", maxHeight: 200, objectFit: "contain", borderRadius: 6, background: "white" }} />
                    <div style={{ display: "flex", gap: 6, marginTop: 8, justifyContent: "flex-end" }}>
                      <button type="button" className="ht-btn ht-btn-ghost" onClick={() => setDrawingOpen(true)} style={{ fontSize: "0.8rem" }}>Editar</button>
                      <button type="button" className="ht-btn ht-btn-ghost" onClick={() => setDrawing(null)} style={{ fontSize: "0.8rem", color: "var(--danger)" }}>Quitar</button>
                    </div>
                  </div>
                </div>
              )}

              {!drawing && !drawingOpen && (
                <button
                  type="button"
                  className="ht-btn ht-btn-secondary"
                  onClick={() => setDrawingOpen(true)}
                  style={{ width: "100%", marginBottom: 16, fontSize: "0.85rem" }}
                >
                  + Agregar dibujo
                </button>
              )}

              {drawingOpen && (
                <DrawingCanvas
                  initial={drawing}
                  onSave={(dataUrl) => { setDrawing(dataUrl); setDrawingOpen(false); }}
                  onCancel={() => setDrawingOpen(false)}
                />
              )}

              <div className="ht-form-actions">
                {initial && <button className="ht-btn ht-btn-danger" type="button" onClick={handleDelete}>Eliminar</button>}
                <div style={{ display: "flex", gap: 8, marginLeft: "auto" }}>
                  <button className="ht-btn ht-btn-ghost" type="button" onClick={onClose}>Cancelar</button>
                  <button className="ht-btn ht-btn-primary" type="button" onClick={handleSave}>Guardar</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    //  DrawingCanvas — canvas simple para dibujar
    // ============================================================
    function DrawingCanvas({ initial, onSave, onCancel }) {
      const canvasRef = React.useRef(null);
      const [drawing, setDrawing] = useState(false);
      const [color, setColor] = useState("#1A1916");
      const [thickness, setThickness] = useState(3);
      const lastPos = React.useRef(null);

      const colors = ["#1A1916", "#E8765C", "#5B9BD5", "#7BA05B", "#C9A227", "#D87B9E", "#A78BC9"];

      // Inicializar canvas
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        // dimensiones internas
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, rect.width, rect.height);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        if (initial) {
          const img = new Image();
          img.onload = () => {
            ctx.drawImage(img, 0, 0, rect.width, rect.height);
          };
          img.src = initial;
        }
      }, [initial]);

      const getPos = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches ? e.touches[0] : e;
        return {
          x: (touch.clientX - rect.left),
          y: (touch.clientY - rect.top),
        };
      };

      const start = (e) => {
        e.preventDefault();
        setDrawing(true);
        lastPos.current = getPos(e);
      };

      const move = (e) => {
        if (!drawing) return;
        e.preventDefault();
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        const pos = getPos(e);
        ctx.strokeStyle = color;
        ctx.lineWidth = thickness;
        ctx.beginPath();
        ctx.moveTo(lastPos.current.x, lastPos.current.y);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        lastPos.current = pos;
      };

      const end = () => {
        setDrawing(false);
        lastPos.current = null;
      };

      const clear = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        const rect = canvas.getBoundingClientRect();
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, rect.width, rect.height);
      };

      const save = () => {
        const canvas = canvasRef.current;
        // exportar a tamaño razonable
        const exportCanvas = document.createElement("canvas");
        const rect = canvas.getBoundingClientRect();
        exportCanvas.width = rect.width;
        exportCanvas.height = rect.height;
        const ctx = exportCanvas.getContext("2d");
        ctx.drawImage(canvas, 0, 0, rect.width, rect.height);
        onSave(exportCanvas.toDataURL("image/png"));
      };

      return (
        <div className="ht-drawing-container">
          <div className="ht-drawing-toolbar">
            <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
              {colors.map((c) => (
                <button
                  key={c}
                  type="button"
                  className="ht-color-swatch"
                  style={{ background: c, borderColor: color === c ? "var(--fg)" : "transparent", width: 26, height: 26 }}
                  onClick={() => setColor(c)}
                  aria-label={`Color ${c}`}
                />
              ))}
            </div>
            <div style={{ display: "flex", gap: 4 }}>
              {[2, 4, 8].map((t) => (
                <button
                  key={t}
                  type="button"
                  onClick={() => setThickness(t)}
                  className={`ht-thickness-btn ${thickness === t ? "active" : ""}`}
                  aria-label={`Grosor ${t}`}
                >
                  <span style={{ display: "inline-block", width: t * 2, height: t * 2, borderRadius: "50%", background: "currentColor" }} />
                </button>
              ))}
            </div>
            <button type="button" className="ht-btn ht-btn-ghost" onClick={clear} style={{ fontSize: "0.75rem", padding: "4px 10px" }}>
              Limpiar
            </button>
          </div>
          <canvas
            ref={canvasRef}
            className="ht-drawing-canvas"
            onMouseDown={start}
            onMouseMove={move}
            onMouseUp={end}
            onMouseLeave={end}
            onTouchStart={start}
            onTouchMove={move}
            onTouchEnd={end}
          />
          <div style={{ display: "flex", gap: 8, marginTop: 10, justifyContent: "flex-end" }}>
            <button type="button" className="ht-btn ht-btn-ghost" onClick={onCancel}>Cancelar</button>
            <button type="button" className="ht-btn ht-btn-primary" onClick={save}>Guardar dibujo</button>
          </div>
        </div>
      );
    }

    // ============================================================
    //  SettingsModal — preferencias de la app
    // ============================================================
    function SettingsModal({ settings, onUpdate, onRequestNotifications, onExport, onImport, onClearAll, onClose }) {
      const notifPermission = notifications.getPermission();
      const themes = [
        { id: "dark", label: "Oscuro", swatch: "#14130F" },
        { id: "light", label: "Claro", swatch: "#FAFAF7" },
        { id: "midnight", label: "Medianoche", swatch: "#0A0E1A" },
        { id: "auto", label: "Auto (sistema)", swatch: "linear-gradient(135deg, #14130F 50%, #FAFAF7 50%)" },
      ];

      const accentColors = [
        "#E8765C", // coral (default)
        "#6BA9E8", // azul
        "#7BA05B", // verde
        "#C9A227", // amarillo
        "#A78BC9", // morado
        "#D87B9E", // rosa
        "#5BA89F", // turquesa
      ];

      const testNotification = () => {
        const ok = notifications.show("Prueba de notificación", "Si ves esto, todo está funcionando 🎉");
        if (!ok) alert("Las notificaciones no están activas o no son soportadas en este navegador.");
      };

      return (
        <div className="ht-modal-bg" onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div className="ht-modal">
            <div className="ht-modal-header">
              <div className="ht-modal-title">Ajustes</div>
              <button className="ht-modal-close" onClick={onClose}>×</button>
            </div>
            <div className="ht-modal-body">

              {/* TEMA */}
              <div className="ht-settings-section">
                <div className="ht-settings-section-title">Apariencia</div>
                <div className="ht-field">
                  <label className="ht-label">Tema</label>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(110px, 1fr))", gap: 8 }}>
                    {themes.map((t) => (
                      <button
                        key={t.id}
                        type="button"
                        onClick={() => onUpdate({ theme: t.id })}
                        className={`ht-theme-btn ${settings.theme === t.id ? "active" : ""}`}
                      >
                        <span className="ht-theme-swatch" style={{ background: t.swatch }} />
                        {t.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="ht-field">
                  <label className="ht-label">Color de acento</label>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    {accentColors.map((c) => (
                      <button
                        key={c}
                        type="button"
                        onClick={() => onUpdate({ accentColor: c })}
                        className="ht-color-swatch"
                        style={{
                          background: c,
                          borderColor: settings.accentColor === c ? "var(--fg)" : "transparent",
                        }}
                        aria-label={`Color ${c}`}
                      />
                    ))}
                  </div>
                </div>
              </div>

              {/* NOTIFICACIONES */}
              <div className="ht-settings-section">
                <div className="ht-settings-section-title">Notificaciones</div>
                {notifPermission === "unsupported" && (
                  <div className="ht-alert" style={{ marginBottom: 12, fontSize: "0.8rem" }}>
                    Tu navegador no soporta notificaciones. Si estás en iOS, prueba abriendo la app desde la pantalla de inicio (Añadir a pantalla de inicio).
                  </div>
                )}
                {notifPermission === "default" && (
                  <div className="ht-field">
                    <button className="ht-btn ht-btn-primary" onClick={onRequestNotifications} style={{ width: "100%" }}>
                      Activar notificaciones
                    </button>
                  </div>
                )}
                {notifPermission === "denied" && (
                  <div className="ht-alert" style={{ marginBottom: 12, fontSize: "0.8rem" }}>
                    Permiso bloqueado. Actívalo desde los ajustes del navegador (candado en la barra de direcciones).
                  </div>
                )}
                {notifPermission === "granted" && (
                  <>
                    <div className="ht-toggle-row">
                      <div>
                        <div className="ht-toggle-label">Avisar antes de cada clase / tarea</div>
                        <div className="ht-toggle-sub">Te notifica X minutos antes</div>
                      </div>
                      <Toggle checked={settings.notificationsEnabled} onChange={(v) => onUpdate({ notificationsEnabled: v })} />
                    </div>

                    {settings.notificationsEnabled && (
                      <div className="ht-field">
                        <label className="ht-label">Minutos antes</label>
                        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                          {[5, 10, 15, 30, 60].map((m) => (
                            <button
                              key={m}
                              type="button"
                              onClick={() => onUpdate({ notifyMinutesBefore: m })}
                              className={`ht-pill ${settings.notifyMinutesBefore === m ? "active" : ""}`}
                            >{m} min</button>
                          ))}
                        </div>
                      </div>
                    )}

                    <button className="ht-btn ht-btn-secondary" onClick={testNotification} style={{ fontSize: "0.8rem" }}>
                      Probar notificación
                    </button>
                  </>
                )}
              </div>

              {/* AGENDA */}
              <div className="ht-settings-section">
                <div className="ht-settings-section-title">Agenda</div>
                <div className="ht-toggle-row">
                  <div>
                    <div className="ht-toggle-label">Ocultar tareas completadas</div>
                    <div className="ht-toggle-sub">Por defecto se ocultan, se pueden mostrar con un botón</div>
                  </div>
                  <Toggle checked={settings.hideCompletedTasks} onChange={(v) => onUpdate({ hideCompletedTasks: v })} />
                </div>
              </div>

              {/* CATEGORÍAS */}
              <div className="ht-settings-section">
                <div className="ht-settings-section-title">Categorías</div>
                <div style={{ fontSize: "0.78rem", color: "var(--fg-3)", marginBottom: 10, lineHeight: 1.5 }}>
                  Las predeterminadas siempre están disponibles. Las que crees aquí se suman a la lista cuando editas un evento o tarea.
                </div>

                <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 12 }}>
                  {DEFAULT_CATEGORIES.map((c) => (
                    <div key={c.id} className="ht-cat-row">
                      <span className="ht-cat-dot" style={{ background: c.color }} />
                      <span style={{ flex: 1, fontSize: "0.88rem", color: "var(--fg)" }}>{c.label}</span>
                      <span style={{ fontSize: "0.7rem", color: "var(--fg-3)" }}>predeterminada</span>
                    </div>
                  ))}
                  {(settings.categories || []).map((c) => (
                    <div key={c.id} className="ht-cat-row">
                      <span className="ht-cat-dot" style={{ background: c.color }} />
                      <span style={{ flex: 1, fontSize: "0.88rem", color: "var(--fg)" }}>{c.label}</span>
                      <button
                        type="button"
                        className="ht-icon-btn"
                        style={{ width: 28, height: 28, fontSize: "0.9rem" }}
                        onClick={() => {
                          if (window.confirm(`¿Eliminar la categoría "${c.label}"?`)) {
                            const next = (settings.categories || []).filter(cat => cat.id !== c.id);
                            onUpdate({ categories: next });
                          }
                        }}
                        aria-label="Eliminar"
                      >×</button>
                    </div>
                  ))}
                </div>

                <button
                  type="button"
                  className="ht-btn ht-btn-secondary"
                  style={{ width: "100%", fontSize: "0.85rem" }}
                  onClick={() => {
                    const label = window.prompt("Nombre de la nueva categoría:");
                    if (!label || !label.trim()) return;
                    const color = window.prompt("Color en hex (ej: #5BA89F):", "#5BA89F") || "#9B9890";
                    if (!/^#[0-9A-Fa-f]{6}$/.test(color)) {
                      alert("Color inválido. Usa formato hex como #5BA89F");
                      return;
                    }
                    const newCat = {
                      id: "custom_" + Math.random().toString(36).slice(2, 8),
                      label: label.trim(),
                      color,
                    };
                    onUpdate({ categories: [...(settings.categories || []), newCat] });
                  }}
                >
                  + Crear nueva categoría
                </button>
              </div>

              {/* CALENDARIO */}
              <div className="ht-settings-section">
                <div className="ht-settings-section-title">Calendario</div>
                <div className="ht-field">
                  <label className="ht-label">Mostrar festivos de</label>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {[
                      { id: "mx", label: "México" },
                      { id: "us", label: "Estados Unidos" },
                      { id: "none", label: "Ninguno" },
                    ].map((opt) => (
                      <button
                        key={opt.id}
                        type="button"
                        onClick={() => onUpdate({ countryHolidays: opt.id })}
                        className={`ht-pill ${settings.countryHolidays === opt.id ? "active" : ""}`}
                      >{opt.label}</button>
                    ))}
                  </div>
                </div>
              </div>

              {/* DATOS */}
              <div className="ht-settings-section">
                <div className="ht-settings-section-title">Datos</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  <button className="ht-btn ht-btn-secondary" onClick={onExport}>
                    Exportar (copiar al portapapeles)
                  </button>
                  <button className="ht-btn ht-btn-secondary" onClick={onImport}>
                    Importar desde texto
                  </button>
                  <button className="ht-btn ht-btn-danger" onClick={() => { onClearAll(); onClose(); }}>
                    Borrar todo
                  </button>
                </div>
              </div>

              {/* ACERCA */}
              <div className="ht-settings-section" style={{ borderBottom: 0, paddingBottom: 0 }}>
                <div className="ht-settings-section-title">Acerca de</div>
                <div style={{ fontSize: "0.82rem", color: "var(--fg-2)", lineHeight: 1.5 }}>
                  <strong>agenda.</strong> v{APP_VERSION} · build {APP_BUILD_DATE}<br />
                  Tus datos viven en este navegador. Usa exportar para hacer respaldo.
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    //  Toggle — switch reutilizable
    // ============================================================
    function Toggle({ checked, onChange }) {
      return (
        <button
          type="button"
          role="switch"
          aria-checked={checked}
          onClick={() => onChange(!checked)}
          className={`ht-toggle ${checked ? "checked" : ""}`}
        >
          <span className="ht-toggle-thumb" />
        </button>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
