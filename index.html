    const DAY_MAP = { Lun: 1, Mar: 2, "Mié": 3, Mie: 3, Jue: 4, Vie: 5, "Sáb": 6, Sab: 6, Dom: 0 };

    const normTime = (h, m) => `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;

    async function extractPdfText(file) {
      if (!window.pdfjsLib) throw new Error("PDF.js no cargó");
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      let allText = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const items = content.items.filter((it) => it.str !== undefined && it.str.length > 0);

        // 1. Agrupar items por línea visual (Y similar, tolerancia 3pt)
        items.sort((a, b) => {
          const dy = b.transform[5] - a.transform[5];
          if (Math.abs(dy) > 3) return dy;
          return a.transform[4] - b.transform[4];
        });

        const lines = [];
        let curLine = [];
        let lastY = null;
        for (const it of items) {
          const y = it.transform[5];
          if (lastY === null || Math.abs(y - lastY) < 3) {
            curLine.push(it);
          } else {
            if (curLine.length) lines.push(curLine);
            curLine = [it];
          }
          lastY = y;
        }
        if (curLine.length) lines.push(curLine);

        // 2. Dentro de cada línea, separar por columnas usando gaps grandes en X
        const processedLines = [];
        for (const line of lines) {
          line.sort((a, b) => a.transform[4] - b.transform[4]);
          const parts = [[line[0]]];
          for (let k = 1; k < line.length; k++) {
            const prev = line[k - 1];
            const curr = line[k];
            const prevEnd = prev.transform[4] + (prev.width || prev.str.length * 4);
            const gap = curr.transform[4] - prevEnd;
            if (gap > 25) {
              parts.push([curr]); // nueva columna
            } else {
              parts[parts.length - 1].push(curr);
            }
          }
          for (const part of parts) {
            const text = part.map((it) => it.str).join(" ").replace(/\s+/g, " ").trim();
            if (text) processedLines.push(text);
          }
        }
        allText += processedLines.join("\n") + "\n";
      }
      return allText;
    }

    // Preprocesar imagen para OCR: escalar 2x, escala de grises, aumento de contraste suave
    async function preprocessImage(file) {
      const img = new Image();
      const url = URL.createObjectURL(file);
      try {
        await new Promise((res, rej) => {
          img.onload = res;
          img.onerror = rej;
          img.src = url;
        });

        // Escalar 2x para que el OCR vea mejor el texto chico
        const scale = img.width < 1600 ? 2 : 1.3;
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        // Aplicar grayscale + aumento de contraste MODERADO (sin threshold agresivo)
        // Esto preserva detalle en texto chico como los tiempos
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          let gray = 0.299 * r + 0.587 * g + 0.114 * b;
          // contraste más suave: 1.4x (antes 1.8x)
          gray = (gray - 128) * 1.4 + 128;
          gray = Math.max(0, Math.min(255, gray));
          data[i] = data[i + 1] = data[i + 2] = gray;
        }
        ctx.putImageData(imageData, 0, 0);

        return await new Promise((res) => canvas.toBlob(res, "image/png"));
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    // OCR para imágenes — usa Tesseract.js con preprocesamiento
    // Hace DOS pasadas: una con preprocess (mejor para celdas/materias)
    // y otra sin preprocess sobre la columna izquierda (mejor para tiempos chicos)
    async function extractImageText(file, onProgress) {
      if (!window.Tesseract) throw new Error("Tesseract no cargó");
      if (onProgress) onProgress(2);

      // Pasada 1: imagen preprocesada (alto contraste, buena para texto grande de celdas)
      const processed = await preprocessImage(file).catch(() => file);
      const result1 = await Tesseract.recognize(processed, "spa+eng", {
        logger: (m) => {
          if (m.status === "recognizing text" && onProgress) {
            onProgress(2 + Math.round(m.progress * 50));
          }
        },
      });

      // Pasada 2: imagen sin preprocesar (mejor para texto chico/colorido como tiempos)
      // Solo si la pasada 1 no encontró ningún tiempo, hacemos esta extra
      const text1 = result1.data.text;
      const words1 = (result1.data.words || []).map((w) => ({
        text: w.text,
        x0: w.bbox?.x0 ?? 0,
        y0: w.bbox?.y0 ?? 0,
        x1: w.bbox?.x1 ?? 0,
        y1: w.bbox?.y1 ?? 0,
      }));

      const TIME_RE = /^(\d{1,2})[:.](\d{2})$/;
      const timesFound1 = words1.filter((w) => TIME_RE.test(w.text.trim().replace(/[^\d:.]/g, ""))).length;
      console.log("[horario] Pasada 1 (preprocess): " + words1.length + " palabras, " + timesFound1 + " tiempos");

      let words = words1;
      let text = text1;

      if (timesFound1 < 4) {
        // los tiempos se perdieron — intentar segunda pasada sin preprocess
        if (onProgress) onProgress(52);
        console.log("[horario] Pocos tiempos detectados, intentando segunda pasada sin preprocesamiento...");
        try {
          const result2 = await Tesseract.recognize(file, "spa+eng", {
            logger: (m) => {
              if (m.status === "recognizing text" && onProgress) {
                onProgress(52 + Math.round(m.progress * 48));
              }
            },
          });
          const words2 = (result2.data.words || []).map((w) => ({
            text: w.text,
            x0: w.bbox?.x0 ?? 0,
            y0: w.bbox?.y0 ?? 0,
            x1: w.bbox?.x1 ?? 0,
            y1: w.bbox?.y1 ?? 0,
          }));
          const timesFound2 = words2.filter((w) => TIME_RE.test(w.text.trim().replace(/[^\d:.]/g, ""))).length;
          console.log("[horario] Pasada 2 (raw): " + words2.length + " palabras, " + timesFound2 + " tiempos");

          // mezclar: usar palabras de la pasada 2 SOLO para tiempos en la columna izquierda
          // las palabras de la pasada 1 para todo lo demás
          if (timesFound2 > timesFound1) {
            const timeWordsFromRaw = words2.filter((w) =>
              TIME_RE.test(w.text.trim().replace(/[^\d:.]/g, ""))
            );
            // añadir los tiempos de la pasada 2 a las palabras de la pasada 1
            words = [...words1, ...timeWordsFromRaw];
            console.log("[horario] Mezclando: " + timeWordsFromRaw.length + " tiempos extra de la pasada raw");
          }
        } catch (e) {
          console.warn("[horario] Pasada 2 falló:", e);
        }
      }

      // log debug global accesible desde consola
      window.__horarioDebug = window.__horarioDebug || {};
      window.__horarioDebug.lastWords = words;
      window.__horarioDebug.lastText = text;
      window.__horarioDebug.gridLog = [];
      console.log("[horario] Total final: " + words.length + " palabras detectadas");

      const gridText = tryReconstructGrid(words);
      window.__horarioDebug.lastGridText = gridText;
      console.log("[horario] Reconstrucción: " + (gridText ? "ÉXITO" : "FALLÓ"));

      const finalText = gridText || text;
      return { text: finalText, rawText: text, gridText, words, wordCount: words.length };
    }

    // ============================================================
    //  RECONSTRUCTOR DE REJILLA v2
    //  Estrategia: encontrar la columna de HORAS a la izquierda
    //  (más confiable que el encabezado de días que suele ser texto blanco
    //  sobre fondo de color y el OCR lo destruye)
    //  Luego: detectar columnas de días por clustering de X de las celdas
    // ============================================================
    function tryReconstructGrid(words) {
      const log = (msg) => {
        if (window.__horarioDebug && window.__horarioDebug.gridLog) {
          window.__horarioDebug.gridLog.push(msg);
        }
        console.log("[horario/grid] " + msg);
      };

      if (!words || words.length < 15) {
        log("ABORT: muy pocas palabras (" + (words?.length || 0) + " < 15)");
        return null;
      }
      log("inicio: " + words.length + " palabras");

      const TIME_RE = /^(\d{1,2})[:.](\d{2})$/;

      // 1. Buscar TODAS las palabras que parezcan tiempo
      const timeWords = [];
      for (const w of words) {
        const cleaned = w.text.trim().replace(/[^\d:.]/g, "");
        const m = cleaned.match(TIME_RE);
        if (m) {
          const h = parseInt(m[1], 10);
          const min = parseInt(m[2], 10);
          if (h >= 0 && h <= 23 && min >= 0 && min <= 59) {
            timeWords.push({
              x: (w.x0 + w.x1) / 2,
              y: (w.y0 + w.y1) / 2,
              time: `${String(h).padStart(2, "0")}:${String(min).padStart(2, "0")}`,
              minutes: h * 60 + min,
              raw: w.text,
            });
          }
        }
      }
      log("paso 1: encontré " + timeWords.length + " palabras tipo HH:MM");
      log("muestras: " + timeWords.slice(0, 5).map(t => `${t.time}@(${Math.round(t.x)},${Math.round(t.y)})`).join(", "));

      if (timeWords.length < 4) {
        log("ABORT: menos de 4 tiempos, no es rejilla horaria");
        return null;
      }

      // 2. Encontrar la columna izquierda de tiempos: cluster con X más pequeño
      timeWords.sort((a, b) => a.x - b.x);
      const leftmostX = timeWords[0].x;
      // expandimos a 120px para tolerar OCR (antes 80)
      const leftColumn = timeWords.filter((t) => t.x < leftmostX + 120);
      log("paso 2: leftmostX=" + Math.round(leftmostX) + ", tiempos en columna izq: " + leftColumn.length);
      if (leftColumn.length < 4) {
        log("ABORT: columna izquierda de tiempos tiene menos de 4 entradas");
        return null;
      }

      // 3. Ordenar por Y → secuencia de horas de arriba a abajo
      leftColumn.sort((a, b) => a.y - b.y);

      // 4. Dedup tiempos muy cercanos en Y (mismo "row")
      // tolerancia adaptativa: 1.5% del rango Y total
      const yRangeTotal = leftColumn[leftColumn.length - 1].y - leftColumn[0].y;
      const dedupTol = Math.max(10, yRangeTotal * 0.012);
      log("paso 4: dedup tolerance = " + Math.round(dedupTol) + "px");

      const timeRows = [];
      for (const t of leftColumn) {
        const last = timeRows[timeRows.length - 1];
        if (last && Math.abs(t.y - last.y) < dedupTol) continue;
        timeRows.push(t);
      }
      log("paso 4: " + timeRows.length + " filas únicas de tiempo: " + timeRows.map(t => t.time).join(", "));

      if (timeRows.length < 3) {
        log("ABORT: menos de 3 filas únicas de tiempo");
        return null;
      }

      // 5. Determinar el área del horario: desde el primer tiempo hasta el último
      const gridTopY = timeRows[0].y;
      const gridBottomY = timeRows[timeRows.length - 1].y;
      // las celdas empiezan a la derecha de la columna de tiempos, pero no muy lejos
      const gridLeftX = leftmostX + 40;
      log("paso 5: área grid Y=[" + Math.round(gridTopY) + "," + Math.round(gridBottomY) + "], leftX=" + Math.round(gridLeftX));

      // 6. Encontrar el límite derecho: la palabra más a la derecha dentro del rango Y de la rejilla
      let gridRightX = 0;
      for (const w of words) {
        const wy = (w.y0 + w.y1) / 2;
        if (wy >= gridTopY - 20 && wy <= gridBottomY + 20) {
          gridRightX = Math.max(gridRightX, w.x1);
        }
      }
      log("paso 6: gridRightX=" + Math.round(gridRightX));
      if (gridRightX <= gridLeftX) {
        log("ABORT: gridRightX <= gridLeftX, área inválida");
        return null;
      }

      // 7. Detectar columnas de días por clustering de X de las palabras dentro del grid
      const cellWords = words.filter((w) => {
        const wy = (w.y0 + w.y1) / 2;
        const wx = (w.x0 + w.x1) / 2;
        if (wy < gridTopY - 10 || wy > gridBottomY + 30) return false;
        if (wx < gridLeftX || wx > gridRightX + 20) return false;
        if (TIME_RE.test(w.text.trim().replace(/[^\d:.]/g, ""))) return false;
        if (w.text.trim().length < 2) return false;
        return true;
      });

      log("paso 7: " + cellWords.length + " palabras dentro de la rejilla");
      log("muestras celda: " + cellWords.slice(0, 6).map(w => `"${w.text}"@(${Math.round((w.x0+w.x1)/2)},${Math.round((w.y0+w.y1)/2)})`).join(", "));

      if (cellWords.length < 6) {
        log("ABORT: menos de 6 palabras en la rejilla");
        return null;
      }

      // 8. Asumir N columnas iguales entre gridLeftX y gridRightX
      // Heurística: contar palabras únicas por bandas de X, encontrar el número de columnas más probable
      // Empezar con 5 columnas (típico L-M-M-J-V), permitir 4-7
      // Probar diferentes counts y elegir el que distribuya las palabras más uniformemente
      let bestNumCols = 5;
      let bestVariance = Infinity;
      for (let numCols = 4; numCols <= 7; numCols++) {
        const totalWidth = gridRightX - gridLeftX;
        const colWidth = totalWidth / numCols;
        const counts = new Array(numCols).fill(0);
        for (const w of cellWords) {
          const wx = (w.x0 + w.x1) / 2;
          const col = Math.min(numCols - 1, Math.max(0, Math.floor((wx - gridLeftX) / colWidth)));
          counts[col]++;
        }
        // calcular varianza: queremos distribución uniforme
        const mean = counts.reduce((a, b) => a + b, 0) / numCols;
        const variance = counts.reduce((s, c) => s + (c - mean) ** 2, 0) / numCols;
        // normalizar por mean para preferir distribuciones más balanceadas
        const normVar = variance / (mean || 1);
        // criterio más permisivo: al menos 1 palabra en cada columna (antes 2)
        if (normVar < bestVariance && counts.every((c) => c >= 1)) {
          bestVariance = normVar;
          bestNumCols = numCols;
        }
      }

      const numCols = bestNumCols;
      const colWidth = (gridRightX - gridLeftX) / numCols;
      log("paso 8: best numCols=" + numCols + " (colWidth=" + Math.round(colWidth) + "px)");

      // 9. Mapeo de columna → día. Asumimos lunes a viernes para 5 cols, ajustar si es 6/7
      let colToDay;
      if (numCols === 5) colToDay = [1, 2, 3, 4, 5];
      else if (numCols === 6) colToDay = [1, 2, 3, 4, 5, 6];
      else if (numCols === 7) colToDay = [1, 2, 3, 4, 5, 6, 0];
      else colToDay = [1, 2, 3, 4];

      // 10. Para cada (slot, col), juntar palabras
      const classMap = {};
      const slots = [];
      const dedupTolSlot = Math.max(8, dedupTol * 0.7);
      for (let r = 0; r < timeRows.length - 1; r++) {
        const slot = {
          start: timeRows[r].time,
          end: timeRows[r + 1].time,
          yTop: timeRows[r].y,
          yBot: timeRows[r + 1].y,
        };
        if (slot.yBot - slot.yTop < dedupTolSlot) continue;
        // skip si el rango es muy largo (más de 4 horas: probablemente saltó algo grande)
        const slotMin = (parseInt(slot.end.split(":")[0]) * 60 + parseInt(slot.end.split(":")[1])) -
                        (parseInt(slot.start.split(":")[0]) * 60 + parseInt(slot.start.split(":")[1]));
        if (slotMin > 240 || slotMin <= 0) continue;
        slots.push(slot);
      }
      log("paso 10: " + slots.length + " slots horarios válidos");

      if (slots.length < 2) {
        log("ABORT: menos de 2 slots válidos");
        return null;
      }

      for (const slot of slots) {
        for (let c = 0; c < numCols; c++) {
          const colLeft = gridLeftX + c * colWidth;
          const colRight = gridLeftX + (c + 1) * colWidth;
          const cellWordsHere = cellWords.filter((w) => {
            const wy = (w.y0 + w.y1) / 2;
            const wx = (w.x0 + w.x1) / 2;
            return wy > slot.yTop - 2 && wy < slot.yBot + 4 &&
                   wx >= colLeft && wx < colRight;
          });
          if (cellWordsHere.length === 0) continue;

          cellWordsHere.sort((a, b) => a.y0 - b.y0 || a.x0 - b.x0);
          const cellText = cellWordsHere.map((w) => w.text).join(" ").trim();
          if (cellText.length < 3) continue;

          // separar nombre / salón
          const tokens = cellText.split(/\s+/);
          let room = "";
          let name = cellText;
          // si la última palabra es un número de 2-4 cifras → salón
          const lastTok = tokens[tokens.length - 1];
          if (/^\d{2,4}$/.test(lastTok) && tokens.length > 1) {
            room = lastTok;
            name = tokens.slice(0, -1).join(" ");
          }
          // limpiar puntos suspensivos y caracteres raros
          name = name.replace(/[|]+/g, "").replace(/\.{2,}$/, "").replace(/\s+/g, " ").trim();
          if (name.length < 3) continue;
          if (/^[\d\s.,]+$/.test(name)) continue;

          const key = name.toUpperCase().replace(/\s+/g, " ");
          if (!classMap[key]) classMap[key] = { name, room, schedule: [] };
          classMap[key].schedule.push({ day: colToDay[c], start: slot.start, end: slot.end });
          if (!classMap[key].room && room) classMap[key].room = room;
        }
      }

      // 11. Fusionar slots consecutivos
      const classes = Object.values(classMap);
      for (const cls of classes) {
        cls.schedule.sort((a, b) => a.day - b.day || a.start.localeCompare(b.start));
        const merged = [];
        for (const s of cls.schedule) {
          const last = merged[merged.length - 1];
          if (last && last.day === s.day && last.end === s.start) {
            last.end = s.end;
          } else {
            merged.push({ ...s });
          }
        }
        cls.schedule = merged;
      }

      log("paso 11: " + classes.length + " clases reconstruidas");
      if (classes.length === 0) {
        log("ABORT: 0 clases después de juntar celdas");
        return null;
      }

      log("ÉXITO: nombres detectados: " + classes.map(c => c.name).join(" | "));

      // 12. Generar texto formato "Materia:" para el parser principal
      const DAY_NAMES = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
      const lines = ["Materias del plan de estudios"];
      classes.forEach((c, i) => {
        lines.push(`Materia: AUTO${i + 1}`);
        lines.push(c.name);
        const byTimeKey = {};
        for (const s of c.schedule) {
          const k = `${s.start}-${s.end}`;
          if (!byTimeKey[k]) byTimeKey[k] = [];
          byTimeKey[k].push(s.day);
        }
        for (const [timeRange, days] of Object.entries(byTimeKey)) {
          const dayStr = days.map((d) => DAY_NAMES[d]).join(", ");
          const [start, end] = timeRange.split("-");
          lines.push(`${dayStr} ${start} - ${end}`);
        }
        if (c.room) lines.push(`Salón ${c.room} | CRN 0000`);
      });
      return lines.join("\n");
    }

    const isImageFile = (file) => /^image\//i.test(file.type) || /\.(png|jpg|jpeg|webp|bmp)$/i.test(file.name);
    const isPdfFile = (file) => file.type === "application/pdf" || /\.pdf$/i.test(file.name);

    // ============================================================
    //  EXTRACTOR DE MATERIAS CANDIDATAS — fallback cuando OCR no
    //  puede leer la rejilla horaria. Busca nombres de materias
    //  en cualquier parte del texto, los limpia y deduplica.
    // ============================================================
    function extractCandidateSubjects(text) {
      const candidates = [];
      const seen = new Map();

      // helper: limpiar línea de basura común
      const cleanLine = (raw) => {
        let s = raw;
        // quitar prefijos de bullet/iconos comunes del OCR: @, [, (, ), ], ., *, espacios
        s = s.replace(/^[\[\]\(\)@\)\(\.\*\-\s•◯◉○●]+/, "");
        // si empieza con cosa como "[) " o "(] " quitar
        s = s.replace(/^[^\w]+/, "");
        return s.trim();
      };

      // helper: detectar si una palabra parece apellido (todo mayúsculas, 4+ chars, no numeral)
      const looksLikeSurname = (t) => {
        if (t.length < 4) return false;
        if (/^(II|III|IV|VI|VII|VIII|FTC)$/i.test(t)) return false;
        // todo mayúsculas o con acentos mayúsculos
        return /^[A-ZÁÉÍÓÚÑ]+$/.test(t) || /^[A-ZÁÉÍÓÚÑ]+[\.,]$/.test(t);
      };

      // helper: detectar inicio del nombre del profesor en una lista de tokens
      // los nombres de profesor típicamente son 2+ palabras MAYÚSCULAS consecutivas
      const findProfessorStart = (tokens) => {
        for (let i = 1; i < tokens.length - 1; i++) {
          // limpiar punctuation del token actual
          const t = tokens[i].replace(/[\.,]/g, "");
          const tNext = tokens[i + 1].replace(/[\.,]/g, "");
          if (looksLikeSurname(t) && looksLikeSurname(tNext)) {
            return i;
          }
        }
        // backup: buscar coma — los profesores suelen tener "APELLIDO, NOMBRE"
        for (let i = 1; i < tokens.length; i++) {
          if (tokens[i].includes(",")) {
            // retroceder hasta encontrar inicio del nombre (palabra anterior en mayúsculas)
            for (let j = i; j >= 1; j--) {
              if (looksLikeSurname(tokens[j].replace(/[\.,]/g, ""))) {
                return j;
              }
            }
            return i;
          }
        }
        return -1;
      };

      // 1. Sección "Inscripciones de clases" — la fuente más limpia
      const inscMatch = text.match(/Inscripciones\s+de\s+clases([\s\S]+?)(?:https?:|$)/i);
      if (inscMatch) {
        const section = inscMatch[1];
        const lines = section.split("\n").map(l => l.trim()).filter(Boolean);
        for (let line of lines) {
          // saltar headers
          if (/^(Clase\s+Profesor|Profesor\s+Grupo|Clase|Profesor|Grupo)/i.test(line)) continue;

          let clean = cleanLine(line);
          if (clean.length < 4) continue;

          // quitar sufijo de grupo: "3-F", "3F", "3", "ROBÓTICA" al final
          clean = clean.replace(/\s+(3-?F?|ROBÓTICA)\s*$/i, "").trim();

          const tokens = clean.split(/\s+/);
          if (tokens.length < 2) {
            // posible que sea solo nombre de materia, mantener
            const norm = clean.toUpperCase().replace(/\s+/g, " ");
            if (!seen.has(norm) && /[A-ZÁÉÍÓÚÑ]{3,}/.test(clean)) {
              seen.set(norm, clean);
              candidates.push(clean);
            }
            continue;
          }

          // separar materia / profesor
          const profStart = findProfessorStart(tokens);
          let subjectTokens;
          if (profStart > 0) {
            subjectTokens = tokens.slice(0, profStart);
          } else {
            // si no detectamos profesor, asumimos toda la línea es materia
            subjectTokens = tokens;
          }

          // limpiar tokens basura (numerales romanos rotos como "Nl", "If", "til", "Il", "Ii")
          // los conservamos pero los normalizamos a "III" o "II" cuando son obvios
          const subject = subjectTokens.join(" ")
            .replace(/\b(Nl|nl|NI|N!|N1)\b/g, "III") // OCR confunde III con Nl frecuentemente
            .replace(/\b(Il|il|I1|i1)\b/g, "III")
            .replace(/\b(Ii|ii|i!)\b/g, "II")
            .replace(/\btil\b/g, "III")
            .replace(/\b(If|lf|1f)\b/g, "II")
            .replace(/\s+/g, " ")
            .trim();

          if (subject.length < 4) continue;
          // descartar si parece basura
          if (!/[A-ZÁÉÍÓÚÑ]{3,}/.test(subject)) continue;
          if (/^(Clase|Profesor|Grupo|Materia)\s*$/i.test(subject)) continue;

          // título case suave: si todo mayúsculas, convertir a Title Case para que se vea mejor
          let display = subject;
          if (subject === subject.toUpperCase()) {
            display = subject.toLowerCase().replace(/\b[a-záéíóúñ]/g, (c) => c.toUpperCase());
          }

          const norm = display.toUpperCase().replace(/\s+/g, " ");
          if (!seen.has(norm)) {
            seen.set(norm, display);
            candidates.push(display);
          }
        }
      }

      // 2. COMPLEMENTAR desde el cuerpo del texto: buscar PALABRAS-MATERIA
      //    conocidas que pueden haberse perdido en la sección Inscripciones
      //    por OCR roto (ej: CHEMISTRY → "creistrr", HEALTH → "aun")
      // Vocabulario de palabras-clave comunes en horarios escolares
      const KNOWN_SUBJECTS = [
        "CHEMISTRY", "PHYSICS", "BIOLOGY", "MATHEMATICS", "MATEMATICAS", "MATEMÁTICAS",
        "HISTORY", "HISTORIA", "ESPAÑOL", "ESPANOL", "ENGLISH", "INGLES", "INGLÉS",
        "FRANCES", "FRANCÉS", "FRENCH", "GERMAN", "ALEMAN",
        "HEALTH", "SALUD", "ARTS", "ARTE", "VISUAL", "MUSIC", "MUSICA", "MÚSICA",
        "GRAMMAR", "WRITING", "READING", "LITERATURE", "LITERATURA",
        "GEOGRAFÍA", "GEOGRAFIA", "FÍSICA", "FISICA", "QUÍMICA", "QUIMICA",
        "ROBÓTICA", "ROBOTICA", "TECHNOLOGY", "TECNOLOGÍA", "TECNOLOGIA",
        "TUTORÍA", "TUTORIA", "CHARACTER", "FORMACIÓN", "FORMACION",
        "CÍVICA", "CIVICA", "ÉTICA", "ETICA", "FILOSOFÍA", "FILOSOFIA",
        "EDUCACIÓN", "EDUCACION", "DEPORTE", "EDUCACIÓN FÍSICA",
        "APPLIED", "ALGEBRA", "GEOMETRY", "CALCULUS", "CALCULO", "CÁLCULO",
      ];

      const bodyText = text.toUpperCase();
      for (const subject of KNOWN_SUBJECTS) {
        // buscar la palabra como token completo (con boundaries)
        const re = new RegExp(`\\b${subject.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\b`, "i");
        if (re.test(bodyText)) {
          // capitalizar bonito
          const display = subject.charAt(0).toUpperCase() + subject.slice(1).toLowerCase();
          const norm = display.toUpperCase();
          // solo agregar si NO está ya en candidates (parcial)
          const alreadyHave = candidates.some(c => {
            const cNorm = c.toUpperCase();
            return cNorm.includes(norm) || norm.includes(cNorm);
          });
          if (!alreadyHave && !seen.has(norm)) {
            seen.set(norm, display);
            candidates.push(display);
          }
        }
      }

      return candidates;
    }

    function parseTecSchedule(text) {
      const rawLines = text.split("\n").map((l) => l.trim()).filter(Boolean);

      // 1. Recorrer una vez para identificar secciones y bloques de materia
      let currentSection = "academica";
      const blocks = []; // { code, name, section, lines: [] }
      let cur = null;

      for (let i = 0; i < rawLines.length; i++) {
        const line = rawLines[i];

        // detectar headers de sección
        if (/LE\s*-\s*Lengua/i.test(line) || /^Lengua\s+extranjera/i.test(line)) currentSection = "lenguas";
        else if (/Materias\s+LiFE/i.test(line) || /^LiFE/i.test(line)) currentSection = "life";
        else if (/Materias\s+del\s+plan/i.test(line)) currentSection = "academica";
        else if (/Materias?\s+cocurricular/i.test(line) || /^Cocurricular/i.test(line)) currentSection = "cocurricular";

        const mMat = line.match(/^Materia:\s*(.+?)\s*$/i);
        if (mMat) {
          if (cur) blocks.push(cur);
          // siguiente línea con contenido útil = nombre
          let name = "";
          for (let j = i + 1; j < rawLines.length; j++) {
            const cand = rawLines[j];
            if (cand.length > 1 && !/^Materia:/i.test(cand) && !/^Materias?\s+/i.test(cand)) {
              name = cand;
              break;
            }
          }
          cur = { code: mMat[1].trim(), name, section: currentSection, lines: [] };
          continue;
        }

        if (cur) cur.lines.push(line);
      }
      if (cur) blocks.push(cur);

      // 2. Para cada bloque, sacar horarios, salón con regex globales
      const SCHEDULE_RE = /((?:Lun|Mar|Mié|Mie|Jue|Vie|Sáb|Sab|Dom)(?:\s*,\s*(?:Lun|Mar|Mié|Mie|Jue|Vie|Sáb|Sab|Dom))*)\s+(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})/g;
      const LOCATION_RE = /([A-Z]{2,5}\s*\|\s*[^|\n]+?\s*\|\s*\S+)/;
      const ROOM_RE = /(\S+)\s*\|\s*CRN\s*\d+/;

      const classes = [];
      for (const block of blocks) {
        const blob = block.lines.join("\n");

        // horarios — puede haber varios
        const scheduleRaw = [];
        let m;
        SCHEDULE_RE.lastIndex = 0;
        while ((m = SCHEDULE_RE.exec(blob)) !== null) {
          const days = m[1].split(",").map((d) => d.trim());
          const start = normTime(m[2], m[3]);
          const end = normTime(m[4], m[5]);
          // validar que tiene sentido (start < end, dentro de horario humano)
          if (toMin(start) >= toMin(end)) continue;
          for (const d of days) {
            const dn = DAY_MAP[d];
            if (dn !== undefined) scheduleRaw.push({ day: dn, start, end });
          }
        }

        // deduplicar
        const seen = new Set();
        const schedule = scheduleRaw.filter((s) => {
          const k = `${s.day}-${s.start}-${s.end}`;
          if (seen.has(k)) return false;
          seen.add(k);
          return true;
        });

        if (schedule.length === 0) continue;

        // ubicación
        let location = "";
        const mLoc = blob.match(LOCATION_RE);
        if (mLoc) location = mLoc[1].trim();

        // salón
        let roomNum = "";
        for (const ln of block.lines) {
          const r = ln.match(ROOM_RE);
          if (r) { roomNum = r[1]; break; }
        }

        const roomParts = [];
        if (location) roomParts.push(location.replace(/^[A-Z]{2,5}\s*\|\s*/, ""));
        if (roomNum) roomParts.push(`Salón ${roomNum}`);

        classes.push({
          id: uid(),
          code: block.code,
          name: block.name || block.code,
          room: roomParts.join(" · "),
          category: block.section,
          schedule,
          description: "",
        });
      }

      return classes;
    }

    // ============================================================
    //  TIMELINE — incluye bloques de tiempo libre entre clases
    // ============================================================
    const buildTimelineWithFreeSlots = (todayBlocks) => {
      if (todayBlocks.length === 0) return [];
      const slots = [];
      for (let i = 0; i < todayBlocks.length; i++) {
        slots.push({ type: "class", ...todayBlocks[i] });
        if (i < todayBlocks.length - 1) {
          const gap = todayBlocks[i + 1].start - todayBlocks[i].end;
          if (gap >= 15) {
            const start = todayBlocks[i].end;
            const end = todayBlocks[i + 1].start;
            slots.push({
              type: "free",
              start,
              end,
              startStr: fromMin(start),
              endStr: fromMin(end),
              message: getFreeMessage(start, end),
            });
          }
        }
      }
      return slots;
    };

    const analyzeSchedule = (classes, now) => {
      const day = now.getDay();
      const currentMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
      const allBlocks = [];
      classes.forEach((c) => {
        c.schedule.forEach((s, idx) => {
          allBlocks.push({
            classId: c.id, name: c.name, room: c.room, category: c.category,
            day: s.day, start: toMin(s.start), end: toMin(s.end),
            startStr: s.start, endStr: s.end, blockIdx: idx,
          });
        });
      });
      const todayBlocks = allBlocks.filter((b) => b.day === day).sort((a, b) => a.start - b.start);
      let current = null, next = null;
      for (const b of todayBlocks) {
        if (currentMin >= b.start && currentMin < b.end) { current = b; break; }
      }
      for (let offset = 0; offset < 7; offset++) {
        const checkDay = (day + offset) % 7;
        const blocksThatDay = allBlocks.filter((b) => b.day === checkDay).sort((a, b) => a.start - b.start);
        for (const b of blocksThatDay) {
          if (offset === 0) {
            if (b.start > currentMin) { next = { ...b, dayOffset: 0 }; break; }
          } else {
            next = { ...b, dayOffset: offset }; break;
          }
        }
        if (next) break;
      }
      return { current, next, todayBlocks, allBlocks };
    };

    const detectOverlaps = (classes) => {
      const blocks = [];
      classes.forEach((c) => {
        c.schedule.forEach((s) => {
          blocks.push({ classId: c.id, name: c.name, day: s.day, start: toMin(s.start), end: toMin(s.end), startStr: s.start, endStr: s.end });
        });
      });
      const overlaps = [];
      for (let i = 0; i < blocks.length; i++) {
        for (let j = i + 1; j < blocks.length; j++) {
          const a = blocks[i], b = blocks[j];
          if (a.day === b.day && a.start < b.end && b.start < a.end && a.classId !== b.classId) {
            overlaps.push({ a, b });
          }
        }
      }
      return overlaps;
    };

    // ============================================================
    //  STORAGE — localStorage con verificación
    //  Tres keys: clases recurrentes, tareas/eventos, configuración
    // ============================================================
    const storage = {
      isAvailable: () => {
        try {
          const k = "__ht_test__";
          localStorage.setItem(k, "1");
          localStorage.removeItem(k);
          return true;
        } catch { return false; }
      },
      // Clases recurrentes
      loadClasses: () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch { return []; }
      },
      saveClasses: (classes) => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(classes));
          return true;
        } catch { return false; }
      },
      // Tareas y eventos puntuales
      loadTasks: () => {
        try {
          const raw = localStorage.getItem(STORAGE_TASKS_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch { return []; }
      },
      saveTasks: (tasks) => {
        try {
          localStorage.setItem(STORAGE_TASKS_KEY, JSON.stringify(tasks));
          return true;
        } catch { return false; }
      },
      // Configuración
      loadSettings: () => {
        try {
          const raw = localStorage.getItem(STORAGE_SETTINGS_KEY);
          if (!raw) return { ...DEFAULT_SETTINGS };
          const parsed = JSON.parse(raw);
          // merge con defaults por si hay nuevos campos
          return { ...DEFAULT_SETTINGS, ...parsed };
        } catch { return { ...DEFAULT_SETTINGS }; }
      },
      saveSettings: (settings) => {
        try {
          localStorage.setItem(STORAGE_SETTINGS_KEY, JSON.stringify(settings));
          return true;
        } catch { return false; }
      },
      // Notas
      loadNotes: () => {
        try {
          const raw = localStorage.getItem(STORAGE_NOTES_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch { return []; }
      },
      saveNotes: (notes) => {
        try {
          localStorage.setItem(STORAGE_NOTES_KEY, JSON.stringify(notes));
          return true;
        } catch { return false; }
      },
      // Backwards-compat alias
      load: function() { return this.loadClasses(); },
      save: function(c) { return this.saveClasses(c); },
    };

    // ============================================================
    //  NOTIFICACIONES — API nativa del navegador (Notification API)
    //  Programa avisos locales sin necesidad de backend.
    //  Funciona en Chrome/Edge/Firefox desktop y mobile.
    //  En iOS Safari requiere PWA instalada como app.
    // ============================================================
    const notifications = {
      isSupported: () => typeof Notification !== "undefined",
      getPermission: () => typeof Notification !== "undefined" ? Notification.permission : "unsupported",
      request: async () => {
        if (typeof Notification === "undefined") return "unsupported";
        try {
          const result = await Notification.requestPermission();
          return result;
        } catch { return "denied"; }
      },
      // Programa una notificación para X ms en el futuro
      // Devuelve el timer id para poder cancelar
      schedule: (whenMs, title, body) => {
        if (whenMs <= 0) return null;
        if (typeof Notification === "undefined") return null;
        if (Notification.permission !== "granted") return null;
        return setTimeout(() => {
          try {
            new Notification(title, { body, icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314130F'/%3E%3Ctext x='50%25' y='62%25' text-anchor='middle' font-family='sans-serif' font-weight='600' font-size='38' fill='%23E8765C'%3Eh%3C/text%3E%3C/svg%3E" });
          } catch (e) { console.warn("[agenda] notificación falló:", e); }
        }, whenMs);
      },
      // Notificación inmediata (para tests)
      show: (title, body) => {
        if (typeof Notification === "undefined") return false;
        if (Notification.permission !== "granted") return false;
        try {
          new Notification(title, { body });
          return true;
        } catch { return false; }
      },
    };

    // ============================================================
    //  APP
    // ============================================================
    function App() {
      const [classes, setClasses] = useState([]); // eventos recurrentes (semanales)
      const [tasks, setTasks] = useState([]); // tareas/eventos puntuales
      const [notes, setNotes] = useState([]); // notas rápidas
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [loaded, setLoaded] = useState(false);
      const [editorOpen, setEditorOpen] = useState(false);
      const [editingClass, setEditingClass] = useState(null);
      const [taskEditorOpen, setTaskEditorOpen] = useState(false);
      const [editingTask, setEditingTask] = useState(null);
      const [noteEditorOpen, setNoteEditorOpen] = useState(false);
      const [editingNote, setEditingNote] = useState(null);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [view, setView] = useState("home"); // home | agenda | schedule | calendar | notes
      const [now, setNow] = useState(new Date());
      const [toast, setToast] = useState(null);
      const [storageOk, setStorageOk] = useState(true);
      const [pdfModalOpen, setPdfModalOpen] = useState(false);
      const scheduledTimersRef = React.useRef(new Set());

      useEffect(() => {
        const t = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(t);
      }, []);

      // Load todo al iniciar
      useEffect(() => {
        const ok = storage.isAvailable();
        setStorageOk(ok);
        if (ok) {
          setClasses(storage.loadClasses());
          setTasks(storage.loadTasks());
          setNotes(storage.loadNotes());
          setSettings(storage.loadSettings());
        }
        setLoaded(true);
      }, []);

      // Aplicar tema al DOM
      useEffect(() => {
        let theme = settings.theme;
        if (theme === "auto") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
        // Color de acento custom
        if (settings.accentColor && settings.accentColor !== "#E8765C") {
          document.documentElement.style.setProperty("--accent", settings.accentColor);
          // generar soft del accent
          const hex = settings.accentColor.replace("#", "");
          if (hex.length === 6) {
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            document.documentElement.style.setProperty("--accent-soft", `rgba(${r},${g},${b},0.12)`);
          }
        } else {
          document.documentElement.style.removeProperty("--accent");
          document.documentElement.style.removeProperty("--accent-soft");
        }
      }, [settings.theme, settings.accentColor]);

      // Reprogramar notificaciones cuando cambien clases, tareas o settings
      useEffect(() => {
        // limpiar timers anteriores
        scheduledTimersRef.current.forEach((id) => clearTimeout(id));
        scheduledTimersRef.current.clear();

        if (!settings.notificationsEnabled) return;
        if (notifications.getPermission() !== "granted") return;

        const nowMs = Date.now();
        const minsBefore = settings.notifyMinutesBefore || 10;

        // Próximas instancias de clases en los próximos 7 días
        const nowDate = new Date();
        for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
          const checkDate = new Date(nowDate);
          checkDate.setDate(checkDate.getDate() + dayOffset);
          const dayNum = checkDate.getDay();
          for (const cls of classes) {
            for (const s of cls.schedule) {
              if (s.day !== dayNum) continue;
              const [h, m] = s.start.split(":").map(Number);
              const classTime = new Date(checkDate);
              classTime.setHours(h, m, 0, 0);
              const notifyTime = classTime.getTime() - minsBefore * 60 * 1000;
              if (notifyTime > nowMs && notifyTime - nowMs < 7 * 24 * 60 * 60 * 1000) {
                const id = notifications.schedule(
                  notifyTime - nowMs,
                  `${cls.name} en ${minsBefore} min`,
                  cls.room ? `Lugar: ${cls.room}` : "Tu próximo evento está por empezar"
                );
                if (id) scheduledTimersRef.current.add(id);
              }
            }
          }
        }

        // Tareas/eventos puntuales
        for (const task of tasks) {
          if (task.completed) continue;
          if (!task.dueDate) continue;
          const dueMs = new Date(task.dueDate).getTime();
          if (isNaN(dueMs)) continue;
          const notifyTime = dueMs - minsBefore * 60 * 1000;
          if (notifyTime > nowMs && notifyTime - nowMs < 14 * 24 * 60 * 60 * 1000) {
            const id = notifications.schedule(
              notifyTime - nowMs,
              `${TASK_TYPES[task.type]?.label || "Recordatorio"}: ${task.title}`,
              task.description || `Vence en ${minsBefore} minutos`
            );
            if (id) scheduledTimersRef.current.add(id);
          }
        }

        return () => {
          scheduledTimersRef.current.forEach((id) => clearTimeout(id));
          scheduledTimersRef.current.clear();
        };
      }, [classes, tasks, settings.notificationsEnabled, settings.notifyMinutesBefore]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2800);
      };

      const persistClasses = useCallback((next) => {
        if (!storageOk) return;
        if (!storage.saveClasses(next)) {
          setStorageOk(false);
          showToast("⚠ No se pudo guardar — usa Exportar como respaldo");
        }
      }, [storageOk]);

      const persistTasks = useCallback((next) => {
        if (!storageOk) return;
        if (!storage.saveTasks(next)) {
          setStorageOk(false);
          showToast("⚠ No se pudo guardar las tareas");
        }
      }, [storageOk]);

      const persistSettings = useCallback((next) => {
        if (!storageOk) return;
        storage.saveSettings(next);
      }, [storageOk]);

      const persistNotes = useCallback((next) => {
        if (!storageOk) return;
        if (!storage.saveNotes(next)) {
          setStorageOk(false);
          showToast("No se pudo guardar la nota");
        }
      }, [storageOk]);

      // alias para no romper código existente
      const persist = persistClasses;

      const upsertClass = (cls) => {
        setClasses((prev) => {
          const exists = prev.some((c) => c.id === cls.id);
          const next = exists ? prev.map((c) => (c.id === cls.id ? cls : c)) : [...prev, cls];
          persist(next);
          return next;
        });
        setEditorOpen(false);
        setEditingClass(null);
        showToast(`✓ ${cls.name} guardada`);
      };

      const deleteClass = (id) => {
        setClasses((prev) => {
          const next = prev.filter((c) => c.id !== id);
          persist(next);
          return next;
        });
        setEditorOpen(false);
        setEditingClass(null);
        showToast("Clase eliminada");
      };

      const clearAll = () => {
        if (!window.confirm("¿Borrar TODO (eventos, tareas, notas)? No se puede deshacer.")) return;
        setClasses([]);
        setTasks([]);
        setNotes([]);
        persistClasses([]);
        persistTasks([]);
        persistNotes([]);
        showToast("Todo reiniciado");
      };

      const exportData = async () => {
        const payload = {
          version: APP_VERSION,
          exportedAt: new Date().toISOString(),
          classes,
          tasks,
          notes,
          settings,
        };
        const data = JSON.stringify(payload, null, 2);
        try {
          await navigator.clipboard.writeText(data);
          showToast("✓ Datos copiados al portapapeles");
        } catch {
          window.prompt("Copia este texto y guárdalo donde quieras:", data);
        }
      };

      const importData = () => {
        const raw = window.prompt("Pega aquí el JSON exportado:");
        if (!raw) return;
        try {
          const parsed = JSON.parse(raw);
          let classesIn = [], tasksIn = [], notesIn = [], settingsIn = null;
          if (Array.isArray(parsed)) {
            classesIn = parsed;
          } else if (parsed && typeof parsed === "object") {
            classesIn = Array.isArray(parsed.classes) ? parsed.classes : [];
            tasksIn = Array.isArray(parsed.tasks) ? parsed.tasks : [];
            notesIn = Array.isArray(parsed.notes) ? parsed.notes : [];
            settingsIn = parsed.settings && typeof parsed.settings === "object" ? parsed.settings : null;
          } else {
            throw new Error("formato inválido");
          }
          for (const c of classesIn) {
            if (!c.id || !c.name || !Array.isArray(c.schedule)) throw new Error("evento mal formado");
          }
          setClasses(classesIn);
          persistClasses(classesIn);
          if (tasksIn.length) {
            setTasks(tasksIn);
            persistTasks(tasksIn);
          }
          if (notesIn.length) {
            setNotes(notesIn);
            persistNotes(notesIn);
          }
          if (settingsIn) {
            const merged = { ...DEFAULT_SETTINGS, ...settingsIn };
            setSettings(merged);
            persistSettings(merged);
          }
          const parts = [];
          if (classesIn.length) parts.push(`${classesIn.length} evento${classesIn.length !== 1 ? "s" : ""} recurrente${classesIn.length !== 1 ? "s" : ""}`);
          if (tasksIn.length) parts.push(`${tasksIn.length} tarea${tasksIn.length !== 1 ? "s" : ""}`);
          if (notesIn.length) parts.push(`${notesIn.length} nota${notesIn.length !== 1 ? "s" : ""}`);
          showToast(`✓ Importado: ${parts.join(", ")}`);
        } catch {
          showToast("⚠ El texto no es válido");
        }
      };

      const importFromPdf = (parsedClasses, mode = "replace") => {
        let next;
        if (mode === "merge") {
          const existingCodes = new Set(classes.map((c) => c.code).filter(Boolean));
          const toAdd = parsedClasses.filter((c) => !c.code || !existingCodes.has(c.code));
          next = [...classes, ...toAdd];
        } else {
          next = parsedClasses;
        }
        setClasses(next);
        persistClasses(next);
        setPdfModalOpen(false);
        showToast(`✓ ${parsedClasses.length} clase${parsedClasses.length !== 1 ? "s" : ""} importada${parsedClasses.length !== 1 ? "s" : ""}`);
      };

      // ============= TASKS / EVENTS =============
      const upsertTask = (task) => {
        setTasks((prev) => {
          const exists = prev.some((t) => t.id === task.id);
          const next = exists ? prev.map((t) => (t.id === task.id ? task : t)) : [...prev, task];
          persistTasks(next);
          return next;
        });
        setTaskEditorOpen(false);
        setEditingTask(null);
        showToast(`✓ ${task.title} guardada`);
      };

      const deleteTask = (id) => {
        setTasks((prev) => {
          const next = prev.filter((t) => t.id !== id);
          persistTasks(next);
          return next;
        });
        setTaskEditorOpen(false);
        setEditingTask(null);
        showToast("Eliminada");
      };

      const toggleTaskComplete = (id) => {
        setTasks((prev) => {
          const next = prev.map((t) => t.id === id ? { ...t, completed: !t.completed, completedAt: !t.completed ? new Date().toISOString() : null } : t);
          persistTasks(next);
          return next;
        });
      };

      // ============= NOTES =============
      const upsertNote = (note) => {
        setNotes((prev) => {
          const exists = prev.some((n) => n.id === note.id);
          const next = exists ? prev.map((n) => (n.id === note.id ? note : n)) : [note, ...prev];
          persistNotes(next);
          return next;
        });
        setNoteEditorOpen(false);
        setEditingNote(null);
        showToast("✓ Nota guardada");
      };

      const deleteNote = (id) => {
        setNotes((prev) => {
          const next = prev.filter((n) => n.id !== id);
          persistNotes(next);
          return next;
        });
        setNoteEditorOpen(false);
        setEditingNote(null);
        showToast("Nota eliminada");
      };

      // ============= SETTINGS =============
      const updateSettings = (patch) => {
        setSettings((prev) => {
          const next = { ...prev, ...patch };
          persistSettings(next);
          return next;
        });
      };

      const requestNotificationPermission = async () => {
        const result = await notifications.request();
        if (result === "granted") {
          updateSettings({ notificationsEnabled: true });
          showToast("✓ Notificaciones activadas");
          notifications.show("agenda.", "Las notificaciones están listas 🎉");
        } else if (result === "denied") {
          showToast("⚠ Permiso denegado — actívalo en ajustes del navegador");
        } else {
          showToast("⚠ Notificaciones no disponibles aquí");
        }
      };

      const { current, next, todayBlocks } = useMemo(() => analyzeSchedule(classes, now), [classes, now]);
      const overlaps = useMemo(() => detectOverlaps(classes), [classes]);

      if (!loaded) return null;

      const hasAny = classes.length > 0 || tasks.length > 0 || notes.length > 0;

      return (
        <div className="ht-app">
          <div className="ht-container">
            <header className="ht-header">
              <div className="ht-logo">agenda<span>.</span></div>
              <div className="ht-header-right">
                <div className="ht-clock">
                  <div className="ht-clock-big">
                    {now.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", hour12: false })}
                  </div>
                  <div className="ht-clock-day">
                    {DAYS_FULL[now.getDay()]} · {now.getDate()} {now.toLocaleString("es-MX", { month: "short" })}
                  </div>
                </div>
                <button className="ht-icon-btn" onClick={() => setSettingsOpen(true)} title="Ajustes" aria-label="Ajustes">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
              </div>
            </header>

            {hasAny && (
              <div className="ht-tabs">
                <button className={`ht-tab ${view === "home" ? "active" : ""}`} onClick={() => setView("home")}>Ahora</button>
                <button className={`ht-tab ${view === "agenda" ? "active" : ""}`} onClick={() => setView("agenda")}>
                  Próximo
                  {tasks.filter(t => !t.completed).length > 0 && (
                    <span className="ht-tab-badge">{tasks.filter(t => !t.completed).length}</span>
                  )}
                </button>
                <button className={`ht-tab ${view === "schedule" ? "active" : ""}`} onClick={() => setView("schedule")}>Eventos</button>
                <button className={`ht-tab ${view === "calendar" ? "active" : ""}`} onClick={() => setView("calendar")}>Calendario</button>
                <button className={`ht-tab ${view === "notes" ? "active" : ""}`} onClick={() => setView("notes")}>
                  Notas
                  {notes.length > 0 && <span className="ht-tab-badge">{notes.length}</span>}
                </button>
              </div>
            )}

            {!storageOk && (
              <div className="ht-alert" style={{ background: "rgba(232,118,92,0.08)", borderColor: "rgba(232,118,92,0.35)", color: "var(--accent)" }}>
                <strong>El navegador no permite guardar.</strong> Puede ser modo privado/incógnito. Usa Exportar/Importar para conservar los datos manualmente.
              </div>
            )}

            {overlaps.length > 0 && view !== "calendar" && view !== "notes" && (
              <div className="ht-alert">
                <strong>Se detectaron {overlaps.length} traslape{overlaps.length > 1 ? "s" : ""}:</strong>{" "}
                {overlaps.slice(0, 2).map((o, i) => (
                  <span key={i}>{o.a.name} y {o.b.name} en {DAYS[o.a.day]}{i < overlaps.slice(0, 2).length - 1 ? "; " : ""}</span>
                ))}
                {overlaps.length > 2 && ` y ${overlaps.length - 2} más`}.
              </div>
            )}

            {!hasAny && (
              <div className="ht-empty">
                <div className="ht-empty-title">Tu agenda, lista para empezar</div>
                <p className="ht-empty-sub">
                  Aquí puedes guardar eventos recurrentes (clases, juntas semanales, deporte), tareas con fecha, recordatorios o notas rápidas. Si tienes un PDF o imagen de tu horario, también se puede importar.
                </p>
                <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>
                  <button className="ht-btn ht-btn-primary" onClick={() => setPdfModalOpen(true)}>
                    Importar desde PDF o imagen
                  </button>
                  <button className="ht-btn ht-btn-secondary" onClick={() => { setEditingClass(null); setEditorOpen(true); }}>
                    Nuevo evento
                  </button>
                  <button className="ht-btn ht-btn-secondary" onClick={() => { setEditingTask(null); setTaskEditorOpen(true); }}>
                    Nueva tarea
                  </button>
                </div>
              </div>
            )}

            {hasAny && view === "home" && (
              <HomeView
                current={current} next={next} todayBlocks={todayBlocks}
                now={now} classes={classes} tasks={tasks}
                onEditClass={(cls) => { setEditingClass(cls); setEditorOpen(true); }}
                onEditTask={(t) => { setEditingTask(t); setTaskEditorOpen(true); }}
                onToggleTask={toggleTaskComplete}
                settings={settings}
              />
            )}

            {hasAny && view === "agenda" && (
              <AgendaView
                tasks={tasks} classes={classes} now={now}
                onEditTask={(t) => { setEditingTask(t); setTaskEditorOpen(true); }}
                onNewTask={() => { setEditingTask(null); setTaskEditorOpen(true); }}
                onToggleTask={toggleTaskComplete}
                settings={settings}
              />
            )}

            {hasAny && view === "schedule" && classes.length > 0 && (
              <ScheduleView classes={classes}
                settings={settings}
                onEdit={(cls) => { setEditingClass(cls); setEditorOpen(true); }}
                onNew={() => { setEditingClass(null); setEditorOpen(true); }}
                onClearAll={clearAll} onExport={exportData} onImport={importData}
                onImportPdf={() => setPdfModalOpen(true)} />
            )}

            {hasAny && view === "schedule" && classes.length === 0 && (
              <div className="ht-empty">
                <div className="ht-empty-title">Sin eventos recurrentes todavía</div>
                <p className="ht-empty-sub">Los eventos recurrentes son cosas que se repiten cada semana — clases, juntas, gym, etc.</p>
                <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>
                  <button className="ht-btn ht-btn-primary" onClick={() => { setEditingClass(null); setEditorOpen(true); }}>Nuevo evento</button>
                  <button className="ht-btn ht-btn-secondary" onClick={() => setPdfModalOpen(true)}>Importar desde archivo</button>
                </div>
              </div>
            )}

            {hasAny && view === "calendar" && (
              <CalendarView
                now={now} classes={classes} tasks={tasks}
                settings={settings}
                onSelectDate={(d) => {
                  // pre-llenar editor de tarea con la fecha seleccionada
                  const preset = { dueDate: d.toISOString() };
                  setEditingTask(preset);
                  setTaskEditorOpen(true);
                }}
                onEditTask={(t) => { setEditingTask(t); setTaskEditorOpen(true); }}
              />
            )}

            {hasAny && view === "notes" && (
              <NotesView
                notes={notes}
                onEdit={(n) => { setEditingNote(n); setNoteEditorOpen(true); }}
                onNew={() => { setEditingNote(null); setNoteEditorOpen(true); }}
              />
            )}

            <footer className="ht-footer">
              <span className="ht-footer-logo">agenda<span>.</span></span>
              <span className="ht-footer-version">
                v{APP_VERSION}
                {APP_CHANNEL !== "stable" && <span className="ht-footer-channel">·{APP_CHANNEL}</span>}
                <span className="ht-footer-date">·{APP_BUILD_DATE}</span>
              </span>
            </footer>
          </div>

          {hasAny && (
            <FabMenu
              currentView={view}
              onNewClass={() => { setEditingClass(null); setEditorOpen(true); }}
              onNewTask={() => { setEditingTask(null); setTaskEditorOpen(true); }}
              onNewNote={() => { setEditingNote(null); setNoteEditorOpen(true); }}
            />
          )}

          {editorOpen && (
            <ClassEditor initial={editingClass} settings={settings} onUpdateSettings={updateSettings}
              onSave={upsertClass} onDelete={deleteClass}
              onClose={() => { setEditorOpen(false); setEditingClass(null); }} />
          )}

          {taskEditorOpen && (
            <TaskEditor initial={editingTask} settings={settings} onUpdateSettings={updateSettings}
              onSave={upsertTask} onDelete={deleteTask}
              onClose={() => { setTaskEditorOpen(false); setEditingTask(null); }} />
          )}

          {noteEditorOpen && (
            <NoteEditor initial={editingNote}
              onSave={upsertNote} onDelete={deleteNote}
              onClose={() => { setNoteEditorOpen(false); setEditingNote(null); }} />
          )}

          {pdfModalOpen && (
            <PdfImportModal
              hasExisting={classes.length > 0}
              onImport={importFromPdf}
              onClose={() => setPdfModalOpen(false)}
            />
          )}

          {settingsOpen && (
            <SettingsModal
              settings={settings}
              onUpdate={updateSettings}
              onRequestNotifications={requestNotificationPermission}
              onExport={exportData}
              onImport={importData}
              onClearAll={clearAll}
              onClose={() => setSettingsOpen(false)}
            />
          )}

          {toast && <div className="ht-toast">{toast}</div>}
        </div>
      );
    }

    function HomeView({ current, next, todayBlocks, now, classes, tasks, onEditClass, onEditTask, onToggleTask, settings }) {
      const currentMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
      let countdown = null;
      if (current) {
        countdown = { label: "Termina en", value: fmtDuration(current.end - currentMin) };
      } else if (next) {
        let mins;
        if (next.dayOffset === 0) mins = next.start - currentMin;
        else mins = (24 * 60 - currentMin) + (next.dayOffset - 1) * 24 * 60 + next.start;
        countdown = { label: "Empieza en", value: fmtDuration(mins) };
      }
      const findClass = (id) => classes.find((c) => c.id === id);
      const currentClassFull = current ? findClass(current.classId) : null;
      const nextClassFull = next ? findClass(next.classId) : null;

      // tareas próximas (no completadas, en los próximos 3 días)
      const nowMs = now.getTime();
      const horizon = nowMs + 3 * 24 * 60 * 60 * 1000;
      const upcomingTasks = tasks
        .filter(t => !t.completed && t.dueDate)
        .filter(t => {
          const due = new Date(t.dueDate).getTime();
          return !isNaN(due) && due >= nowMs - 12 * 60 * 60 * 1000 && due <= horizon;
        })
        .sort((a, b) => new Date(a.dueDate).getTime() - new Date(b.dueDate).getTime())
        .slice(0, 5);

      const overdueTasks = tasks.filter(t => !t.completed && t.dueDate && new Date(t.dueDate).getTime() < nowMs - 12 * 60 * 60 * 1000);

      return (
        <>
          {current ? (
            <div className="ht-now-card">
              <div className="ht-now-eyebrow"><span className="ht-pulse" />En curso<CategoryPill cat={current.category} /></div>
              <div className="ht-now-name">{current.name}</div>
              {currentClassFull?.description && (
                <div style={{ fontFamily: "var(--body)", color: "var(--fg-2)", marginBottom: 18, fontSize: "1rem", lineHeight: 1.4 }}>
                  {currentClassFull.description}
                </div>
              )}
              <div className="ht-now-meta">
                <div className="ht-now-meta-item"><div className="ht-now-meta-label">Lugar</div><div className="ht-now-meta-value">{current.room || "—"}</div></div>
                <div className="ht-now-meta-item"><div className="ht-now-meta-label">Horario</div><div className="ht-now-meta-value">{current.startStr} – {current.endStr}</div></div>
                <div className="ht-now-meta-item"><div className="ht-now-meta-label">Duración</div><div className="ht-now-meta-value">{fmtDuration(current.end - current.start)}</div></div>
              </div>
              {countdown && (
                <div className="ht-countdown">
                  <span className="ht-countdown-label">{countdown.label}</span>
                  <span className="ht-countdown-value">{countdown.value}</span>
                </div>
              )}
            </div>
          ) : next ? (
            <div className="ht-now-card">
              <div className="ht-now-eyebrow">Siguiente evento <CategoryPill cat={next.category} /></div>
              <div className="ht-now-name">{next.name}</div>
              {nextClassFull?.description && (
                <div style={{ fontFamily: "var(--body)", color: "var(--fg-2)", marginBottom: 18, fontSize: "1rem", lineHeight: 1.4 }}>
                  {nextClassFull.description}
                </div>
              )}
              <div className="ht-now-meta">
                <div className="ht-now-meta-item"><div className="ht-now-meta-label">Lugar</div><div className="ht-now-meta-value">{next.room || "—"}</div></div>
                <div className="ht-now-meta-item"><div className="ht-now-meta-label">Cuándo</div><div className="ht-now-meta-value">{next.dayOffset === 0 ? "Hoy" : next.dayOffset === 1 ? "Mañana" : DAYS_FULL[next.day]} · {next.startStr}</div></div>
                <div className="ht-now-meta-item"><div className="ht-now-meta-label">Duración</div><div className="ht-now-meta-value">{fmtDuration(next.end - next.start)}</div></div>
              </div>
              {countdown && (
                <div className="ht-countdown">
                  <span className="ht-countdown-label">{countdown.label}</span>
                  <span className="ht-countdown-value">{countdown.value}</span>
                </div>
              )}
            </div>
          ) : (
            <div className="ht-now-card">
              <div className="ht-now-eyebrow">Sin eventos ahora</div>
              <div className="ht-now-name">{upcomingTasks.length > 0 ? `${upcomingTasks.length} pendiente${upcomingTasks.length !== 1 ? "s" : ""} próximo${upcomingTasks.length !== 1 ? "s" : ""}` : "Sin pendientes"}</div>
              <div className="ht-now-meta">
                <div className="ht-now-meta-item"><div className="ht-now-meta-value" style={{ color: "var(--fg-2)", fontFamily: "var(--body)", fontSize: "0.95rem" }}>{upcomingTasks.length > 0 ? "Mira el tab Próximo para ver detalles." : "No hay eventos ni tareas configuradas en los próximos días."}</div></div>
              </div>
            </div>
          )}

          {overdueTasks.length > 0 && (
            <div className="ht-day-section">
              <div className="ht-section-label" style={{ color: "var(--danger)" }}>Atrasadas · {overdueTasks.length}</div>
              <div className="ht-day-list">
                {overdueTasks.slice(0, 3).map((t) => (
                  <TaskRow key={t.id} task={t} onEdit={() => onEditTask(t)} onToggle={() => onToggleTask(t.id)} now={now} overdue />
                ))}
              </div>
            </div>
          )}

          {upcomingTasks.length > 0 && (
            <div className="ht-day-section">
              <div className="ht-section-label">Próximas tareas</div>
              <div className="ht-day-list">
                {upcomingTasks.map((t) => (
                  <TaskRow key={t.id} task={t} onEdit={() => onEditTask(t)} onToggle={() => onToggleTask(t.id)} now={now} />
                ))}
              </div>
            </div>
          )}

          {todayBlocks.length > 0 && (
            <div className="ht-day-section">
              <div className="ht-section-label">Hoy · {DAYS_FULL[now.getDay()]}</div>
              <div className="ht-day-list">
                {buildTimelineWithFreeSlots(todayBlocks).map((slot, i) => {
                  if (slot.type === "free") {
                    const isPast = currentMin >= slot.end;
                    const isCurrent = currentMin >= slot.start && currentMin < slot.end;
                    return (
                      <div key={`free-${i}`} className={`ht-free-item ${isPast ? "past" : ""} ${isCurrent ? "current" : ""}`}>
                        <div className="ht-free-time">
                          {slot.startStr}
                          <div className="ht-day-time-sep">↓</div>
                          {slot.endStr}
                        </div>
                        <div>
                          <div className="ht-free-msg">{slot.message}</div>
                          <div className="ht-free-duration">{fmtDuration(slot.end - slot.start)} libre</div>
                        </div>
                      </div>
                    );
                  }
                  const b = slot;
                  const isPast = currentMin >= b.end;
                  const isCurrent = currentMin >= b.start && currentMin < b.end;
                  const cls = findClass(b.classId);
                  return (

    function ClassEditor({ initial, settings, onUpdateSettings, onSave, onDelete, onClose }) {
      const [name, setName] = useState(initial?.name || "");
      const [room, setRoom] = useState(initial?.room || "");
      const [category, setCategory] = useState(initial?.category || "academica");
      const [description, setDescription] = useState(initial?.description || "");
      const [schedule, setSchedule] = useState(
        initial?.schedule?.length ? initial.schedule : [{ day: 1, start: "09:00", end: "10:30" }]
      );
      const [error, setError] = useState("");
      const [showCategoryPicker, setShowCategoryPicker] = useState(false);

      // lista combinada de categorías: defaults + custom del usuario
      const userCategories = settings?.categories || [];
      const allCategories = [...DEFAULT_CATEGORIES, ...userCategories.filter(c => !DEFAULT_CATEGORIES.some(d => d.id === c.id))];
      const currentCat = allCategories.find(c => c.id === category) || DEFAULT_CATEGORIES[0];

      const addBlock = () => {
        const usedDays = new Set(schedule.map((s) => s.day));
        let suggestDay = 1;
        for (let d = 1; d <= 5; d++) { if (!usedDays.has(d)) { suggestDay = d; break; } }
        const lastBlock = schedule[schedule.length - 1];
        setSchedule([...schedule, { day: suggestDay, start: lastBlock?.start || "09:00", end: lastBlock?.end || "10:30" }]);
      };

      const removeBlock = (i) => {
        if (schedule.length === 1) { setError("Necesitas al menos un horario."); return; }
        setSchedule(schedule.filter((_, idx) => idx !== i));
      };

      const updateBlock = (i, field, val) => {
        const next = [...schedule];
        next[i] = { ...next[i], [field]: val };
        if (field === "start" && toMin(val) >= toMin(next[i].end)) {
          const newEndMin = Math.min(toMin(val) + 90, 23 * 60 + 30);
          next[i].end = fromMin(newEndMin);
        }
        if (field === "end" && toMin(val) <= toMin(next[i].start)) {
          const newStartMin = Math.max(toMin(val) - 90, 0);
          next[i].start = fromMin(newStartMin);
        }
        setSchedule(next);
      };

      const handleSave = () => {
        setError("");
        if (!name.trim()) { setError("Pon un nombre al evento."); return; }
        if (!schedule.length) { setError("Agrega al menos un horario."); return; }
        const bad = [];
        schedule.forEach((s, idx) => {
          if (toMin(s.start) >= toMin(s.end)) bad.push(`bloque ${idx + 1} (${DAYS_FULL[s.day]})`);
        });
        if (bad.length) { setError(`Horas inválidas en: ${bad.join(", ")}.`); return; }
        onSave({ id: initial?.id || uid(), code: initial?.code, name: name.trim(), room: room.trim(), category, schedule, description: description.trim() });
      };

      const handleDelete = () => {
        if (!initial?.id) return;
        if (window.confirm(`¿Eliminar "${initial.name}"?`)) onDelete(initial.id);
      };

      // Crear nueva categoría
      const createCategory = () => {
        const label = window.prompt("Nombre de la nueva categoría:");
        if (!label || !label.trim()) return;
        const color = window.prompt("Color en hex (ej: #5BA89F), o deja vacío para gris:", "#5BA89F") || "#9B9890";
        if (!/^#[0-9A-Fa-f]{6}$/.test(color)) {
          alert("Color inválido. Usa formato hex como #5BA89F");
          return;
        }
        const newId = "custom_" + Math.random().toString(36).slice(2, 8);
        const newCat = { id: newId, label: label.trim(), color };
        const next = [...userCategories, newCat];
        if (onUpdateSettings) onUpdateSettings({ categories: next });
        setCategory(newId);
        setShowCategoryPicker(false);
      };

      return (
        <div className="ht-modal-bg" onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div className="ht-modal">
            <div className="ht-modal-header">
              <div className="ht-modal-title">{initial ? "Editar evento" : "Nuevo evento recurrente"}</div>
              <button className="ht-modal-close" onClick={onClose}>×</button>
            </div>
            <div className="ht-modal-body">
              {error && <div className="ht-alert" style={{ background: "rgba(201,114,104,0.1)", borderColor: "rgba(201,114,104,0.3)", color: "#E89588" }}>{error}</div>}

              <div className="ht-field">
                <label className="ht-label">Nombre</label>
                <input className="ht-input" value={name} onChange={(e) => setName(e.target.value)} placeholder="Cálculo, Gym, Junta de equipo..." autoFocus />
              </div>

              <div className="ht-field">
                <label className="ht-label">Lugar / Salón</label>
                <input className="ht-input" value={room} onChange={(e) => setRoom(e.target.value)} placeholder="Opcional" />
              </div>

              <div className="ht-field">
                <label className="ht-label">Notas <span style={{ color: "var(--fg-3)", fontWeight: 400 }}>(opcional)</span></label>
                <input className="ht-input" value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Llevar laptop, profe puntual, etc." />
              </div>

              <div className="ht-field">
                <label className="ht-label">Categoría</label>
                <button
                  type="button"
                  className="ht-cat-selector"
                  onClick={() => setShowCategoryPicker(!showCategoryPicker)}
                >
                  <span className="ht-cat-dot" style={{ background: currentCat.color }} />
                  <span>{currentCat.label}</span>
                  <span style={{ marginLeft: "auto", color: "var(--fg-3)", fontSize: "0.85rem" }}>{showCategoryPicker ? "▴" : "▾"}</span>
                </button>
                {showCategoryPicker && (
                  <div className="ht-cat-picker">
                    {allCategories.map((c) => (
                      <button
                        key={c.id}
                        type="button"
                        className={`ht-cat-btn ${category === c.id ? "active" : ""}`}
                        onClick={() => { setCategory(c.id); setShowCategoryPicker(false); }}
                        style={category === c.id ? { borderColor: c.color, color: c.color } : {}}
                      >
                        <span className="ht-cat-dot" style={{ background: c.color }} />{c.label}
                      </button>
                    ))}
                    <button
                      type="button"
                      className="ht-cat-btn ht-cat-new"
                      onClick={createCategory}
                    >
                      <span style={{ color: "var(--accent)", fontSize: "1rem", fontWeight: 600 }}>+</span>
                      Nueva categoría
                    </button>
                  </div>
                )}
              </div>

              <div className="ht-field">
                <label className="ht-label">Horarios</label>
                <div className="ht-block-list">
                  {schedule.map((s, i) => (
                    <div key={i} className="ht-block-row">
                      {schedule.length > 1 && (
                        <>
                          <div style={{ position: "absolute", top: 10, left: 14, fontSize: "0.75rem", color: "var(--fg-3)", fontWeight: 500 }}>Bloque {i + 1}</div>
                          <button className="ht-block-remove" onClick={() => removeBlock(i)}>×</button>
                        </>
                      )}
                      <div style={{ marginTop: schedule.length > 1 ? 24 : 0, marginBottom: 10 }}>
                        <div className="ht-label" style={{ marginBottom: 6 }}>
                          Día <span style={{ color: "var(--accent)", fontFamily: "var(--body)", marginLeft: 6 }}>{DAYS_FULL[s.day]}</span>
                        </div>
                        <div className="ht-day-picker">
                          {DAYS.map((d, di) => (
                            <button key={di} type="button" className={`ht-day-btn ${s.day === di ? "active" : ""}`}
                              onClick={() => updateBlock(i, "day", di)}>{d}</button>
                          ))}
                        </div>
                      </div>
                      <div className="ht-time-row">
                        <div>
                          <div className="ht-label" style={{ marginBottom: 6 }}>Inicio</div>
                          <input type="time" className="ht-input" value={s.start} onChange={(e) => updateBlock(i, "start", e.target.value)} />
                        </div>
                        <div>
                          <div className="ht-label" style={{ marginBottom: 6 }}>Fin</div>
                          <input type="time" className="ht-input" value={s.end} onChange={(e) => updateBlock(i, "end", e.target.value)} />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
                <button className="ht-btn ht-btn-secondary" type="button" onClick={addBlock} style={{ width: "100%" }}>
                  + Otro día/horario
                </button>
              </div>

              <div className="ht-form-actions">
                {initial && <button className="ht-btn ht-btn-danger" type="button" onClick={handleDelete}>Eliminar</button>}
                <div style={{ display: "flex", gap: 8, marginLeft: "auto" }}>
                  <button className="ht-btn ht-btn-ghost" type="button" onClick={onClose}>Cancelar</button>
                  <button className="ht-btn ht-btn-primary" type="button" onClick={handleSave}>Guardar</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function PdfImportModal({ hasExisting, onImport, onClose }) {
      const [stage, setStage] = useState("upload"); // upload | processing | preview | error | assign
      const [error, setError] = useState("");
      const [parsed, setParsed] = useState([]);
      const [rawText, setRawText] = useState("");
      const [showRaw, setShowRaw] = useState(false);
      const [dragging, setDragging] = useState(false);
      const [files, setFiles] = useState([]); // [{ name, type, status, progress, text, error }]
      const [candidates, setCandidates] = useState([]); // materias detectadas para asignación manual
      const fileInputRef = React.useRef(null);
