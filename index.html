<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6E4DC">
<meta name="description" content="Horario semanal y agenda con recordatorios.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Horario">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="iconos/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<title>Mi Horario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600;700&family=Sometype+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   MI HORARIO
   Lenguaje visual: diagrama de línea de transporte.
   Un día es una secuencia lineal de paradas con duraciones
   distintas y huecos entre ellas — la línea lo dice literal.
   Papel de mapa impreso + tintas de señalética.
   ═══════════════════════════════════════════════════════════ */

:root{
  --paper:      #E6E4DC;
  --card:       #F5F3EE;
  --card-2:     #EFEDE6;
  --ink:        #171613;
  --ink-2:      #56534B;
  --ink-3:      #8A867B;
  --rule:       #C4C0B4;
  --rule-soft:  #D6D2C7;
  --focus:      #2B5FCB;
  --alert:      #D0356A;
  --cue:        #2B5FCB;

  --rail: 22px;
  --clock: 48px;

  --f-disp: 'Archivo','Archivo Black',system-ui,sans-serif;
  --f-body: 'Instrument Sans','Helvetica Neue',system-ui,sans-serif;
  --f-num:  'Sometype Mono',ui-monospace,'SFMono-Regular',monospace;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-bottom:92px;
  background-image:
    repeating-linear-gradient(0deg,rgba(23,22,19,.014) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(23,22,19,.014) 0 1px,transparent 1px 3px);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--rule)}
::-webkit-scrollbar-track{background:transparent}

.eyebrow{font-family:var(--f-num);font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-disp);font-variation-settings:'wdth' 118;font-weight:800;letter-spacing:-.012em;text-transform:uppercase}

/* ─── Cabecera ─────────────────────────────────────────── */
.masthead{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--ink);padding:13px 18px 0}
.mast-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.wordmark{font-family:var(--f-disp);font-variation-settings:'wdth' 112;font-weight:800;font-size:15px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.wordmark em{font-style:normal;color:var(--alert)}
.mast-right{display:flex;align-items:center;gap:10px;flex:none}
#bell{position:relative;width:28px;height:28px;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
#bell svg{width:13px;height:13px}
#bell.armed{border-color:var(--ink);color:var(--ink)}
#bell .pip{position:absolute;top:-4px;right:-4px;min-width:14px;height:14px;padding:0 3px;background:var(--alert);color:#fff;font-family:var(--f-num);font-size:8.5px;font-weight:700;display:none;align-items:center;justify-content:center}
#bell.due .pip{display:flex}

.weekbar{display:flex;align-items:stretch;border:1px solid var(--rule);background:var(--card);margin-bottom:12px}
.weekbar .step{width:38px;flex:none;font-size:15px;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.weekbar .step:active{background:var(--card-2)}
.weekbar .range{flex:1;text-align:center;padding:7px 4px;border-left:1px solid var(--rule);border-right:1px solid var(--rule);line-height:1.25}
.weekbar .range b{display:block;font-family:var(--f-num);font-size:12px;font-weight:500}
.weekbar .now{flex:none;padding:0 13px;background:var(--ink);color:var(--paper);font-family:var(--f-num);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}

.tabbar{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{padding:0 0 9px;font-family:var(--f-num);font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;position:relative}
.tabbar button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.tabbar button sup{font-family:var(--f-num);font-size:8px;color:var(--alert);font-weight:700;top:-4px}

.utils{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule-soft);background:var(--card)}
.utils::-webkit-scrollbar{display:none}
.utils button{flex:none;padding:10px 15px;font-family:var(--f-num);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);border-right:1px solid var(--rule-soft);white-space:nowrap}
.utils button:active{background:var(--card-2)}
.utils button.lead{color:var(--cue);font-weight:700}
.utils button.risk{color:var(--alert)}

main{padding:20px 18px 0;max-width:940px;margin:0 auto}

/* ─── Avisos en pantalla ───────────────────────────────── */
#cues{position:fixed;left:0;right:0;bottom:0;z-index:150;padding:0 12px 12px;display:flex;flex-direction:column-reverse;gap:7px;pointer-events:none}
.cue{pointer-events:auto;max-width:520px;margin:0 auto;width:100%;background:var(--ink);color:var(--paper);border-left:4px solid var(--alert);padding:12px 14px;display:flex;gap:11px;align-items:flex-start;box-shadow:4px 4px 0 rgba(23,22,19,.2)}
.cue .ct{flex:1;min-width:0}
.cue .cl{font-family:var(--f-num);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(230,228,220,.62)}
.cue .cn{font-size:14.5px;font-weight:600;margin-top:2px;word-break:break-word}
.cue .cs{font-family:var(--f-num);font-size:10px;color:rgba(230,228,220,.68);margin-top:3px}
.cue button{flex:none;width:24px;height:24px;border:1px solid rgba(230,228,220,.3);color:var(--paper);display:flex;align-items:center;justify-content:center}
.cue button svg{width:10px;height:10px}

/* ─── Selector de día ──────────────────────────────────── */
.platform{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--rule);margin-bottom:26px;background:var(--card)}
.platform button{padding:8px 2px 7px;text-align:center;border-right:1px solid var(--rule-soft)}
.platform button:last-child{border-right:none}
.platform .pd{font-family:var(--f-num);font-size:8.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block}
.platform .pn{font-family:var(--f-num);font-size:16px;font-weight:500;color:var(--ink-2);display:block;line-height:1.25}
.platform .pc{display:block;height:3px;margin:3px auto 0;width:16px;background:transparent}
.platform button.has .pc{background:var(--ink-3)}
.platform button.today .pn{color:var(--alert);font-weight:700}
.platform button[aria-pressed="true"]{background:var(--ink)}
.platform button[aria-pressed="true"] .pd{color:rgba(230,228,220,.6)}
.platform button[aria-pressed="true"] .pn{color:var(--paper);font-weight:700}
.platform button[aria-pressed="true"] .pc{background:var(--paper)}

/* ─── Encabezado del día ───────────────────────────────── */
.dayline{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:7px;margin-bottom:5px}
.dayline h2{margin:0;font-size:clamp(27px,8.5vw,42px);line-height:.92}
.dayline .stamp{font-family:var(--f-num);font-size:26px;font-weight:500;line-height:1;color:var(--ink-2);flex:none}
.daymeta{display:flex;flex-wrap:wrap;gap:0 14px;margin-bottom:22px}
.daymeta span{font-family:var(--f-num);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.daymeta b{color:var(--ink-2);font-weight:500}
.bulletin{display:flex;gap:10px;align-items:baseline;border-left:3px solid var(--ink);background:var(--card);padding:10px 13px;margin-bottom:22px;font-size:13px;color:var(--ink-2)}
.bulletin .lbl{font-family:var(--f-num);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);flex:none}
.bulletin b{color:var(--ink);font-weight:600}

/* ─── LA LÍNEA ─────────────────────────────────────────── */
.diagram{margin-bottom:8px}
.stop,.void{display:grid;grid-template-columns:var(--clock) var(--rail) 1fr;column-gap:12px}
.clock{text-align:right;padding-top:1px}
.clock .t1{font-family:var(--f-num);font-size:11.5px;font-weight:500;display:block;line-height:1.3}
.clock .t2{font-family:var(--f-num);font-size:11.5px;color:var(--ink-3);display:block;line-height:1.3}
.clock .t2::before{content:'';display:block;width:9px;height:1px;background:var(--rule);margin:4px 0 4px auto}
.rail{position:relative;display:flex;justify-content:center}
.seg{width:9px;border-radius:5px;flex:none}
.dash{width:0;border-left:2px dotted var(--rule);flex:none;margin:3px 0}
.node{position:absolute;left:50%;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--card);border:3px solid currentColor}
.node.a{top:-1px}
.node.b{bottom:-1px}
.here{position:absolute;left:50%;margin-left:-15px;width:30px;height:2px;background:var(--ink);z-index:3}
.here::before{content:'';position:absolute;left:-1px;top:-4px;border-left:8px solid var(--ink);border-top:5px solid transparent;border-bottom:5px solid transparent}
.stop .plate{background:var(--card);border:1px solid var(--rule);padding:11px 13px 12px;margin-bottom:9px}
.stop.is-done .plate{background:transparent;border-style:dashed}
.stop.is-done .pt-name{text-decoration:line-through;color:var(--ink-3)}
.plate-hd{display:flex;align-items:flex-start;gap:9px}
.glyph{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;border-radius:3px}
.glyph svg{width:16px;height:16px;display:block}
.pt-txt{flex:1;min-width:0}
.pt-name{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.25;word-break:break-word}
.pt-sub{display:flex;flex-wrap:wrap;gap:0 9px;margin-top:2px;align-items:center}
.pt-sub span{font-family:var(--f-num);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.pt-note{font-size:12.5px;color:var(--ink-2);margin-top:6px;padding-left:35px;word-break:break-word}
.tick{flex:none;width:22px;height:22px;border:1.5px solid var(--rule);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--card);margin-top:2px}
.tick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.tick svg{width:11px;height:11px}
.tag{font-family:var(--f-num);font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:1px 5px;border:1px solid currentColor}
.tag.fixed{color:var(--cue)}
.tag.edited{color:#DD5F14}
.tag.live{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag.crash{color:var(--alert)}
.void .vlabel{display:flex;align-items:center;gap:9px;padding:9px 0;font-family:var(--f-num);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.void .vlabel::after{content:'';flex:1;height:1px;background:var(--rule-soft)}
.void .vlabel b{color:var(--ink-2);font-weight:500}
.terminus{display:grid;grid-template-columns:var(--clock) var(--rail) 1fr;column-gap:12px;margin-top:2px}
.terminus .cap{width:11px;height:11px;border-radius:50%;background:var(--rule);margin:0 auto}
.terminus .tx{font-family:var(--f-num);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

.blank{border:1px dashed var(--rule);padding:38px 22px;text-align:center;background:var(--card)}
.blank h3{font-family:var(--f-disp);font-variation-settings:'wdth' 105;font-weight:700;text-transform:uppercase;font-size:16px;margin:0 0 6px;letter-spacing:.01em}
.blank p{margin:0 auto;font-size:13px;color:var(--ink-2);max-width:34ch;line-height:1.6}

/* ─── Rejilla semanal ──────────────────────────────────── */
.sheet-wrap{overflow-x:auto;border:1px solid var(--ink);background:var(--card)}
.sheet{display:grid;grid-template-columns:40px repeat(7,minmax(88px,1fr));min-width:648px}
.sh-cap{position:sticky;top:0;left:0;z-index:6;background:var(--ink)}
.sh-day{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--paper);padding:7px 3px 8px;text-align:center;border-left:1px solid rgba(230,228,220,.16)}
.sh-day .d{font-family:var(--f-num);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.62;display:block}
.sh-day .n{font-family:var(--f-num);font-size:14px;font-weight:500;display:block;line-height:1.25}
.sh-day.today .n{color:#fff;font-weight:700}
.sh-day.today .n::after{content:'';display:block;width:14px;height:2px;background:var(--alert);margin:2px auto 0}
.sh-hours{position:sticky;left:0;z-index:4;background:var(--card);border-right:1px solid var(--rule)}
.sh-hours i{position:absolute;right:5px;font-family:var(--f-num);font-size:9px;font-style:normal;color:var(--ink-3)}
.sh-col{position:relative;border-left:1px solid var(--rule-soft)}
.sh-col.today{background:rgba(208,53,106,.035)}
.sh-rule{position:absolute;left:0;right:0;border-top:1px solid var(--rule-soft)}
.sh-rule.h{border-color:var(--rule)}
.sh-blk{position:absolute;left:4px;right:4px;border-radius:5px;padding:4px 6px;color:#fff;overflow:hidden;line-height:1.2}
.sh-blk b{font-size:10.5px;font-weight:600;display:block}
.sh-blk i{font-family:var(--f-num);font-size:8.5px;font-style:normal;opacity:.82;display:block}
.sh-blk.done{opacity:.4}
.sh-blk.fix{border-left:3px solid rgba(255,255,255,.75);padding-left:5px}
.sh-now{position:absolute;left:0;right:0;height:2px;background:var(--ink);z-index:8}
.sh-now::before{content:'';position:absolute;left:0;top:-4px;border-left:7px solid var(--ink);border-top:5px solid transparent;border-bottom:5px solid transparent}
.caption{font-family:var(--f-num);font-size:9.5px;letter-spacing:.06em;color:var(--ink-3);margin-top:9px;line-height:1.7}

/* ─── Agenda ───────────────────────────────────────────── */
.agroup{margin-bottom:22px}
.agroup h4{display:flex;align-items:baseline;gap:10px;margin:0 0 9px;font-family:var(--f-num);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.agroup h4::after{content:'';flex:1;height:1px;background:var(--rule)}
.agroup h4 em{font-style:normal;color:var(--ink-3);flex:none}
.agroup.late h4{color:var(--alert)}
.entry{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);padding:11px 12px;margin-bottom:7px}
.entry:active{background:var(--card-2)}
.entry.late{border-left:3px solid var(--alert)}
.entry.is-done{background:transparent;border-style:dashed}
.entry.is-done .en{text-decoration:line-through;color:var(--ink-3)}
.stampbox{flex:none;width:40px;text-align:center;border-right:1px solid var(--rule-soft);padding-right:9px}
.stampbox .sd{font-family:var(--f-num);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block}
.stampbox .sn{font-family:var(--f-num);font-size:18px;font-weight:500;display:block;line-height:1.15}
.stampbox .sy{font-family:var(--f-num);font-size:8px;color:var(--ink-3);display:block}
.ebody{flex:1;min-width:0}
.en{font-size:15px;font-weight:600;line-height:1.25;word-break:break-word}
.esub{display:flex;flex-wrap:wrap;gap:0 9px;margin-top:3px;align-items:center}
.esub span{font-family:var(--f-num);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.esub .warn{color:var(--alert)}
.enote{font-size:12.5px;color:var(--ink-2);margin-top:5px;word-break:break-word}
.hasbell{display:inline-flex;align-items:center;gap:3px;color:var(--cue)}
.hasbell svg{width:9px;height:9px}

/* ─── Fijo ─────────────────────────────────────────────── */
.brief{border:1px solid var(--cue);border-left-width:3px;background:var(--card);padding:13px 15px;margin-bottom:24px;font-size:13px;color:var(--ink-2);line-height:1.6}
.brief b{color:var(--ink)}
.bgroup{margin-bottom:24px}
.bgroup h4{display:flex;align-items:baseline;gap:10px;margin:0 0 9px;font-family:var(--f-num);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.bgroup h4::after{content:'';flex:1;height:1px;background:var(--rule)}
.bgroup h4 em{font-style:normal;color:var(--ink-3);flex:none}
.brow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);padding:10px 12px;margin-bottom:7px}
.brow:active{background:var(--card-2)}
.brow .bt{font-family:var(--f-num);font-size:10.5px;color:var(--ink-3);flex:none;width:44px;padding-top:4px;line-height:1.35}

/* ─── Balance ──────────────────────────────────────────── */
.ledger{border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);margin-bottom:26px}
.lrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.lrow:last-child{border-bottom:none}
.lrow .lk{font-family:var(--f-num);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.lrow .lv{font-family:var(--f-num);font-size:17px;font-weight:500}
.meter{margin-bottom:15px}
.meter .mh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.meter .mn{font-size:13.5px;font-weight:600;flex:1}
.meter .mv{font-family:var(--f-num);font-size:10px;color:var(--ink-3)}
.meter .mt{height:7px;background:var(--card-2);border:1px solid var(--rule-soft)}
.meter .mf{height:100%}
.mini{width:15px;height:15px;flex:none;border-radius:2px;display:flex;align-items:center;justify-content:center;color:#fff}
.mini svg{width:10px;height:10px}
.ribbon{display:flex;border:1px solid var(--ink);margin-bottom:10px}
.ribbon div{height:26px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-num);font-size:9.5px;font-weight:700;min-width:0}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:28px}
.key span{display:flex;align-items:center;gap:6px;font-family:var(--f-num);font-size:10px;color:var(--ink-2)}
.key i{width:9px;height:9px;flex:none}
.loadchart{display:flex;gap:6px;align-items:flex-end;height:74px;border-bottom:1px solid var(--ink);margin-bottom:6px}
.loadchart .lb{flex:1;position:relative;height:100%}
.loadchart .lb i{position:absolute;bottom:0;left:0;right:0;background:var(--ink)}
.loadchart .lb.pk i{background:var(--alert)}
.loadkey{display:flex;gap:6px;margin-bottom:24px}
.loadkey span{flex:1;text-align:center;font-family:var(--f-num);font-size:8.5px;text-transform:uppercase;color:var(--ink-3);line-height:1.6}
.notes{border-left:3px solid var(--rule);padding-left:13px}
.notes p{margin:0 0 7px;font-size:13px;color:var(--ink-2);line-height:1.55}
.notes p:last-child{margin-bottom:0}
.notes b{color:var(--ink);font-weight:600}

.compose{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:50;background:var(--ink);color:var(--paper);padding:14px 26px;font-family:var(--f-num);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;box-shadow:4px 4px 0 rgba(23,22,19,.16)}
.compose:active{transform:translateX(-50%) translate(2px,2px);box-shadow:2px 2px 0 rgba(23,22,19,.16)}

/* ─── Diálogos ─────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(23,22,19,.42);display:flex;align-items:flex-end;justify-content:center;animation:in .14s ease}
@media(min-width:640px){.scrim{align-items:center;padding:20px}}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(22px)}to{transform:translateY(0)}}
@keyframes turn{to{transform:rotate(360deg)}}
.dialog{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--paper);border:1px solid var(--ink);border-bottom:none;animation:rise .2s cubic-bezier(.2,.9,.3,1)}
@media(min-width:640px){.dialog{border-bottom:1px solid var(--ink);box-shadow:6px 6px 0 rgba(23,22,19,.14)}}
.dg-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 20px;border-bottom:1px solid var(--ink);position:sticky;top:0;background:var(--paper);z-index:2}
.dg-hd h2{margin:0;font-family:var(--f-disp);font-variation-settings:'wdth' 108;font-weight:700;font-size:14px;letter-spacing:.03em;text-transform:uppercase}
.dg-hd button{width:28px;height:28px;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;flex:none}
.dg-hd button svg{width:11px;height:11px}
.dg-bd{padding:4px 20px 20px}
.dg-ft{display:flex;gap:8px;padding:12px 20px 20px;position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--rule-soft)}

.field{display:block;font-family:var(--f-num);font-size:9.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 7px}
.dg-bd input[type=text],.dg-bd input[type=time],.dg-bd input[type=date],.dg-bd textarea,.dg-bd select{
  width:100%;background:var(--card);border:1px solid var(--rule);border-radius:0;padding:11px 12px;font-size:14.5px;outline:none;transition:border-color .12s;
}
.dg-bd input:focus,.dg-bd textarea:focus,.dg-bd select:focus{border-color:var(--ink)}
.dg-bd input[type=time],.dg-bd input[type=date]{font-family:var(--f-num);font-size:15px}
.dg-bd textarea{resize:vertical;min-height:56px;font-size:14px;line-height:1.5}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:11px}

.lines{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lines button{border:1px solid var(--rule);background:var(--card);padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px}
.lines button .mini{width:19px;height:19px}
.lines button .mini svg{width:12px;height:12px}
.lines button span{font-family:var(--f-num);font-size:8.5px;color:var(--ink-3);text-transform:uppercase;text-align:center;line-height:1.2}
.lines button[aria-pressed="true"]{border-color:var(--ink);border-width:2px;padding:8px 1px 6px}
.lines button[aria-pressed="true"] span{color:var(--ink);font-weight:700}
.lines button.add .mini{background:transparent!important;border:1px dashed var(--rule);color:var(--ink-3)}

.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week7 button{border:1px solid var(--rule);background:var(--card);padding:10px 1px;font-family:var(--f-num);font-size:10.5px;color:var(--ink-2);text-transform:uppercase}
.week7 button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.week7 button:disabled{opacity:.32}

.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.trio button,.duo button{border:1px solid var(--rule);background:var(--card);padding:10px 7px;text-align:left;line-height:1.3}
.trio button strong,.duo button strong{display:block;font-size:12.5px;font-weight:600}
.trio button em,.duo button em{display:block;font-style:normal;font-family:var(--f-num);font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-top:2px;line-height:1.3}
.trio button[aria-pressed="true"],.duo button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.trio button[aria-pressed="true"] strong,.duo button[aria-pressed="true"] strong{color:var(--paper)}
.trio button[aria-pressed="true"] em,.duo button[aria-pressed="true"] em{color:rgba(230,228,220,.6)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--rule);background:var(--card);padding:8px 11px;font-family:var(--f-num);font-size:10px;letter-spacing:.05em;color:var(--ink-2);text-transform:uppercase}
.chips button[aria-pressed="true"]{background:var(--cue);border-color:var(--cue);color:#fff;font-weight:700}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.swatches button{height:34px;border:1px solid var(--rule)}
.swatches button[aria-pressed="true"]{border:3px solid var(--ink)}
.glyphgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.glyphgrid button{height:38px;border:1px solid var(--rule);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.glyphgrid button svg{width:16px;height:16px}
.glyphgrid button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.aside{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.6}
.aside b{color:var(--ink-2);font-weight:600}
.alarm{border:1px solid var(--alert);border-left-width:3px;background:rgba(208,53,106,.05);padding:9px 12px;margin-top:12px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.memo{border:1px solid var(--rule);background:var(--card);padding:10px 12px;margin-top:12px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.memo b{color:var(--ink)}

.act{padding:13px 18px;font-family:var(--f-num);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;border:1px solid var(--ink)}
.act.solid{flex:1;background:var(--ink);color:var(--paper)}
.act.blue{flex:1;background:var(--cue);color:#fff;border-color:var(--cue)}
.act.quiet{background:transparent;color:var(--ink-2);border-color:var(--rule)}
.act.danger{color:var(--alert);border-color:var(--alert);background:transparent}
.wide{display:block;width:100%;margin-top:8px;padding:13px;text-align:center;border:1px solid var(--rule);background:var(--card);font-size:13.5px;font-weight:600}
.wide:active{background:var(--card-2)}

.route{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);padding:14px;margin-bottom:8px}
.route:active{border-color:var(--ink)}
.route .rn{font-family:var(--f-num);font-size:11px;font-weight:700;color:var(--ink-3);flex:none;width:16px}
.route strong{display:block;font-size:14px;font-weight:600}
.route span{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.4;margin-top:2px}
.wheel{width:30px;height:30px;border:2px solid var(--rule);border-top-color:var(--ink);border-radius:50%;animation:turn .8s linear infinite;margin:0 auto}
.pick{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);padding:10px 12px;margin-bottom:6px}
.pick .box{width:17px;height:17px;border:1.5px solid var(--rule);flex:none;margin-top:3px;display:flex;align-items:center;justify-content:center;color:var(--paper)}
.pick .box svg{width:10px;height:10px}
.pick[aria-pressed="true"] .box{background:var(--ink);border-color:var(--ink)}
.pick .pmeta{font-family:var(--f-num);font-size:9.5px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase;display:block}
.pick .pname{font-size:14px;font-weight:600;margin-top:1px;display:block}
.lman{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);padding:10px 12px;margin-bottom:6px}
.lman .lnm{flex:1;font-size:14px;font-weight:600}
.lman .lct{font-family:var(--f-num);font-size:9.5px;color:var(--ink-3);text-transform:uppercase}
#uploader{display:none}

#flash{position:fixed;left:50%;transform:translateX(-50%);bottom:82px;z-index:200;background:var(--ink);color:var(--paper);padding:11px 18px;font-family:var(--f-num);font-size:11px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}
#flash.up{opacity:1}

#update{position:fixed;left:12px;right:12px;bottom:88px;z-index:160;max-width:520px;margin:0 auto;
  background:var(--ink);color:var(--paper);border-left:4px solid var(--cue);padding:12px 14px;
  display:none;gap:11px;align-items:center;box-shadow:4px 4px 0 rgba(23,22,19,.2)}
#update.on{display:flex}
#update .ut{flex:1;min-width:0}
#update .ul{font-family:var(--f-num);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(230,228,220,.62)}
#update .un{font-size:14px;font-weight:600;margin-top:2px}
#update button{flex:none;padding:9px 13px;font-family:var(--f-num);font-size:9.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--paper);color:var(--paper)}
#update button.go{background:var(--paper);color:var(--ink)}
.pasos{counter-reset:paso;list-style:none;margin:0 0 4px;padding:0}
.pasos li{position:relative;padding-left:32px;margin-bottom:11px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.pasos li::before{counter-increment:paso;content:counter(paso,decimal-leading-zero);position:absolute;left:0;top:2px;
  font-family:var(--f-num);font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:.06em}
.pasos li b{color:var(--ink);font-weight:600}
.release{border-top:1px solid var(--rule);padding-top:10px;margin-bottom:14px}
.release h5{display:flex;align-items:baseline;gap:9px;margin:0 0 6px;font-family:var(--f-num);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink)}
.release h5 em{font-style:normal;font-size:9px;font-weight:400;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.release ul{margin:0;padding-left:16px}
.release li{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin-bottom:4px}
#saveflag.bad{color:var(--alert);font-weight:700}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#sheetprint{display:none}
@media print{
  body{background:#fff;padding:0;background-image:none}
  .masthead,.utils,.compose,main,.scrim,#flash,#cues{display:none!important}
  #sheetprint{display:block}
  #sheetprint h1{font-family:var(--f-disp);font-variation-settings:'wdth' 115;font-weight:800;text-transform:uppercase;font-size:19px;margin:0 0 2px}
  #sheetprint .pr-sub{font-family:var(--f-num);font-size:10px;color:#555;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:15px}
  #sheetprint .pr-day{break-inside:avoid;margin-bottom:13px}
  #sheetprint .pr-day h4{font-family:var(--f-num);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 5px;border-bottom:1px solid #999;padding-bottom:3px}
  #sheetprint .pr-line{display:flex;gap:12px;padding:3px 0;font-size:12px}
  #sheetprint .pr-t{font-family:var(--f-num);font-size:10.5px;width:92px;flex:none;color:#333}
  #sheetprint .pr-n{font-size:10.5px;color:#666}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="mast-top">
    <h1 class="wordmark">Mi<em>Horario</em></h1>
    <div class="mast-right">
      <span class="eyebrow" id="saveflag">Se guarda solo</span>
      <button id="bell" aria-label="Avisos"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 .9a1.1 1.1 0 0 1 1.1 1.1v.5a4.6 4.6 0 0 1 3.5 4.5v2.6l1.2 2.1H2.2l1.2-2.1V7A4.6 4.6 0 0 1 6.9 2.5V2A1.1 1.1 0 0 1 8 .9zM6.2 13.1h3.6a1.8 1.8 0 0 1-3.6 0z"/></svg><span class="pip">0</span></button>
    </div>
  </div>
  <div class="weekbar">
    <button class="step" id="back" aria-label="Semana anterior">‹</button>
    <button class="range" id="goto"><b id="span">—</b><span class="eyebrow" id="spanNote">—</span></button>
    <button class="step" id="fwd" aria-label="Semana siguiente">›</button>
    <button class="now" id="jump">Hoy</button>
  </div>
  <nav class="tabbar" role="tablist">
    <button role="tab" data-view="day" aria-selected="true">Día</button>
    <button role="tab" data-view="week" aria-selected="false">Semana</button>
    <button role="tab" data-view="agenda" aria-selected="false">Agenda</button>
    <button role="tab" data-view="base" aria-selected="false">Fijo</button>
    <button role="tab" data-view="stats" aria-selected="false">Balance</button>
  </nav>
</header>

<div class="utils">
  <button id="uImport" class="lead">Importar</button>
  <button id="uExport" class="lead">Exportar</button>
  <button id="uInstall" class="lead">Instalar</button>
  <button id="uLines">Líneas</button>
  <button id="uPrint">Imprimir</button>
  <button id="uCopy">Copiar</button>
  <button id="uDup">Duplicar día</button>
  <button id="uClear" class="risk">Vaciar semana</button>
  <button id="uAbout">v<span id="vtag">5.0</span></button>
</div>

<main id="stage"></main>
<button class="compose" id="compose">Agregar</button>
<input type="file" id="uploader" accept=".json,.csv,.txt,.ics,image/*">
<div id="dialogs"></div>
<div id="cues"></div>
<div id="update" role="status">
  <div class="ut"><div class="ul">Actualización</div><div class="un">Hay una versión nueva lista.</div></div>
  <button id="upLater">Luego</button><button id="upNow" class="go">Recargar</button>
</div>
<div id="flash" role="status" aria-live="polite"></div>
<div id="sheetprint"></div>

<script>
(function(){
"use strict";

/* ══════════ Vocabulario ══════════ */
const DS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const DL=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const MS=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const ML=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

/* Pictogramas dibujados a mano: formas sólidas, legibles a 10 px. */
const GLYPH={
  libro:'<path d="M1.6 3.4 7.4 5v9.2L1.6 12.6zM14.4 3.4 8.6 5v9.2l5.8-1.6z"/>',

  pantalla:'<path fill-rule="evenodd" d="M0.9 2.5h14.2v8.2H9.7v1.9h1.6v1.4H4.7v-1.4h1.6v-1.9H0.9zm2 2v4.2h10.2V4.5z"/>',

  campana:'<path d="M8 .9a1.1 1.1 0 0 1 1.1 1.1v.5a4.6 4.6 0 0 1 3.5 4.5v2.6l1.2 2.1H2.2l1.2-2.1V7A4.6 4.6 0 0 1 6.9 2.5V2A1.1 1.1 0 0 1 8 .9zM6.2 13.1h3.6a1.8 1.8 0 0 1-3.6 0z"/>',
  taza:'<path fill-rule="evenodd" d="M1.6 3.2h9.6v3h2.2a2.1 2.1 0 0 1 0 4.2h-2.4a4.8 4.8 0 0 1-9.4-1.2zm9.6 4.6v1.2h2a.9.9 0 0 0 0-1.2zM.9 13.4h11.4v1.4H.9z"/>',
  nota:'<path d="M13.4 1.1v8.6a2.6 2.6 0 1 1-1.7-2.4V4.2L6.4 5.4v6.6a2.6 2.6 0 1 1-1.7-2.4V3.6z"/>',
  bandera:'<path d="M2.4 1.1h1.6v13.8H2.4zM5.2 1.8h9.2l-2.3 3.3 2.3 3.3H5.2z"/>'

const GLYPH_KEYS=Object.keys(GLYPH);

/* Líneas de fábrica. Sin "Robótica": ahora se crea a la medida. */
const STOCK=[
  {id:"escuela",  nm:"Escuela",  color:"#D0356A", glyph:"libro"},
  {id:"estudio",  nm:"Estudio",  color:"#00857A", glyph:"lapiz"},

const INKS=["#D0356A","#C42B2B","#DD5F14","#B08800","#0B8038","#00857A",
            "#0E7490","#2B5FCB","#4B3FBF","#7742AE","#8A5A2B","#6E7480"];

const STORE="mihorario:v3", LEGACY="mihorario:v2", PREFS="mihorario:prefs";
const SPEC=1, APPVER=5;

/* Versión y bitácora de cambios */
const APP={n:5,label:"5.2",date:"14 ago 2026"};

/* ══════════════════════════════════════════════════════════
   BÓVEDA
   El horario se guarda en el navegador. Se intenta, en orden:
   localStorage (lo normal, y lo que funciona como app de
   inicio), un almacén alterno si el entorno lo ofrece, y como
   último recurso la memoria de la sesión — ahí sí se pierde al

   ══════════════════════════════════════════════════════════ */
const Vault=(function(){
  let mem={};
  let local=false,claudeStore=false;
  try{
    const probe="__mh__"+Math.random();
    window.localStorage.setItem(probe,"1");
    local=window.localStorage.getItem(probe)==="1";
    window.localStorage.removeItem(probe);
  }catch(e){local=false;}
  try{
    claudeStore=!!(window.storage&&typeof window.storage.get==="function"&&typeof window.storage.set==="function");
  }catch(e){claudeStore=false;}
  const mode=local?"navegador":(claudeStore?"claude":"memoria");
  return {
    mode:mode,local:local,claude:claudeStore,
    etiqueta:local?"este navegador":(claudeStore?"el almacén interno":"solo esta sesión"),
    async get(k){
      if(local){try{const v=window.localStorage.getItem(k);if(v!=null)return v;}catch(e){}}
      if(claudeStore){try{const r=await window.storage.get(k);if(r&&r.value!=null)return r.value;}catch(e){}}
      return mem[k]!=null?mem[k]:null;
    },
    async set(k,v){
      mem[k]=v;
      if(local){try{window.localStorage.setItem(k,v);return true;}catch(e){
        /* cuota llena u otro error: no se pierde silenciosamente */
        return false;
      }}
      if(claudeStore){try{await window.storage.set(k,v);return true;}catch(e){return false;}}
      return false;
    },
    async del(k){
      delete mem[k];
      if(local){try{window.localStorage.removeItem(k);}catch(e){}}
      return true;
    },
    /* solo para rescatar datos guardados en el almacén alterno */
    async fromAlterno(k){
      if(!claudeStore) return null;
      try{const r=await window.storage.get(k);return r&&r.value!=null?r.value:null;}catch(e){return null;}
    },
    bytes(){
      if(!local) return 0;
      let n=0;
      try{for(let i=0;i<window.localStorage.length;i++){
        const k=window.localStorage.key(i);
        if(k&&k.indexOf("mihorario")===0) n+=(window.localStorage.getItem(k)||"").length+k.length;
      }}catch(e){}
      return n;
    }
  };
})();

function monday(d){const x=new Date(d);x.setHours(0,0,0,0);const w=x.getDay();x.setDate(x.getDate()-(w===0?6:w-1));return x;}
function wid(d){return iso(monday(d));}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fromISO(s){const p=String(s||"").split("-");const d=new Date(+p[0],(+p[1]||1)-1,+p[2]||1);d.setHours(0,0,0,0);return d;}
function span7(d){const m=monday(d);return Array.from({length:7},function(_,i){const x=new Date(m);x.setDate(m.getDate()+i);return x;});}
function jumpW(d,n){const x=new Date(d);x.setDate(x.getDate()+n*7);return x;}
const hhmm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function len(m){const h=Math.floor(m/60),x=m%60;return (h?h+" h":"")+(x?(h?" ":"")+x+" min":(h?"":"0 min"));}
function mins(v){const p=String(v||"").split(":");return cap((+p[0]||0)*60+(+p[1]||0),0,1439);}
const clock=()=>{const n=new Date();return n.getHours()*60+n.getMinutes();};
const same=d=>d.toDateString()===new Date().toDateString();

function W(k){
  if(!D.weeks[k]) D.weeks[k]={skip:[],mod:{},extra:[],done:{}};
  const w=D.weeks[k];
  w.skip=w.skip||[];w.mod=w.mod||{};w.extra=w.extra||[];w.done=w.done||{};
  return w;
}
function unfold(k){
  const w=W(k),out=[];
  D.base.forEach(function(b){
    if(w.skip.indexOf(b.id)>=0) return;
    const m=w.mod[b.id];
    out.push(Object.assign({},b,m||{},{fixed:true,tweaked:!!m,done:!!w.done[b.id]}));
  });
  w.extra.forEach(function(e){out.push(Object.assign({},e,{fixed:false,tweaked:false,done:!!w.done[e.id]}));});
  return out.sort(function(a,b){return a.day-b.day||a.start-b.start||a.end-b.end;});
}
const here=()=>unfold(wid(V.cursor));
const collide=(l,e)=>l.some(function(o){return o.id!==e.id&&o.day===e.day&&e.start<o.end&&o.start<e.end;});

/* ══════════ Agenda: repeticiones ══════════
   Un pendiente vive en una fecha absoluta, así que sirve para
   cualquier año. Las repeticiones se calculan al vuelo, nunca
   se guardan copias.                                        */
function stepDate(d,cycle,n){
  const x=new Date(d);
  if(cycle==="daily") x.setDate(x.getDate()+n);
  else if(cycle==="weekly") x.setDate(x.getDate()+7*n);
  else if(cycle==="monthly") x.setMonth(x.getMonth()+n);
  else if(cycle==="yearly") x.setFullYear(x.getFullYear()+n);
  return x;
}
function occurrences(it,from,to,limit){
  const out=[],start=fromISO(it.date);
  if(!it.repeat||it.repeat==="none"){
    if(start>=from&&start<=to) out.push(start);
    return out;
  }
  let c=new Date(start),guard=0;
  /* el tope alto permite repeticiones diarias arrastradas desde hace décadas */
  while(c<from&&guard<40000){c=stepDate(c,it.repeat,1);guard++;}
  while(c<=to&&out.length<(limit||400)&&guard<60000){out.push(new Date(c));c=stepDate(c,it.repeat,1);guard++;}
  return out;
}
function nextOccurrence(it,from){
  const o=occurrences(it,from,stepDate(from,"yearly",12),1);
  return o.length?o[0]:null;
}
const slot=(it,d)=>it.id+"@"+iso(d);
const isDone=(it,d)=>!!it.doneOn&&it.doneOn.indexOf(iso(d))>=0;
function markDone(it,d,on){
  it.doneOn=it.doneOn||[];
  const k=iso(d),i=it.doneOn.indexOf(k);
  if(on&&i<0) it.doneOn.push(k);
  if(!on&&i>=0) it.doneOn.splice(i,1);
}
function whenMs(it,d){
  const x=new Date(d);
  if(it.time==null) x.setHours(9,0,0,0);
  else x.setHours(Math.floor(it.time/60),it.time%60,0,0);
  return x.getTime();
}

let pen=null,saveBroken=false;
function keep(){
  clearTimeout(pen);
  flag("Guardando");
  pen=setTimeout(async function(){
    const ok=await Vault.set(STORE,JSON.stringify(D));
    saveBroken=!ok;
    if(ok){flag("Guardado");setTimeout(function(){flag(null);},1500);}
    else{
      flag(null);
      say(Vault.mode==="memoria"
        ? "Este navegador no deja guardar. Exporta un respaldo antes de cerrar."
        : "No se pudo guardar: puede que el almacenamiento esté lleno.");
    }

function flag(t){

function normalize(p){
  p=p||{};
  p.lines=Array.isArray(p.lines)&&p.lines.length?p.lines:STOCK.map(function(l){return Object.assign({},l);});
  p.base=Array.isArray(p.base)?p.base:[];
  p.weeks=(p.weeks&&typeof p.weeks==="object")?p.weeks:{};
  p.agenda=Array.isArray(p.agenda)?p.agenda:[];
  p.settings=Object.assign({notify:false},p.settings||{});
  p.fired=p.fired||{};
  p._keep=p._keep||{};
  /* Si algo apunta a una línea que ya no existe, se recupera en vez
     de perderse: se recrea como línea a la medida. */
  const known={};p.lines.forEach(function(l){known[l.id]=1;});
  const seen={};
  const scan=function(e){if(e&&e.category&&!known[e.category])seen[e.category]=1;};
  p.base.forEach(scan);p.agenda.forEach(scan);
  Object.keys(p.weeks).forEach(function(k){(p.weeks[k].extra||[]).forEach(scan);});
  Object.keys(seen).forEach(function(id){
    p.lines.push({id:id,nm:id.charAt(0).toUpperCase()+id.slice(1),color:INKS[p.lines.length%INKS.length],glyph:"punto",custom:true});
  });
  return p;
}
async function pull(){
  await loadPrefs();
  let got=null;
  try{ got=await Vault.get(STORE); }catch(e){}
  if(got){try{const o=JSON.parse(got);if(o&&typeof o==="object")D=normalize(o);}catch(e){}}

  /* Rescate: la primera vez que se abre en el navegador, el horario
     puede seguir en el almacén alterno. Se copia aquí para que a
     partir de ahora viva en este aparato. */
  const vacio=function(){return !D.base.length&&!D.agenda.length&&!Object.keys(D.weeks).length;};
  if(vacio()&&Vault.local&&Vault.claude){
    const c=await Vault.fromAlterno(STORE);
    if(c){try{
      const o=JSON.parse(c);
      if(o&&typeof o==="object"){D=normalize(o);keep();setTimeout(function(){say("Horario recuperado del almacén anterior");},700);}
    }catch(e){}}
  }
  if(vacio()){
    let legacy=null;
    try{ legacy=await Vault.get(LEGACY)||await Vault.fromAlterno(LEGACY); }catch(e){}
    if(legacy){try{
      const old=JSON.parse(legacy);let n=0;
      Object.keys(old).forEach(function(k){
        if(!Array.isArray(old[k])) return;
        const w=W(k);
        old[k].forEach(function(e){w.extra.push({id:e.id||id8(),title:e.title,category:e.category,day:e.day,start:e.start,end:e.end,notes:e.notes||""});n++;});
      });
      if(n){D=normalize(D);keep();setTimeout(function(){say(n+" actividades recuperadas");},700);}
    }catch(e){}}
  }
  V.ready=true;
}

/* ══════════ Avisos ══════════ */
function pending(){
  const now=Date.now(),lim=now+1000*60*60*24*30,out=[];
  D.agenda.forEach(function(it){
    if(!it.remind||!it.remind.length) return;
    const occ=occurrences(it,today0(),new Date(lim),40);
    occ.forEach(function(d){
      if(isDone(it,d)) return;
      it.remind.forEach(function(off){
        const at=whenMs(it,d)-off*60000;
        if(at>now&&at<lim) out.push({it:it,d:d,off:off,at:at});
      });
    });
  });
  return out.sort(function(a,b){return a.at-b.at;});
}
function sweep(){
  const now=Date.now(),floor=now-1000*60*10;
  let hit=0;
  D.agenda.forEach(function(it){
    if(!it.remind||!it.remind.length) return;
    const from=new Date(now-1000*60*60*48), to=new Date(now+1000*60*60*48);
    occurrences(it,from,to,20).forEach(function(d){
      if(isDone(it,d)) return;
      it.remind.forEach(function(off){
        const at=whenMs(it,d)-off*60000;
        const key=it.id+"|"+iso(d)+"|"+off;
        if(at<=now&&at>floor&&!D.fired[key]){
          D.fired[key]=now;ring(it,d,off);hit++;
        }
      });
    });
  });
  /* poda de la bitácora de avisos ya disparados */
  const cutoff=now-1000*60*60*24*45;
  Object.keys(D.fired).forEach(function(k){if(D.fired[k]<cutoff)delete D.fired[k];});
  if(hit) keep();
  badge();
}
function ring(it,d,off){
  const when=it.time==null?"Todo el día":hhmm(it.time);
  const sub=(off?AHEAD_TXT[off]:"Ahora")+" · "+DS[dowOf(d)]+" "+d.getDate()+" "+MS[d.getMonth()]+" · "+when;
  if(D.settings.notify&&typeof Notification!=="undefined"&&Notification.permission==="granted"){
    const opciones={body:sub,tag:it.id+iso(d)+off,icon:"iconos/icono-192.png",
      badge:"iconos/icono-192.png",lang:"es",requireInteraction:false};
    /* El trabajador de servicio es la vía fiable en una app instalada;
       new Notification() falla en varios Android. */
    let porSW=false;
    try{
      if(navigator.serviceWorker&&navigator.serviceWorker.ready){
        porSW=true;
        navigator.serviceWorker.ready.then(function(reg){
          if(reg&&reg.showNotification) reg.showNotification(it.title,opciones);
          else new Notification(it.title,opciones);
        }).catch(function(){try{new Notification(it.title,opciones);}catch(e){}});
      }
    }catch(e){porSW=false;}
    if(!porSW){try{new Notification(it.title,opciones);}catch(e){}}
  }
  const c=mk("div","cue");
  c.innerHTML='<div class="ct"><div class="cl">Recordatorio</div><div class="cn">'+safe(it.title)+'</div><div class="cs">'+safe(sub)+'</div></div><button aria-label="Cerrar aviso">'+XMARK+'</button>';
  c.querySelector("button").onclick=function(){c.remove();};
  q("#cues").appendChild(c);
  setTimeout(function(){if(c.parentNode)c.remove();},1000*60);
}
function badge(){
  const b=q("#bell"),soon=pending().filter(function(p){return p.at-Date.now()<1000*60*60*24;});
  b.classList.toggle("armed",!!(D.settings.notify&&typeof Notification!=="undefined"&&Notification.permission==="granted"));
  b.classList.toggle("due",soon.length>0);
  b.querySelector(".pip").textContent=soon.length>9?"9+":String(soon.length);
}
function bellDialog(){
  const can=typeof Notification!=="undefined";
  const perm=can?Notification.permission:"unsupported";
  const list=pending().slice(0,14);
  const rows=list.length?list.map(function(p){
    const when=p.it.time==null?"Todo el día":hhmm(p.it.time);
    return '<div class="entry" style="cursor:default"><span class="stampbox"><span class="sd">'+DS[dowOf(p.d)]+'</span><span class="sn">'+p.d.getDate()+'</span><span class="sy">'+MS[p.d.getMonth()]+'</span></span>'+
      '<span class="ebody"><span class="en">'+safe(p.it.title)+'</span><span class="esub"><span>'+when+'</span><span class="hasbell">'+BELL+AHEAD_TXT[p.off]+'</span></span></span></div>';
  }).join(""):'<p class="aside">No hay recordatorios programados en los próximos 30 días.</p>';

  let state;
  if(!can) state='<div class="alarm">Este navegador no permite avisos del sistema. Los recordatorios igual aparecen dentro de la app mientras esté abierta.</div>';
  else if(perm==="granted") state='<div class="memo"><b>Avisos del sistema activos.</b> Aparecen como notificación del dispositivo.</div>';
  else if(perm==="denied") state='<div class="alarm">Bloqueaste los avisos para esta página. Se activan de nuevo desde los permisos del navegador. Mientras tanto, los recordatorios aparecen dentro de la app.</div>';
  else state='<button class="wide" id="grant" style="border-color:var(--cue);color:var(--cue)">Permitir avisos del sistema</button>';

  const dg=sheetDlg("Avisos",
    state+
    '<div class="memo" style="margin-top:12px"><b>Cómo funcionan.</b> Con la app puesta en la pantalla de inicio, los recordatorios salen como notificaciones del sistema. Si la cierras del todo, los de ese rato te aparecen al volver a abrirla.</div>'+'<button class="wide" id="bGuia" style="border-color:var(--cue);color:var(--cue)">Poner la app en el inicio</button>'+''+
    '<span class="field">Próximos recordatorios</span>'+rows,
    '<button class="act solid" id="ok">Listo</button>');
  dg.querySelector("#ok").onclick=close;
  const bg=dg.querySelector("#bGuia"); if(bg) bg.onclick=guiaInstalar;
  const g=dg.querySelector("#grant");
  if(g) g.onclick=function(){
    Notification.requestPermission().then(function(r){
      D.settings.notify=(r==="granted");keep();badge();close();
      say(r==="granted"?"Avisos del sistema activados":"Los avisos quedaron dentro de la app");
    }).catch(function(){say("No se pudieron activar los avisos");});
  };
}

/* ══════════════════════════════════════════════════════════
   GUÍAS
   Instalar en la pantalla de inicio, y conseguir avisos que
   suenen con la app cerrada. Son dos cosas distintas y la

let promptInstalar=null;
try{
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();promptInstalar=e;});
}catch(e){}
function plataforma(){
  const ua=(navigator.userAgent||"");
  if(/iPad|iPhone|iPod/.test(ua)) return "ios";
  if(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1) return "ios";
  if(/Android/.test(ua)) return "android";
  return "escritorio";
}
function yaInstalada(){
  try{
    if(window.navigator.standalone===true) return true;
    return !!(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches);
  }catch(e){return false;}
}
const GUIAS={
  ios:{nm:"iPhone o iPad",pasos:[

    "Toca el botón <b>Compartir</b>: el cuadrito con la flecha hacia arriba, abajo al centro de la pantalla.",

    '<button class="wide" id="gCal">Pasar mis recordatorios al calendario</button>',

  dg.querySelector("#gOk").onclick=function(){P.noInstalar=true;savePrefs();close();};

  const late=D.agenda.filter(function(it){

    return o.length&&!isDone(it,o[o.length-1])&&o[o.length-1]<today0();
  }).length;

}
function draw(){

/* ══════════ VISTA DÍA ══════════ */
function viewDay(s){
  const w=span7(V.cursor),all=here();
  const strip=mk("div","platform");
  w.forEach(function(d,i){
    const n=all.filter(function(e){return e.day===i;}).length;
    const b=mk("button",(n?"has":"")+(same(d)?" today":""));
    b.setAttribute("aria-pressed",i===V.day?"true":"false");
    b.innerHTML='<span class="pd">'+DS[i]+'</span><span class="pn">'+d.getDate()+'</span><span class="pc"></span>';
    b.onclick=function(){V.day=i;draw();};
    strip.appendChild(b);
  });
  s.appendChild(strip);

  const d=w[V.day],list=all.filter(function(e){return e.day===V.day;});
  const busy=list.reduce(function(a,e){return a+(e.end-e.start);},0);
  const shutN=list.filter(function(e){return e.done;}).length;

  const hd=mk("div","dayline");
  hd.innerHTML='<h2 class="disp">'+DL[V.day]+'</h2><span class="stamp">'+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+'</span>';
  s.appendChild(hd);

  const meta=mk("div","daymeta");
  meta.innerHTML='<span>'+ML[d.getMonth()]+" "+d.getFullYear()+'</span>'+
    (list.length?'<span><b>'+list.length+'</b> actividades</span><span><b>'+len(busy)+'</b> ocupadas</span><span><b>'+shutN+"/"+list.length+'</b> hechas</span>':'<span>Día libre</span>');
  s.appendChild(meta);

  /* Pendientes de la agenda que caen en este día */
  const todo=[];
  D.agenda.forEach(function(it){
    occurrences(it,d,d,2).forEach(function(o){todo.push({it:it,d:o});});
  });
  if(todo.length){
    const b=mk("div","bulletin");
    b.innerHTML='<span class="lbl">Agenda</span><span>'+todo.map(function(t){
      return "<b>"+safe(t.it.title)+"</b>"+(t.it.time!=null?(" "+hhmm(t.it.time)):"");
    }).join(" · ")+'</span>';
    b.style.cursor="pointer";b.onclick=function(){V.view="agenda";draw();};
    s.appendChild(b);
  }

  if(same(d)&&list.length){
    const t=clock();
    const on=list.filter(function(e){return t>=e.start&&t<e.end;})[0];
    const next=list.filter(function(e){return e.start>t;})[0];
    const b=mk("div","bulletin");
    if(on) b.innerHTML='<span class="lbl">Ahora</span><span><b>'+safe(on.title)+'</b> — termina en '+len(on.end-t)+'</span>';
    else if(next) b.innerHTML='<span class="lbl">Sigue</span><span><b>'+safe(next.title)+'</b> a las '+hhmm(next.start)+", en "+len(next.start-t)+'</span>';
    else b.innerHTML='<span class="lbl">Listo</span><span>Ya pasó todo lo de hoy.</span>';
    s.appendChild(b);
  }

  if(!list.length){
    s.appendChild(mk("div","blank",'<h3>Nada este día</h3><p>Agrega una actividad, o importa un horario que ya tengas en foto, texto o archivo.</p>'));
    return;
  }

  const dia=mk("div","diagram"),t=clock(),live=same(d);
  list.forEach(function(e,i){
    const c=LINE(e.category).color,span=e.end-e.start;
    const tall=cap(46+span*.3,64,196);
    const running=live&&t>=e.start&&t<e.end;
    const row=mk("div","stop"+(e.done?" is-done":""));
    const tags=(e.fixed?'<span class="tag fixed">Fijo</span>':"")+
      (e.tweaked?'<span class="tag edited">Cambiado</span>':"")+
      (running?'<span class="tag live">Ahora</span>':"")+
      (collide(all,e)?'<span class="tag crash">Encimada</span>':"");
    row.innerHTML=
      '<div class="clock"><span class="t1">'+hhmm(e.start)+'</span><span class="t2">'+hhmm(e.end)+'</span></div>'+
      '<div class="rail" style="color:'+c+'"><span class="seg" style="background:'+c+';min-height:'+tall+'px"></span>'+
        '<span class="node a"></span><span class="node b"></span>'+
        (running?'<span class="here" style="top:'+cap((t-e.start)/span*100,4,96)+'%"></span>':"")+'</div>'+
      '<div class="plate"><div class="plate-hd">'+pict(e.category)+
        '<div class="pt-txt"><div class="pt-name">'+safe(e.title)+'</div>'+
        '<div class="pt-sub"><span>'+len(span)+'</span><span>'+safe(LINE(e.category).nm)+'</span>'+tags+'</div></div>'+
        '<button class="tick" aria-pressed="'+(e.done?"true":"false")+'" aria-label="Marcar como hecha">'+(e.done?CHECK:"")+'</button>'+
      '</div>'+(e.notes?'<div class="pt-note">'+safe(e.notes)+'</div>':"")+'</div>';
    row.querySelector(".tick").onclick=function(ev){ev.stopPropagation();flip(e.id);};
    row.querySelector(".pt-txt").onclick=function(){edit(e);};
    const nt=row.querySelector(".pt-note");if(nt)nt.onclick=function(){edit(e);};
    dia.appendChild(row);

    const nx=list[i+1];
    if(nx){
      const gap=nx.start-e.end,v=mk("div","void");
      if(gap>=10){
        const inGap=live&&t>=e.end&&t<nx.start;
        v.innerHTML='<div></div><div class="rail"><span class="dash" style="min-height:34px"></span>'+
          (inGap?'<span class="here" style="top:'+cap((t-e.end)/gap*100,6,94)+'%"></span>':"")+'</div>'+
          '<div class="vlabel"><b>'+len(gap)+'</b> libre</div>';
      }else v.innerHTML='<div></div><div class="rail"><span class="dash" style="min-height:9px"></span></div><div></div>';
      dia.appendChild(v);
    }
  });
  const end=mk("div","terminus");
  end.innerHTML='<div></div><div><span class="cap"></span></div><div class="tx">Fin del día</div>';
  dia.appendChild(end);
  s.appendChild(dia);
}
function flip(k){
  const w=W(wid(V.cursor));
  if(w.done[k]) delete w.done[k]; else w.done[k]=true;
  keep();draw();
}

/* ══════════ VISTA SEMANA ══════════ */
function viewWeek(s){
  const w=span7(V.cursor),all=here();
  let lo=OPEN,hi=SHUT;
  all.forEach(function(e){lo=Math.min(lo,Math.floor(e.start/60)*60);hi=Math.max(hi,Math.ceil(e.end/60)*60);});
  const H=(hi-lo)*SCALE;
  const box=mk("div","sheet-wrap"),g=mk("div","sheet");
  g.appendChild(mk("div","sh-cap"));
  w.forEach(function(d,i){
    const h=mk("div","sh-day"+(same(d)?" today":""));
    h.innerHTML='<span class="d">'+DS[i]+'</span><span class="n">'+d.getDate()+'</span>';
    h.onclick=function(){V.day=i;V.view="day";draw();};
    g.appendChild(h);
  });
  const gut=mk("div","sh-hours");gut.style.cssText="height:"+H+"px;position:relative";
  for(let m=lo;m<=hi;m+=60){const i=mk("i",null,String(Math.floor(m/60)).padStart(2,"0"));i.style.top=((m-lo)*SCALE-5)+"px";gut.appendChild(i);}
  g.appendChild(gut);
  w.forEach(function(d,i){
    const col=mk("div","sh-col"+(same(d)?" today":""));col.style.height=H+"px";
    for(let m=lo;m<=hi;m+=30){const r=mk("div","sh-rule"+(m%60?"":" h"));r.style.top=((m-lo)*SCALE)+"px";col.appendChild(r);}
    if(same(d)){const t=clock();if(t>=lo&&t<=hi){const n=mk("div","sh-now");n.style.top=((t-lo)*SCALE)+"px";col.appendChild(n);}}
    all.filter(function(e){return e.day===i;}).forEach(function(e){
      const b=mk("div","sh-blk"+(e.done?" done":"")+(e.fixed?" fix":""));
      b.style.cssText="top:"+((e.start-lo)*SCALE)+"px;height:"+Math.max(19,(e.end-e.start)*SCALE-3)+"px;background:"+LINE(e.category).color;
      b.innerHTML="<b>"+safe(e.title)+"</b>"+((e.end-e.start)*SCALE>36?"<i>"+hhmm(e.start)+"–"+hhmm(e.end)+"</i>":"");
      b.onclick=function(){edit(e);};
      col.appendChild(b);
    });
    col.addEventListener("click",function(ev){
      if(ev.target!==col) return;
      const m=cap(Math.round((lo+ev.offsetY/SCALE)/30)*30,lo,hi-60);
      edit(null,{day:i,start:m,end:m+60});
    });
    g.appendChild(col);
  });
  box.appendChild(g);s.appendChild(box);
  s.appendChild(mk("p","caption","La franja blanca al costado de un bloque marca las actividades del horario fijo. Toca un hueco para crear ahí; desliza de lado para ver los siete días."));
}

/* ══════════ VISTA AGENDA ══════════ */
function viewAgenda(s){
  if(!D.agenda.length){
    s.appendChild(mk("div","blank",'<h3>Tu agenda está vacía</h3><p>Aquí van los pendientes con fecha: entregas, exámenes, citas, cumpleaños. Cada uno puede avisarte antes, y la fecha puede ser de cualquier año.</p>'));
    return;
  }
  const t0=today0(),horizon=stepDate(t0,"yearly",50);
  const items=[];
  D.agenda.forEach(function(it){
    occurrences(it,stepDate(t0,"yearly",-3),horizon,80).forEach(function(d){
      items.push({it:it,d:d,done:isDone(it,d)});
    });
  });
  items.sort(function(a,b){return a.d-b.d||((a.it.time==null?-1:a.it.time)-(b.it.time==null?-1:b.it.time));});

  const late=items.filter(function(x){return x.d<t0&&!x.done;});
  const rest=items.filter(function(x){return x.d>=t0;}).slice(0,140);

  const stamp=function(x){
    const cur=new Date().getFullYear();
    return '<span class="stampbox"><span class="sd">'+DS[dowOf(x.d)]+'</span><span class="sn">'+x.d.getDate()+'</span><span class="sy">'+MS[x.d.getMonth()]+(x.d.getFullYear()!==cur?(" "+String(x.d.getFullYear()).slice(2)):"")+'</span></span>';
  };
  const rowOf=function(x,isLate){
    const it=x.it,l=LINE(it.category);
    const when=it.time==null?"Todo el día":hhmm(it.time)+(it.end!=null?"–"+hhmm(it.end):"");
    const rep=(it.repeat&&it.repeat!=="none")?('<span>'+(CYCLES.filter(function(c){return c[0]===it.repeat;})[0]||["","" ])[1]+'</span>'):"";
    const bell=(it.remind&&it.remind.length)?('<span class="hasbell">'+BELL+it.remind.length+'</span>'):"";
    const b=mk("button","entry"+(isLate?" late":"")+(x.done?" is-done":""));
    b.innerHTML=stamp(x)+'<span class="ebody"><span class="en">'+safe(it.title)+'</span>'+
      '<span class="esub"><span>'+when+'</span><span>'+safe(l.nm)+'</span>'+rep+bell+
      (isLate?'<span class="warn">Atrasado</span>':"")+'</span>'+
      (it.notes?'<span class="enote">'+safe(it.notes)+'</span>':"")+'</span>'+
      '<span class="tick" role="checkbox" aria-checked="'+(x.done?"true":"false")+'" aria-pressed="'+(x.done?"true":"false")+'">'+(x.done?CHECK:"")+'</span>';
    b.querySelector(".ebody").onclick=function(ev){ev.stopPropagation();editTask(it);};
    b.querySelector(".stampbox").onclick=function(ev){ev.stopPropagation();editTask(it);};
    b.querySelector(".tick").onclick=function(ev){
      ev.stopPropagation();markDone(it,x.d,!x.done);keep();draw();
    };
    return b;
  };

  if(late.length){
    const g=mk("div","agroup late");
    g.innerHTML='<h4>Atrasado<em>'+late.length+'</em></h4>';
    late.slice(-40).reverse().forEach(function(x){g.appendChild(rowOf(x,true));});
    s.appendChild(g);
  }

  const buckets=[
    ["Hoy",function(x){return x.d.getTime()===t0.getTime();}],
    ["Mañana",function(x){return x.d.getTime()===stepDate(t0,"daily",1).getTime();}],
    ["Próximos 7 días",function(x){return x.d>stepDate(t0,"daily",1)&&x.d<=stepDate(t0,"daily",8);}],
    ["Este mes",function(x){return x.d>stepDate(t0,"daily",8)&&x.d.getMonth()===t0.getMonth()&&x.d.getFullYear()===t0.getFullYear();}]
  ];
  const used=[];
  buckets.forEach(function(bk){
    const set=rest.filter(function(x){return used.indexOf(x)<0&&bk[1](x);});
    set.forEach(function(x){used.push(x);});
    if(!set.length) return;
    const g=mk("div","agroup");
    g.innerHTML='<h4>'+bk[0]+'<em>'+set.length+'</em></h4>';
    set.forEach(function(x){g.appendChild(rowOf(x,false));});
    s.appendChild(g);
  });
  const later={};
  rest.filter(function(x){return used.indexOf(x)<0;}).forEach(function(x){
    const k=ML[x.d.getMonth()]+" "+x.d.getFullYear();
    (later[k]=later[k]||[]).push(x);
  });
  Object.keys(later).forEach(function(k){
    const g=mk("div","agroup");
    g.innerHTML='<h4>'+k+'<em>'+later[k].length+'</em></h4>';
    later[k].forEach(function(x){g.appendChild(rowOf(x,false));});
    s.appendChild(g);
  });
  s.appendChild(mk("p","caption","Los pendientes que se repiten se calculan al vuelo: se calculan hasta cincuenta años adelante sin guardar una copia por cada vez."));
}

/* ══════════ VISTA FIJO ══════════ */

      grp.appendChild(r);

    s.appendChild(grp);

  const wipe=mk("button","wide","Vaciar el horario fijo");
  wipe.style.cssText="border-color:var(--alert);color:var(--alert)";

      '<button class="act quiet" id="no" style="flex:1">Cancelar</button><button class="act danger" id="si" style="flex:1">Vaciar</button>');
    dg.querySelector("#no").onclick=close;
    dg.querySelector("#si").onclick=function(){D.base=[];Object.keys(D.weeks).forEach(function(k){D.weeks[k].skip=[];D.weeks[k].mod={};});keep();close();draw();say("Horario fijo vaciado");};
  };
  s.appendChild(wipe);

/* ══════════ VISTA BALANCE ══════════ */
function viewStats(s){
  const all=here();
  const busy=all.reduce(function(a,e){return a+(e.end-e.start);},0);
  const done=all.filter(function(e){return e.done;}).length;
  const wk=span7(V.cursor);
  const agThis=D.agenda.reduce(function(n,it){return n+occurrences(it,wk[0],wk[6],10).length;},0);
  const led=mk("div","ledger");
  led.innerHTML='<div class="lrow"><span class="lk">Actividades</span><span class="lv">'+all.length+'</span></div>'+
    '<div class="lrow"><span class="lk">Tiempo ocupado</span><span class="lv">'+(busy?len(busy):"0 min")+'</span></div>'+
    '<div class="lrow"><span class="lk">Hechas</span><span class="lv">'+(all.length?Math.round(done/all.length*100):0)+'%</span></div>'+
    '<div class="lrow"><span class="lk">Pendientes de agenda</span><span class="lv">'+agThis+'</span></div>';
  s.appendChild(led);
  if(!all.length){s.appendChild(mk("div","blank",'<h3>Sin datos todavía</h3><p>Cuando tengas actividades esta semana, aquí verás en qué se te va el tiempo.</p>'));return;}
  const rows=D.lines.map(function(l){
    const ev=all.filter(function(e){return e.category===l.id;});
    return Object.assign({},l,{m:ev.reduce(function(a,e){return a+(e.end-e.start);},0),n:ev.length});
  }).filter(function(l){return l.m>0;}).sort(function(a,b){return b.m-a.m;});
  const top=Math.max.apply(null,rows.map(function(r){return r.m;}));
  rows.forEach(function(r){
    const m=mk("div","meter");
    m.innerHTML='<div class="mh">'+pict(r.id,"mini")+'<span class="mn">'+safe(r.nm)+'</span><span class="mv">'+len(r.m)+" · "+r.n+'</span></div>'+
      '<div class="mt"><div class="mf" style="width:'+(r.m/top*100)+'%;background:'+r.color+'"></div></div>';
    s.appendChild(m);
  });
  const rb=mk("div","ribbon");
  rows.forEach(function(r){const p=Math.round(r.m/busy*100),d=mk("div",null,p>=10?p+"%":"");d.style.cssText="flex:"+r.m+";background:"+r.color;rb.appendChild(d);});
  s.appendChild(rb);
  const k=mk("div","key");
  rows.forEach(function(r){k.appendChild(mk("span",null,'<i style="background:'+r.color+'"></i>'+safe(r.nm)));});
  s.appendChild(k);
  const per=Array.from({length:7},function(_,i){return all.filter(function(e){return e.day===i;}).reduce(function(a,e){return a+(e.end-e.start);},0);});
  const peak=Math.max.apply(null,per)||1;
  const ch=mk("div","loadchart");
  per.forEach(function(v){const b=mk("div","lb"+(v===peak&&v>0?" pk":""));b.innerHTML='<i style="height:'+(v/peak*100)+'%"></i>';ch.appendChild(b);});
  s.appendChild(ch);
  const kk=mk("div","loadkey");
  per.forEach(function(v,i){kk.appendChild(mk("span",null,DS[i]+"<br>"+(v?len(v):"—")));});
  s.appendChild(kk);
  const fix=all.filter(function(e){return e.fixed;}).length;
  const n=mk("div","notes"),p=[];
  p.push("Tu día más cargado es el <b>"+DL[per.indexOf(peak)]+"</b>, con "+len(peak)+".");
  const zero=per.map(function(v,i){return v===0?DL[i]:null;}).filter(Boolean);
  if(zero.length) p.push("No hay nada programado el <b>"+zero.join(", ")+"</b>.");
  p.push("<b>"+fix+"</b> vienen del horario fijo y <b>"+(all.length-fix)+"</b> son solo de esta semana.");
  const cr=all.filter(function(e){return collide(all,e);}).length;
  if(cr) p.push("Hay <b>"+cr+"</b> actividad"+(cr!==1?"es":"")+" encimada"+(cr!==1?"s":"")+" con otra.");
  if(peak>10*60) p.push("Un día con más de 10 horas ocupadas rara vez se sostiene. Vale la pena revisarlo.");
  n.innerHTML=p.map(function(x){return "<p>"+x+"</p>";}).join("");
  s.appendChild(n);
}

function lineGrid(sel,onPick){
  return '<div class="lines" id="nL">'+

}

/* ══════════ Líneas a la medida ══════════ */
function newLine(done,existing){
  const st={nm:existing?existing.nm:"",color:existing?existing.color:INKS[D.lines.length%INKS.length],glyph:existing?existing.glyph:"punto"};
  const dg=sheetDlg(existing?"Editar línea":"Nueva línea",
    '<label class="field" for="lnm">Nombre</label><input type="text" id="lnm" maxlength="24" placeholder="Robótica, Trabajo, Terapia…" value="'+safe(st.nm)+'">'+
    '<span class="field">Color</span><div class="swatches" id="lsw">'+INKS.map(function(c){return '<button type="button" data-c="'+c+'" aria-pressed="'+(c===st.color?"true":"false")+'" style="background:'+c+'" aria-label="'+c+'"></button>';}).join("")+'</div>'+
    '<span class="field">Símbolo</span><div class="glyphgrid" id="lgl">'+GLYPH_KEYS.map(function(g){return '<button type="button" data-g="'+g+'" aria-pressed="'+(g===st.glyph?"true":"false")+'"><svg viewBox="0 0 16 16" fill="currentColor">'+GLYPH[g]+'</svg></button>';}).join("")+'</div>',
    (existing?'<button class="act danger" id="ldel">Eliminar</button>':"")+'<button class="act solid" id="lok">'+(existing?"Guardar cambios":"Crear línea")+'</button>');
  dg.querySelectorAll("#lsw button").forEach(function(b){b.onclick=function(){
    st.color=b.dataset.c;
    dg.querySelectorAll("#lsw button").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.c===st.color?"true":"false");});
  };});
  dg.querySelectorAll("#lgl button").forEach(function(b){b.onclick=function(){
    st.glyph=b.dataset.g;
    dg.querySelectorAll("#lgl button").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.g===st.glyph?"true":"false");});
  };});
  dg.querySelector("#lok").onclick=function(){
    const nm=dg.querySelector("#lnm").value.trim();
    if(!nm){say("Falta el nombre de la línea");return;}
    if(existing){
      existing.nm=nm;existing.color=st.color;existing.glyph=st.glyph;
      keep();close();draw();say("Línea actualizada");
      if(done)done(existing.id);
    }else{
      const id="l"+id8();
      D.lines.push({id:id,nm:nm,color:st.color,glyph:st.glyph,custom:true});
      keep();close();say("Línea «"+nm+"» creada");
      if(done)done(id); else draw();
    }
  };
  const del=dg.querySelector("#ldel");
  if(del) del.onclick=function(){
    const used=countLine(existing.id);
    const d2=sheetDlg("Eliminar línea",
      '<p class="aside" style="margin-top:6px">La línea «'+safe(existing.nm)+'» se usa en <b>'+used+'</b> registro'+(used!==1?"s":"")+'. Al eliminarla, esos registros pasan a <b>Personal</b>; no se borra ninguna actividad.</p>',
      '<button class="act quiet" id="c" style="flex:1">Cancelar</button><button class="act danger" id="y" style="flex:1">Eliminar</button>');
    d2.querySelector("#c").onclick=close;
    d2.querySelector("#y").onclick=function(){
      const fb=D.lines.filter(function(l){return l.id!=="_";})[0];
      const to=(D.lines.filter(function(l){return l.id==="personal";})[0]||fb).id;
      const swap=function(e){if(e.category===existing.id)e.category=to;};
      D.base.forEach(swap);D.agenda.forEach(swap);
      Object.keys(D.weeks).forEach(function(k){(D.weeks[k].extra||[]).forEach(swap);Object.keys(D.weeks[k].mod||{}).forEach(function(m){swap(D.weeks[k].mod[m]);});});
      D.lines=D.lines.filter(function(l){return l.id!==existing.id;});
      keep();close();draw();say("Línea eliminada");
    };
  };
}
function countLine(id){
  let n=0;
  const c=function(e){if(e.category===id)n++;};
  D.base.forEach(c);D.agenda.forEach(c);
  Object.keys(D.weeks).forEach(function(k){(D.weeks[k].extra||[]).forEach(c);});
  return n;
}
function linesDialog(){
  const rows=D.lines.map(function(l){
    return '<button class="lman" data-id="'+l.id+'">'+pict(l.id,"mini")+'<span class="lnm">'+safe(l.nm)+'</span><span class="lct">'+countLine(l.id)+'</span></button>';

}

/* ══════════ Alta y edición de actividad ══════════ */
function edit(ev,seed){
  const has=!!ev,onBase=V.view==="base";
  const f=ev?Object.assign({},ev):{id:null,title:"",category:D.lines[0].id,day:(seed&&seed.day!=null)?seed.day:V.day,start:(seed&&seed.start)||8*60,end:(seed&&seed.end)||9*60,notes:""};
  let mode=has?(f.fixed?"fixed":"loose"):(onBase?"fixed":"loose");

  const body=
    '<label class="field" for="nT">Actividad</label><input type="text" id="nT" maxlength="70" placeholder="Cálculo Diferencial" value="'+safe(f.title)+'">'+
    (has?"":'<span class="field">Dónde va</span><div class="trio" id="nP">'+
      '<button type="button" data-m="fixed" aria-pressed="'+(mode==="fixed"?"true":"false")+'"><strong>Fija</strong><em>Cada semana</em></button>'+
      '<button type="button" data-m="loose" aria-pressed="'+(mode==="loose"?"true":"false")+'"><strong>Suelta</strong><em>Solo esta semana</em></button>'+
      '<button type="button" data-m="dated" aria-pressed="false"><strong>Con fecha</strong><em>A la agenda</em></button></div>')+
    '<span class="field">Línea</span>'+lineGrid(f.category)+
    '<span class="field">Día</span><div class="week7" id="nD">'+DS.map(function(d,i){return '<button type="button" data-d="'+i+'" aria-pressed="'+(i===f.day?"true":"false")+'">'+d+'</button>';}).join("")+'</div>'+
    '<div class="pair"><div><label class="field" for="nS">Empieza</label><input type="time" id="nS" step="300" value="'+hhmm(f.start)+'"></div>'+
    '<div><label class="field" for="nE">Termina</label><input type="time" id="nE" step="300" value="'+hhmm(f.end)+'"></div></div><div id="nW"></div>'+
    '<label class="field" for="nN">Nota</label><textarea id="nN" maxlength="180" placeholder="Salón 204, llevar calculadora"></textarea>'+
    (has&&f.fixed&&!f.atBase?'<p class="aside">Esta actividad viene del <b>horario fijo</b>. Al guardar eliges si el cambio es solo de esta semana o de todas.</p>':"");

  let foot;
  if(has&&f.fixed&&!f.atBase) foot='<button class="act danger" id="nX">Quitar</button><button class="act blue" id="nSb">Guardar cambios</button>';
  else if(has) foot='<button class="act danger" id="nX">Borrar</button><button class="act solid" id="nOk">Guardar cambios</button>';
  else foot='<button class="act solid" id="nOk">Agregar actividad</button>';

  const dg=sheetDlg(has?"Editar actividad":(onBase?"Nueva actividad fija":"Nueva actividad"),body,foot);
  dg.querySelector("#nN").value=f.notes||"";
  const A=dg.querySelector("#nS"),B=dg.querySelector("#nE");

  function refreshLines(){
    const tmp=mk("div",null,lineGrid(f.category));
    dg.querySelector("#nL").replaceWith(tmp.firstChild);
    wireLines(dg,f,refreshLines);
  }
  wireLines(dg,f,refreshLines);
  dg.querySelectorAll("#nD button").forEach(function(b){b.onclick=function(){
    f.day=+b.dataset.d;
    dg.querySelectorAll("#nD button").forEach(function(x){x.setAttribute("aria-pressed",+x.dataset.d===f.day?"true":"false");});
    check();
  };});
  const pd=dg.querySelector("#nP");
  if(pd) pd.querySelectorAll("button").forEach(function(b){b.onclick=function(){
    if(b.dataset.m==="dated"){
      const w=span7(V.cursor);
      close();
      editTask(null,{title:dg.querySelector("#nT").value.trim(),category:f.category,date:iso(w[f.day]),time:mins(A.value),end:mins(B.value),notes:dg.querySelector("#nN").value.trim()});
      return;
    }
    mode=b.dataset.m;
    pd.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.m===mode?"true":"false");});
  };});
  A.onchange=B.onchange=check;
  function check(){
    const a=mins(A.value),b=mins(B.value),box=dg.querySelector("#nW");box.innerHTML="";
    if(b<=a){box.innerHTML='<div class="alarm">La hora de término tiene que ser posterior a la de inicio.</div>';return;}
    const x=here().filter(function(o){return o.id!==f.id&&o.day===f.day&&a<o.end&&o.start<b;});
    if(x.length) box.innerHTML='<div class="alarm">Se encima con '+x.map(function(o){return safe(o.title)+" ("+hhmm(o.start)+"–"+hhmm(o.end)+")";}).join(", ")+". Puedes guardarla así si quieres.</div>";
  }
  check();
