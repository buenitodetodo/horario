<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiHorario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0C0E13;
  --panel:#151922;
  --panel-2:#1D222D;
  --line:#2A3040;
  --line-soft:#212734;
  --text:#EDEFF4;
  --muted:#8B93A7;
  --dim:#5D6478;
  --accent:#E8FF52;
  --danger:#FF5D5D;
  --ok:#34D399;
  --radius:14px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Bricolage Grotesque',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.45;
  padding-bottom:96px;
  background-image:radial-gradient(circle at 15% -10%, #1B2130 0%, transparent 55%),radial-gradient(circle at 95% 0%, #171C28 0%, transparent 45%);
  background-attachment:fixed;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- HEADER ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:rgba(12,14,19,.88);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
  padding:14px 16px 0;
}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.brand h1{
  font-size:21px;font-weight:800;margin:0;letter-spacing:-.5px;
}
.brand h1 span{color:var(--accent)}
.brand small{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase}

.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.weeknav button.arrow{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-size:17px;flex:none;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.weeknav button.arrow:active{background:var(--panel-2);color:var(--text)}
.weeklabel{
  flex:1;text-align:center;font-family:var(--mono);font-size:12px;
  color:var(--muted);letter-spacing:.5px;
}
.weeklabel b{display:block;color:var(--text);font-size:13px;font-weight:700}
.btn-today{
  border:1px solid var(--accent);color:var(--accent);background:transparent;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;
  padding:9px 11px;border-radius:10px;flex:none;text-transform:uppercase;
}

.tabs{display:flex;gap:0;border-bottom:1px solid transparent}
.tabs button{
  flex:1;padding:11px 4px 12px;font-size:13px;font-weight:600;color:var(--dim);
  border-bottom:2px solid transparent;transition:.15s;
}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}

/* ---------- ACTION STRIP ---------- */
.strip{
  display:flex;gap:7px;overflow-x:auto;padding:12px 16px 4px;
  scrollbar-width:none;
}
.strip::-webkit-scrollbar{display:none}
.strip button{
  flex:none;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);font-size:12px;font-weight:500;padding:8px 13px;border-radius:9px;
  white-space:nowrap;transition:.15s;
}
.strip button:active{background:var(--panel-2);color:var(--text)}
.strip button.warn{border-color:#3A2224;color:#E08A8A}

/* ---------- LAYOUT ---------- */
main{padding:8px 16px 0;max-width:1000px;margin:0 auto}

/* ---------- DAY VIEW ---------- */
.daychips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 14px;scrollbar-width:none}
.daychips::-webkit-scrollbar{display:none}
.daychip{
  flex:1;min-width:44px;border:1px solid var(--line);background:var(--panel);
  border-radius:12px;padding:9px 4px;text-align:center;transition:.15s;
}
.daychip .d{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.daychip .n{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--muted);line-height:1.3}
.daychip .dot{width:4px;height:4px;border-radius:50%;background:var(--dim);margin:2px auto 0}
.daychip.on{background:var(--accent);border-color:var(--accent)}
.daychip.on .d{color:#31380B}
.daychip.on .n{color:#171B05}
.daychip.on .dot{background:#171B05}
.daychip.today .n{color:var(--accent)}
.daychip.today.on .n{color:#171B05}

.dayhead{margin:2px 0 14px}
.dayhead h2{font-size:24px;font-weight:800;margin:0;letter-spacing:-.6px}
.dayhead p{margin:3px 0 0;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.5px}
.nextup{
  margin-top:11px;border:1px solid var(--line);border-left:3px solid var(--accent);
  background:var(--panel);border-radius:10px;padding:9px 13px;
  font-size:12.5px;color:var(--muted);
}
.nextup b{color:var(--text);font-weight:600}

.tl{display:flex;flex-direction:column;gap:9px}
.item{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--panel);border:1px solid var(--line-soft);
  border-left:4px solid var(--dim);border-radius:12px;padding:13px 14px;
  transition:.15s;position:relative;
}
.item:active{background:var(--panel-2)}
.item.done{opacity:.42}
.item.done .it-title{text-decoration:line-through}
.item.now{border-color:var(--line);box-shadow:0 0 0 1px rgba(232,255,82,.22)}
.check{
  flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);
  margin-top:2px;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--ink);transition:.15s;
}
.check.on{background:var(--ok);border-color:var(--ok)}
.it-body{flex:1;min-width:0}
.it-time{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it-dur{color:var(--dim)}
.it-title{font-size:15.5px;font-weight:600;margin:3px 0 0;letter-spacing:-.2px;word-break:break-word}
.it-notes{font-size:12.5px;color:var(--muted);margin-top:3px;word-break:break-word}
.pill{
  font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.8px;
  padding:2px 7px;border-radius:20px;text-transform:uppercase;
}
.pill.live{background:var(--accent);color:#171B05}
.pill.clash{background:#3A2224;color:#FF9B9B}
.cat-tag{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;opacity:.85}

.empty{text-align:center;padding:52px 20px;color:var(--dim)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.5}
.empty p{margin:0 0 4px;font-size:14px}
.empty small{font-size:12px;color:var(--line);color:#4A5163}

/* ---------- WEEK GRID ---------- */
.gridwrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--panel)}
.grid{display:grid;grid-template-columns:46px repeat(7,minmax(92px,1fr));min-width:660px}
.gcell-head{
  position:sticky;top:0;z-index:5;background:var(--panel-2);
  border-bottom:1px solid var(--line);padding:9px 4px;text-align:center;
}
.gcell-head .d{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.gcell-head .n{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--muted)}
.gcell-head.today .n{color:var(--accent)}
.gcorner{position:sticky;top:0;left:0;z-index:6;background:var(--panel-2);border-bottom:1px solid var(--line);border-right:1px solid var(--line-soft)}
.gtime{
  position:sticky;left:0;z-index:4;background:var(--panel);
  border-right:1px solid var(--line-soft);
  font-family:var(--mono);font-size:9.5px;color:var(--dim);
  text-align:right;padding-right:6px;padding-top:2px;
}
.gcol{position:relative;border-right:1px solid var(--line-soft)}
.gcol.today{background:rgba(232,255,82,.025)}
.hline{position:absolute;left:0;right:0;border-top:1px solid var(--line-soft)}
.hline.half{border-top-style:dashed;opacity:.4}
.blk{
  position:absolute;left:3px;right:3px;border-radius:7px;padding:5px 7px;
  overflow:hidden;color:#0B0D11;font-weight:700;font-size:11px;line-height:1.25;
  border:1px solid rgba(0,0,0,.25);transition:.12s;
}
.blk:active{transform:scale(.97)}
.blk .t{font-family:var(--mono);font-size:9px;font-weight:500;opacity:.75;display:block}
.blk.done{opacity:.4}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:8}
.nowline::before{content:'';position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

/* ---------- STATS ---------- */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:26px}
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:15px 10px;text-align:center}
.card .v{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--accent);letter-spacing:-.5px}
.card .l{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.3}
h3.sec{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin:0 0 13px}
.bar{margin-bottom:14px}
.bar .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.bar .nm{font-size:13.5px;font-weight:600}
.bar .vl{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap}
.track{height:9px;background:var(--panel-2);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.split{display:flex;height:30px;border-radius:9px;overflow:hidden;margin-bottom:12px}
.split div{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:700;color:#0B0D11;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:7px 15px;margin-bottom:26px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.busy{display:flex;gap:5px;align-items:flex-end;height:78px;margin-bottom:8px}
.busy .b{flex:1;background:var(--panel-2);border-radius:5px 5px 0 0;position:relative;transition:.4s}
.busy .b i{position:absolute;bottom:0;left:0;right:0;background:var(--accent);border-radius:5px 5px 0 0}
.busylbl{display:flex;gap:5px}
.busylbl span{flex:1;text-align:center;font-family:var(--mono);font-size:9px;color:var(--dim);text-transform:uppercase}

/* ---------- FAB ---------- */
.fab{
  position:fixed;right:18px;bottom:22px;z-index:50;
  height:54px;padding:0 22px;border-radius:27px;
  background:var(--accent);color:#171B05;font-weight:800;font-size:15px;
  box-shadow:0 8px 28px rgba(232,255,82,.22),0 2px 8px rgba(0,0,0,.5);
  display:flex;align-items:center;gap:8px;letter-spacing:-.2px;
}
.fab:active{transform:scale(.95)}

/* ---------- MODAL ---------- */
.ov{
  position:fixed;inset:0;z-index:100;background:rgba(6,8,12,.78);
  backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;
  animation:fade .16s ease;
}
@media(min-width:640px){.ov{align-items:center}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet{
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);
  border-radius:20px 20px 0 0;animation:up .22s cubic-bezier(.2,.9,.3,1);
}
@media(min-width:640px){.sheet{border-radius:18px}}
.sh-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 4px;position:sticky;top:0;background:var(--panel);z-index:2;
}
.sh-head h2{font-size:18px;font-weight:800;margin:0;letter-spacing:-.4px}
.x{width:32px;height:32px;border-radius:9px;background:var(--panel-2);color:var(--muted);font-size:19px;line-height:1}
.sh-body{padding:4px 20px 18px}
label.lb{
  display:block;font-family:var(--mono);font-size:9.5px;font-weight:500;
  color:var(--dim);letter-spacing:1.3px;text-transform:uppercase;margin:17px 0 7px;
}
input[type=text],input[type=time],textarea,select{
  width:100%;background:var(--panel-2);border:1px solid var(--line);
  border-radius:11px;padding:12px 13px;outline:none;transition:.15s;
}
input[type=text]:focus,input[type=time]:focus,textarea:focus,select:focus{border-color:var(--accent)}
input[type=time]{font-family:var(--mono);font-size:15px}
textarea{resize:vertical;min-height:56px;font-size:14px}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.catbtn{
  border:1.5px solid var(--line);background:var(--panel-2);border-radius:11px;
  padding:9px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s;
}
.catbtn .ic{font-size:16px;line-height:1}
.catbtn .nm{font-size:9.5px;color:var(--muted);font-weight:500}
.catbtn.on .nm{color:var(--text);font-weight:700}
.dayrow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.daybtn{
  border:1.5px solid var(--line);background:var(--panel-2);border-radius:10px;
  padding:10px 2px;font-family:var(--mono);font-size:11px;color:var(--muted);transition:.15s;
}
.daybtn.on{background:var(--accent);border-color:var(--accent);color:#171B05;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.hint{font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.5}
.warnbox{
  margin-top:13px;border:1px solid #3A2224;background:#1B1315;
  border-radius:10px;padding:10px 12px;font-size:12px;color:#E08A8A;
}
.sh-foot{
  display:flex;gap:8px;padding:6px 20px 22px;position:sticky;bottom:0;
  background:linear-gradient(transparent,var(--panel) 22%);
}
.b-main{flex:1;background:var(--accent);color:#171B05;font-weight:800;padding:14px;border-radius:12px;font-size:15px}
.b-ghost{border:1px solid var(--line);color:var(--muted);padding:14px 18px;border-radius:12px;font-weight:600}
.b-del{border:1px solid #3A2224;background:#1B1315;color:#FF8A8A;padding:14px 18px;border-radius:12px;font-weight:600}
.b-full{width:100%;margin-top:9px;border:1px solid var(--line);background:var(--panel-2);padding:13px;border-radius:11px;font-weight:600;text-align:center;color:var(--text)}

/* ---------- TOAST ---------- */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:200;
  background:var(--text);color:var(--ink);font-weight:700;font-size:13.5px;
  padding:11px 20px;border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:88vw;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* ---------- PRINT ---------- */
#printsheet{display:none}
@media print{
  body{background:#fff;color:#000;padding:0}
  header,.strip,.fab,main,.ov,#toast{display:none!important}
  #printsheet{display:block;padding:0;font-family:var(--sans)}
  #printsheet h1{font-size:20px;margin:0 0 2px}
  #printsheet .sub{font-family:var(--mono);font-size:10px;color:#555;margin-bottom:16px}
  #printsheet .pd{break-inside:avoid;margin-bottom:14px;border-bottom:1px solid #ccc;padding-bottom:8px}
  #printsheet .pd h4{font-size:13px;margin:0 0 6px;text-transform:uppercase;letter-spacing:1px}
  #printsheet .pr{display:flex;gap:10px;font-size:12px;padding:3px 0}
  #printsheet .pr .pt{font-family:var(--mono);font-size:11px;width:96px;flex:none;color:#333}
  #printsheet .pr .pn{color:#555;font-size:11px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Mi<span>Horario</span></h1>
    <small id="autosave">guardado automático</small>
  </div>
  <div class="weeknav">
    <button class="arrow" id="prevW">‹</button>
    <div class="weeklabel"><b id="wRange">—</b><span id="wSub">—</span></div>
    <button class="arrow" id="nextW">›</button>
    <button class="btn-today" id="btnToday">Hoy</button>
  </div>
  <div class="tabs">
    <button data-view="day" class="on">Día</button>
    <button data-view="week">Semana</button>
    <button data-view="stats">Resumen</button>
  </div>
</header>

<div class="strip">
  <button id="aPrint">Imprimir</button>
  <button id="aCopy">Copiar texto</button>
  <button id="aDup">Duplicar día</button>
  <button id="aNextWeek">Copiar semana →</button>
  <button id="aBackup">Respaldo</button>
  <button id="aClear" class="warn">Limpiar semana</button>
</div>

<main id="app"></main>

<button class="fab" id="fab">＋ Actividad</button>
<div id="modals"></div>
<div id="toast"></div>
<div id="printsheet"></div>

<script>
(function(){
"use strict";

/* ═══════════ CONFIG ═══════════ */
const DAYS_S=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const DAYS_L=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const MONTHS=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const CATS=[
  {id:"escuela",  nm:"Escuela",  ic:"📚", c:"#5B95FF"},
  {id:"robotica", nm:"Robótica", ic:"🤖", c:"#B266FF"},
  {id:"estudio",  nm:"Estudio",  ic:"✏️", c:"#22D3EE"},
  {id:"ejercicio",nm:"Ejercicio",ic:"💪", c:"#34D399"},
  {id:"personal", nm:"Personal", ic:"🏠", c:"#FBBF24"},
  {id:"social",   nm:"Social",   ic:"👥", c:"#F472B6"},
  {id:"ocio",     nm:"Ocio",     ic:"🎮", c:"#FF7A45"},
  {id:"descanso", nm:"Descanso", ic:"😴", c:"#94A3B8"}
];
const CAT=id=>CATS.find(c=>c.id===id)||CATS[0];
const KEY="mihorario:v2";
const PXM=0.85;              // pixeles por minuto en la grilla
const DEF_START=6*60, DEF_END=23*60;

/* ═══════════ STATE ═══════════ */
let S={ events:{}, view:"day", cursor:new Date(), selDay:0, loaded:false };

/* ═══════════ HELPERS ═══════════ */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);

function mondayOf(d){
  const x=new Date(d); x.setHours(0,0,0,0);
  const w=x.getDay(); x.setDate(x.getDate()-(w===0?6:w-1));
  return x;
}
function keyOf(d){const m=mondayOf(d);return m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")+"-"+String(m.getDate()).padStart(2,"0");}
function weekDates(d){const m=mondayOf(d);return Array.from({length:7},(_,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return x;});}
function shiftWeeks(d,n){const x=new Date(d);x.setDate(x.getDate()+n*7);return x;}
const fmt=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function dur(m){const h=Math.floor(m/60),mm=m%60; return (h?h+"h":"")+(mm?(h?" ":"")+mm+"m":(h?"":"0m"));}
function toMin(v){const p=(v||"").split(":");return (+p[0]||0)*60+(+p[1]||0);}
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes();};
const isToday=d=>d.toDateString()===new Date().toDateString();
const todayIdx=()=>{const w=new Date().getDay();return w===0?6:w-1;};

const weekEvents=()=> (S.events[keyOf(S.cursor)]||[]).slice();
function setWeekEvents(k,arr){ S.events[k]=arr; save(); }
const sortEv=a=>a.sort((x,y)=>x.day-y.day||x.start-y.start||x.end-y.end);

function overlaps(list,ev){
  return list.some(o=>o.id!==ev.id && o.day===ev.day && ev.start<o.end && o.start<ev.end);
}

/* ═══════════ STORAGE ═══════════ */
let saveT=null;
function save(){
  clearTimeout(saveT);
  $("#autosave").textContent="guardando…";
  saveT=setTimeout(async()=>{
    try{
      await window.storage.set(KEY,JSON.stringify(S.events));
      $("#autosave").textContent="guardado ✓";
      setTimeout(()=>{$("#autosave").textContent="guardado automático";},1600);
    }catch(e){
      $("#autosave").textContent="⚠ sin guardar";
      console.error(e);
    }
  },350);
}
async function load(){
  try{
    const r=await window.storage.get(KEY);
    if(r&&r.value) S.events=JSON.parse(r.value)||{};
  }catch(e){ S.events={}; }
  S.loaded=true;
}

/* ═══════════ TOAST ═══════════ */
let tT=null;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(tT); tT=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ═══════════ RENDER: SHELL ═══════════ */
function renderHeader(){
  const w=weekDates(S.cursor);
  $("#wRange").textContent=w[0].getDate()+" "+MONTHS[w[0].getMonth()]+" — "+w[6].getDate()+" "+MONTHS[w[6].getMonth()];
  const now=mondayOf(new Date()).getTime(), cur=mondayOf(S.cursor).getTime();
  const diff=Math.round((cur-now)/604800000);
  $("#wSub").textContent = diff===0?"Semana actual":diff===1?"Próxima semana":diff===-1?"Semana pasada":
    (diff>0?"En "+diff+" semanas":"Hace "+Math.abs(diff)+" semanas");
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.view===S.view));
}

function render(){
  renderHeader();
  const app=$("#app"); app.innerHTML="";
  if(!S.loaded){ app.appendChild(el("div","empty","<p>Cargando…</p>")); return; }
  if(S.view==="day") renderDay(app);
  else if(S.view==="week") renderWeek(app);
  else renderStats(app);
}

/* ═══════════ VIEW: DÍA ═══════════ */
function renderDay(app){
  const w=weekDates(S.cursor), all=weekEvents();

  // chips de día
  const chips=el("div","daychips");
  w.forEach((d,i)=>{
    const n=all.filter(e=>e.day===i).length;
    const b=el("button","daychip"+(i===S.selDay?" on":"")+(isToday(d)?" today":""));
    b.innerHTML='<div class="d">'+DAYS_S[i]+'</div><div class="n">'+d.getDate()+'</div>'+(n?'<div class="dot"></div>':'');
    b.onclick=()=>{S.selDay=i;render();};
    chips.appendChild(b);
  });
  app.appendChild(chips);

  const d=w[S.selDay];
  const list=sortEv(all.filter(e=>e.day===S.selDay));
  const total=list.reduce((s,e)=>s+(e.end-e.start),0);
  const doneN=list.filter(e=>e.done).length;

  const head=el("div","dayhead");
  head.innerHTML='<h2>'+DAYS_L[S.selDay]+'</h2><p>'+d.getDate()+" de "+
    ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"][d.getMonth()]+
    " · "+list.length+" actividad"+(list.length!==1?"es":"")+(list.length?" · "+dur(total):"")+
    (list.length?" · "+doneN+"/"+list.length+" hechas":"")+'</p>';
  app.appendChild(head);

  // próxima actividad (solo si es hoy)
  if(isToday(d)){
    const nm=nowMin();
    const cur=list.find(e=>nm>=e.start&&nm<e.end);
    const nxt=list.find(e=>e.start>nm);
    if(cur) head.appendChild(el("div","nextup","Ahora mismo: <b>"+esc(cur.title)+"</b> · termina en "+dur(cur.end-nm)));
    else if(nxt) head.appendChild(el("div","nextup","Sigue: <b>"+esc(nxt.title)+"</b> en "+dur(nxt.start-nm)+" ("+fmt(nxt.start)+")"));
    else if(list.length) head.appendChild(el("div","nextup","Terminaste todo lo programado de hoy."));
  }

  if(!list.length){
    app.appendChild(el("div","empty",'<div class="big">◌</div><p>Sin actividades este día</p><small>Toca “＋ Actividad” para empezar</small>'));
    return;
  }

  const tl=el("div","tl");
  list.forEach(e=>{
    const c=CAT(e.category);
    const nm=nowMin();
    const live=isToday(d)&&nm>=e.start&&nm<e.end;
    const clash=overlaps(all,e);
    const it=el("div","item"+(e.done?" done":"")+(live?" now":""));
    it.style.borderLeftColor=c.c;
    it.innerHTML=
      '<div class="check'+(e.done?" on":"")+'">'+(e.done?"✓":"")+'</div>'+
      '<div class="it-body">'+
        '<div class="it-time">'+fmt(e.start)+" – "+fmt(e.end)+
          '<span class="it-dur">'+dur(e.end-e.start)+'</span>'+
          '<span class="cat-tag" style="color:'+c.c+'">'+c.ic+" "+c.nm+'</span>'+
          (live?'<span class="pill live">ahora</span>':"")+
          (clash?'<span class="pill clash">traslape</span>':"")+
        '</div>'+
        '<div class="it-title">'+esc(e.title)+'</div>'+
        (e.notes?'<div class="it-notes">'+esc(e.notes)+'</div>':"")+
      '</div>';
    it.querySelector(".check").onclick=ev=>{ev.stopPropagation();toggleDone(e.id);};
    it.querySelector(".it-body").onclick=()=>openForm(e);
    tl.appendChild(it);
  });
  app.appendChild(tl);
}

function toggleDone(id){
  const k=keyOf(S.cursor), arr=(S.events[k]||[]).map(e=>e.id===id?Object.assign({},e,{done:!e.done}):e);
  setWeekEvents(k,arr); render();
}

/* ═══════════ VIEW: SEMANA ═══════════ */
function renderWeek(app){
  const w=weekDates(S.cursor), all=weekEvents();
  let lo=DEF_START, hi=DEF_END;
  all.forEach(e=>{lo=Math.min(lo,Math.floor(e.start/60)*60);hi=Math.max(hi,Math.ceil(e.end/60)*60);});
  const H=(hi-lo)*PXM;

  const wrap=el("div","gridwrap"), g=el("div","grid");
  g.appendChild(el("div","gcorner"));
  w.forEach((d,i)=>{
    const h=el("div","gcell-head"+(isToday(d)?" today":""));
    h.innerHTML='<div class="d">'+DAYS_S[i]+'</div><div class="n">'+d.getDate()+'</div>';
    h.onclick=()=>{S.selDay=i;S.view="day";render();};
    g.appendChild(h);
  });

  const tcol=el("div","gtime"); tcol.style.height=H+"px"; tcol.style.position="relative";
  for(let m=lo;m<=hi;m+=60){
    const lab=el("div",null,String(Math.floor(m/60)).padStart(2,"0"));
    lab.style.cssText="position:absolute;right:6px;top:"+((m-lo)*PXM-5)+"px";
    tcol.appendChild(lab);
  }
  g.appendChild(tcol);

  w.forEach((d,i)=>{
    const col=el("div","gcol"+(isToday(d)?" today":"")); col.style.height=H+"px";
    for(let m=lo;m<=hi;m+=30){
      const l=el("div","hline"+(m%60?" half":"")); l.style.top=((m-lo)*PXM)+"px"; col.appendChild(l);
    }
    if(isToday(d)){
      const nm=nowMin();
      if(nm>=lo&&nm<=hi){const nl=el("div","nowline");nl.style.top=((nm-lo)*PXM)+"px";col.appendChild(nl);}
    }
    all.filter(e=>e.day===i).forEach(e=>{
      const c=CAT(e.category);
      const b=el("div","blk"+(e.done?" done":""));
      b.style.top=((e.start-lo)*PXM)+"px";
      b.style.height=Math.max(20,(e.end-e.start)*PXM-2)+"px";
      b.style.background=c.c;
      const tall=(e.end-e.start)*PXM>34;
      b.innerHTML=esc(e.title)+(tall?'<span class="t">'+fmt(e.start)+"–"+fmt(e.end)+'</span>':"");
      b.onclick=()=>openForm(e);
      col.appendChild(b);
    });
    col.addEventListener("click",ev=>{
      if(ev.target!==col) return;
      const y=ev.offsetY, m=Math.round((lo+y/PXM)/30)*30;
      openForm(null,{day:i,start:Math.min(m,hi-60),end:Math.min(m+60,hi)});
    });
    g.appendChild(col);
  });

  wrap.appendChild(g); app.appendChild(wrap);
  app.appendChild(el("div","hint","Toca un espacio vacío para crear ahí · toca un bloque para editarlo · desliza de lado para ver todos los días"));
}

/* ═══════════ VIEW: RESUMEN ═══════════ */
function renderStats(app){
  const all=weekEvents();
  const total=all.reduce((s,e)=>s+(e.end-e.start),0);
  const done=all.filter(e=>e.done).length;

  const cards=el("div","cards");
  cards.innerHTML=
    '<div class="card"><div class="v">'+all.length+'</div><div class="l">actividades</div></div>'+
    '<div class="card"><div class="v">'+(total?dur(total):"0h")+'</div><div class="l">tiempo ocupado</div></div>'+
    '<div class="card"><div class="v">'+(all.length?Math.round(done/all.length*100):0)+'%</div><div class="l">completado</div></div>';
  app.appendChild(cards);

  if(!all.length){
    app.appendChild(el("div","empty",'<div class="big">◌</div><p>Nada que resumir todavía</p><small>Agrega actividades y aquí verás en qué se te va la semana</small>'));
    return;
  }

  // por categoría
  const stats=CATS.map(c=>{
    const ev=all.filter(e=>e.category===c.id);
    return Object.assign({},c,{min:ev.reduce((s,e)=>s+(e.end-e.start),0),n:ev.length});
  }).filter(c=>c.min>0).sort((a,b)=>b.min-a.min);
  const max=Math.max.apply(null,stats.map(s=>s.min));

  app.appendChild(el("h3","sec","En qué usas tu tiempo"));
  stats.forEach(s=>{
    const b=el("div","bar");
    b.innerHTML='<div class="top"><span class="nm">'+s.ic+" "+s.nm+'</span><span class="vl">'+dur(s.min)+" · "+s.n+'</span></div>'+
      '<div class="track"><div class="fill" style="width:'+(s.min/max*100)+'%;background:'+s.c+'"></div></div>';
    app.appendChild(b);
  });

  const sp=el("div","split");
  stats.forEach(s=>{
    const p=Math.round(s.min/total*100);
    const d=el("div",null,p>=9?p+"%":"");
    d.style.cssText="flex:"+s.min+";background:"+s.c;
    sp.appendChild(d);
  });
  app.appendChild(sp);
  const lg=el("div","legend");
  stats.forEach(s=>lg.appendChild(el("span",null,'<i style="background:'+s.c+'"></i>'+s.nm+" "+Math.round(s.min/total*100)+"%")));
  app.appendChild(lg);

  // carga por día
  app.appendChild(el("h3","sec","Carga por día"));
  const perDay=Array.from({length:7},(_,i)=>all.filter(e=>e.day===i).reduce((s,e)=>s+(e.end-e.start),0));
  const mx=Math.max.apply(null,perDay)||1;
  const bz=el("div","busy");
  perDay.forEach(v=>{const b=el("div","b");b.innerHTML='<i style="height:'+(v/mx*100)+'%"></i>';bz.appendChild(b);});
  app.appendChild(bz);
  const bl=el("div","busylbl");
  perDay.forEach((v,i)=>bl.appendChild(el("span",null,DAYS_S[i]+"<br>"+(v?dur(v):"—"))));
  app.appendChild(bl);

  // observaciones honestas
  const obs=[];
  const busiest=perDay.indexOf(mx);
  const free=perDay.map((v,i)=>v===0?DAYS_L[i]:null).filter(Boolean);
  obs.push("Tu día más cargado es <b>"+DAYS_L[busiest]+"</b> con "+dur(mx)+".");
  if(free.length) obs.push("Sin nada programado: <b>"+free.join(", ")+"</b>.");
  const clashes=all.filter(e=>overlaps(all,e)).length;
  if(clashes) obs.push("Tienes <b>"+clashes+"</b> actividad"+(clashes!==1?"es":"")+" con horarios encimados.");
  if(mx>10*60) obs.push("Más de 10 h ocupadas en un solo día — revisa si es realista.");
  const o=el("div","hint"); o.style.cssText="margin-top:20px;line-height:1.8;font-size:12.5px";
  o.innerHTML=obs.join("<br>");
  app.appendChild(o);
}

/* ═══════════ MODAL BASE ═══════════ */
function closeModal(){ $("#modals").innerHTML=""; }
function modal(title,bodyHTML,footHTML){
  const ov=el("div","ov");
  ov.innerHTML='<div class="sheet"><div class="sh-head"><h2>'+title+'</h2><button class="x">×</button></div>'+
    '<div class="sh-body">'+bodyHTML+'</div><div class="sh-foot">'+(footHTML||"")+'</div></div>';
  ov.onclick=e=>{if(e.target===ov)closeModal();};
  ov.querySelector(".x").onclick=closeModal;
  $("#modals").innerHTML=""; $("#modals").appendChild(ov);
  return ov;
}

/* ═══════════ FORMULARIO ═══════════ */
function openForm(ev,pre){
  const editing=!!ev;
  const f=ev?Object.assign({},ev):{
    id:null,title:"",category:"escuela",day:(pre&&pre.day!=null)?pre.day:S.selDay,
    start:(pre&&pre.start)||8*60,end:(pre&&pre.end)||9*60,notes:"",done:false,gid:null
  };

  const body=
    '<label class="lb">Actividad</label>'+
    '<input type="text" id="fTitle" placeholder="Ej. Clase de Cálculo" value="'+esc(f.title)+'" maxlength="70">'+
    '<label class="lb">Categoría</label><div class="catgrid" id="fCats">'+
      CATS.map(c=>'<button class="catbtn'+(c.id===f.category?" on":"")+'" data-c="'+c.id+'" style="'+(c.id===f.category?"border-color:"+c.c+";background:"+c.c+"1F":"")+'"><span class="ic">'+c.ic+'</span><span class="nm">'+c.nm+'</span></button>').join("")+
    '</div>'+
    '<label class="lb">Día</label><div class="dayrow" id="fDays">'+
      DAYS_S.map((d,i)=>'<button class="daybtn'+(i===f.day?" on":"")+'" data-d="'+i+'">'+d+'</button>').join("")+
    '</div>'+
    '<div class="two"><div><label class="lb">Inicio</label><input type="time" id="fStart" step="300" value="'+fmt(f.start)+'"></div>'+
    '<div><label class="lb">Fin</label><input type="time" id="fEnd" step="300" value="'+fmt(f.end)+'"></div></div>'+
    '<div id="fWarn"></div>'+
    '<label class="lb">Notas (opcional)</label>'+
    '<textarea id="fNotes" placeholder="Salón 204, llevar calculadora…" maxlength="180">'+esc(f.notes)+'</textarea>'+
    (editing?"":
      '<label class="lb">Repetir</label><select id="fRep">'+
      '<option value="0">Solo esta semana</option><option value="4">4 semanas</option>'+
      '<option value="8">8 semanas</option><option value="16">16 semanas</option></select>')+
    (editing&&f.gid?'<div class="hint">Esta actividad es parte de una serie repetida.</div>':"");

  const foot=(editing?'<button class="b-del" id="fDel">Borrar</button>':"")+
    '<button class="b-main" id="fSave">'+(editing?"Guardar":"Agregar")+'</button>';

  const ov=modal(editing?"Editar actividad":"Nueva actividad",body,foot);
  const st=ov.querySelector("#fStart"), en=ov.querySelector("#fEnd");

  ov.querySelectorAll("#fCats .catbtn").forEach(b=>b.onclick=()=>{
    f.category=b.dataset.c;
    ov.querySelectorAll("#fCats .catbtn").forEach(x=>{
      const on=x.dataset.c===f.category, c=CAT(x.dataset.c);
      x.classList.toggle("on",on);
      x.style.cssText=on?("border-color:"+c.c+";background:"+c.c+"1F"):"";
    });
  });
  ov.querySelectorAll("#fDays .daybtn").forEach(b=>b.onclick=()=>{
    f.day=+b.dataset.d;
    ov.querySelectorAll("#fDays .daybtn").forEach(x=>x.classList.toggle("on",+x.dataset.d===f.day));
    checkWarn();
  });
  st.onchange=en.onchange=checkWarn;

  function checkWarn(){
    const a=toMin(st.value), b=toMin(en.value);
    const box=ov.querySelector("#fWarn"); box.innerHTML="";
    if(b<=a){ box.innerHTML='<div class="warnbox">La hora de fin debe ser posterior a la de inicio.</div>'; return; }
    const test={id:f.id,day:f.day,start:a,end:b};
    const clash=weekEvents().filter(o=>o.id!==f.id&&o.day===f.day&&a<o.end&&o.start<b);
    if(clash.length) box.innerHTML='<div class="warnbox">Se encima con: '+clash.map(c=>esc(c.title)+" ("+fmt(c.start)+"–"+fmt(c.end)+")").join(", ")+'. Puedes guardarlo igual.</div>';
  }
  checkWarn();

  ov.querySelector("#fSave").onclick=()=>{
    const title=ov.querySelector("#fTitle").value.trim();
    const a=toMin(st.value), b=toMin(en.value);
    if(!title){ toast("Ponle un nombre a la actividad"); return; }
    if(b<=a){ toast("La hora de fin debe ser mayor"); return; }
    const base={title:title,category:f.category,day:f.day,start:a,end:b,notes:ov.querySelector("#fNotes").value.trim()};

    if(editing){
      const k=keyOf(S.cursor);
      setWeekEvents(k,(S.events[k]||[]).map(e=>e.id===f.id?Object.assign({},e,base):e));
      toast("Actualizado");
    }else{
      const rep=+(ov.querySelector("#fRep")||{value:0}).value;
      const gid=rep>0?uid():null;
      for(let i=0;i<Math.max(1,rep);i++){
        const k=keyOf(shiftWeeks(S.cursor,i));
        const arr=(S.events[k]||[]).slice();
        arr.push(Object.assign({id:uid(),done:false,gid:gid},base));
        S.events[k]=arr;
      }
      save();
      toast(rep>0?("Agregado en "+rep+" semanas"):"Agregado");
      S.selDay=f.day;
    }
    closeModal(); render();
  };

  const delBtn=ov.querySelector("#fDel");
  if(delBtn) delBtn.onclick=()=>confirmDelete(f);

  setTimeout(()=>{const t=ov.querySelector("#fTitle"); if(!editing) t.focus();},120);
}

function confirmDelete(f){
  const serie=!!f.gid;
  const ov=modal("¿Borrar actividad?",
    '<p style="font-size:14px;color:var(--muted);margin:8px 0 0">“'+esc(f.title)+'”'+(serie?" es parte de una serie repetida.":"")+' Esta acción no se puede deshacer.</p>'+
    (serie?'<button class="b-full" id="dAll">Borrar toda la serie</button>':""),
    '<button class="b-ghost" id="dNo" style="flex:1">Cancelar</button><button class="b-del" id="dYes" style="flex:1">Borrar</button>');
  ov.querySelector("#dNo").onclick=closeModal;
  ov.querySelector("#dYes").onclick=()=>{
    const k=keyOf(S.cursor);
    setWeekEvents(k,(S.events[k]||[]).filter(e=>e.id!==f.id));
    closeModal(); render(); toast("Borrado");
  };
  const all=ov.querySelector("#dAll");
  if(all) all.onclick=()=>{
    Object.keys(S.events).forEach(k=>{S.events[k]=S.events[k].filter(e=>e.gid!==f.gid);});
    save(); closeModal(); render(); toast("Serie borrada");
  };
}

/* ═══════════ ACCIONES ═══════════ */
function buildText(){
  const w=weekDates(S.cursor), all=sortEv(weekEvents());
  let out="MI HORARIO · "+w[0].getDate()+" "+MONTHS[w[0].getMonth()]+" – "+w[6].getDate()+" "+MONTHS[w[6].getMonth()]+"\n";
  out+="─".repeat(34)+"\n";
  if(!all.length) return out+"(sin actividades esta semana)";
  DAYS_L.forEach((dn,i)=>{
    const ev=all.filter(e=>e.day===i);
    if(!ev.length) return;
    out+="\n"+dn.toUpperCase()+" "+w[i].getDate()+"\n";
    ev.forEach(e=>{out+="  "+fmt(e.start)+"–"+fmt(e.end)+"  "+CAT(e.category).ic+" "+e.title+(e.notes?"  ("+e.notes+")":"")+"\n";});
  });
  return out;
}

function actCopy(){
  const txt=buildText();
  const ov=modal("Copiar horario",
    '<p class="hint" style="margin:6px 0 10px">Texto listo para WhatsApp, Discord o notas.</p>'+
    '<textarea id="cpT" style="min-height:230px;font-family:var(--mono);font-size:11px;line-height:1.5">'+esc(txt)+'</textarea>',
    '<button class="b-main" id="cpB">Copiar todo</button>');
  ov.querySelector("#cpB").onclick=()=>{
    const t=ov.querySelector("#cpT"); t.select(); t.setSelectionRange(0,99999);
    try{ if(navigator.clipboard) navigator.clipboard.writeText(txt); else document.execCommand("copy"); toast("Copiado"); }
    catch(e){ toast("Selecciónalo y copia manualmente"); }
  };
}

function actPrint(){
  const w=weekDates(S.cursor), all=sortEv(weekEvents());
  let h='<h1>Mi Horario</h1><div class="sub">'+w[0].getDate()+" "+MONTHS[w[0].getMonth()]+" – "+w[6].getDate()+" "+MONTHS[w[6].getMonth()]+" "+w[6].getFullYear()+'</div>';
  if(!all.length) h+="<p>Sin actividades esta semana.</p>";
  DAYS_L.forEach((dn,i)=>{
    const ev=all.filter(e=>e.day===i); if(!ev.length) return;
    h+='<div class="pd"><h4>'+dn+" "+w[i].getDate()+"</h4>";
    ev.forEach(e=>{h+='<div class="pr"><div class="pt">'+fmt(e.start)+" – "+fmt(e.end)+'</div><div><b>'+esc(e.title)+"</b>"+(e.notes?'<div class="pn">'+esc(e.notes)+"</div>":"")+"</div></div>";});
    h+="</div>";
  });
  $("#printsheet").innerHTML=h;
  setTimeout(()=>window.print(),120);
}

function actDupDay(){
  const w=weekDates(S.cursor);
  const src=S.selDay, n=weekEvents().filter(e=>e.day===src).length;
  if(!n){ toast("Ese día está vacío"); return; }
  const ov=modal("Duplicar día",
    '<p class="hint" style="margin:6px 0 14px">Copiar las <b>'+n+'</b> actividades de <b>'+DAYS_L[src]+'</b> a:</p>'+
    '<div class="dayrow" id="dpD">'+DAYS_S.map((d,i)=>'<button class="daybtn" data-d="'+i+'"'+(i===src?' disabled style="opacity:.3"':"")+'>'+d+'</button>').join("")+'</div>'+
    '<p class="hint">Puedes elegir varios días.</p>',
    '<button class="b-ghost" id="dpC" style="flex:1">Cancelar</button><button class="b-main" id="dpOK">Duplicar</button>');
  const sel=new Set();
  ov.querySelectorAll("#dpD .daybtn").forEach(b=>{
    if(b.disabled) return;
    b.onclick=()=>{const i=+b.dataset.d; sel.has(i)?sel.delete(i):sel.add(i); b.classList.toggle("on");};
  });
  ov.querySelector("#dpC").onclick=closeModal;
  ov.querySelector("#dpOK").onclick=()=>{
    if(!sel.size){ toast("Elige al menos un día"); return; }
    const k=keyOf(S.cursor), arr=(S.events[k]||[]).slice();
    const src_ev=arr.filter(e=>e.day===src);
    sel.forEach(t=>src_ev.forEach(e=>arr.push(Object.assign({},e,{id:uid(),day:t,done:false,gid:null}))));
    setWeekEvents(k,arr); closeModal(); render(); toast("Duplicado a "+sel.size+" día(s)");
  };
}

function actNextWeek(){
  const src=weekEvents();
  if(!src.length){ toast("Esta semana está vacía"); return; }
  const ov=modal("Copiar a la próxima semana",
    '<p class="hint" style="margin:6px 0 0">Se copiarán <b>'+src.length+'</b> actividades a la semana siguiente. Lo que ya exista ahí se conserva.</p>',
    '<button class="b-ghost" id="nwC" style="flex:1">Cancelar</button><button class="b-main" id="nwOK">Copiar</button>');
  ov.querySelector("#nwC").onclick=closeModal;
  ov.querySelector("#nwOK").onclick=()=>{
    const nk=keyOf(shiftWeeks(S.cursor,1));
    const arr=(S.events[nk]||[]).slice();
    src.forEach(e=>arr.push(Object.assign({},e,{id:uid(),done:false,gid:null})));
    S.events[nk]=arr; save();
    S.cursor=shiftWeeks(S.cursor,1);
    closeModal(); render(); toast("Copiado — ahora estás en esa semana");
  };
}

function actClear(){
  if(!weekEvents().length){ toast("Ya está vacía"); return; }
  const ov=modal("Limpiar semana",
    '<p class="hint" style="margin:6px 0 0">Se borrarán las <b>'+weekEvents().length+'</b> actividades de esta semana. No se puede deshacer.</p>',
    '<button class="b-ghost" id="clC" style="flex:1">Cancelar</button><button class="b-del" id="clOK" style="flex:1">Borrar todo</button>');
  ov.querySelector("#clC").onclick=closeModal;
  ov.querySelector("#clOK").onclick=()=>{ setWeekEvents(keyOf(S.cursor),[]); closeModal(); render(); toast("Semana limpiada"); };
}

function actBackup(){
  const json=JSON.stringify(S.events);
  const ov=modal("Respaldo",
    '<p class="hint" style="margin:6px 0 10px">Copia este texto y guárdalo donde quieras. Para restaurar, pega un respaldo aquí y toca Restaurar.</p>'+
    '<textarea id="bkT" style="min-height:170px;font-family:var(--mono);font-size:10px">'+esc(json)+'</textarea>'+
    '<button class="b-full" id="bkR">Restaurar desde el texto de arriba</button>'+
    '<p class="hint">Restaurar reemplaza <b>todo</b> tu horario actual.</p>',
    '<button class="b-main" id="bkC">Copiar respaldo</button>');
  ov.querySelector("#bkC").onclick=()=>{
    const t=ov.querySelector("#bkT"); t.select();
    try{ if(navigator.clipboard) navigator.clipboard.writeText(t.value); else document.execCommand("copy"); toast("Respaldo copiado"); }
    catch(e){ toast("Selecciónalo y copia manualmente"); }
  };
  ov.querySelector("#bkR").onclick=()=>{
    try{
      const d=JSON.parse(ov.querySelector("#bkT").value);
      if(typeof d!=="object"||Array.isArray(d)||d===null) throw 0;
      S.events=d; save(); closeModal(); render(); toast("Horario restaurado");
    }catch(e){ toast("Ese texto no es un respaldo válido"); }
  };
}

/* ═══════════ EVENTOS GLOBALES ═══════════ */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.view=b.dataset.view;render();});
$("#prevW").onclick=()=>{S.cursor=shiftWeeks(S.cursor,-1);render();};
$("#nextW").onclick=()=>{S.cursor=shiftWeeks(S.cursor,1);render();};
$("#btnToday").onclick=()=>{S.cursor=new Date();S.selDay=todayIdx();render();};
$("#fab").onclick=()=>openForm(null);
$("#aPrint").onclick=actPrint;
$("#aCopy").onclick=actCopy;
$("#aDup").onclick=actDupDay;
$("#aNextWeek").onclick=actNextWeek;
$("#aClear").onclick=actClear;
$("#aBackup").onclick=actBackup;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

/* refresca el "ahora" cada minuto */
setInterval(()=>{ if(S.view!=="stats") render(); },60000);

/* ═══════════ INIT ═══════════ */
S.selDay=todayIdx();
render();
load().then(render);

})();
</script>
</body>
</html>
