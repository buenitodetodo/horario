<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Horario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600;700&family=Sometype+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   MI HORARIO
   Lenguaje visual: diagrama de línea de transporte.
   Un día es una secuencia lineal de paradas con duraciones
   distintas y huecos entre ellas — la línea lo dice literal.
   Papel de mapa impreso + tintas de señalética.
   ═══════════════════════════════════════════════════════════ */

:root{
  /* Papel y tinta ---------------------------------------- */
  --paper:      #E6E4DC;   /* stock del mapa doblado */
  --card:       #F5F3EE;   /* recuadro impreso encima */
  --card-2:     #EFEDE6;
  --ink:        #171613;   /* tinta negra cálida */
  --ink-2:      #56534B;   /* tinta secundaria */
  --ink-3:      #8A867B;   /* tinta desvanecida */
  --rule:       #C4C0B4;   /* filete */
  --rule-soft:  #D6D2C7;
  --focus:      #2B5FCB;

  /* Tintas de línea — señalética esmaltada ---------------- */
  --l-escuela:   #D0356A;  /* rosa mexicano */
  --l-robotica:  #2B5FCB;
  --l-estudio:   #00857A;
  --l-ejercicio: #DD5F14;
  --l-personal:  #7742AE;
  --l-social:    #B08800;
  --l-ocio:      #0B8038;
  --l-descanso:  #6E7480;

  --rail: 22px;   /* ancho de la columna de la línea */
  --clock: 48px;  /* ancho de la columna de horas */

  --f-disp: 'Archivo','Archivo Black',system-ui,sans-serif;
  --f-body: 'Instrument Sans','Helvetica Neue',system-ui,sans-serif;
  --f-num:  'Sometype Mono',ui-monospace,'SFMono-Regular',monospace;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;line-height:1.45;
  padding-bottom:92px;
  /* trama fina de papel */
  background-image:
    repeating-linear-gradient(0deg,rgba(23,22,19,.014) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(23,22,19,.014) 0 1px,transparent 1px 3px);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:0}
::-webkit-scrollbar-track{background:transparent}

.eyebrow{font-family:var(--f-num);font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-disp);font-variation-settings:'wdth' 118;font-weight:800;letter-spacing:-.012em;text-transform:uppercase}

/* ─── Cabecera ─────────────────────────────────────────── */
.masthead{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--ink);padding:13px 18px 0;
}
.mast-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}
.wordmark{font-family:var(--f-disp);font-variation-settings:'wdth' 112;font-weight:800;font-size:15px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.wordmark em{font-style:normal;color:var(--l-escuela)}
#saveflag{white-space:nowrap}

.weekbar{display:flex;align-items:stretch;gap:0;border:1px solid var(--rule);background:var(--card);margin-bottom:12px}
.weekbar button.step{width:38px;flex:none;font-size:15px;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.weekbar button.step:active{background:var(--card-2)}
.weekbar .range{flex:1;text-align:center;padding:7px 4px;border-left:1px solid var(--rule);border-right:1px solid var(--rule);line-height:1.25}
.weekbar .range b{display:block;font-family:var(--f-num);font-size:12px;font-weight:500;letter-spacing:.01em}
.weekbar button.now{
  flex:none;padding:0 13px;background:var(--ink);color:var(--paper);
  font-family:var(--f-num);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
}

.tabbar{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{
  padding:0 0 9px;font-family:var(--f-num);font-size:10.5px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
}
.tabbar button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}

/* ─── Barra de utilidades ──────────────────────────────── */
.utils{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule-soft);background:var(--card)}
.utils::-webkit-scrollbar{display:none}
.utils button{
  flex:none;padding:10px 15px;font-family:var(--f-num);font-size:10px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);
  border-right:1px solid var(--rule-soft);white-space:nowrap;
}
.utils button:active{background:var(--card-2)}
.utils button.lead{color:var(--l-robotica);font-weight:700}
.utils button.risk{color:var(--l-escuela)}

main{padding:20px 18px 0;max-width:940px;margin:0 auto}

/* ─── Selector de día: fichas de andén ─────────────────── */
.platform{display:grid;grid-template-columns:repeat(7,1fr);gap:0;border:1px solid var(--rule);margin-bottom:26px;background:var(--card)}
.platform button{
  padding:8px 2px 7px;text-align:center;border-right:1px solid var(--rule-soft);position:relative;
}
.platform button:last-child{border-right:none}
.platform .pd{font-family:var(--f-num);font-size:8.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block}
.platform .pn{font-family:var(--f-num);font-size:16px;font-weight:500;color:var(--ink-2);display:block;line-height:1.25}
.platform .pc{display:block;height:3px;margin:3px auto 0;width:16px;background:transparent}
.platform button.has .pc{background:var(--ink-3)}
.platform button.today .pn{color:var(--l-escuela);font-weight:700}
.platform button[aria-pressed="true"]{background:var(--ink)}
.platform button[aria-pressed="true"] .pd{color:rgba(230,228,220,.6)}
.platform button[aria-pressed="true"] .pn{color:var(--paper);font-weight:700}
.platform button[aria-pressed="true"] .pc{background:var(--paper)}

/* ─── Encabezado del día ───────────────────────────────── */
.dayline{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:7px;margin-bottom:5px}
.dayline h2{margin:0;font-size:clamp(27px,8.5vw,42px);line-height:.92}
.dayline .stamp{font-family:var(--f-num);font-size:26px;font-weight:500;line-height:1;color:var(--ink-2);flex:none}
.daymeta{display:flex;flex-wrap:wrap;gap:0 14px;margin-bottom:22px}
.daymeta span{font-family:var(--f-num);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.daymeta b{color:var(--ink-2);font-weight:500}

.bulletin{
  display:flex;gap:10px;align-items:baseline;
  border-left:3px solid var(--ink);background:var(--card);
  padding:10px 13px;margin-bottom:22px;font-size:13px;color:var(--ink-2);
}
.bulletin .lbl{font-family:var(--f-num);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);flex:none}
.bulletin b{color:var(--ink);font-weight:600}

/* ─── LA LÍNEA — elemento firma ────────────────────────── */
.diagram{margin-bottom:8px}
.stop,.void{display:grid;grid-template-columns:var(--clock) var(--rail) 1fr;column-gap:12px}

.clock{text-align:right;padding-top:1px}
.clock .t1{font-family:var(--f-num);font-size:11.5px;font-weight:500;display:block;line-height:1.3}
.clock .t2{font-family:var(--f-num);font-size:11.5px;color:var(--ink-3);display:block;line-height:1.3}
.clock .t2::before{content:'';display:block;width:9px;height:1px;background:var(--rule);margin:4px 0 4px auto}

.rail{position:relative;display:flex;justify-content:center}
.seg{width:9px;border-radius:5px;flex:none}
.dash{width:0;border-left:2px dotted var(--rule);flex:none;margin:3px 0}
.node{
  position:absolute;left:50%;width:13px;height:13px;margin-left:-6.5px;
  border-radius:50%;background:var(--card);border:3px solid currentColor;
}
.node.a{top:-1px}
.node.b{bottom:-1px}
.here{position:absolute;left:50%;margin-left:-15px;width:30px;height:2px;background:var(--ink);z-index:3}
.here::before{
  content:'';position:absolute;left:-1px;top:-4px;
  border-left:8px solid var(--ink);border-top:5px solid transparent;border-bottom:5px solid transparent;
}

.stop{margin-bottom:0}
.stop .plate{
  background:var(--card);border:1px solid var(--rule);
  padding:11px 13px 12px;margin-bottom:9px;
}
.stop.is-done .plate{background:transparent;border-style:dashed}
.stop.is-done .pt-name{text-decoration:line-through;color:var(--ink-3)}
.plate-hd{display:flex;align-items:flex-start;gap:9px}
.glyph{
  width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;
  color:#fff;border-radius:3px;
}
.glyph svg{width:16px;height:16px;display:block}
.pt-txt{flex:1;min-width:0}
.pt-name{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.25;word-break:break-word}
.pt-sub{display:flex;flex-wrap:wrap;gap:0 9px;margin-top:2px}
.pt-sub span{font-family:var(--f-num);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.pt-note{font-size:12.5px;color:var(--ink-2);margin-top:6px;padding-left:35px;word-break:break-word}
.tick{
  flex:none;width:22px;height:22px;border:1.5px solid var(--rule);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--card);margin-top:2px;
}
.tick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.tick svg{width:11px;height:11px}

.tag{font-family:var(--f-num);font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:1px 5px;border:1px solid currentColor}
.tag.fixed{color:var(--l-robotica)}
.tag.edited{color:var(--l-ejercicio)}
.tag.live{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag.crash{color:var(--l-escuela)}

.void .vlabel{
  display:flex;align-items:center;gap:9px;padding:9px 0;
  font-family:var(--f-num);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
}
.void .vlabel::after{content:'';flex:1;height:1px;background:var(--rule-soft)}
.void .vlabel b{color:var(--ink-2);font-weight:500}
.terminus{display:grid;grid-template-columns:var(--clock) var(--rail) 1fr;column-gap:12px;margin-top:2px}
.terminus .cap{width:11px;height:11px;border-radius:50%;background:var(--rule);margin:0 auto}
.terminus .tx{font-family:var(--f-num);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding-top:-1px}

/* ─── Vacíos ───────────────────────────────────────────── */
.blank{border:1px dashed var(--rule);padding:38px 22px;text-align:center;background:var(--card)}
.blank h3{font-family:var(--f-disp);font-variation-settings:'wdth' 105;font-weight:700;text-transform:uppercase;font-size:16px;margin:0 0 6px;letter-spacing:.01em}
.blank p{margin:0;font-size:13px;color:var(--ink-2);max-width:34ch;margin-inline:auto;line-height:1.6}

/* ─── Rejilla semanal ──────────────────────────────────── */
.sheet-wrap{overflow-x:auto;border:1px solid var(--ink);background:var(--card)}
.sheet{display:grid;grid-template-columns:40px repeat(7,minmax(88px,1fr));min-width:648px}
.sh-cap{position:sticky;top:0;left:0;z-index:6;background:var(--ink)}
.sh-day{
  position:sticky;top:0;z-index:5;background:var(--ink);color:var(--paper);
  padding:7px 3px 8px;text-align:center;border-left:1px solid rgba(230,228,220,.16);
}
.sh-day .d{font-family:var(--f-num);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.62;display:block}
.sh-day .n{font-family:var(--f-num);font-size:14px;font-weight:500;display:block;line-height:1.25}
.sh-day.today .n{color:#fff;font-weight:700}
.sh-day.today .n::after{content:'';display:block;width:14px;height:2px;background:var(--l-escuela);margin:2px auto 0}
.sh-hours{position:sticky;left:0;z-index:4;background:var(--card);border-right:1px solid var(--rule);position:relative}
.sh-hours i{position:absolute;right:5px;font-family:var(--f-num);font-size:9px;font-style:normal;color:var(--ink-3)}
.sh-col{position:relative;border-left:1px solid var(--rule-soft)}
.sh-col.today{background:rgba(208,53,106,.035)}
.sh-rule{position:absolute;left:0;right:0;border-top:1px solid var(--rule-soft)}
.sh-rule.h{border-color:var(--rule)}
.sh-blk{position:absolute;left:4px;right:4px;border-radius:5px;padding:4px 6px;color:#fff;overflow:hidden;line-height:1.2}
.sh-blk b{font-size:10.5px;font-weight:600;display:block}
.sh-blk i{font-family:var(--f-num);font-size:8.5px;font-style:normal;opacity:.82;display:block}
.sh-blk.done{opacity:.4}
.sh-blk.fix{border-left:3px solid rgba(255,255,255,.75);padding-left:5px}
.sh-now{position:absolute;left:0;right:0;height:2px;background:var(--ink);z-index:8}
.sh-now::before{content:'';position:absolute;left:0;top:-4px;border-left:7px solid var(--ink);border-top:5px solid transparent;border-bottom:5px solid transparent}
.caption{font-family:var(--f-num);font-size:9.5px;letter-spacing:.06em;color:var(--ink-3);margin-top:9px;line-height:1.7}

/* ─── Base ─────────────────────────────────────────────── */
.brief{border:1px solid var(--l-robotica);border-left-width:3px;background:var(--card);padding:13px 15px;margin-bottom:24px;font-size:13px;color:var(--ink-2);line-height:1.6}
.brief b{color:var(--ink)}
.bgroup{margin-bottom:24px}
.bgroup h4{display:flex;align-items:baseline;gap:10px;margin:0 0 9px;font-family:var(--f-num);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.bgroup h4::after{content:'';flex:1;height:1px;background:var(--rule)}
.bgroup h4 em{font-style:normal;color:var(--ink-3);flex:none}
.brow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);padding:10px 12px;margin-bottom:7px}
.brow:active{background:var(--card-2)}
.brow .bt{font-family:var(--f-num);font-size:10.5px;color:var(--ink-3);flex:none;width:44px;padding-top:4px;line-height:1.35}

/* ─── Resumen ──────────────────────────────────────────── */
.ledger{border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);margin-bottom:26px}
.lrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.lrow:last-child{border-bottom:none}
.lrow .lk{font-family:var(--f-num);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.lrow .lv{font-family:var(--f-num);font-size:17px;font-weight:500}
.meter{margin-bottom:15px}
.meter .mh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.meter .mn{font-size:13.5px;font-weight:600;flex:1}
.meter .mv{font-family:var(--f-num);font-size:10px;color:var(--ink-3);letter-spacing:.06em}
.meter .mt{height:7px;background:var(--card-2);border:1px solid var(--rule-soft)}
.meter .mf{height:100%}
.mini{width:15px;height:15px;flex:none;border-radius:2px;display:flex;align-items:center;justify-content:center;color:#fff}
.mini svg{width:10px;height:10px}
.ribbon{display:flex;border:1px solid var(--ink);margin-bottom:10px}
.ribbon div{height:26px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-num);font-size:9.5px;font-weight:700;min-width:0}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:28px}
.key span{display:flex;align-items:center;gap:6px;font-family:var(--f-num);font-size:10px;letter-spacing:.05em;color:var(--ink-2)}
.key i{width:9px;height:9px;flex:none}
.loadchart{display:flex;gap:6px;align-items:flex-end;height:74px;border-bottom:1px solid var(--ink);margin-bottom:6px}
.loadchart .lb{flex:1;position:relative;height:100%}
.loadchart .lb i{position:absolute;bottom:0;left:0;right:0;background:var(--ink)}
.loadchart .lb.pk i{background:var(--l-escuela)}
.loadkey{display:flex;gap:6px;margin-bottom:24px}
.loadkey span{flex:1;text-align:center;font-family:var(--f-num);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);line-height:1.6}
.notes{border-left:3px solid var(--rule);padding-left:13px}
.notes p{margin:0 0 7px;font-size:13px;color:var(--ink-2);line-height:1.55}
.notes p:last-child{margin-bottom:0}
.notes b{color:var(--ink);font-weight:600}

/* ─── Acción principal ─────────────────────────────────── */
.compose{
  position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:50;
  background:var(--ink);color:var(--paper);padding:14px 26px;
  font-family:var(--f-num);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  box-shadow:4px 4px 0 rgba(23,22,19,.16);
}
.compose:active{transform:translateX(-50%) translate(2px,2px);box-shadow:2px 2px 0 rgba(23,22,19,.16)}

/* ─── Diálogos ─────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(23,22,19,.42);display:flex;align-items:flex-end;justify-content:center;animation:in .14s ease}
@media(min-width:640px){.scrim{align-items:center;padding:20px}}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(22px)}to{transform:translateY(0)}}
@keyframes turn{to{transform:rotate(360deg)}}
.dialog{
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  background:var(--paper);border:1px solid var(--ink);border-bottom:none;
  animation:rise .2s cubic-bezier(.2,.9,.3,1);
}
@media(min-width:640px){.dialog{border-bottom:1px solid var(--ink);box-shadow:6px 6px 0 rgba(23,22,19,.14)}}
.dg-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 20px;border-bottom:1px solid var(--ink);position:sticky;top:0;background:var(--paper);z-index:2}
.dg-hd h2{margin:0;font-family:var(--f-disp);font-variation-settings:'wdth' 108;font-weight:700;font-size:14px;letter-spacing:.03em;text-transform:uppercase}
.dg-hd button{width:28px;height:28px;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;flex:none}
.dg-hd button svg{width:11px;height:11px}
.dg-bd{padding:4px 20px 20px}
.dg-ft{display:flex;gap:8px;padding:12px 20px 20px;position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--rule-soft)}

.field{display:block;font-family:var(--f-num);font-size:9.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 7px}
.dg-bd input[type=text],.dg-bd input[type=time],.dg-bd textarea{
  width:100%;background:var(--card);border:1px solid var(--rule);border-radius:0;
  padding:11px 12px;font-size:14.5px;outline:none;transition:border-color .12s;
}
.dg-bd input:focus,.dg-bd textarea:focus{border-color:var(--ink)}
.dg-bd input[type=time]{font-family:var(--f-num);font-size:15px}
.dg-bd textarea{resize:vertical;min-height:56px;font-size:14px;line-height:1.5}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:11px}

.lines{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lines button{border:1px solid var(--rule);background:var(--card);padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px}
.lines button .mini{width:19px;height:19px}
.lines button .mini svg{width:12px;height:12px}
.lines button span{font-family:var(--f-num);font-size:8.5px;letter-spacing:.05em;color:var(--ink-3);text-transform:uppercase}
.lines button[aria-pressed="true"]{border-color:var(--ink);border-width:2px;padding:8px 1px 6px}
.lines button[aria-pressed="true"] span{color:var(--ink);font-weight:700}

.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week7 button{border:1px solid var(--rule);background:var(--card);padding:10px 1px;font-family:var(--f-num);font-size:10.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.week7 button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.week7 button:disabled{opacity:.32}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.duo button{border:1px solid var(--rule);background:var(--card);padding:11px 8px;text-align:left;line-height:1.3}
.duo button strong{display:block;font-size:13px;font-weight:600}
.duo button em{display:block;font-style:normal;font-family:var(--f-num);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.duo button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.duo button[aria-pressed="true"] strong{color:var(--paper)}
.duo button[aria-pressed="true"] em{color:rgba(230,228,220,.6)}

.aside{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.6}
.aside b{color:var(--ink-2);font-weight:600}
.alarm{border:1px solid var(--l-escuela);border-left-width:3px;background:rgba(208,53,106,.05);padding:9px 12px;margin-top:12px;font-size:12.5px;color:var(--ink-2);line-height:1.5}

.act{padding:13px 18px;font-family:var(--f-num);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;border:1px solid var(--ink)}
.act.solid{flex:1;background:var(--ink);color:var(--paper)}
.act.blue{flex:1;background:var(--l-robotica);color:#fff;border-color:var(--l-robotica)}
.act.quiet{background:transparent;color:var(--ink-2);border-color:var(--rule)}
.act.danger{color:var(--l-escuela);border-color:var(--l-escuela);background:transparent}
.wide{display:block;width:100%;margin-top:8px;padding:13px;text-align:center;border:1px solid var(--rule);background:var(--card);font-size:13.5px;font-weight:600}
.wide:active{background:var(--card-2)}

.route{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);padding:14px;margin-bottom:8px}
.route:active{border-color:var(--ink)}
.route .rn{font-family:var(--f-num);font-size:11px;font-weight:700;color:var(--ink-3);flex:none;width:16px}
.route strong{display:block;font-size:14px;font-weight:600}
.route span{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.4;margin-top:2px}
.wheel{width:30px;height:30px;border:2px solid var(--rule);border-top-color:var(--ink);border-radius:50%;animation:turn .8s linear infinite;margin:0 auto}
.pick{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);padding:10px 12px;margin-bottom:6px}
.pick .box{width:17px;height:17px;border:1.5px solid var(--rule);flex:none;margin-top:3px;display:flex;align-items:center;justify-content:center;color:var(--paper)}
.pick .box svg{width:10px;height:10px}
.pick[aria-pressed="true"] .box{background:var(--ink);border-color:var(--ink)}
.pick .pmeta{font-family:var(--f-num);font-size:9.5px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.pick .pname{font-size:14px;font-weight:600;margin-top:1px}
#uploader{display:none}

#flash{
  position:fixed;left:50%;transform:translateX(-50%);bottom:82px;z-index:200;
  background:var(--ink);color:var(--paper);padding:11px 18px;
  font-family:var(--f-num);font-size:11px;letter-spacing:.05em;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center;
}
#flash.up{opacity:1}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ─── Impresión ────────────────────────────────────────── */
#sheetprint{display:none}
@media print{
  body{background:#fff;padding:0;background-image:none}
  .masthead,.utils,.compose,main,.scrim,#flash{display:none!important}
  #sheetprint{display:block}
  #sheetprint h1{font-family:var(--f-disp);font-variation-settings:'wdth' 115;font-weight:800;text-transform:uppercase;font-size:19px;margin:0 0 2px}
  #sheetprint .pr-sub{font-family:var(--f-num);font-size:10px;color:#555;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:15px}
  #sheetprint .pr-day{break-inside:avoid;margin-bottom:13px}
  #sheetprint .pr-day h4{font-family:var(--f-num);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 5px;border-bottom:1px solid #999;padding-bottom:3px}
  #sheetprint .pr-line{display:flex;gap:12px;padding:3px 0;font-size:12px}
  #sheetprint .pr-t{font-family:var(--f-num);font-size:10.5px;width:92px;flex:none;color:#333}
  #sheetprint .pr-n{font-size:10.5px;color:#666}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="mast-top">
    <h1 class="wordmark">Mi<em>Horario</em></h1>
    <span class="eyebrow" id="saveflag">Se guarda solo</span>
  </div>
  <div class="weekbar">
    <button class="step" id="back" aria-label="Semana anterior">‹</button>
    <div class="range"><b id="span">—</b><span class="eyebrow" id="spanNote">—</span></div>
    <button class="step" id="fwd" aria-label="Semana siguiente">›</button>
    <button class="now" id="jump">Hoy</button>
  </div>
  <nav class="tabbar" role="tablist">
    <button role="tab" data-view="day" aria-selected="true">Día</button>
    <button role="tab" data-view="week" aria-selected="false">Semana</button>
    <button role="tab" data-view="base" aria-selected="false">Fijo</button>
    <button role="tab" data-view="stats" aria-selected="false">Balance</button>
  </nav>
</header>

<div class="utils">
  <button id="uImport" class="lead">Importar</button>
  <button id="uPrint">Imprimir</button>
  <button id="uCopy">Copiar</button>
  <button id="uDup">Duplicar día</button>
  <button id="uBackup">Respaldo</button>
  <button id="uClear" class="risk">Vaciar semana</button>
</div>

<main id="stage"></main>
<button class="compose" id="compose">Agregar actividad</button>
<input type="file" id="uploader" accept="image/*,.csv,.txt,.json">
<div id="dialogs"></div>
<div id="flash" role="status" aria-live="polite"></div>
<div id="sheetprint"></div>

<script>
(function(){
"use strict";

/* ══════════ Vocabulario ══════════ */
const DS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const DL=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const MS=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const ML=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

/* Pictogramas — dibujados a mano, en la tradición de la señalética
   de estación: formas sólidas, sin trazos, legibles a 10 px. */
const GLYPH={
  escuela:'<path d="M1.6 3.4 7.4 5v9.2L1.6 12.6zM14.4 3.4 8.6 5v9.2l5.8-1.6z"/>',
  robotica:'<path d="M7.2 0.8h1.6v2.1H7.2z"/><path fill-rule="evenodd" d="M2.6 3.5h10.8v9.2H2.6zm2.4 2.4v2.3h2.1V5.9zm4.4 0v2.3h2.1V5.9zM5.4 10.2h5.2v1.1H5.4z"/>',
  estudio:'<path d="M11.3 1.3 14.7 4.7 6.6 12.8 2.4 13.9l1.1-4.2z"/>',
  ejercicio:'<path d="M0.9 5.7h1.9v4.6H0.9zM3.4 4h2.1v8H3.4zM6.1 7h3.8v2H6.1zM10.5 4h2.1v8h-2.1zM13.2 5.7h1.9v4.6h-1.9z"/>',
  personal:'<path d="M8 0.9 15.4 7.4h-2.2v7.7H2.8V7.4H0.6z"/>',
  social:'<path d="M5.1 2.3a2.3 2.3 0 1 1 0 4.6 2.3 2.3 0 0 1 0-4.6zM10.9 2.3a2.3 2.3 0 1 1 0 4.6 2.3 2.3 0 0 1 0-4.6zM0.7 14.3c0-2.9 2-4.6 4.4-4.6s4.4 1.7 4.4 4.6zM10.4 9.7c2.4 0 4.5 1.7 4.5 4.6h-3.7c0-1.9-.5-3.4-1.5-4.5z"/>',
  ocio:'<path fill-rule="evenodd" d="M0.9 2.5h14.2v8.2H9.7v1.9h1.6v1.4H4.7v-1.4h1.6v-1.9H0.9zm2 2v4.2h10.2V4.5z"/>',
  descanso:'<path d="M10.6 0.9a7.2 7.2 0 1 0 0 14.2 8 8 0 0 1 0-14.2z"/>'
};
const LINES=[
  {id:"escuela",  nm:"Escuela",  v:"--l-escuela"},
  {id:"robotica", nm:"Robótica", v:"--l-robotica"},
  {id:"estudio",  nm:"Estudio",  v:"--l-estudio"},
  {id:"ejercicio",nm:"Ejercicio",v:"--l-ejercicio"},
  {id:"personal", nm:"Personal", v:"--l-personal"},
  {id:"social",   nm:"Social",   v:"--l-social"},
  {id:"ocio",     nm:"Ocio",     v:"--l-ocio"},
  {id:"descanso", nm:"Descanso", v:"--l-descanso"}
];
const LINE=id=>LINES.filter(l=>l.id===id)[0]||LINES[4];
const hue=id=>getComputedStyle(document.documentElement).getPropertyValue(LINE(id).v).trim()||"#56534B";
const pict=(id,cls)=>'<span class="'+(cls||"glyph")+'" style="background:'+hue(id)+'"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">'+GLYPH[id]+'</svg></span>';
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"><path d="M2.5 8.3 6.2 12 13.5 4.4"/></svg>';
const CLOSE='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 3l10 10M13 3L3 13"/></svg>';

const STORE="mihorario:v3", LEGACY="mihorario:v2";
const SCALE=.82, OPEN=6*60, CLOSE_H=23*60;

/* ══════════ Datos ══════════ */
let D={base:[],weeks:{}};
let V={view:"day",cursor:new Date(),day:0,ready:false};

const q=s=>document.querySelector(s);
const mk=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const safe=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const id8=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const cap=(v,a,b)=>Math.max(a,Math.min(b,v));

function monday(d){const x=new Date(d);x.setHours(0,0,0,0);const w=x.getDay();x.setDate(x.getDate()-(w===0?6:w-1));return x;}
function wid(d){const m=monday(d);return m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")+"-"+String(m.getDate()).padStart(2,"0");}
function span7(d){const m=monday(d);return Array.from({length:7},(_,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return x;});}
function jumpW(d,n){const x=new Date(d);x.setDate(x.getDate()+n*7);return x;}
const hhmm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function len(m){const h=Math.floor(m/60),x=m%60;return (h?h+" h":"")+(x?(h?" ":"")+x+" min":(h?"":"0 min"));}
function mins(v){const p=String(v||"").split(":");return cap((+p[0]||0)*60+(+p[1]||0),0,1439);}
const clock=()=>{const n=new Date();return n.getHours()*60+n.getMinutes();};
const same=d=>d.toDateString()===new Date().toDateString();
const dayNow=()=>{const w=new Date().getDay();return w===0?6:w-1;};

function W(k){
  if(!D.weeks[k]) D.weeks[k]={skip:[],mod:{},extra:[],done:{}};
  const w=D.weeks[k];
  w.skip=w.skip||[];w.mod=w.mod||{};w.extra=w.extra||[];w.done=w.done||{};
  return w;
}
function unfold(k){
  const w=W(k),out=[];
  D.base.forEach(b=>{
    if(w.skip.indexOf(b.id)>=0) return;
    const m=w.mod[b.id];
    out.push(Object.assign({},b,m||{},{fixed:true,tweaked:!!m,done:!!w.done[b.id]}));
  });
  w.extra.forEach(e=>out.push(Object.assign({},e,{fixed:false,tweaked:false,done:!!w.done[e.id]})));
  return out.sort((a,b)=>a.day-b.day||a.start-b.start||a.end-b.end);
}
const here=()=>unfold(wid(V.cursor));
const collide=(l,e)=>l.some(o=>o.id!==e.id&&o.day===e.day&&e.start<o.end&&o.start<e.end);

/* ══════════ Persistencia ══════════ */
let pen=null;
function keep(){
  clearTimeout(pen);
  q("#saveflag").textContent="Guardando";
  pen=setTimeout(async function(){
    try{
      await window.storage.set(STORE,JSON.stringify(D));
      q("#saveflag").textContent="Guardado";
      setTimeout(function(){q("#saveflag").textContent="Se guarda solo";},1500);
    }catch(e){ q("#saveflag").textContent="No se guardó"; console.error(e); }
  },320);
}
async function pull(){
  try{
    const r=await window.storage.get(STORE);
    if(r&&r.value){const p=JSON.parse(r.value);if(p&&p.weeks){D=p;D.base=D.base||[];}}
  }catch(e){}
  if(!D.base.length&&!Object.keys(D.weeks).length){
    try{
      const o=await window.storage.get(LEGACY);
      if(o&&o.value){
        const old=JSON.parse(o.value);let n=0;
        Object.keys(old).forEach(function(k){
          const w=W(k);
          (old[k]||[]).forEach(function(e){w.extra.push({id:e.id||id8(),title:e.title,category:e.category,day:e.day,start:e.start,end:e.end,notes:e.notes||""});n++;});
        });
        if(n){keep();setTimeout(function(){say(n+" actividades recuperadas de la versión anterior");},700);}
      }
    }catch(e){}
  }
  V.ready=true;
}
let ft=null;
function say(m){const f=q("#flash");f.textContent=m;f.classList.add("up");clearTimeout(ft);ft=setTimeout(function(){f.classList.remove("up");},2400);}

/* ══════════ Cabecera ══════════ */
function chrome(){
  const w=span7(V.cursor);
  q("#span").textContent=w[0].getDate()+" "+MS[w[0].getMonth()]+" – "+w[6].getDate()+" "+MS[w[6].getMonth()];
  const n=Math.round((monday(V.cursor)-monday(new Date()))/604800000);
  q("#spanNote").textContent=n===0?"Esta semana":n===1?"Semana entrante":n===-1?"Semana pasada":(n>0?"En "+n+" semanas":"Hace "+Math.abs(n)+" semanas");
  document.querySelectorAll(".tabbar button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.view===V.view?"true":"false");});
  const hide=V.view==="base";
  ["#uPrint","#uCopy","#uDup","#uClear"].forEach(function(s){q(s).style.display=hide?"none":"";});
}
function draw(){
  chrome();
  const s=q("#stage");s.innerHTML="";
  if(!V.ready){s.appendChild(mk("div","blank","<h3>Abriendo</h3><p>Un momento.</p>"));return;}
  ({day:viewDay,week:viewWeek,base:viewBase,stats:viewStats}[V.view])(s);
}

/* ══════════════════════════════════════════════════════════
   VISTA DÍA — el diagrama de línea.
   Las actividades son paradas; los huecos entre ellas son
   segmentos punteados con su duración escrita. El hueco es
   información: es donde cabe algo más.
   ══════════════════════════════════════════════════════════ */
function viewDay(s){
  const w=span7(V.cursor), all=here();

  const strip=mk("div","platform");
  w.forEach(function(d,i){
    const n=all.filter(function(e){return e.day===i;}).length;
    const b=mk("button",(n?"has":"")+(same(d)?" today":""));
    b.setAttribute("aria-pressed",i===V.day?"true":"false");
    b.innerHTML='<span class="pd">'+DS[i]+'</span><span class="pn">'+d.getDate()+'</span><span class="pc"></span>';
    b.onclick=function(){V.day=i;draw();};
    strip.appendChild(b);
  });
  s.appendChild(strip);

  const d=w[V.day];
  const list=all.filter(function(e){return e.day===V.day;});
  const busy=list.reduce(function(a,e){return a+(e.end-e.start);},0);
  const shut=list.filter(function(e){return e.done;}).length;

  const hd=mk("div","dayline");
  hd.innerHTML='<h2 class="disp">'+DL[V.day]+'</h2><span class="stamp">'+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+'</span>';
  s.appendChild(hd);

  const meta=mk("div","daymeta");
  meta.innerHTML='<span>'+ML[d.getMonth()]+" "+d.getFullYear()+'</span>'+
    (list.length?'<span><b>'+list.length+'</b> actividades</span><span><b>'+len(busy)+'</b> ocupadas</span><span><b>'+shut+"/"+list.length+'</b> hechas</span>':'<span>Día libre</span>');
  s.appendChild(meta);

  if(same(d)&&list.length){
    const t=clock();
    const on=list.filter(function(e){return t>=e.start&&t<e.end;})[0];
    const next=list.filter(function(e){return e.start>t;})[0];
    const b=mk("div","bulletin");
    if(on) b.innerHTML='<span class="lbl">Ahora</span><span><b>'+safe(on.title)+'</b> — termina en '+len(on.end-t)+'</span>';
    else if(next) b.innerHTML='<span class="lbl">Sigue</span><span><b>'+safe(next.title)+'</b> a las '+hhmm(next.start)+", en "+len(next.start-t)+'</span>';
    else b.innerHTML='<span class="lbl">Listo</span><span>Ya pasó todo lo de hoy.</span>';
    s.appendChild(b);
  }

  if(!list.length){
    s.appendChild(mk("div","blank",'<h3>Nada este día</h3><p>Agrega una actividad, o importa un horario que ya tengas en foto o texto.</p>'));
    return;
  }

  const dia=mk("div","diagram");
  const t=clock(), live=same(d);

  list.forEach(function(e,i){
    const c=hue(e.category), span=e.end-e.start;
    const tall=cap(46+span*.3,64,196);
    const running=live&&t>=e.start&&t<e.end;

    const row=mk("div","stop"+(e.done?" is-done":""));
    const tags=(e.fixed?'<span class="tag fixed">Fijo</span>':"")+
      (e.tweaked?'<span class="tag edited">Cambiado</span>':"")+
      (running?'<span class="tag live">Ahora</span>':"")+
      (collide(all,e)?'<span class="tag crash">Encimada</span>':"");

    row.innerHTML=
      '<div class="clock"><span class="t1">'+hhmm(e.start)+'</span><span class="t2">'+hhmm(e.end)+'</span></div>'+
      '<div class="rail" style="color:'+c+'">'+
        '<span class="seg" style="background:'+c+';min-height:'+tall+'px"></span>'+
        '<span class="node a"></span><span class="node b"></span>'+
        (running?'<span class="here" style="top:'+cap((t-e.start)/span*100,4,96)+'%"></span>':"")+
      '</div>'+
      '<div class="plate">'+
        '<div class="plate-hd">'+pict(e.category)+
          '<div class="pt-txt"><div class="pt-name">'+safe(e.title)+'</div>'+
          '<div class="pt-sub"><span>'+len(span)+'</span><span>'+LINE(e.category).nm+'</span>'+tags+'</div></div>'+
          '<button class="tick" aria-pressed="'+(e.done?"true":"false")+'" aria-label="Marcar como hecha">'+(e.done?CHECK:"")+'</button>'+
        '</div>'+
        (e.notes?'<div class="pt-note">'+safe(e.notes)+'</div>':"")+
      '</div>';

    row.querySelector(".tick").onclick=function(ev){ev.stopPropagation();flip(e.id);};
    row.querySelector(".plate-hd .pt-txt").onclick=function(){edit(e);};
    const nt=row.querySelector(".pt-note"); if(nt) nt.onclick=function(){edit(e);};
    dia.appendChild(row);

    const nx=list[i+1];
    if(nx){
      const gap=nx.start-e.end;
      const v=mk("div","void");
      if(gap>=10){
        const inGap=live&&t>=e.end&&t<nx.start;
        v.innerHTML='<div></div><div class="rail"><span class="dash" style="min-height:34px"></span>'+
          (inGap?'<span class="here" style="top:'+cap((t-e.end)/gap*100,6,94)+'%"></span>':"")+'</div>'+
          '<div class="vlabel"><b>'+len(gap)+'</b> libre</div>';
      }else{
        v.innerHTML='<div></div><div class="rail"><span class="dash" style="min-height:9px"></span></div><div></div>';
      }
      dia.appendChild(v);
    }
  });

  const end=mk("div","terminus");
  end.innerHTML='<div></div><div><span class="cap"></span></div><div class="tx">Fin del día</div>';
  dia.appendChild(end);
  s.appendChild(dia);
}
function flip(k){
  const w=W(wid(V.cursor));
  if(w.done[k]) delete w.done[k]; else w.done[k]=true;
  keep();draw();
}

/* ══════════ VISTA SEMANA — plano del sistema ══════════ */
function viewWeek(s){
  const w=span7(V.cursor), all=here();
  let lo=OPEN,hi=CLOSE_H;
  all.forEach(function(e){lo=Math.min(lo,Math.floor(e.start/60)*60);hi=Math.max(hi,Math.ceil(e.end/60)*60);});
  const H=(hi-lo)*SCALE;

  const box=mk("div","sheet-wrap"), g=mk("div","sheet");
  g.appendChild(mk("div","sh-cap"));
  w.forEach(function(d,i){
    const h=mk("div","sh-day"+(same(d)?" today":""));
    h.innerHTML='<span class="d">'+DS[i]+'</span><span class="n">'+d.getDate()+'</span>';
    h.onclick=function(){V.day=i;V.view="day";draw();};
    g.appendChild(h);
  });
  const gut=mk("div","sh-hours");gut.style.height=H+"px";
  for(let m=lo;m<=hi;m+=60){const i=mk("i",null,String(Math.floor(m/60)).padStart(2,"0"));i.style.top=((m-lo)*SCALE-5)+"px";gut.appendChild(i);}
  g.appendChild(gut);

  w.forEach(function(d,i){
    const col=mk("div","sh-col"+(same(d)?" today":""));col.style.height=H+"px";
    for(let m=lo;m<=hi;m+=30){const r=mk("div","sh-rule"+(m%60?"":" h"));r.style.top=((m-lo)*SCALE)+"px";col.appendChild(r);}
    if(same(d)){const t=clock();if(t>=lo&&t<=hi){const n=mk("div","sh-now");n.style.top=((t-lo)*SCALE)+"px";col.appendChild(n);}}
    all.filter(function(e){return e.day===i;}).forEach(function(e){
      const b=mk("div","sh-blk"+(e.done?" done":"")+(e.fixed?" fix":""));
      b.style.cssText="top:"+((e.start-lo)*SCALE)+"px;height:"+Math.max(19,(e.end-e.start)*SCALE-3)+"px;background:"+hue(e.category);
      b.innerHTML="<b>"+safe(e.title)+"</b>"+((e.end-e.start)*SCALE>36?"<i>"+hhmm(e.start)+"–"+hhmm(e.end)+"</i>":"");
      b.onclick=function(){edit(e);};
      col.appendChild(b);
    });
    col.addEventListener("click",function(ev){
      if(ev.target!==col) return;
      const m=cap(Math.round((lo+ev.offsetY/SCALE)/30)*30,lo,hi-60);
      edit(null,{day:i,start:m,end:m+60});
    });
    g.appendChild(col);
  });
  box.appendChild(g);s.appendChild(box);
  s.appendChild(mk("p","caption","La franja blanca al costado de un bloque marca las actividades del horario fijo. Toca un hueco para crear ahí; desliza de lado para ver los siete días."));
}

function viewBase(s){
  const brief=mk("div","brief");
  brief.innerHTML="<b>Horario fijo.</b> Lo que se repite todas las semanas, sin fecha de término: aparece igual en la semana pasada y en la de dentro de tres años. Si un día concreto cambias o cancelas algo, se guarda como excepción de esa semana y el resto no se mueve.";
  s.appendChild(brief);

  if(!D.base.length){
    s.appendChild(mk("div","blank",'<h3>Todavía no hay nada fijo</h3><p>Aquí van las clases, entrenamientos y rutinas que se repiten cada semana. Agrega una actividad desde esta pestaña y quedará marcada como fija.</p>'));

  }
  const total=D.base.reduce(function(a,e){return a+(e.end-e.start);},0);
  const led=mk("div","ledger");
  led.innerHTML='<div class="lrow"><span class="lk">Actividades fijas</span><span class="lv">'+D.base.length+'</span></div>'+
    '<div class="lrow"><span class="lk">Cada semana</span><span class="lv">'+len(total)+'</span></div>'+
    '<div class="lrow"><span class="lk">Al mes, aprox.</span><span class="lv">'+len(Math.round(total*52/12))+'</span></div>';
  s.appendChild(led);

  DL.forEach(function(dn,i){
    const ev=D.base.filter(function(e){return e.day===i;}).sort(function(a,b){return a.start-b.start;});
    if(!ev.length) return;
    const grp=mk("div","bgroup");
    grp.innerHTML='<h4>'+dn+'<em>'+len(ev.reduce(function(a,e){return a+(e.end-e.start);},0))+'</em></h4>';
    ev.forEach(function(e){
      const r=mk("button","brow");
      r.innerHTML='<span class="bt">'+hhmm(e.start)+"<br>"+hhmm(e.end)+'</span>'+pict(e.category)+
        '<span class="pt-txt"><span class="pt-name">'+safe(e.title)+'</span>'+
        '<span class="pt-sub"><span>'+len(e.end-e.start)+'</span><span>'+LINE(e.category).nm+'</span></span>'+
        (e.notes?'<span class="pt-note" style="padding-left:0">'+safe(e.notes)+'</span>':"")+'</span>';
      r.onclick=function(){edit(Object.assign({},e,{fixed:true,atBase:true}));};
      grp.appendChild(r);
    });
    s.appendChild(grp);
  });

  const wipe=mk("button","wide","Vaciar el horario fijo");
  wipe.style.cssText="border-color:var(--l-escuela);color:var(--l-escuela)";
  wipe.onclick=function(){
    const dg=sheetDlg("Vaciar el horario fijo",'<p class="aside" style="margin-top:6px">Se eliminan las <b>'+D.base.length+'</b> actividades fijas de todas las semanas. Las actividades sueltas no se tocan. Esto no se puede deshacer.</p>',
      '<button class="act quiet" id="no" style="flex:1">Cancelar</button><button class="act danger" id="si" style="flex:1">Vaciar</button>');
    dg.querySelector("#no").onclick=shut;
    dg.querySelector("#si").onclick=function(){D.base=[];Object.keys(D.weeks).forEach(function(k){D.weeks[k].skip=[];D.weeks[k].mod={};});keep();shut();draw();say("Horario fijo vaciado");};
  };
  s.appendChild(wipe);
}

/* ══════════ VISTA BALANCE ══════════ */
function viewStats(s){
  const all=here();
  const busy=all.reduce(function(a,e){return a+(e.end-e.start);},0);
  const shut=all.filter(function(e){return e.done;}).length;
  const led=mk("div","ledger");
  led.innerHTML='<div class="lrow"><span class="lk">Actividades</span><span class="lv">'+all.length+'</span></div>'+
    '<div class="lrow"><span class="lk">Tiempo ocupado</span><span class="lv">'+(busy?len(busy):"0 min")+'</span></div>'+
    '<div class="lrow"><span class="lk">Hechas</span><span class="lv">'+(all.length?Math.round(shut/all.length*100):0)+'%</span></div>';
  s.appendChild(led);

  if(!all.length){s.appendChild(mk("div","blank",'<h3>Sin datos todavía</h3><p>Cuando tengas actividades esta semana, aquí verás en qué se te va el tiempo.</p>'));return;}

  const rows=LINES.map(function(l){
    const ev=all.filter(function(e){return e.category===l.id;});
    return Object.assign({},l,{m:ev.reduce(function(a,e){return a+(e.end-e.start);},0),n:ev.length});
  }).filter(function(l){return l.m>0;}).sort(function(a,b){return b.m-a.m;});
  const top=Math.max.apply(null,rows.map(function(r){return r.m;}));

  rows.forEach(function(r){
    const c=hue(r.id), m=mk("div","meter");
    m.innerHTML='<div class="mh">'+pict(r.id,"mini")+'<span class="mn">'+r.nm+'</span><span class="mv">'+len(r.m)+" · "+r.n+'</span></div>'+
      '<div class="mt"><div class="mf" style="width:'+(r.m/top*100)+'%;background:'+c+'"></div></div>';
    s.appendChild(m);
  });

  const rb=mk("div","ribbon");
  rows.forEach(function(r){
    const p=Math.round(r.m/busy*100), d=mk("div",null,p>=10?p+"%":"");
    d.style.cssText="flex:"+r.m+";background:"+hue(r.id);
    rb.appendChild(d);
  });
  s.appendChild(rb);
  const k=mk("div","key");
  rows.forEach(function(r){k.appendChild(mk("span",null,'<i style="background:'+hue(r.id)+'"></i>'+r.nm));});
  s.appendChild(k);

  const per=Array.from({length:7},function(_,i){return all.filter(function(e){return e.day===i;}).reduce(function(a,e){return a+(e.end-e.start);},0);});
  const peak=Math.max.apply(null,per)||1;
  const ch=mk("div","loadchart");
  per.forEach(function(v){const b=mk("div","lb"+(v===peak&&v>0?" pk":""));b.innerHTML='<i style="height:'+(v/peak*100)+'%"></i>';ch.appendChild(b);});
  s.appendChild(ch);
  const kk=mk("div","loadkey");
  per.forEach(function(v,i){kk.appendChild(mk("span",null,DS[i]+"<br>"+(v?len(v):"—")));});
  s.appendChild(kk);

  const fix=all.filter(function(e){return e.fixed;}).length;
  const n=mk("div","notes"), p=[];
  p.push("Tu día más cargado es el <b>"+DL[per.indexOf(peak)]+"</b>, con "+len(peak)+".");
  const zero=per.map(function(v,i){return v===0?DL[i]:null;}).filter(Boolean);
  if(zero.length) p.push("No hay nada programado el <b>"+zero.join(", ")+"</b>.");
  p.push("<b>"+fix+"</b> vienen del horario fijo y <b>"+(all.length-fix)+"</b> son solo de esta semana.");
  const cr=all.filter(function(e){return collide(all,e);}).length;
  if(cr) p.push("Hay <b>"+cr+"</b> actividad"+(cr!==1?"es":"")+" encimada"+(cr!==1?"s":"")+" con otra.");
  if(peak>10*60) p.push("Un día con más de 10 horas ocupadas rara vez se sostiene. Vale la pena revisarlo.");
  n.innerHTML=p.map(function(x){return "<p>"+x+"</p>";}).join("");
  s.appendChild(n);
}

function edit(ev,seed){
  const has=!!ev, onBase=V.view==="base";
  const f=ev?Object.assign({},ev):{id:null,title:"",category:"escuela",day:(seed&&seed.day!=null)?seed.day:V.day,start:(seed&&seed.start)||8*60,end:(seed&&seed.end)||9*60,notes:""};
  let perm=has?!!f.fixed:onBase;

  const body=
    '<label class="field" for="nT">Actividad</label><input type="text" id="nT" maxlength="70" placeholder="Cálculo Diferencial" value="'+safe(f.title)+'">'+
    (has?"":'<span class="field">Repetición</span><div class="duo" id="nP">'+
      '<button data-p="1" aria-pressed="'+(perm?"true":"false")+'"><strong>Fija</strong><em>Todas las semanas</em></button>'+
      '<button data-p="0" aria-pressed="'+(perm?"false":"true")+'"><strong>Suelta</strong><em>Solo esta semana</em></button></div>')+
    '<span class="field">Línea</span><div class="lines" id="nL">'+
      LINES.map(function(l){return '<button data-l="'+l.id+'" aria-pressed="'+(l.id===f.category?"true":"false")+'">'+pict(l.id,"mini")+'<span>'+l.nm+'</span></button>';}).join("")+'</div>'+
    '<span class="field">Día</span><div class="week7" id="nD">'+
      DS.map(function(d,i){return '<button data-d="'+i+'" aria-pressed="'+(i===f.day?"true":"false")+'">'+d+'</button>';}).join("")+'</div>'+
    '<div class="pair"><div><label class="field" for="nS">Empieza</label><input type="time" id="nS" step="300" value="'+hhmm(f.start)+'"></div>'+
    '<div><label class="field" for="nE">Termina</label><input type="time" id="nE" step="300" value="'+hhmm(f.end)+'"></div></div><div id="nW"></div>'+
    '<label class="field" for="nN">Nota</label><textarea id="nN" maxlength="180" placeholder="Salón 204, llevar calculadora"></textarea>'+
    (has&&f.fixed&&!f.atBase?'<p class="aside">Esta actividad viene del <b>horario fijo</b>. Al guardar eliges si el cambio es solo de esta semana o de todas.</p>':"");

  let foot;
  if(has&&f.fixed&&!f.atBase) foot='<button class="act danger" id="nX">Quitar</button><button class="act blue" id="nSb">Guardar cambios</button>';
  else if(has) foot='<button class="act danger" id="nX">Borrar</button><button class="act solid" id="nOk">Guardar cambios</button>';
  else foot='<button class="act solid" id="nOk">Agregar actividad</button>';

  const dg=sheetDlg(has?"Editar actividad":(onBase?"Nueva actividad fija":"Nueva actividad"),body,foot);
  dg.querySelector("#nN").value=f.notes||"";
  const A=dg.querySelector("#nS"), B=dg.querySelector("#nE");

  dg.querySelectorAll("#nL button").forEach(function(b){b.onclick=function(){
    f.category=b.dataset.l;
    dg.querySelectorAll("#nL button").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.l===f.category?"true":"false");});
  };});
  dg.querySelectorAll("#nD button").forEach(function(b){b.onclick=function(){
    f.day=+b.dataset.d;
    dg.querySelectorAll("#nD button").forEach(function(x){x.setAttribute("aria-pressed",+x.dataset.d===f.day?"true":"false");});
    check();
  };});
  const pd=dg.querySelector("#nP");
  if(pd) pd.querySelectorAll("button").forEach(function(b){b.onclick=function(){
    perm=b.dataset.p==="1";
    pd.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",(x.dataset.p==="1")===perm?"true":"false");});
  };});
  A.onchange=B.onchange=check;
  function check(){
    const a=mins(A.value),b=mins(B.value),box=dg.querySelector("#nW");box.innerHTML="";
    if(b<=a){box.innerHTML='<div class="alarm">La hora de término tiene que ser posterior a la de inicio.</div>';return;}
    const x=here().filter(function(o){return o.id!==f.id&&o.day===f.day&&a<o.end&&o.start<b;});
    if(x.length) box.innerHTML='<div class="alarm">Se encima con '+x.map(function(o){return safe(o.title)+" ("+hhmm(o.start)+"–"+hhmm(o.end)+")";}).join(", ")+". Puedes guardarla así si quieres.</div>";
  }
  check();

  function read(){
    const t=dg.querySelector("#nT").value.trim(), a=mins(A.value), b=mins(B.value);
    if(!t){say("Falta el nombre de la actividad");return null;}
    if(b<=a){say("La hora de término tiene que ser posterior");return null;}
    return {title:t,category:f.category,day:f.day,start:a,end:b,notes:dg.querySelector("#nN").value.trim()};
  }

  const ok=dg.querySelector("#nOk");
  if(ok) ok.onclick=function(){
    const v=read();if(!v)return;
    if(has){
      if(f.atBase) D.base=D.base.map(function(x){return x.id===f.id?Object.assign({},x,v):x;});
      else{const w=W(wid(V.cursor));w.extra=w.extra.map(function(x){return x.id===f.id?Object.assign({},x,v):x;});}
      say("Cambios guardados");
    }else if(perm){ D.base.push(Object.assign({id:id8()},v)); say("Actividad fija agregada"); }
    else{ W(wid(V.cursor)).extra.push(Object.assign({id:id8()},v)); say("Actividad agregada"); }
    V.day=v.day;keep();shut();draw();
  };

  const okB=dg.querySelector("#nSb");
  if(okB) okB.onclick=function(){
    const v=read();if(!v)return;
    const d2=sheetDlg("Alcance del cambio",'<p class="aside" style="margin-top:6px">«'+safe(v.title)+'» está en tu horario fijo.</p>'+
      '<button class="wide" id="justOne">Cambiar solo esta semana</button>'+
      '<button class="wide" id="always" style="border-color:var(--l-robotica);color:var(--l-robotica)">Cambiar todas las semanas</button>');
    d2.querySelector("#justOne").onclick=function(){W(wid(V.cursor)).mod[f.id]=v;keep();shut();draw();say("Cambio aplicado a esta semana");};
    d2.querySelector("#always").onclick=function(){D.base=D.base.map(function(x){return x.id===f.id?Object.assign({},x,v):x;});delete W(wid(V.cursor)).mod[f.id];keep();shut();draw();say("Horario fijo actualizado");};
  };

  const rm=dg.querySelector("#nX");
  if(rm) rm.onclick=function(){
    if(f.atBase){
      const d2=sheetDlg("Eliminar del horario fijo",'<p class="aside" style="margin-top:6px">«'+safe(f.title)+'» desaparece de <b>todas</b> las semanas.</p>',
        '<button class="act quiet" id="c" style="flex:1">Cancelar</button><button class="act danger" id="y" style="flex:1">Eliminar</button>');
      d2.querySelector("#c").onclick=shut;
      d2.querySelector("#y").onclick=function(){D.base=D.base.filter(function(x){return x.id!==f.id;});keep();shut();draw();say("Eliminada del horario fijo");};
    }else if(f.fixed){
      const d2=sheetDlg("Quitar actividad",'<p class="aside" style="margin-top:6px">«'+safe(f.title)+'» viene del horario fijo.</p>'+
        '<button class="wide" id="once">Cancelar solo esta semana</button>'+
        '<button class="wide" id="forever" style="border-color:var(--l-escuela);color:var(--l-escuela)">Eliminar de todas las semanas</button>');
      d2.querySelector("#once").onclick=function(){const w=W(wid(V.cursor));if(w.skip.indexOf(f.id)<0)w.skip.push(f.id);keep();shut();draw();say("Cancelada esta semana");};
      d2.querySelector("#forever").onclick=function(){D.base=D.base.filter(function(x){return x.id!==f.id;});keep();shut();draw();say("Eliminada del horario fijo");};
    }else{
      const d2=sheetDlg("Borrar actividad",'<p class="aside" style="margin-top:6px">«'+safe(f.title)+'». Esto no se puede deshacer.</p>',
        '<button class="act quiet" id="c" style="flex:1">Cancelar</button><button class="act danger" id="y" style="flex:1">Borrar</button>');
      d2.querySelector("#c").onclick=shut;
      d2.querySelector("#y").onclick=function(){const w=W(wid(V.cursor));w.extra=w.extra.filter(function(x){return x.id!==f.id;});keep();shut();draw();say("Actividad borrada");};
    }
  };
  if(!has) setTimeout(function(){dg.querySelector("#nT").focus();},120);
}

function fromImage(file){
  working("Preparando la imagen","");
  const fr=new FileReader();
  fr.onload=function(){
    const im=new Image();
    im.onload=function(){
      const MAX=1400,k=Math.min(1,MAX/Math.max(im.width,im.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      ask([{type:"image",source:{type:"base64",media_type:"image/jpeg",data:cv.toDataURL("image/jpeg",.85).split(",")[1]}},{type:"text",text:PROMPT}],
        "Leyendo la imagen","Identificando días, horas y materias");
    };
    im.onerror=function(){shut();say("No se pudo abrir esa imagen");};
    im.src=fr.result;
  };
  fr.onerror=function(){shut();say("No se pudo leer el archivo");};
  fr.readAsDataURL(file);
}

}
const PROMPT=
"Eres un extractor de horarios. Analiza el contenido y devuelve EXCLUSIVAMENTE un array JSON valido, sin explicaciones y sin markdown.\n"+
"Formato de cada elemento: {\"t\":\"nombre\",\"d\":0,\"s\":\"HH:MM\",\"e\":\"HH:MM\",\"c\":\"categoria\",\"n\":\"nota o cadena vacia\"}\n"+
"d: 0=Lunes 1=Martes 2=Miercoles 3=Jueves 4=Viernes 5=Sabado 6=Domingo.\n"+
"s y e en formato de 24 horas. Si solo hay hora de inicio, asume 1 hora de duracion.\n"+
"c debe ser exactamente uno de: escuela, robotica, estudio, ejercicio, personal, social, ocio, descanso. Si dudas usa escuela para materias y personal para lo demas.\n"+
"n: salon, maestro o detalle corto; si no hay, cadena vacia.\n"+
"Si una materia se repite en varios dias, genera un elemento por cada dia. No inventes nada que no aparezca. Si no encuentras nada, devuelve [].";

async function ask(content,msg,sub){
  working(msg,sub);
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:content}]})
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data=await r.json();
    const txt=(data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
    const m=txt.match(/\[[\s\S]*\]/);
    if(!m) throw new Error("sin JSON");
    const found=JSON.parse(m[0]).map(function(x){return {
      title:String(x.t||"").slice(0,70).trim(),
      day:cap(parseInt(x.d,10)||0,0,6),
      start:mins(x.s),end:mins(x.e),
      category:LINES.some(function(l){return l.id===x.c;})?x.c:"escuela",
      notes:String(x.n||"").slice(0,180).trim()
    };}).filter(function(x){return x.title&&x.end>x.start;});
    if(!found.length){shut();say("No se encontraron actividades ahí");return;}
    confirmImport(found);
  }catch(e){
    console.error(e);
    const dg=sheetDlg("No se pudo leer",
      '<p class="aside" style="margin-top:6px">La lectura por IA no funcionó. Las causas más comunes:</p>'+
      '<p class="aside">La app se abrió <b>fuera de Claude</b>, descargada — esta función solo corre dentro de Claude. La imagen está borrosa o el texto no se distingue. O se cortó la conexión.</p>'+
      '<p class="aside">El CSV y la captura a mano funcionan siempre.</p>',
      '<button class="act solid" id="k">Entendido</button>');
    dg.querySelector("#k").onclick=shut;
  }
}

function confirmImport(items){
  const on={};items.forEach(function(_,i){on[i]=true;});
  const tally=function(){return Object.keys(on).filter(function(k){return on[k];}).length;};
  let dest="base";
  const rows=items.map(function(x,i){
    return '<button class="pick" data-i="'+i+'" aria-pressed="true"><span class="box">'+CHECK+'</span>'+pict(x.category,"mini")+
      '<span style="flex:1;min-width:0"><span class="pmeta">'+DS[x.day]+" · "+hhmm(x.start)+"–"+hhmm(x.end)+'</span>'+
      '<span class="pname">'+safe(x.title)+'</span>'+(x.notes?'<span class="aside" style="margin-top:1px">'+safe(x.notes)+'</span>':"")+'</span></button>';
  }).join("");
  const dg=sheetDlg("Revisar antes de importar",
    '<p class="aside" style="margin:4px 0 12px">Se encontraron <b>'+items.length+'</b> actividades. Desmarca lo que no quieras; después puedes corregir cualquiera desde la app.</p>'+
    '<span class="field" style="margin-top:0">Destino</span><div class="duo" id="dst">'+
      '<button data-t="base" aria-pressed="true"><strong>Horario fijo</strong><em>Todas las semanas</em></button>'+
      '<button data-t="week" aria-pressed="false"><strong>Solo esta semana</strong><em>Una vez</em></button></div>'+
    '<span class="field">Actividades</span>'+rows,
    '<button class="act quiet" id="ic">Cancelar</button><button class="act solid" id="ig">Importar</button>');
  const dd=dg.querySelector("#dst");
  dd.querySelectorAll("button").forEach(function(b){b.onclick=function(){
    dest=b.dataset.t;
    dd.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.t===dest?"true":"false");});
  };});
  const go=dg.querySelector("#ig");
  dg.querySelectorAll(".pick").forEach(function(r){r.onclick=function(){
    const i=+r.dataset.i;on[i]=!on[i];
    r.setAttribute("aria-pressed",on[i]?"true":"false");
    r.querySelector(".box").innerHTML=on[i]?CHECK:"";
    go.textContent="Importar "+tally();
  };});
  go.textContent="Importar "+tally();
  dg.querySelector("#ic").onclick=shut;
  go.onclick=function(){
    const take=items.filter(function(_,i){return on[i];});
    if(!take.length){say("No hay nada seleccionado");return;}
    if(dest==="base") take.forEach(function(x){D.base.push(Object.assign({id:id8()},x));});
    else{const w=W(wid(V.cursor));take.forEach(function(x){w.extra.push(Object.assign({id:id8()},x));});}
    keep();shut();
    if(dest==="base") V.view="base";
    draw();say(take.length+" actividades importadas");
  };
}

function fromCSV(file){
  const fr=new FileReader();
  fr.onload=function(){
    const rows=String(fr.result).split(/\r?\n/).filter(function(l){return l.trim();});
    const dayOf=function(s){
      const t=s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      const k=["lun","mar","mie","jue","vie","sab","dom"];
      for(let i=0;i<7;i++) if(t.indexOf(k[i])===0) return i;
      const n=parseInt(t,10);return isNaN(n)?-1:cap(n,0,6);
    };
    const out=[];
    rows.forEach(function(ln){
      const p=ln.split(/[,;\t]/).map(function(s){return s.trim().replace(/^"|"$/g,"");});
      if(p.length<4) return;
      const d=dayOf(p[0]),a=mins(p[1]),b=mins(p[2]);
      if(d<0||b<=a||!p[3]) return;
      out.push({title:p[3].slice(0,70),day:d,start:a,end:b,
        category:LINES.some(function(l){return l.id===(p[4]||"").toLowerCase();})?p[4].toLowerCase():"escuela",
        notes:(p[5]||"").slice(0,180)});
    });
    if(!out.length){
      const dg=sheetDlg("Formato no reconocido",
        '<p class="aside" style="margin-top:6px">Cada línea del archivo debe traer, en este orden:</p>'+
        '<p class="aside num" style="color:var(--ink-2);font-size:11px">dia,inicio,fin,actividad,linea,nota<br>Lunes,07:00,09:00,Cálculo,escuela,Salón 204</p>'+
        '<p class="aside">Las últimas dos columnas son opcionales. Sirve con comas, punto y coma o tabulaciones.</p>',
        '<button class="act solid" id="k">Entendido</button>');
      dg.querySelector("#k").onclick=shut;return;
    }
    confirmImport(out);
  };
  fr.readAsText(file);
}

/* ══════════ Utilidades ══════════ */
function asText(){
  const w=span7(V.cursor),all=here();
  let o="MI HORARIO — "+w[0].getDate()+" "+MS[w[0].getMonth()]+" al "+w[6].getDate()+" "+MS[w[6].getMonth()]+"\n";
  o+="==============================\n";
  if(!all.length) return o+"Sin actividades esta semana.";
  DL.forEach(function(dn,i){
    const ev=all.filter(function(e){return e.day===i;});if(!ev.length)return;
    o+="\n"+dn.toUpperCase()+" "+w[i].getDate()+"\n";
    ev.forEach(function(e){o+="  "+hhmm(e.start)+"-"+hhmm(e.end)+"  "+e.title+(e.notes?" ("+e.notes+")":"")+"\n";});
  });
  return o;
}
function doCopy(){
  const t=asText();
  const dg=sheetDlg("Copiar horario",'<p class="aside" style="margin:4px 0 10px">Listo para pegar en WhatsApp, Discord o tus notas.</p><textarea id="cz" style="min-height:230px;font-family:var(--f-num);font-size:11px;line-height:1.55">'+safe(t)+'</textarea>','<button class="act solid" id="cb">Copiar todo</button>');
  dg.querySelector("#cb").onclick=function(){
    const a=dg.querySelector("#cz");a.select();a.setSelectionRange(0,99999);
    try{if(navigator.clipboard)navigator.clipboard.writeText(t);else document.execCommand("copy");say("Horario copiado");}
    catch(e){say("Selecciónalo y cópialo a mano");}
  };
}
function doPrint(){
  const w=span7(V.cursor),all=here();
  let h='<h1>Mi Horario</h1><div class="pr-sub">'+w[0].getDate()+" "+MS[w[0].getMonth()]+" – "+w[6].getDate()+" "+MS[w[6].getMonth()]+" "+w[6].getFullYear()+'</div>';
  if(!all.length) h+="<p>Sin actividades esta semana.</p>";
  DL.forEach(function(dn,i){
    const ev=all.filter(function(e){return e.day===i;});if(!ev.length)return;
    h+='<div class="pr-day"><h4>'+dn+" "+w[i].getDate()+"</h4>";
    ev.forEach(function(e){h+='<div class="pr-line"><span class="pr-t">'+hhmm(e.start)+" – "+hhmm(e.end)+'</span><span><b>'+safe(e.title)+"</b>"+(e.notes?'<span class="pr-n"> — '+safe(e.notes)+"</span>":"")+"</span></div>";});
    h+="</div>";
  });
  q("#sheetprint").innerHTML=h;setTimeout(function(){window.print();},120);
}
function doDup(){
  const src=V.day,ev=here().filter(function(e){return e.day===src;});
  if(!ev.length){say("Ese día no tiene nada que copiar");return;}
  const dg=sheetDlg("Duplicar día",'<p class="aside" style="margin:4px 0 14px">Copia las <b>'+ev.length+'</b> actividades del <b>'+DL[src]+'</b> a otros días. Llegan como actividades sueltas de esta semana.</p>'+
    '<span class="field" style="margin-top:0">Copiar a</span><div class="week7" id="dw">'+DS.map(function(d,i){return '<button data-d="'+i+'" aria-pressed="false"'+(i===src?" disabled":"")+'>'+d+'</button>';}).join("")+'</div>',
    '<button class="act quiet" id="dc" style="flex:1">Cancelar</button><button class="act solid" id="dy">Duplicar</button>');
  const on={};
  dg.querySelectorAll("#dw button").forEach(function(b){if(b.disabled)return;b.onclick=function(){
    const i=+b.dataset.d;on[i]=!on[i];b.setAttribute("aria-pressed",on[i]?"true":"false");};});
  dg.querySelector("#dc").onclick=shut;
  dg.querySelector("#dy").onclick=function(){
    const days=Object.keys(on).filter(function(k){return on[k];});
    if(!days.length){say("Elige al menos un día");return;}
    const w=W(wid(V.cursor));
    days.forEach(function(t){ev.forEach(function(e){w.extra.push({id:id8(),title:e.title,category:e.category,day:+t,start:e.start,end:e.end,notes:e.notes});});});
    keep();shut();draw();say("Día duplicado a "+days.length+(days.length===1?" día":" días"));
  };
}
function doClear(){
  const w=W(wid(V.cursor)),n=w.extra.length;
  if(!n&&!D.base.length){say("Esta semana ya está vacía");return;}
  const dg=sheetDlg("Vaciar la semana",'<p class="aside" style="margin:4px 0 10px">Elige qué quitar de esta semana.</p>'+
    '<button class="wide" id="ce">Borrar las '+n+' actividades sueltas</button>'+
    '<button class="wide" id="cb">Borrar las sueltas y cancelar también las fijas</button>'+
    '<p class="aside">El horario fijo queda intacto: cancelarlo aquí solo afecta a esta semana. Para eliminarlo de verdad ve a la pestaña <b>Fijo</b>.</p>',
    '<button class="act quiet" id="cc" style="flex:1">Cancelar</button>');
  dg.querySelector("#cc").onclick=shut;
  dg.querySelector("#ce").onclick=function(){w.extra=[];keep();shut();draw();say("Actividades sueltas borradas");};
  dg.querySelector("#cb").onclick=function(){w.extra=[];w.skip=D.base.map(function(b){return b.id;});keep();shut();draw();say("Semana vaciada");};
}
function doBackup(){
  const json=JSON.stringify(D);
  const dg=sheetDlg("Respaldo",'<p class="aside" style="margin:4px 0 10px">Copia este texto y guárdalo donde quieras. Para restaurar, pega aquí un respaldo y usa el botón de abajo.</p>'+
    '<textarea id="bz" style="min-height:170px;font-family:var(--f-num);font-size:10px">'+safe(json)+'</textarea>'+
    '<button class="wide" id="br">Restaurar desde este texto</button>'+
    '<p class="aside">Restaurar reemplaza <b>todo</b> tu horario actual.</p>',
    '<button class="act solid" id="bc">Copiar respaldo</button>');
  dg.querySelector("#bc").onclick=function(){
    const a=dg.querySelector("#bz");a.select();
    try{if(navigator.clipboard)navigator.clipboard.writeText(a.value);else document.execCommand("copy");say("Respaldo copiado");}
    catch(e){say("Selecciónalo y cópialo a mano");}
  };
  dg.querySelector("#br").onclick=function(){
    try{
      const d=JSON.parse(dg.querySelector("#bz").value);
      if(!d||typeof d!=="object") throw 0;
      D=d.weeks?d:{base:[],weeks:d};D.base=D.base||[];D.weeks=D.weeks||{};
      keep();shut();draw();say("Horario restaurado");
    }catch(e){say("Ese texto no es un respaldo válido");}
  };
}

/* ══════════ Enlaces ══════════ */
document.querySelectorAll(".tabbar button").forEach(function(b){b.onclick=function(){V.view=b.dataset.view;draw();};});
q("#back").onclick=function(){V.cursor=jumpW(V.cursor,-1);draw();};
q("#fwd").onclick=function(){V.cursor=jumpW(V.cursor,1);draw();};
q("#jump").onclick=function(){V.cursor=new Date();V.day=dayNow();if(V.view==="base")V.view="day";draw();};
q("#compose").onclick=function(){edit(null);};
q("#uImport").onclick=openImport;
q("#uPrint").onclick=doPrint;
q("#uCopy").onclick=doCopy;
q("#uDup").onclick=doDup;
q("#uBackup").onclick=doBackup;
q("#uClear").onclick=doClear;
document.addEventListener("keydown",function(e){if(e.key==="Escape")shut();});
setInterval(function(){if(V.view==="day"||V.view==="week")draw();},60000);

V.day=dayNow();
draw();
pull().then(draw);

})();
</script>
