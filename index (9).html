    function ClassEditor({ initial, onSave, onDelete, onClose }) {
      const [name, setName] = useState(initial?.name || "");
      const [room, setRoom] = useState(initial?.room || "");
      const [category, setCategory] = useState(initial?.category || "academica");
      const [description, setDescription] = useState(initial?.description || "");
      const [schedule, setSchedule] = useState(
        initial?.schedule?.length ? initial.schedule : [{ day: 1, start: "09:00", end: "10:30" }]
      );
      const [error, setError] = useState("");

      const addBlock = () => {
        const usedDays = new Set(schedule.map((s) => s.day));
        let suggestDay = 1;
        for (let d = 1; d <= 5; d++) { if (!usedDays.has(d)) { suggestDay = d; break; } }
        const lastBlock = schedule[schedule.length - 1];
        setSchedule([...schedule, { day: suggestDay, start: lastBlock?.start || "09:00", end: lastBlock?.end || "10:30" }]);
      };

      const removeBlock = (i) => {
        if (schedule.length === 1) { setError("Necesitas al menos un horario."); return; }
        setSchedule(schedule.filter((_, idx) => idx !== i));
      };

      const updateBlock = (i, field, val) => {
        const next = [...schedule];
        next[i] = { ...next[i], [field]: val };
        if (field === "start" && toMin(val) >= toMin(next[i].end)) {
          const newEndMin = Math.min(toMin(val) + 90, 23 * 60 + 30);
          next[i].end = fromMin(newEndMin);
        }
        if (field === "end" && toMin(val) <= toMin(next[i].start)) {
          const newStartMin = Math.max(toMin(val) - 90, 0);
          next[i].start = fromMin(newStartMin);
        }
        setSchedule(next);
      };

      const handleSave = () => {
        setError("");
        if (!name.trim()) { setError("Pon un nombre a la clase."); return; }
        if (!schedule.length) { setError("Agrega al menos un horario."); return; }
        const bad = [];
        schedule.forEach((s, idx) => {
          if (toMin(s.start) >= toMin(s.end)) bad.push(`bloque ${idx + 1} (${DAYS_FULL[s.day]})`);
        });
        if (bad.length) { setError(`Horas inválidas en: ${bad.join(", ")}.`); return; }
        onSave({ id: initial?.id || uid(), code: initial?.code, name: name.trim(), room: room.trim(), category, schedule, description: description.trim() });
      };

      const handleDelete = () => {
        if (!initial?.id) return;
        if (window.confirm(`¿Eliminar "${initial.name}"?`)) onDelete(initial.id);
      };

      return (
        <div className="ht-modal-bg" onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div className="ht-modal">
            <div className="ht-modal-header">
              <div className="ht-modal-title">{initial ? "Editar clase" : "Nueva clase"}</div>
              <button className="ht-modal-close" onClick={onClose}>×</button>
            </div>
            <div className="ht-modal-body">
              {error && <div className="ht-alert" style={{ background: "rgba(201,114,104,0.1)", borderColor: "rgba(201,114,104,0.3)", color: "#E89588" }}>{error}</div>}

              <div className="ht-field">
                <label className="ht-label">Nombre de la clase</label>
                <input className="ht-input" value={name} onChange={(e) => setName(e.target.value)} placeholder="Cálculo Diferencial" autoFocus />
              </div>

              <div className="ht-field">
                <label className="ht-label">Salón</label>
                <input className="ht-input" value={room} onChange={(e) => setRoom(e.target.value)} placeholder="Aula 1-203 (opcional)" />
              </div>

              <div className="ht-field">
                <label className="ht-label">Descripción / notas <span style={{ textTransform: "none", letterSpacing: 0, color: "var(--fg-3)", fontWeight: 400 }}>(opcional)</span></label>
                <input className="ht-input" value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Profe relajado, llevar laptop, etc." />
              </div>

              <div className="ht-field">
                <label className="ht-label">Categoría</label>
                <div className="ht-cat-grid">
                  {Object.entries(CATEGORIES).map(([key, c]) => (
                    <button key={key} type="button" className={`ht-cat-btn ${category === key ? "active" : ""}`}
                      onClick={() => setCategory(key)} style={category === key ? { borderColor: c.color, color: c.color } : {}}>
                      <span className="ht-cat-dot" style={{ background: c.color }} />{c.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="ht-field">
                <label className="ht-label">Horarios</label>
                <div className="ht-block-list">
                  {schedule.map((s, i) => (
                    <div key={i} className="ht-block-row">
                      {schedule.length > 1 && (
                        <>
                          <div style={{ position: "absolute", top: 10, left: 14, fontSize: "0.65rem", color: "var(--fg-3)", letterSpacing: "0.15em", textTransform: "uppercase", fontWeight: 600 }}>Bloque {i + 1}</div>
                          <button className="ht-block-remove" onClick={() => removeBlock(i)}>×</button>
                        </>
                      )}
                      <div style={{ marginTop: schedule.length > 1 ? 24 : 0, marginBottom: 10 }}>
                        <div className="ht-label" style={{ marginBottom: 6 }}>
                          Día <span style={{ color: "var(--accent)", fontFamily: "var(--body)", textTransform: "none", letterSpacing: 0, marginLeft: 6 }}>{DAYS_FULL[s.day]}</span>
                        </div>
                        <div className="ht-day-picker">
                          {DAYS.map((d, di) => (
                            <button key={di} type="button" className={`ht-day-btn ${s.day === di ? "active" : ""}`}
                              onClick={() => updateBlock(i, "day", di)}>{d}</button>
                          ))}
                        </div>
                      </div>
                      <div className="ht-time-row">
                        <div>
                          <div className="ht-label" style={{ marginBottom: 6 }}>Inicio</div>
                          <input type="time" className="ht-input" value={s.start} onChange={(e) => updateBlock(i, "start", e.target.value)} />
                        </div>
                        <div>
                          <div className="ht-label" style={{ marginBottom: 6 }}>Fin</div>
                          <input type="time" className="ht-input" value={s.end} onChange={(e) => updateBlock(i, "end", e.target.value)} />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
                <button className="ht-btn ht-btn-secondary" type="button" onClick={addBlock} style={{ width: "100%" }}>
                  + Otro día/horario
                </button>
              </div>

              <div className="ht-form-actions">
                {initial && <button className="ht-btn ht-btn-danger" type="button" onClick={handleDelete}>Eliminar</button>}
                <div style={{ display: "flex", gap: 8, marginLeft: "auto" }}>
                  <button className="ht-btn ht-btn-ghost" type="button" onClick={onClose}>Cancelar</button>
                  <button className="ht-btn ht-btn-primary" type="button" onClick={handleSave}>Guardar</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function PdfImportModal({ hasExisting, onImport, onClose }) {
      const [stage, setStage] = useState("upload"); // upload | processing | preview | error | assign
      const [error, setError] = useState("");
      const [parsed, setParsed] = useState([]);
      const [rawText, setRawText] = useState("");
      const [showRaw, setShowRaw] = useState(false);
      const [dragging, setDragging] = useState(false);
      const [files, setFiles] = useState([]); // [{ name, type, status, progress, text, error }]
      const [candidates, setCandidates] = useState([]); // materias detectadas para asignación manual
      const fileInputRef = React.useRef(null);

      const updateFile = (idx, patch) => {
        setFiles((prev) => prev.map((f, i) => (i === idx ? { ...f, ...patch } : f)));
      };

      const processFiles = async (rawFiles) => {
        const validFiles = Array.from(rawFiles).filter((f) => isPdfFile(f) || isImageFile(f));
        if (validFiles.length === 0) {
          setError("Solo PDFs e imágenes (PNG, JPG). ¿Otro formato? Convíertelo primero.");
          setStage("error");
          return;
        }

        const initialState = validFiles.map((f) => ({
          name: f.name,
          type: isPdfFile(f) ? "pdf" : "image",
          status: "pending",
          progress: 0,
          text: "",
          error: "",
        }));
        setFiles(initialState);
        setStage("processing");

        const allTexts = [];
        const fileDebug = [];
        for (let i = 0; i < validFiles.length; i++) {
          const file = validFiles[i];
          updateFile(i, { status: "processing", progress: 0 });
          try {
            let text;
            let debugInfo = null;
            if (isPdfFile(file)) {
              text = await extractPdfText(file);
              updateFile(i, { progress: 100 });
            } else {
              const result = await extractImageText(file, (pct) => updateFile(i, { progress: pct }));
              text = result.text;
              debugInfo = {
                name: file.name,
                wordCount: result.wordCount,
                gridSuccess: !!result.gridText,
                rawText: result.rawText,
                gridText: result.gridText,
              };
            }
            updateFile(i, { status: "done", text, progress: 100 });
            allTexts.push(text);
            if (debugInfo) fileDebug.push(debugInfo);
          } catch (e) {
            console.error("[horario] error procesando archivo:", e);
            updateFile(i, { status: "error", error: e.message || String(e) });
          }
        }

        // unir todos los textos extraídos y parsear como uno solo
        const combined = allTexts.join("\n\n--- ARCHIVO ---\n\n");

        // construir rawText extendido con info de debug
        let debugReport = combined;
        if (fileDebug.length > 0) {
          debugReport = "=== INFO DE OCR ===\n";
          fileDebug.forEach((d, idx) => {
            debugReport += `\nArchivo ${idx + 1}: ${d.name}\n`;
            debugReport += `Palabras detectadas: ${d.wordCount}\n`;
            debugReport += `Reconstrucción de rejilla: ${d.gridSuccess ? "✓ ÉXITO" : "✗ FALLÓ"}\n`;
            if (window.__horarioDebug?.gridLog?.length) {
              debugReport += "Log de reconstrucción:\n";
              window.__horarioDebug.gridLog.forEach((l) => debugReport += "  - " + l + "\n");
            }
          });
          debugReport += "\n=== TEXTO QUE SE PASÓ AL PARSER ===\n" + combined;
          if (fileDebug.some(d => !d.gridSuccess)) {
            debugReport += "\n\n=== TEXTO BRUTO DEL OCR (sin reconstruir) ===\n";
            fileDebug.forEach((d) => {
              if (!d.gridSuccess && d.rawText) debugReport += d.rawText + "\n\n";
            });
          }
        }
        setRawText(debugReport);

        if (allTexts.length === 0) {
          setError("No se pudo leer ningún archivo. Revisa que sean PDFs válidos o imágenes legibles.");
          setStage("error");
          return;
        }

        const classes = parseTecSchedule(combined);
        if (classes.length === 0) {
          // Fallback: extraer materias candidatas para asignación manual
          const candList = extractCandidateSubjects(combined);
          if (candList.length > 0) {
            setCandidates(candList);
            setStage("assign");
            return;
          }
          setError("No encontré clases en los archivos. Revisa el debug abajo para ver qué leyó el OCR y por qué falló.");
          setStage("error");
          return;
        }

        // Dedup: si dos archivos tienen la misma clase (mismo code o mismo nombre+horario), conservar una
        const seen = new Set();
        const dedupClasses = [];
        for (const c of classes) {
          const key = c.code || `${c.name}-${c.schedule.map(s => `${s.day}${s.start}`).join(",")}`;
          if (seen.has(key)) continue;
          seen.add(key);
          dedupClasses.push(c);
        }

        setParsed(dedupClasses);
        setStage("preview");
      };

      const handleFiles = (fileList) => {
        if (!fileList || fileList.length === 0) return;
        processFiles(fileList);
      };

      const onDrop = (e) => {
        e.preventDefault();
        setDragging(false);
        handleFiles(e.dataTransfer.files);
      };

      const reset = () => {
        setStage("upload");
        setRawText("");
        setShowRaw(false);
        setFiles([]);
        setError("");
        setParsed([]);
        setCandidates([]);
      };

      return (
        <div className="ht-modal-bg" onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div className="ht-modal">
            <div className="ht-modal-header">
              <div className="ht-modal-title">Importar horario</div>
              <button className="ht-modal-close" onClick={onClose}>×</button>
            </div>
            <div className="ht-modal-body">
              {stage === "upload" && (
                <>
                  <p style={{ color: "var(--fg-2)", fontSize: "0.9rem", marginTop: 0, marginBottom: 16, lineHeight: 1.5 }}>
                    Sube uno o varios archivos (PDF o imágenes) de tu horario escolar. Extraigo materias, horarios, salones y los clasifico automáticamente.
                  </p>
                  <div
                    className={`ht-drop ${dragging ? "dragging" : ""}`}
                    onClick={() => fileInputRef.current?.click()}
                    onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
                    onDragLeave={() => setDragging(false)}
                    onDrop={onDrop}
                  >
                    <div className="ht-drop-icon">📄🖼️</div>
                    <div className="ht-drop-title">Suelta tus archivos aquí</div>
                    <div className="ht-drop-sub">PDFs e imágenes (PNG, JPG) — uno o varios a la vez</div>
                  </div>
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept="application/pdf,.pdf,image/*"
                    multiple
                    style={{ display: "none" }}
                    onChange={(e) => handleFiles(e.target.files)}
                  />
                  <div className="ht-ocr-warning">
                    Las imágenes usan OCR (lectura por reconocimiento óptico). Tarda 5-20 segundos por imagen y la primera vez baja ~10 MB de datos. Funciona mejor con capturas claras y de alta resolución; las fotos a una pantalla con reflejos dan resultados regulares.
                  </div>
                </>
              )}

              {stage === "processing" && (
                <>
                  <p style={{ color: "var(--fg-2)", fontSize: "0.9rem", marginTop: 0, marginBottom: 4, fontFamily: "var(--display)", fontStyle: "italic", fontSize: "1.1rem" }}>
                    Procesando archivos…
                  </p>
                  <p style={{ color: "var(--fg-3)", fontSize: "0.75rem", marginTop: 0, marginBottom: 16 }}>
                    Las imágenes pueden tardar varios segundos. No cierres la ventana.
                  </p>
                  <div className="ht-file-list">
                    {files.map((f, i) => (
                      <div key={i} className="ht-file-row" style={{ flexDirection: "column", alignItems: "stretch", gap: 6 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                          <span className="ht-file-icon">{f.type === "pdf" ? "📄" : "🖼️"}</span>
                          <span className="ht-file-name">{f.name}</span>
                          <span className={`ht-file-status ${f.status === "done" ? "done" : f.status === "error" ? "error" : f.status === "processing" ? "processing" : ""}`}>
                            {f.status === "pending" && "esperando"}
                            {f.status === "processing" && (f.type === "image" ? `${f.progress}%` : "leyendo…")}
                            {f.status === "done" && "✓ listo"}
                            {f.status === "error" && "✗ error"}
                          </span>
                        </div>
                        {f.status === "processing" && f.type === "image" && (
                          <div className="ht-progress-bar">
                            <div className="ht-progress-fill" style={{ width: `${f.progress}%` }} />
                          </div>
                        )}
                        {f.status === "error" && f.error && (
                          <div style={{ fontSize: "0.7rem", color: "#C97268", marginLeft: 32 }}>{f.error}</div>
                        )}
                      </div>
                    ))}
                  </div>
                </>
              )}

              {stage === "error" && (
                <>
                  <div className="ht-alert" style={{ background: "rgba(201,114,104,0.1)", borderColor: "rgba(201,114,104,0.3)", color: "#E89588" }}>
                    {error}
                  </div>
                  {files.length > 0 && (
                    <div className="ht-file-list">
                      {files.map((f, i) => (
                        <div key={i} className="ht-file-row">
                          <span className="ht-file-icon">{f.type === "pdf" ? "📄" : "🖼️"}</span>
                          <span className="ht-file-name">{f.name}</span>
                          <span className={`ht-file-status ${f.status === "done" ? "done" : "error"}`}>
                            {f.status === "done" ? "✓" : "✗"}
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                  {rawText && (
                    <div style={{ marginBottom: 12 }}>
                      <button className="ht-btn ht-btn-ghost" onClick={() => setShowRaw(!showRaw)} style={{ fontSize: "0.8rem" }}>
                        {showRaw ? "▾ Ocultar" : "▸ Ver"} texto extraído (debug)
                      </button>
                      {showRaw && (
                        <pre style={{ fontFamily: "var(--mono)", fontSize: "0.7rem", color: "var(--fg-3)", background: "var(--bg-3)", padding: 12, borderRadius: 8, maxHeight: 240, overflow: "auto", whiteSpace: "pre-wrap", marginTop: 8 }}>
                          {rawText}
                        </pre>
                      )}
                    </div>
                  )}
                  <button className="ht-btn ht-btn-secondary" onClick={reset} style={{ width: "100%" }}>
                    Intentar de nuevo
                  </button>
                </>
              )}

              {stage === "preview" && (
                <>
                  <p style={{ color: "var(--fg-2)", fontSize: "0.9rem", marginTop: 0, marginBottom: 4 }}>
                    Encontré <strong style={{ color: "var(--fg)" }}>{parsed.length} clase{parsed.length !== 1 ? "s" : ""}</strong> en {files.length} archivo{files.length !== 1 ? "s" : ""}. Revisa que esté bien:
                  </p>
                  {files.some(f => f.type === "image") && (
                    <p style={{ color: "var(--fg-3)", fontSize: "0.72rem", marginTop: 0, marginBottom: 12, fontStyle: "italic" }}>
                      Las imágenes pueden tener errores de OCR — verifica horarios con cuidado y edita después si algo está mal.
                    </p>
                  )}
                  <div className="ht-preview-list">
                    {parsed.map((c, i) => (
                      <div key={i} className="ht-preview-item">
                        <span className="ht-cat-dot" style={{ background: CATEGORIES[c.category]?.color }} />
                        <div className="ht-preview-name">
                          {c.name}
                          <div className="ht-preview-meta" style={{ marginTop: 2 }}>
                            {c.schedule.map((s) => `${DAYS[s.day]} ${s.start}-${s.end}`).join(" · ")}
                            {c.room && ` · ${c.room}`}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                  {rawText && (
                    <div style={{ marginBottom: 8 }}>
                      <button className="ht-btn ht-btn-ghost" onClick={() => setShowRaw(!showRaw)} style={{ fontSize: "0.75rem", padding: "4px 8px" }}>
                        {showRaw ? "▾ Ocultar" : "▸ Ver"} texto extraído (debug)
                      </button>
                      {showRaw && (
                        <pre style={{ fontFamily: "var(--mono)", fontSize: "0.65rem", color: "var(--fg-3)", background: "var(--bg-3)", padding: 10, borderRadius: 8, maxHeight: 180, overflow: "auto", whiteSpace: "pre-wrap", marginTop: 6 }}>
                          {rawText}
                        </pre>
                      )}
                    </div>
                  )}
                  {hasExisting && (
                    <div className="ht-alert" style={{ marginBottom: 12 }}>
                      Ya tienes clases guardadas. Elige cómo combinarlas:
                    </div>
                  )}
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12 }}>
                    <button className="ht-btn ht-btn-ghost" onClick={onClose}>Cancelar</button>
                    {hasExisting && (
                      <button className="ht-btn ht-btn-secondary" onClick={() => onImport(parsed, "merge")}>
                        Agregar las nuevas
                      </button>
                    )}
                    <button className="ht-btn ht-btn-primary" onClick={() => onImport(parsed, "replace")} style={{ marginLeft: "auto" }}>
                      {hasExisting ? "Reemplazar todo" : `Importar ${parsed.length}`}
                    </button>
                  </div>
                </>
              )}

              {stage === "assign" && (
                <AssignSubjects
                  candidates={candidates}
                  rawText={rawText}
                  showRaw={showRaw}
                  setShowRaw={setShowRaw}
                  hasExisting={hasExisting}
                  onCancel={onClose}
                  onRetry={reset}
                  onSubmit={(classes, mode) => onImport(classes, mode)}
                />
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    //  AssignSubjects — editor de asignación manual
    //  Cuando el OCR detecta materias pero no logra leer los
    //  horarios, el usuario los asigna a mano de forma rápida
    // ============================================================
    function AssignSubjects({ candidates, rawText, showRaw, setShowRaw, hasExisting, onCancel, onRetry, onSubmit }) {
      // estado: para cada candidato, su info (selected, name, days, start, end, category, room)
      const [items, setItems] = useState(() => candidates.map((name) => ({
        id: uid(),
        selected: true, // por defecto todas seleccionadas
        name,
        days: [], // ej: [1, 3, 5] = lun, mié, vie
        start: "08:00",
        end: "09:00",
        category: "academica",
        room: "",
      })));

      const updateItem = (idx, patch) => {
        setItems((prev) => prev.map((it, i) => i === idx ? { ...it, ...patch } : it));
      };

      const toggleDay = (idx, day) => {
        setItems((prev) => prev.map((it, i) => {
          if (i !== idx) return it;
          const days = it.days.includes(day) ? it.days.filter(d => d !== day) : [...it.days, day].sort();
          return { ...it, days };
        }));
      };

      const removeItem = (idx) => {
        setItems((prev) => prev.filter((_, i) => i !== idx));
      };

      const addCustomItem = () => {
        setItems((prev) => [...prev, {
          id: uid(),
          selected: true,
          name: "",
          days: [],
          start: "08:00",
          end: "09:00",
          category: "academica",
          room: "",
        }]);
      };

      const finish = (mode) => {
        // construir clases finales: solo las seleccionadas con nombre + días + horas válidas
        const classes = [];
        for (const it of items) {
          if (!it.selected) continue;
          if (!it.name.trim()) continue;
          if (it.days.length === 0) continue;
          if (toMin(it.start) >= toMin(it.end)) continue;
          classes.push({
            id: it.id,
            name: it.name.trim(),
            room: it.room.trim(),
            category: it.category,
            description: "",
            schedule: it.days.map(d => ({ day: d, start: it.start, end: it.end })),
          });
        }
        if (classes.length === 0) {
          alert("Asigna al menos una clase con nombre, días y horario válido.");
          return;
        }
        onSubmit(classes, mode);
      };

      const validCount = items.filter(it => it.selected && it.name.trim() && it.days.length > 0 && toMin(it.start) < toMin(it.end)).length;

      return (
        <>
          <div className="ht-alert" style={{ background: "rgba(91,155,213,0.08)", borderColor: "rgba(91,155,213,0.3)", color: "#A5C8E8", marginBottom: 16 }}>
            <strong style={{ color: "#C5DDF0" }}>OCR no pudo leer los horarios.</strong> Pero sí detecté las materias. Asígnales sus días y horas abajo (es rápido — desmarca las que no necesites, ajusta nombres rotos por el OCR).
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 10, maxHeight: "55vh", overflowY: "auto", marginBottom: 16, paddingRight: 4 }}>
            {items.map((it, idx) => (
              <div key={it.id} style={{
                background: it.selected ? "var(--bg-3)" : "transparent",
                border: "1px solid var(--line)",
                borderRadius: 12,
                padding: "12px 14px",
                opacity: it.selected ? 1 : 0.5,
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                  <input
                    type="checkbox"
                    checked={it.selected}
                    onChange={(e) => updateItem(idx, { selected: e.target.checked })}
                    style={{ accentColor: "var(--accent)", cursor: "pointer", flexShrink: 0 }}
                  />
                  <input
                    className="ht-input"
                    value={it.name}
                    onChange={(e) => updateItem(idx, { name: e.target.value })}
                    placeholder="Nombre de la materia"
                    style={{ flex: 1, padding: "8px 12px", fontSize: "0.9rem" }}
                  />
                  <button
                    onClick={() => removeItem(idx)}
                    style={{ background: "transparent", border: "none", color: "var(--fg-3)", cursor: "pointer", fontSize: "1.1rem", padding: "4px 8px" }}
                    title="Eliminar de la lista"
                  >×</button>
                </div>

                {it.selected && (
                  <>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginBottom: 10 }}>
                      {["L", "M", "M", "J", "V", "S", "D"].map((dl, di) => {
                        // di: 0=L=1, 1=M=2, 2=M=3, 3=J=4, 4=V=5, 5=S=6, 6=D=0
                        const dayNum = di === 6 ? 0 : di + 1;
                        const active = it.days.includes(dayNum);
                        return (
                          <button
                            key={di}
                            onClick={() => toggleDay(idx, dayNum)}
                            style={{
                              padding: "6px 10px",
                              borderRadius: 6,
                              background: active ? "var(--accent)" : "var(--bg-2)",
                              color: active ? "var(--bg)" : "var(--fg-2)",
                              border: "1px solid " + (active ? "var(--accent)" : "var(--line)"),
                              fontSize: "0.75rem",
                              fontFamily: "var(--mono)",
                              fontWeight: 600,
                              cursor: "pointer",
                              minWidth: 32,
                            }}
                          >{dl}</button>
                        );
                      })}
                    </div>

                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 8 }}>
                      <input
                        type="time"
                        className="ht-input"
                        value={it.start}
                        onChange={(e) => updateItem(idx, { start: e.target.value })}
                        style={{ padding: "8px", fontSize: "0.85rem" }}
                      />
                      <input
                        type="time"
                        className="ht-input"
                        value={it.end}
                        onChange={(e) => updateItem(idx, { end: e.target.value })}
                        style={{ padding: "8px", fontSize: "0.85rem" }}
                      />
                      <input
                        className="ht-input"
                        value={it.room}
                        onChange={(e) => updateItem(idx, { room: e.target.value })}
                        placeholder="Salón"
                        style={{ padding: "8px", fontSize: "0.85rem" }}
                      />
                    </div>

                    <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                      {Object.entries(CATEGORIES).map(([key, c]) => (
                        <button
                          key={key}
                          onClick={() => updateItem(idx, { category: key })}
                          style={{
                            padding: "4px 10px",
                            borderRadius: 999,
                            background: it.category === key ? c.soft : "transparent",
                            color: it.category === key ? c.color : "var(--fg-3)",
                            border: "1px solid " + (it.category === key ? c.color : "var(--line)"),
                            fontSize: "0.7rem",
                            cursor: "pointer",
                            display: "inline-flex",
                            alignItems: "center",
                            gap: 4,
                          }}
                        >
                          <span style={{ width: 6, height: 6, borderRadius: "50%", background: c.color }} />
                          {c.label}
                        </button>
                      ))}
                    </div>
                  </>
                )}
              </div>
            ))}
          </div>

          <button
            onClick={addCustomItem}
            style={{
              background: "transparent",
              border: "1px dashed var(--line-strong)",
              color: "var(--fg-2)",
              padding: "10px",
              borderRadius: 10,
              width: "100%",
              cursor: "pointer",
              fontSize: "0.85rem",
              marginBottom: 16,
            }}
          >+ Agregar materia que no está en la lista</button>

          {rawText && (
            <div style={{ marginBottom: 12 }}>
              <button className="ht-btn ht-btn-ghost" onClick={() => setShowRaw(!showRaw)} style={{ fontSize: "0.75rem", padding: "4px 8px" }}>
                {showRaw ? "▾ Ocultar" : "▸ Ver"} texto extraído (debug)
              </button>
              {showRaw && (
                <pre style={{ fontFamily: "var(--mono)", fontSize: "0.65rem", color: "var(--fg-3)", background: "var(--bg-3)", padding: 10, borderRadius: 8, maxHeight: 180, overflow: "auto", whiteSpace: "pre-wrap", marginTop: 6 }}>
                  {rawText}
                </pre>
              )}
            </div>
          )}

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, paddingTop: 12, borderTop: "1px solid var(--line)" }}>
            <span style={{ fontSize: "0.8rem", color: "var(--fg-3)", fontFamily: "var(--mono)" }}>
              {validCount} de {items.length} listas
            </span>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button className="ht-btn ht-btn-ghost" onClick={onCancel}>Cancelar</button>
              <button className="ht-btn ht-btn-secondary" onClick={onRetry}>Otro archivo</button>
              {hasExisting && (
                <button className="ht-btn ht-btn-secondary" onClick={() => finish("merge")} disabled={validCount === 0}>
                  Agregar
                </button>
              )}
              <button className="ht-btn ht-btn-primary" onClick={() => finish("replace")} disabled={validCount === 0}>
                {hasExisting ? "Reemplazar todo" : `Importar ${validCount}`}
              </button>
            </div>
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
