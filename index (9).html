<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14130F" />
  <title>horario.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314130F'/%3E%3Ctext x='50%25' y='62%25' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='44' fill='%23E8765C'%3Eh%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #14130F;
      --bg-2: #1C1B17;
      --bg-3: #25241E;
      --fg: #F5F0E6;
      --fg-2: #B8B2A4;
      --fg-3: #6E6A5F;
      --line: rgba(245,240,230,0.08);
      --line-strong: rgba(245,240,230,0.18);
      --accent: #E8765C;
      --display: 'Instrument Serif', serif;
      --body: 'Geist', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { margin: 0; padding: 0; background: var(--bg); }
    body {
      font-family: var(--body);
      color: var(--fg);
      letter-spacing: -0.01em;
      min-height: 100vh;
      min-height: 100dvh;
    }
    #initial-loader {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--display); font-style: italic; font-size: 1.3rem;
      color: var(--fg-3); opacity: 0;
      animation: fadeIn 0.4s 0.2s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    .ht-app { background: var(--bg); color: var(--fg); min-height: 100vh; min-height: 100dvh; padding-bottom: 120px; }
    .ht-grain { position: fixed; inset: 0; pointer-events: none; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); z-index: 0; }
    .ht-container { max-width: 880px; margin: 0 auto; padding: 32px 24px calc(env(safe-area-inset-bottom) + 24px); position: relative; z-index: 1; }
    @media (max-width: 600px) { .ht-container { padding: 20px 16px calc(env(safe-area-inset-bottom) + 20px); } }

    .ht-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
    .ht-logo { font-family: var(--display); font-style: italic; font-size: 1.9rem; line-height: 1; color: var(--fg); }
    .ht-logo span { color: var(--accent); }
    .ht-clock { font-family: var(--mono); font-size: 0.85rem; color: var(--fg-2); text-align: right; line-height: 1.4; }
    .ht-clock-big { font-size: 1.1rem; color: var(--fg); letter-spacing: 0.05em; }
    .ht-clock-day { text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.2em; margin-top: 2px; }

    .ht-tabs { display: flex; gap: 4px; margin-bottom: 32px; padding: 4px; background: var(--bg-2); border-radius: 999px; width: fit-content; border: 1px solid var(--line); }
    .ht-tab { padding: 8px 18px; border-radius: 999px; font-size: 0.85rem; color: var(--fg-2); cursor: pointer; border: none; background: transparent; font-family: var(--body); transition: all 0.2s; }
    .ht-tab.active { background: var(--fg); color: var(--bg); font-weight: 500; }
    .ht-tab:hover:not(.active) { color: var(--fg); }

    .ht-now-card { background: var(--bg-2); border-radius: 24px; padding: 36px 32px; border: 1px solid var(--line); margin-bottom: 24px; position: relative; overflow: hidden; }
    .ht-now-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent); }
    .ht-now-eyebrow { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.25em; color: var(--accent); margin-bottom: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ht-pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
    .ht-now-name { font-family: var(--display); font-size: clamp(2.4rem, 6vw, 3.8rem); line-height: 1; color: var(--fg); margin-bottom: 18px; }
    .ht-now-name em { color: var(--accent); }
    .ht-now-meta { display: flex; flex-wrap: wrap; gap: 24px; font-family: var(--mono); color: var(--fg-2); font-size: 0.9rem; }
    .ht-now-meta-item { display: flex; flex-direction: column; gap: 4px; }
    .ht-now-meta-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--fg-3); }
    .ht-now-meta-value { font-size: 1rem; color: var(--fg); }
    .ht-countdown { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .ht-countdown-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.18em; color: var(--fg-3); }
    .ht-countdown-value { font-family: var(--mono); font-size: 1.6rem; color: var(--fg); font-weight: 500; }

    .ht-empty { background: var(--bg-2); border: 1px dashed var(--line-strong); border-radius: 24px; padding: 60px 32px; text-align: center; }
    .ht-empty-title { font-family: var(--display); font-size: 2.2rem; line-height: 1.1; margin-bottom: 12px; color: var(--fg); }
    .ht-empty-title em { color: var(--accent); }
    .ht-empty-sub { color: var(--fg-2); margin-bottom: 28px; font-size: 0.95rem; max-width: 420px; margin-left: auto; margin-right: auto; line-height: 1.5; }

    .ht-btn { padding: 12px 24px; border-radius: 999px; font-family: var(--body); font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; display: inline-flex; align-items: center; gap: 8px; }
    .ht-btn-primary { background: var(--accent); color: var(--bg); }
    .ht-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(232,118,92,0.25); }
    .ht-btn-secondary { background: var(--bg-3); color: var(--fg); border: 1px solid var(--line); }
    .ht-btn-secondary:hover { background: var(--line); }
    .ht-btn-ghost { background: transparent; color: var(--fg-2); padding: 8px 14px; }
    .ht-btn-ghost:hover { color: var(--fg); }
    .ht-btn-danger { background: transparent; color: #C97268; border: 1px solid rgba(201,114,104,0.3); }
    .ht-btn-danger:hover { background: rgba(201,114,104,0.1); }

    .ht-section-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.25em; color: var(--fg-3); margin-bottom: 16px; font-weight: 500; }
    .ht-day-section { margin-top: 40px; }
    .ht-day-list { display: flex; flex-direction: column; gap: 10px; }
    .ht-day-item { background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; display: grid; grid-template-columns: 80px 1fr auto; gap: 18px; align-items: center; transition: all 0.2s; }
    .ht-day-item.past { opacity: 0.4; }
    .ht-day-item.current { border-color: var(--accent); background: linear-gradient(135deg, var(--bg-2), rgba(232,118,92,0.06)); }
    .ht-day-time { font-family: var(--mono); font-size: 0.85rem; color: var(--fg); line-height: 1.4; }
    .ht-day-time-sep { color: var(--fg-3); font-size: 0.75rem; }
    .ht-day-name { font-size: 1rem; color: var(--fg); font-weight: 500; margin-bottom: 4px; }
    .ht-day-room { font-family: var(--mono); font-size: 0.75rem; color: var(--fg-2); }
    .ht-cat-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
    .ht-cat-pill { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 500; }

    .ht-class-grid { display: flex; flex-direction: column; gap: 12px; }
    .ht-class-card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
    .ht-class-card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
    .ht-class-card-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
    .ht-class-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .ht-class-name { font-size: 1.15rem; color: var(--fg); font-weight: 500; }
    .ht-class-room { font-family: var(--mono); font-size: 0.75rem; color: var(--fg-2); }
    .ht-class-schedule { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .ht-class-block { font-family: var(--mono); font-size: 0.7rem; padding: 4px 10px; border-radius: 6px; background: var(--bg-3); color: var(--fg-2); }
    .ht-class-block-day { color: var(--fg); font-weight: 600; margin-right: 6px; }

    .ht-modal-bg { position: fixed; inset: 0; background: rgba(20,19,15,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.2s ease-out; }
    .ht-modal { background: var(--bg-2); border-radius: 24px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--line); animation: slideUp 0.25s cubic-bezier(0.16,1,0.3,1); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px) } to { opacity: 1; transform: translateY(0) } }
    .ht-modal-header { padding: 28px 28px 0; display: flex; justify-content: space-between; align-items: center; }
    .ht-modal-title { font-family: var(--display); font-size: 2rem; line-height: 1; }
    .ht-modal-close { background: var(--bg-3); border: none; color: var(--fg-2); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
    .ht-modal-close:hover { background: var(--line); color: var(--fg); }
    .ht-modal-body { padding: 24px 28px 28px; }

    .ht-field { margin-bottom: 18px; }
    .ht-label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--fg-3); margin-bottom: 8px; font-weight: 600; }
    .ht-input, .ht-select { width: 100%; padding: 12px 14px; background: var(--bg-3); border: 1px solid var(--line); border-radius: 10px; color: var(--fg); font-family: var(--body); font-size: 0.95rem; transition: border 0.15s; }
    .ht-input:focus, .ht-select:focus { outline: none; border-color: var(--accent); }
    .ht-input::placeholder { color: var(--fg-3); }

    .ht-cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
    .ht-cat-btn { padding: 10px 12px; border-radius: 10px; background: var(--bg-3); border: 1px solid var(--line); color: var(--fg-2); cursor: pointer; font-size: 0.8rem; font-family: var(--body); text-align: left; transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
    .ht-cat-btn.active { border-color: var(--fg); color: var(--fg); background: var(--bg-3); }

    .ht-day-picker { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .ht-day-btn { padding: 10px 2px; border-radius: 8px; background: var(--bg-3); border: 1px solid var(--line); color: var(--fg-2); cursor: pointer; font-size: 0.78rem; font-family: var(--body); font-weight: 600; letter-spacing: -0.02em; transition: all 0.15s; text-align: center; min-width: 0; }
    .ht-day-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

    .ht-time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .ht-block-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .ht-block-row { background: var(--bg-3); border: 1px solid var(--line); border-radius: 10px; padding: 14px; position: relative; }
    .ht-block-remove { position: absolute; top: 8px; right: 8px; background: transparent; border: none; color: var(--fg-3); cursor: pointer; font-size: 1rem; padding: 4px 8px; }
    .ht-block-remove:hover { color: #C97268; }

    .ht-form-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); gap: 12px; flex-wrap: wrap; }

    .ht-fab { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 24px); right: 24px; z-index: 50; padding: 14px 22px; border-radius: 999px; background: var(--accent); color: var(--bg); font-family: var(--body); font-size: 0.95rem; font-weight: 500; border: none; cursor: pointer; box-shadow: 0 10px 30px rgba(232,118,92,0.35); display: inline-flex; align-items: center; gap: 8px; }
    .ht-fab:hover { transform: translateY(-2px); }

    .ht-footer {
      margin-top: 80px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--fg-3);
      letter-spacing: 0.02em;
      flex-wrap: wrap;
      gap: 8px;
    }
    .ht-footer-logo {
      font-family: var(--display);
      font-style: italic;
      font-size: 1rem;
      color: var(--fg-2);
    }
    .ht-footer-logo span { color: var(--accent); }
    .ht-footer-version { display: inline-flex; gap: 8px; }
    .ht-footer-channel {
      color: var(--accent);
      padding-left: 8px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .ht-footer-date { padding-left: 8px; opacity: 0.7; }

    .ht-toast { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 90px); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 12px 22px; border-radius: 999px; font-size: 0.9rem; font-weight: 500; z-index: 200; box-shadow: 0 8px 32px rgba(0,0,0,0.4); animation: toastIn 0.3s cubic-bezier(0.16,1,0.3,1); }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }

    .ht-alert { background: rgba(201,162,39,0.08); border: 1px solid rgba(201,162,39,0.3); border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; font-size: 0.85rem; color: #E0BC4A; line-height: 1.5; }
    .ht-alert strong { color: #F0D070; }

    /* Bloque libre (tiempo entre clases) */
    .ht-free-item {
      background: transparent;
      border: 1px dashed var(--line-strong);
      border-radius: 14px;
      padding: 14px 20px;
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 18px;
      align-items: center;
      opacity: 0.85;
    }
    .ht-free-item.past { opacity: 0.3; }
    .ht-free-item.current { border-color: var(--accent); border-style: solid; background: linear-gradient(135deg, transparent, rgba(232,118,92,0.04)); opacity: 1; }
    .ht-free-time { font-family: var(--mono); font-size: 0.8rem; color: var(--fg-3); line-height: 1.4; }
    .ht-free-msg { font-size: 0.95rem; color: var(--fg-2); font-family: var(--display); font-style: italic; line-height: 1.3; }
    .ht-free-duration { font-family: var(--mono); font-size: 0.7rem; color: var(--fg-3); margin-top: 4px; }

    /* PDF drop zone */
    .ht-drop {
      border: 2px dashed var(--line-strong);
      border-radius: 16px;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg-3);
    }
    .ht-drop:hover { border-color: var(--accent); background: rgba(232,118,92,0.04); }
    .ht-drop.dragging { border-color: var(--accent); background: rgba(232,118,92,0.08); }
    .ht-drop-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }
    .ht-drop-title { font-family: var(--display); font-size: 1.4rem; margin-bottom: 6px; color: var(--fg); }
    .ht-drop-sub { font-size: 0.85rem; color: var(--fg-2); line-height: 1.5; }
    .ht-preview-list { max-height: 280px; overflow-y: auto; margin: 16px 0; }
    .ht-preview-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .ht-preview-item:last-child { border-bottom: 0; }
    .ht-preview-name { flex: 1; font-size: 0.9rem; color: var(--fg); }
    .ht-preview-meta { font-family: var(--mono); font-size: 0.7rem; color: var(--fg-3); }

    /* Lista de archivos en proceso */
    .ht-file-list { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
    .ht-file-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      background: var(--bg-3);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 0.85rem;
    }
    .ht-file-icon { font-size: 1.1rem; flex-shrink: 0; }
    .ht-file-name { flex: 1; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ht-file-status { font-family: var(--mono); font-size: 0.72rem; color: var(--fg-3); flex-shrink: 0; }
    .ht-file-status.done { color: #7BA05B; }
    .ht-file-status.error { color: #C97268; }
    .ht-file-status.processing { color: var(--accent); }
    .ht-progress-bar {
      width: 100%; height: 3px;
      background: var(--bg-3); border-radius: 999px;
      overflow: hidden; margin-top: 6px;
    }
    .ht-progress-fill {
      height: 100%; background: var(--accent);
      transition: width 0.3s ease;
    }
    .ht-ocr-warning {
      font-size: 0.75rem;
      color: var(--fg-3);
      margin-top: 12px;
      font-style: italic;
      line-height: 1.5;
    }

    @media (max-width: 500px) {
      .ht-day-item { grid-template-columns: 70px 1fr; gap: 12px; }
      .ht-day-item > :nth-child(3) { grid-column: 1 / -1; }
      .ht-free-item { grid-template-columns: 70px 1fr; gap: 12px; }
      .ht-fab { bottom: calc(env(safe-area-inset-bottom) + 16px); right: 16px; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="initial-loader">cargando tu horario…</div>
  </div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://unpkg.com/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    }
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useCallback } = React;

    // ============================================================
    //  horario. — schedule app para clases/cursos
    //  Datos guardados localmente en este navegador (localStorage)
    //  Usa Exportar/Importar para mover el horario entre dispositivos
    // ============================================================

    const CATEGORIES = {
      academica: { label: "Académica", color: "#5B9BD5", soft: "rgba(91,155,213,0.12)" },
      life: { label: "Deporte / Life", color: "#7BA05B", soft: "rgba(123,160,91,0.14)" },
      lenguas: { label: "Lengua Extranjera", color: "#E8765C", soft: "rgba(232,118,92,0.14)" },
      cocurricular: { label: "Cocurricular", color: "#C9A227", soft: "rgba(201,162,39,0.14)" },
      otro: { label: "Otro", color: "#A78BC9", soft: "rgba(167,139,201,0.14)" },
    };

    const DAYS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
    const DAYS_FULL = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
    const STORAGE_KEY = "horario-tec-v1";
    const APP_VERSION = "0.6.0";
    const APP_CHANNEL = "stable";
    const APP_BUILD_DATE = "2026-05-13";

    // Mensajes para bloques de tiempo libre — deterministic por slot
    const FREE_MESSAGES = [
      "Tiempo libre — ve a comer algo 🥪",
      "Ventana entre clases. Avanza tareas o tira hueva 😌",
      "Espacio para un café ☕ o respirar tantito",
      "Hueco libre — perfecto para una vuelta rápida",
      "Pausa. Estira las piernas, te lo ganaste",
      "Sin clase. Hidrátate, ve al baño, etc",
      "Tiempo muerto — productivo si tú quieres",
      "Libre. Charla con alguien o haz tarea",
      "Espacio entre clases — aprovecha 🌞",
      "Pausa estratégica. No la desperdicies (o sí)",
      "Hora libre — momento ideal para un OXXO break",
      "Sin pendientes por ahora. Disfruta",
    ];

    const getFreeMessage = (startMin, endMin) => {
      const idx = Math.abs((startMin * 13 + endMin * 7)) % FREE_MESSAGES.length;
      return FREE_MESSAGES[idx];
    };

    const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

    const toMin = (hhmm) => {
      if (!hhmm) return 0;
      const [h, m] = hhmm.split(":").map(Number);
      return h * 60 + m;
    };

    const fromMin = (mins) => {
      const h = Math.floor(mins / 60).toString().padStart(2, "0");
      const m = (mins % 60).toString().padStart(2, "0");
      return `${h}:${m}`;
    };

    const fmtDuration = (mins) => {
      if (mins < 1) return "menos de 1 min";
      if (mins < 60) return `${Math.round(mins)} min`;
      const h = Math.floor(mins / 60);
      const m = Math.round(mins % 60);
      return m === 0 ? `${h} h` : `${h} h ${m} min`;
    };

    // ============================================================
    //  PDF PARSER — extrae horarios de PDFs con formato tabular
    // ============================================================
    const DAY_MAP = { Lun: 1, Mar: 2, "Mié": 3, Mie: 3, Jue: 4, Vie: 5, "Sáb": 6, Sab: 6, Dom: 0 };

    const normTime = (h, m) => `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;

    async function extractPdfText(file) {
      if (!window.pdfjsLib) throw new Error("PDF.js no cargó");
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      let allText = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const items = content.items.filter((it) => it.str !== undefined && it.str.length > 0);

        // 1. Agrupar items por línea visual (Y similar, tolerancia 3pt)
        items.sort((a, b) => {
          const dy = b.transform[5] - a.transform[5];
          if (Math.abs(dy) > 3) return dy;
          return a.transform[4] - b.transform[4];
        });

        const lines = [];
        let curLine = [];
        let lastY = null;
        for (const it of items) {
          const y = it.transform[5];
          if (lastY === null || Math.abs(y - lastY) < 3) {
            curLine.push(it);
          } else {
            if (curLine.length) lines.push(curLine);
            curLine = [it];
          }
          lastY = y;
        }
        if (curLine.length) lines.push(curLine);

        // 2. Dentro de cada línea, separar por columnas usando gaps grandes en X
        const processedLines = [];
        for (const line of lines) {
          line.sort((a, b) => a.transform[4] - b.transform[4]);
          const parts = [[line[0]]];
          for (let k = 1; k < line.length; k++) {
            const prev = line[k - 1];
            const curr = line[k];
            const prevEnd = prev.transform[4] + (prev.width || prev.str.length * 4);
            const gap = curr.transform[4] - prevEnd;
            if (gap > 25) {
              parts.push([curr]); // nueva columna
            } else {
              parts[parts.length - 1].push(curr);
            }
          }
          for (const part of parts) {
            const text = part.map((it) => it.str).join(" ").replace(/\s+/g, " ").trim();
            if (text) processedLines.push(text);
          }
        }
        allText += processedLines.join("\n") + "\n";
      }
      return allText;
    }

    // Preprocesar imagen para OCR: escalar 2x, escala de grises, aumento de contraste suave
    async function preprocessImage(file) {
      const img = new Image();
      const url = URL.createObjectURL(file);
      try {
        await new Promise((res, rej) => {
          img.onload = res;
          img.onerror = rej;
          img.src = url;
        });

        // Escalar 2x para que el OCR vea mejor el texto chico
        const scale = img.width < 1600 ? 2 : 1.3;
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        // Aplicar grayscale + aumento de contraste MODERADO (sin threshold agresivo)
        // Esto preserva detalle en texto chico como los tiempos
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          let gray = 0.299 * r + 0.587 * g + 0.114 * b;
          // contraste más suave: 1.4x (antes 1.8x)
          gray = (gray - 128) * 1.4 + 128;
          gray = Math.max(0, Math.min(255, gray));
          data[i] = data[i + 1] = data[i + 2] = gray;
        }
        ctx.putImageData(imageData, 0, 0);

        return await new Promise((res) => canvas.toBlob(res, "image/png"));
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    // OCR para imágenes — usa Tesseract.js con preprocesamiento
    // Hace DOS pasadas: una con preprocess (mejor para celdas/materias)
    // y otra sin preprocess sobre la columna izquierda (mejor para tiempos chicos)
    async function extractImageText(file, onProgress) {
      if (!window.Tesseract) throw new Error("Tesseract no cargó");
      if (onProgress) onProgress(2);

      // Pasada 1: imagen preprocesada (alto contraste, buena para texto grande de celdas)
      const processed = await preprocessImage(file).catch(() => file);
      const result1 = await Tesseract.recognize(processed, "spa+eng", {
        logger: (m) => {
          if (m.status === "recognizing text" && onProgress) {
            onProgress(2 + Math.round(m.progress * 50));
          }
        },
      });

      // Pasada 2: imagen sin preprocesar (mejor para texto chico/colorido como tiempos)
      // Solo si la pasada 1 no encontró ningún tiempo, hacemos esta extra
      const text1 = result1.data.text;
      const words1 = (result1.data.words || []).map((w) => ({
        text: w.text,
        x0: w.bbox?.x0 ?? 0,
        y0: w.bbox?.y0 ?? 0,
        x1: w.bbox?.x1 ?? 0,
        y1: w.bbox?.y1 ?? 0,
      }));

      const TIME_RE = /^(\d{1,2})[:.](\d{2})$/;
      const timesFound1 = words1.filter((w) => TIME_RE.test(w.text.trim().replace(/[^\d:.]/g, ""))).length;
      console.log("[horario] Pasada 1 (preprocess): " + words1.length + " palabras, " + timesFound1 + " tiempos");

      let words = words1;
      let text = text1;

      if (timesFound1 < 4) {
        // los tiempos se perdieron — intentar segunda pasada sin preprocess
        if (onProgress) onProgress(52);
        console.log("[horario] Pocos tiempos detectados, intentando segunda pasada sin preprocesamiento...");
        try {
          const result2 = await Tesseract.recognize(file, "spa+eng", {
            logger: (m) => {
              if (m.status === "recognizing text" && onProgress) {
                onProgress(52 + Math.round(m.progress * 48));
              }
            },
          });
          const words2 = (result2.data.words || []).map((w) => ({
            text: w.text,
            x0: w.bbox?.x0 ?? 0,
            y0: w.bbox?.y0 ?? 0,
            x1: w.bbox?.x1 ?? 0,
            y1: w.bbox?.y1 ?? 0,
          }));
          const timesFound2 = words2.filter((w) => TIME_RE.test(w.text.trim().replace(/[^\d:.]/g, ""))).length;
          console.log("[horario] Pasada 2 (raw): " + words2.length + " palabras, " + timesFound2 + " tiempos");

          // mezclar: usar palabras de la pasada 2 SOLO para tiempos en la columna izquierda
          // las palabras de la pasada 1 para todo lo demás
          if (timesFound2 > timesFound1) {
            const timeWordsFromRaw = words2.filter((w) =>
              TIME_RE.test(w.text.trim().replace(/[^\d:.]/g, ""))
            );
            // añadir los tiempos de la pasada 2 a las palabras de la pasada 1
            words = [...words1, ...timeWordsFromRaw];
            console.log("[horario] Mezclando: " + timeWordsFromRaw.length + " tiempos extra de la pasada raw");
          }
        } catch (e) {
          console.warn("[horario] Pasada 2 falló:", e);
        }
      }

      // log debug global accesible desde consola
      window.__horarioDebug = window.__horarioDebug || {};
      window.__horarioDebug.lastWords = words;
      window.__horarioDebug.lastText = text;
      window.__horarioDebug.gridLog = [];
      console.log("[horario] Total final: " + words.length + " palabras detectadas");

      const gridText = tryReconstructGrid(words);
      window.__horarioDebug.lastGridText = gridText;
      console.log("[horario] Reconstrucción: " + (gridText ? "ÉXITO" : "FALLÓ"));

      const finalText = gridText || text;
      return { text: finalText, rawText: text, gridText, words, wordCount: words.length };
    }

    // ============================================================
    //  RECONSTRUCTOR DE REJILLA v2
    //  Estrategia: encontrar la columna de HORAS a la izquierda
    //  (más confiable que el encabezado de días que suele ser texto blanco
    //  sobre fondo de color y el OCR lo destruye)
    //  Luego: detectar columnas de días por clustering de X de las celdas
    // ============================================================
    function tryReconstructGrid(words) {
      const log = (msg) => {
        if (window.__horarioDebug && window.__horarioDebug.gridLog) {
          window.__horarioDebug.gridLog.push(msg);
        }
        console.log("[horario/grid] " + msg);
      };

      if (!words || words.length < 15) {
        log("ABORT: muy pocas palabras (" + (words?.length || 0) + " < 15)");
        return null;
      }
      log("inicio: " + words.length + " palabras");

      const TIME_RE = /^(\d{1,2})[:.](\d{2})$/;

      // 1. Buscar TODAS las palabras que parezcan tiempo
      const timeWords = [];
      for (const w of words) {
        const cleaned = w.text.trim().replace(/[^\d:.]/g, "");
        const m = cleaned.match(TIME_RE);
        if (m) {
          const h = parseInt(m[1], 10);
          const min = parseInt(m[2], 10);
          if (h >= 0 && h <= 23 && min >= 0 && min <= 59) {
            timeWords.push({
              x: (w.x0 + w.x1) / 2,
              y: (w.y0 + w.y1) / 2,
              time: `${String(h).padStart(2, "0")}:${String(min).padStart(2, "0")}`,
              minutes: h * 60 + min,
              raw: w.text,
            });
          }
        }
      }
      log("paso 1: encontré " + timeWords.length + " palabras tipo HH:MM");
      log("muestras: " + timeWords.slice(0, 5).map(t => `${t.time}@(${Math.round(t.x)},${Math.round(t.y)})`).join(", "));

      if (timeWords.length < 4) {
        log("ABORT: menos de 4 tiempos, no es rejilla horaria");
        return null;
      }

      // 2. Encontrar la columna izquierda de tiempos: cluster con X más pequeño
      timeWords.sort((a, b) => a.x - b.x);
      const leftmostX = timeWords[0].x;
      // expandimos a 120px para tolerar OCR (antes 80)
      const leftColumn = timeWords.filter((t) => t.x < leftmostX + 120);
      log("paso 2: leftmostX=" + Math.round(leftmostX) + ", tiempos en columna izq: " + leftColumn.length);
      if (leftColumn.length < 4) {
        log("ABORT: columna izquierda de tiempos tiene menos de 4 entradas");
        return null;
      }

      // 3. Ordenar por Y → secuencia de horas de arriba a abajo
      leftColumn.sort((a, b) => a.y - b.y);

      // 4. Dedup tiempos muy cercanos en Y (mismo "row")
      // tolerancia adaptativa: 1.5% del rango Y total
      const yRangeTotal = leftColumn[leftColumn.length - 1].y - leftColumn[0].y;
      const dedupTol = Math.max(10, yRangeTotal * 0.012);
      log("paso 4: dedup tolerance = " + Math.round(dedupTol) + "px");

      const timeRows = [];
      for (const t of leftColumn) {
        const last = timeRows[timeRows.length - 1];
        if (last && Math.abs(t.y - last.y) < dedupTol) continue;
        timeRows.push(t);
      }
      log("paso 4: " + timeRows.length + " filas únicas de tiempo: " + timeRows.map(t => t.time).join(", "));

      if (timeRows.length < 3) {
        log("ABORT: menos de 3 filas únicas de tiempo");
        return null;
      }

      // 5. Determinar el área del horario: desde el primer tiempo hasta el último
      const gridTopY = timeRows[0].y;
      const gridBottomY = timeRows[timeRows.length - 1].y;
      // las celdas empiezan a la derecha de la columna de tiempos, pero no muy lejos
      const gridLeftX = leftmostX + 40;
      log("paso 5: área grid Y=[" + Math.round(gridTopY) + "," + Math.round(gridBottomY) + "], leftX=" + Math.round(gridLeftX));

      // 6. Encontrar el límite derecho: la palabra más a la derecha dentro del rango Y de la rejilla
      let gridRightX = 0;
      for (const w of words) {
        const wy = (w.y0 + w.y1) / 2;
        if (wy >= gridTopY - 20 && wy <= gridBottomY + 20) {
          gridRightX = Math.max(gridRightX, w.x1);
        }
      }
      log("paso 6: gridRightX=" + Math.round(gridRightX));
      if (gridRightX <= gridLeftX) {
        log("ABORT: gridRightX <= gridLeftX, área inválida");
        return null;
      }

      // 7. Detectar columnas de días por clustering de X de las palabras dentro del grid
      const cellWords = words.filter((w) => {
        const wy = (w.y0 + w.y1) / 2;
        const wx = (w.x0 + w.x1) / 2;
        if (wy < gridTopY - 10 || wy > gridBottomY + 30) return false;
        if (wx < gridLeftX || wx > gridRightX + 20) return false;
        if (TIME_RE.test(w.text.trim().replace(/[^\d:.]/g, ""))) return false;
        if (w.text.trim().length < 2) return false;
        return true;
      });

      log("paso 7: " + cellWords.length + " palabras dentro de la rejilla");
      log("muestras celda: " + cellWords.slice(0, 6).map(w => `"${w.text}"@(${Math.round((w.x0+w.x1)/2)},${Math.round((w.y0+w.y1)/2)})`).join(", "));

      if (cellWords.length < 6) {
        log("ABORT: menos de 6 palabras en la rejilla");
        return null;
      }

      // 8. Asumir N columnas iguales entre gridLeftX y gridRightX
      // Heurística: contar palabras únicas por bandas de X, encontrar el número de columnas más probable
      // Empezar con 5 columnas (típico L-M-M-J-V), permitir 4-7
      // Probar diferentes counts y elegir el que distribuya las palabras más uniformemente
      let bestNumCols = 5;
      let bestVariance = Infinity;
      for (let numCols = 4; numCols <= 7; numCols++) {
        const totalWidth = gridRightX - gridLeftX;
        const colWidth = totalWidth / numCols;
        const counts = new Array(numCols).fill(0);
        for (const w of cellWords) {
          const wx = (w.x0 + w.x1) / 2;
          const col = Math.min(numCols - 1, Math.max(0, Math.floor((wx - gridLeftX) / colWidth)));
          counts[col]++;
        }
        // calcular varianza: queremos distribución uniforme
        const mean = counts.reduce((a, b) => a + b, 0) / numCols;
        const variance = counts.reduce((s, c) => s + (c - mean) ** 2, 0) / numCols;
        // normalizar por mean para preferir distribuciones más balanceadas
        const normVar = variance / (mean || 1);
        // criterio más permisivo: al menos 1 palabra en cada columna (antes 2)
        if (normVar < bestVariance && counts.every((c) => c >= 1)) {
          bestVariance = normVar;
          bestNumCols = numCols;
        }
      }

      const numCols = bestNumCols;
      const colWidth = (gridRightX - gridLeftX) / numCols;
      log("paso 8: best numCols=" + numCols + " (colWidth=" + Math.round(colWidth) + "px)");

      // 9. Mapeo de columna → día. Asumimos lunes a viernes para 5 cols, ajustar si es 6/7
      let colToDay;
      if (numCols === 5) colToDay = [1, 2, 3, 4, 5];
      else if (numCols === 6) colToDay = [1, 2, 3, 4, 5, 6];
      else if (numCols === 7) colToDay = [1, 2, 3, 4, 5, 6, 0];
      else colToDay = [1, 2, 3, 4];

      // 10. Para cada (slot, col), juntar palabras
      const classMap = {};
      const slots = [];
      const dedupTolSlot = Math.max(8, dedupTol * 0.7);
      for (let r = 0; r < timeRows.length - 1; r++) {
        const slot = {
          start: timeRows[r].time,
          end: timeRows[r + 1].time,
          yTop: timeRows[r].y,
          yBot: timeRows[r + 1].y,
        };
        if (slot.yBot - slot.yTop < dedupTolSlot) continue;
        // skip si el rango es muy largo (más de 4 horas: probablemente saltó algo grande)
        const slotMin = (parseInt(slot.end.split(":")[0]) * 60 + parseInt(slot.end.split(":")[1])) -
                        (parseInt(slot.start.split(":")[0]) * 60 + parseInt(slot.start.split(":")[1]));
        if (slotMin > 240 || slotMin <= 0) continue;
        slots.push(slot);
      }
      log("paso 10: " + slots.length + " slots horarios válidos");

      if (slots.length < 2) {
        log("ABORT: menos de 2 slots válidos");
        return null;
      }

      for (const slot of slots) {
        for (let c = 0; c < numCols; c++) {
          const colLeft = gridLeftX + c * colWidth;
          const colRight = gridLeftX + (c + 1) * colWidth;
          const cellWordsHere = cellWords.filter((w) => {
            const wy = (w.y0 + w.y1) / 2;
            const wx = (w.x0 + w.x1) / 2;
            return wy > slot.yTop - 2 && wy < slot.yBot + 4 &&
                   wx >= colLeft && wx < colRight;
          });
          if (cellWordsHere.length === 0) continue;

          cellWordsHere.sort((a, b) => a.y0 - b.y0 || a.x0 - b.x0);
          const cellText = cellWordsHere.map((w) => w.text).join(" ").trim();
          if (cellText.length < 3) continue;

          // separar nombre / salón
          const tokens = cellText.split(/\s+/);
          let room = "";
          let name = cellText;
          // si la última palabra es un número de 2-4 cifras → salón
          const lastTok = tokens[tokens.length - 1];
          if (/^\d{2,4}$/.test(lastTok) && tokens.length > 1) {
            room = lastTok;
            name = tokens.slice(0, -1).join(" ");
          }
          // limpiar puntos suspensivos y caracteres raros
          name = name.replace(/[|]+/g, "").replace(/\.{2,}$/, "").replace(/\s+/g, " ").trim();
          if (name.length < 3) continue;
          if (/^[\d\s.,]+$/.test(name)) continue;

          const key = name.toUpperCase().replace(/\s+/g, " ");
          if (!classMap[key]) classMap[key] = { name, room, schedule: [] };
          classMap[key].schedule.push({ day: colToDay[c], start: slot.start, end: slot.end });
          if (!classMap[key].room && room) classMap[key].room = room;
        }
      }

      // 11. Fusionar slots consecutivos
      const classes = Object.values(classMap);
      for (const cls of classes) {
        cls.schedule.sort((a, b) => a.day - b.day || a.start.localeCompare(b.start));
        const merged = [];
        for (const s of cls.schedule) {
          const last = merged[merged.length - 1];
          if (last && last.day === s.day && last.end === s.start) {
            last.end = s.end;
          } else {
            merged.push({ ...s });
          }
        }
        cls.schedule = merged;
      }

      log("paso 11: " + classes.length + " clases reconstruidas");
      if (classes.length === 0) {
        log("ABORT: 0 clases después de juntar celdas");
        return null;
      }

      log("ÉXITO: nombres detectados: " + classes.map(c => c.name).join(" | "));

      // 12. Generar texto formato "Materia:" para el parser principal
      const DAY_NAMES = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
      const lines = ["Materias del plan de estudios"];
      classes.forEach((c, i) => {
        lines.push(`Materia: AUTO${i + 1}`);
        lines.push(c.name);
        const byTimeKey = {};
        for (const s of c.schedule) {
          const k = `${s.start}-${s.end}`;
          if (!byTimeKey[k]) byTimeKey[k] = [];
          byTimeKey[k].push(s.day);
        }
        for (const [timeRange, days] of Object.entries(byTimeKey)) {
          const dayStr = days.map((d) => DAY_NAMES[d]).join(", ");
          const [start, end] = timeRange.split("-");
          lines.push(`${dayStr} ${start} - ${end}`);
        }
        if (c.room) lines.push(`Salón ${c.room} | CRN 0000`);
      });
      return lines.join("\n");
    }

    const isImageFile = (file) => /^image\//i.test(file.type) || /\.(png|jpg|jpeg|webp|bmp)$/i.test(file.name);
    const isPdfFile = (file) => file.type === "application/pdf" || /\.pdf$/i.test(file.name);

    // ============================================================
    //  EXTRACTOR DE MATERIAS CANDIDATAS — fallback cuando OCR no
    //  puede leer la rejilla horaria. Busca nombres de materias
    //  en cualquier parte del texto, los limpia y deduplica.
    // ============================================================
    function extractCandidateSubjects(text) {
      const candidates = [];
      const seen = new Map();

      // helper: limpiar línea de basura común
      const cleanLine = (raw) => {
        let s = raw;
        // quitar prefijos de bullet/iconos comunes del OCR: @, [, (, ), ], ., *, espacios
        s = s.replace(/^[\[\]\(\)@\)\(\.\*\-\s•◯◉○●]+/, "");
        // si empieza con cosa como "[) " o "(] " quitar
        s = s.replace(/^[^\w]+/, "");
        return s.trim();
      };

      // helper: detectar si una palabra parece apellido (todo mayúsculas, 4+ chars, no numeral)
      const looksLikeSurname = (t) => {
        if (t.length < 4) return false;
        if (/^(II|III|IV|VI|VII|VIII|FTC)$/i.test(t)) return false;
        // todo mayúsculas o con acentos mayúsculos
        return /^[A-ZÁÉÍÓÚÑ]+$/.test(t) || /^[A-ZÁÉÍÓÚÑ]+[\.,]$/.test(t);
      };

      // helper: detectar inicio del nombre del profesor en una lista de tokens
      // los nombres de profesor típicamente son 2+ palabras MAYÚSCULAS consecutivas
      const findProfessorStart = (tokens) => {
        for (let i = 1; i < tokens.length - 1; i++) {
          // limpiar punctuation del token actual
          const t = tokens[i].replace(/[\.,]/g, "");
          const tNext = tokens[i + 1].replace(/[\.,]/g, "");
          if (looksLikeSurname(t) && looksLikeSurname(tNext)) {
            return i;
          }
        }
        // backup: buscar coma — los profesores suelen tener "APELLIDO, NOMBRE"
        for (let i = 1; i < tokens.length; i++) {
          if (tokens[i].includes(",")) {
            // retroceder hasta encontrar inicio del nombre (palabra anterior en mayúsculas)
            for (let j = i; j >= 1; j--) {
              if (looksLikeSurname(tokens[j].replace(/[\.,]/g, ""))) {
                return j;
              }
            }
            return i;
          }
        }
        return -1;
      };

      // 1. Sección "Inscripciones de clases" — la fuente más limpia
      const inscMatch = text.match(/Inscripciones\s+de\s+clases([\s\S]+?)(?:https?:|$)/i);
      if (inscMatch) {
        const section = inscMatch[1];
        const lines = section.split("\n").map(l => l.trim()).filter(Boolean);
        for (let line of lines) {
          // saltar headers
          if (/^(Clase\s+Profesor|Profesor\s+Grupo|Clase|Profesor|Grupo)/i.test(line)) continue;

          let clean = cleanLine(line);
          if (clean.length < 4) continue;

          // quitar sufijo de grupo: "3-F", "3F", "3", "ROBÓTICA" al final
          clean = clean.replace(/\s+(3-?F?|ROBÓTICA)\s*$/i, "").trim();

          const tokens = clean.split(/\s+/);
          if (tokens.length < 2) {
            // posible que sea solo nombre de materia, mantener
            const norm = clean.toUpperCase().replace(/\s+/g, " ");
            if (!seen.has(norm) && /[A-ZÁÉÍÓÚÑ]{3,}/.test(clean)) {
              seen.set(norm, clean);
              candidates.push(clean);
            }
            continue;
          }

          // separar materia / profesor
          const profStart = findProfessorStart(tokens);
          let subjectTokens;
          if (profStart > 0) {
            subjectTokens = tokens.slice(0, profStart);
          } else {
            // si no detectamos profesor, asumimos toda la línea es materia
            subjectTokens = tokens;
          }

          // limpiar tokens basura (numerales romanos rotos como "Nl", "If", "til", "Il", "Ii")
          // los conservamos pero los normalizamos a "III" o "II" cuando son obvios
          const subject = subjectTokens.join(" ")
            .replace(/\b(Nl|nl|NI|N!|N1)\b/g, "III") // OCR confunde III con Nl frecuentemente
            .replace(/\b(Il|il|I1|i1)\b/g, "III")
            .replace(/\b(Ii|ii|i!)\b/g, "II")
            .replace(/\btil\b/g, "III")
            .replace(/\b(If|lf|1f)\b/g, "II")
            .replace(/\s+/g, " ")
            .trim();

          if (subject.length < 4) continue;
          // descartar si parece basura
          if (!/[A-ZÁÉÍÓÚÑ]{3,}/.test(subject)) continue;
          if (/^(Clase|Profesor|Grupo|Materia)\s*$/i.test(subject)) continue;

          // título case suave: si todo mayúsculas, convertir a Title Case para que se vea mejor
          let display = subject;
          if (subject === subject.toUpperCase()) {
            display = subject.toLowerCase().replace(/\b[a-záéíóúñ]/g, (c) => c.toUpperCase());
          }

          const norm = display.toUpperCase().replace(/\s+/g, " ");
          if (!seen.has(norm)) {
            seen.set(norm, display);
            candidates.push(display);
          }
        }
      }

      // 2. COMPLEMENTAR desde el cuerpo del texto: buscar PALABRAS-MATERIA
      //    conocidas que pueden haberse perdido en la sección Inscripciones
      //    por OCR roto (ej: CHEMISTRY → "creistrr", HEALTH → "aun")
      // Vocabulario de palabras-clave comunes en horarios escolares
      const KNOWN_SUBJECTS = [
        "CHEMISTRY", "PHYSICS", "BIOLOGY", "MATHEMATICS", "MATEMATICAS", "MATEMÁTICAS",
        "HISTORY", "HISTORIA", "ESPAÑOL", "ESPANOL", "ENGLISH", "INGLES", "INGLÉS",
        "FRANCES", "FRANCÉS", "FRENCH", "GERMAN", "ALEMAN",
        "HEALTH", "SALUD", "ARTS", "ARTE", "VISUAL", "MUSIC", "MUSICA", "MÚSICA",
        "GRAMMAR", "WRITING", "READING", "LITERATURE", "LITERATURA",
        "GEOGRAFÍA", "GEOGRAFIA", "FÍSICA", "FISICA", "QUÍMICA", "QUIMICA",
        "ROBÓTICA", "ROBOTICA", "TECHNOLOGY", "TECNOLOGÍA", "TECNOLOGIA",
        "TUTORÍA", "TUTORIA", "CHARACTER", "FORMACIÓN", "FORMACION",
        "CÍVICA", "CIVICA", "ÉTICA", "ETICA", "FILOSOFÍA", "FILOSOFIA",
        "EDUCACIÓN", "EDUCACION", "DEPORTE", "EDUCACIÓN FÍSICA",
        "APPLIED", "ALGEBRA", "GEOMETRY", "CALCULUS", "CALCULO", "CÁLCULO",
      ];

      const bodyText = text.toUpperCase();
      for (const subject of KNOWN_SUBJECTS) {
        // buscar la palabra como token completo (con boundaries)
        const re = new RegExp(`\\b${subject.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\b`, "i");
        if (re.test(bodyText)) {
          // capitalizar bonito
          const display = subject.charAt(0).toUpperCase() + subject.slice(1).toLowerCase();
          const norm = display.toUpperCase();
          // solo agregar si NO está ya en candidates (parcial)
          const alreadyHave = candidates.some(c => {
            const cNorm = c.toUpperCase();
            return cNorm.includes(norm) || norm.includes(cNorm);
          });
          if (!alreadyHave && !seen.has(norm)) {
            seen.set(norm, display);
            candidates.push(display);
          }
        }
      }

      return candidates;
    }

    function parseTecSchedule(text) {
      const rawLines = text.split("\n").map((l) => l.trim()).filter(Boolean);

      // 1. Recorrer una vez para identificar secciones y bloques de materia
      let currentSection = "academica";
      const blocks = []; // { code, name, section, lines: [] }
      let cur = null;

      for (let i = 0; i < rawLines.length; i++) {
        const line = rawLines[i];

        // detectar headers de sección
        if (/LE\s*-\s*Lengua/i.test(line) || /^Lengua\s+extranjera/i.test(line)) currentSection = "lenguas";
        else if (/Materias\s+LiFE/i.test(line) || /^LiFE/i.test(line)) currentSection = "life";
        else if (/Materias\s+del\s+plan/i.test(line)) currentSection = "academica";
        else if (/Materias?\s+cocurricular/i.test(line) || /^Cocurricular/i.test(line)) currentSection = "cocurricular";

        const mMat = line.match(/^Materia:\s*(.+?)\s*$/i);
        if (mMat) {
          if (cur) blocks.push(cur);
          // siguiente línea con contenido útil = nombre
          let name = "";
          for (let j = i + 1; j < rawLines.length; j++) {
            const cand = rawLines[j];
            if (cand.length > 1 && !/^Materia:/i.test(cand) && !/^Materias?\s+/i.test(cand)) {
              name = cand;
              break;
            }
          }
          cur = { code: mMat[1].trim(), name, section: currentSection, lines: [] };
          continue;
        }

        if (cur) cur.lines.push(line);
      }
      if (cur) blocks.push(cur);

      // 2. Para cada bloque, sacar horarios, salón con regex globales
      const SCHEDULE_RE = /((?:Lun|Mar|Mié|Mie|Jue|Vie|Sáb|Sab|Dom)(?:\s*,\s*(?:Lun|Mar|Mié|Mie|Jue|Vie|Sáb|Sab|Dom))*)\s+(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})/g;
      const LOCATION_RE = /([A-Z]{2,5}\s*\|\s*[^|\n]+?\s*\|\s*\S+)/;
      const ROOM_RE = /(\S+)\s*\|\s*CRN\s*\d+/;

      const classes = [];
      for (const block of blocks) {
        const blob = block.lines.join("\n");

        // horarios — puede haber varios
        const scheduleRaw = [];
        let m;
        SCHEDULE_RE.lastIndex = 0;
        while ((m = SCHEDULE_RE.exec(blob)) !== null) {
          const days = m[1].split(",").map((d) => d.trim());
          const start = normTime(m[2], m[3]);
          const end = normTime(m[4], m[5]);
          // validar que tiene sentido (start < end, dentro de horario humano)
          if (toMin(start) >= toMin(end)) continue;
          for (const d of days) {
            const dn = DAY_MAP[d];
            if (dn !== undefined) scheduleRaw.push({ day: dn, start, end });
          }
        }

        // deduplicar
        const seen = new Set();
        const schedule = scheduleRaw.filter((s) => {
          const k = `${s.day}-${s.start}-${s.end}`;
          if (seen.has(k)) return false;
          seen.add(k);
          return true;
        });

        if (schedule.length === 0) continue;

        // ubicación
        let location = "";
        const mLoc = blob.match(LOCATION_RE);
        if (mLoc) location = mLoc[1].trim();

        // salón
        let roomNum = "";
        for (const ln of block.lines) {
          const r = ln.match(ROOM_RE);
          if (r) { roomNum = r[1]; break; }
        }

        const roomParts = [];
        if (location) roomParts.push(location.replace(/^[A-Z]{2,5}\s*\|\s*/, ""));
        if (roomNum) roomParts.push(`Salón ${roomNum}`);

        classes.push({
          id: uid(),
          code: block.code,
          name: block.name || block.code,
          room: roomParts.join(" · "),
          category: block.section,
          schedule,
          description: "",
        });
      }

      return classes;
    }

    // ============================================================
    //  TIMELINE — incluye bloques de tiempo libre entre clases
    // ============================================================
    const buildTimelineWithFreeSlots = (todayBlocks) => {
      if (todayBlocks.length === 0) return [];
      const slots = [];
      for (let i = 0; i < todayBlocks.length; i++) {
        slots.push({ type: "class", ...todayBlocks[i] });
        if (i < todayBlocks.length - 1) {
          const gap = todayBlocks[i + 1].start - todayBlocks[i].end;
          if (gap >= 15) {
            const start = todayBlocks[i].end;
            const end = todayBlocks[i + 1].start;
            slots.push({
              type: "free",
              start,
              end,
              startStr: fromMin(start),
              endStr: fromMin(end),
              message: getFreeMessage(start, end),
            });
          }
        }
      }
      return slots;
    };

    const analyzeSchedule = (classes, now) => {
      const day = now.getDay();
      const currentMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
      const allBlocks = [];
      classes.forEach((c) => {
        c.schedule.forEach((s, idx) => {
          allBlocks.push({
            classId: c.id, name: c.name, room: c.room, category: c.category,
            day: s.day, start: toMin(s.start), end: toMin(s.end),
            startStr: s.start, endStr: s.end, blockIdx: idx,
          });
        });
      });
      const todayBlocks = allBlocks.filter((b) => b.day === day).sort((a, b) => a.start - b.start);
      let current = null, next = null;
      for (const b of todayBlocks) {
        if (currentMin >= b.start && currentMin < b.end) { current = b; break; }
      }
      for (let offset = 0; offset < 7; offset++) {
        const checkDay = (day + offset) % 7;
        const blocksThatDay = allBlocks.filter((b) => b.day === checkDay).sort((a, b) => a.start - b.start);
        for (const b of blocksThatDay) {
          if (offset === 0) {
            if (b.start > currentMin) { next = { ...b, dayOffset: 0 }; break; }
          } else {
            next = { ...b, dayOffset: offset }; break;
          }
        }
        if (next) break;
      }
      return { current, next, todayBlocks, allBlocks };
    };

    const detectOverlaps = (classes) => {
      const blocks = [];
      classes.forEach((c) => {
        c.schedule.forEach((s) => {
          blocks.push({ classId: c.id, name: c.name, day: s.day, start: toMin(s.start), end: toMin(s.end), startStr: s.start, endStr: s.end });
        });
      });
      const overlaps = [];
      for (let i = 0; i < blocks.length; i++) {
        for (let j = i + 1; j < blocks.length; j++) {
          const a = blocks[i], b = blocks[j];
          if (a.day === b.day && a.start < b.end && b.start < a.end && a.classId !== b.classId) {
            overlaps.push({ a, b });
          }
        }
      }
      return overlaps;
    };

    // ============================================================
    //  STORAGE — localStorage con verificación
    // ============================================================
    const storage = {
      isAvailable: () => {
        try {
          const k = "__ht_test__";
          localStorage.setItem(k, "1");
          localStorage.removeItem(k);
          return true;
        } catch { return false; }
      },
      load: () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch { return []; }
      },
      save: (classes) => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(classes));
          return true;
        } catch { return false; }
      },
    };

    // ============================================================
    //  APP
    // ============================================================
    function App() {
      const [classes, setClasses] = useState([]);
      const [loaded, setLoaded] = useState(false);
      const [editorOpen, setEditorOpen] = useState(false);
      const [editingClass, setEditingClass] = useState(null);
      const [view, setView] = useState("home");
      const [now, setNow] = useState(new Date());
      const [toast, setToast] = useState(null);
      const [storageOk, setStorageOk] = useState(true);
      const [pdfModalOpen, setPdfModalOpen] = useState(false);

      useEffect(() => {
        const t = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(t);
      }, []);

      useEffect(() => {
        const ok = storage.isAvailable();
        setStorageOk(ok);
        if (ok) setClasses(storage.load());
        setLoaded(true);
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2800);
      };

      const persist = useCallback((next) => {
        if (!storageOk) return;
        if (!storage.save(next)) {
          setStorageOk(false);
          showToast("⚠ No se pudo guardar — usa Exportar como respaldo");
        }
      }, [storageOk]);

      const upsertClass = (cls) => {
        setClasses((prev) => {
          const exists = prev.some((c) => c.id === cls.id);
          const next = exists ? prev.map((c) => (c.id === cls.id ? cls : c)) : [...prev, cls];
          persist(next);
          return next;
        });
        setEditorOpen(false);
        setEditingClass(null);
        showToast(`✓ ${cls.name} guardada`);
      };

      const deleteClass = (id) => {
        setClasses((prev) => {
          const next = prev.filter((c) => c.id !== id);
          persist(next);
          return next;
        });
        setEditorOpen(false);
        setEditingClass(null);
        showToast("Clase eliminada");
      };

      const clearAll = () => {
        if (!window.confirm("¿Borrar TODO el horario? Esto no se puede deshacer.")) return;
        setClasses([]);
        persist([]);
        showToast("Horario reiniciado");
      };

      const exportData = async () => {
        const data = JSON.stringify(classes, null, 2);
        try {
          await navigator.clipboard.writeText(data);
          showToast("✓ Horario copiado al portapapeles");
        } catch {
          window.prompt("Copia este texto y guárdalo donde quieras:", data);
        }
      };

      const importData = () => {
        const raw = window.prompt("Pega aquí el JSON de tu horario:");
        if (!raw) return;
        try {
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) throw new Error("formato inválido");
          for (const c of parsed) {
            if (!c.id || !c.name || !Array.isArray(c.schedule)) throw new Error("clase mal formada");
          }
          setClasses(parsed);
          persist(parsed);
          showToast(`✓ ${parsed.length} clase${parsed.length !== 1 ? "s" : ""} importada${parsed.length !== 1 ? "s" : ""}`);
        } catch {
          showToast("⚠ El texto no es un horario válido");
        }
      };

      const importFromPdf = (parsedClasses, mode = "replace") => {
        // mode: "replace" o "merge"
        let next;
        if (mode === "merge") {
          const existingCodes = new Set(classes.map((c) => c.code).filter(Boolean));
          const toAdd = parsedClasses.filter((c) => !c.code || !existingCodes.has(c.code));
          next = [...classes, ...toAdd];
        } else {
          next = parsedClasses;
        }
        setClasses(next);
        persist(next);
        setPdfModalOpen(false);
        showToast(`✓ ${parsedClasses.length} clase${parsedClasses.length !== 1 ? "s" : ""} importada${parsedClasses.length !== 1 ? "s" : ""} del PDF`);
      };

      const { current, next, todayBlocks } = useMemo(() => analyzeSchedule(classes, now), [classes, now]);
      const overlaps = useMemo(() => detectOverlaps(classes), [classes]);

      if (!loaded) return null;

      return (
        <div className="ht-app">
          <div className="ht-grain" />
          <div className="ht-container">
            <header className="ht-header">
              <div className="ht-logo">horario<span>.</span></div>
              <div className="ht-clock">
                <div className="ht-clock-big">
                  {now.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false })}
                </div>
                <div className="ht-clock-day">
                  {DAYS_FULL[now.getDay()]} · {now.getDate()} {now.toLocaleString("es-MX", { month: "short" })}
                </div>
              </div>
            </header>

            {classes.length > 0 && (
              <div className="ht-tabs">
                <button className={`ht-tab ${view === "home" ? "active" : ""}`} onClick={() => setView("home")}>Ahora</button>
                <button className={`ht-tab ${view === "schedule" ? "active" : ""}`} onClick={() => setView("schedule")}>Mi horario</button>
              </div>
            )}

            {!storageOk && (
              <div className="ht-alert" style={{ background: "rgba(232,118,92,0.08)", borderColor: "rgba(232,118,92,0.35)", color: "#F0A090" }}>
                <strong>⚠ Tu navegador no permite guardar.</strong> Puede ser modo privado/incógnito. Usa Exportar/Importar para conservar tu horario manualmente.
              </div>
            )}

            {overlaps.length > 0 && (
              <div className="ht-alert">
                <strong>⚠ Encontré {overlaps.length} traslape{overlaps.length > 1 ? "s" : ""}:</strong>{" "}
                {overlaps.slice(0, 2).map((o, i) => (
                  <span key={i}>{o.a.name} y {o.b.name} en {DAYS[o.a.day]}{i < overlaps.slice(0, 2).length - 1 ? "; " : ""}</span>
                ))}
                {overlaps.length > 2 && ` y ${overlaps.length - 2} más`}.
              </div>
            )}

            {classes.length === 0 && (
              <div className="ht-empty">
                <div className="ht-empty-title">Empieza tu <em>semestre</em></div>
                <p className="ht-empty-sub">
                  Sube el PDF de tu horario escolar y armo todo en automático: materias, días, horas, salones y categorías. O agrégalas a mano una por una.
                </p>
                <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>
                  <button className="ht-btn ht-btn-primary" onClick={() => setPdfModalOpen(true)}>
                    📄 Importar desde PDF
                  </button>
                  <button className="ht-btn ht-btn-secondary" onClick={() => { setEditingClass(null); setEditorOpen(true); }}>
                    + Agregar manualmente
                  </button>
                </div>
              </div>
            )}

            {classes.length > 0 && view === "home" && (
              <HomeView current={current} next={next} todayBlocks={todayBlocks} now={now} classes={classes}
                onEdit={(cls) => { setEditingClass(cls); setEditorOpen(true); }} />
            )}

            {classes.length > 0 && view === "schedule" && (
              <ScheduleView classes={classes}
                onEdit={(cls) => { setEditingClass(cls); setEditorOpen(true); }}
                onClearAll={clearAll} onExport={exportData} onImport={importData}
                onImportPdf={() => setPdfModalOpen(true)} />
            )}

            <footer className="ht-footer">
              <span className="ht-footer-logo">horario<span>.</span></span>
              <span className="ht-footer-version">
                v{APP_VERSION}
                {APP_CHANNEL !== "stable" && <span className="ht-footer-channel">·{APP_CHANNEL}</span>}
                <span className="ht-footer-date">·{APP_BUILD_DATE}</span>
              </span>
            </footer>
          </div>

          {classes.length > 0 && (
            <button className="ht-fab" onClick={() => { setEditingClass(null); setEditorOpen(true); }}>
              <span style={{ fontSize: "1.1rem" }}>+</span> Agregar clase
            </button>
          )}

          {editorOpen && (
            <ClassEditor initial={editingClass} onSave={upsertClass} onDelete={deleteClass}
              onClose={() => { setEditorOpen(false); setEditingClass(null); }} />
          )}

          {pdfModalOpen && (
            <PdfImportModal
              hasExisting={classes.length > 0}
              onImport={importFromPdf}
              onClose={() => setPdfModalOpen(false)}
            />
          )}

          {toast && <div className="ht-toast">{toast}</div>}
        </div>
      );
    }

    function HomeView({ current, next, todayBlocks, now, classes, onEdit }) {
      const currentMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
      let countdown = null;
      if (current) {
        countdown = { label: "Termina en", value: fmtDuration(current.end - currentMin) };
      } else if (next) {
        let mins;
        if (next.dayOffset === 0) mins = next.start - currentMin;
        else mins = (24 * 60 - currentMin) + (next.dayOffset - 1) * 24 * 60 + next.start;
        countdown = { label: "Empieza en", value: fmtDuration(mins) };
      }
      const findClass = (id) => classes.find((c) => c.id === id);
      const currentClassFull = current ? findClass(current.classId) : null;
      const nextClassFull = next ? findClass(next.classId) : null;

      return (
        <>
          {current ? (
            <div className="ht-now-card">
              <div className="ht-now-eyebrow"><span className="ht-pulse" />En curso<CategoryPill cat={current.category} /></div>
              <div className="ht-now-name">{current.name}</div>
              {currentClassFull?.description && (
                <div style={{ fontFamily: "var(--display)", fontStyle: "italic", color: "var(--fg-2)", marginBottom: 18, fontSize: "1rem", lineHeight: 1.4 }}>
                  {currentClassFull.description}
                </div>
              )}
              <div className="ht-now-meta">
                <div className="ht-now-meta-item"><div className="ht-now-meta-label">Salón</div><div className="ht-now-meta-value">{current.room || "—"}</div></div>
                <div className="ht-now-meta-item"><div className="ht-now-meta-label">Horario</div><div className="ht-now-meta-value">{current.startStr} – {current.endStr}</div></div>
                <div className="ht-now-meta-item"><div className="ht-now-meta-label">Duración</div><div className="ht-now-meta-value">{fmtDuration(current.end - current.start)}</div></div>
              </div>
              {countdown && (
                <div className="ht-countdown">
                  <span className="ht-countdown-label">{countdown.label}</span>
                  <span className="ht-countdown-value">{countdown.value}</span>
                </div>
              )}
            </div>
          ) : next ? (
            <div className="ht-now-card">
              <div className="ht-now-eyebrow">Siguiente clase <CategoryPill cat={next.category} /></div>
              <div className="ht-now-name">{next.name}</div>
              {nextClassFull?.description && (
                <div style={{ fontFamily: "var(--display)", fontStyle: "italic", color: "var(--fg-2)", marginBottom: 18, fontSize: "1rem", lineHeight: 1.4 }}>
                  {nextClassFull.description}
                </div>
              )}
              <div className="ht-now-meta">
                <div className="ht-now-meta-item"><div className="ht-now-meta-label">Salón</div><div className="ht-now-meta-value">{next.room || "—"}</div></div>
                <div className="ht-now-meta-item"><div className="ht-now-meta-label">Cuándo</div><div className="ht-now-meta-value">{next.dayOffset === 0 ? "Hoy" : next.dayOffset === 1 ? "Mañana" : DAYS_FULL[next.day]} · {next.startStr}</div></div>
                <div className="ht-now-meta-item"><div className="ht-now-meta-label">Duración</div><div className="ht-now-meta-value">{fmtDuration(next.end - next.start)}</div></div>
              </div>
              {countdown && (
                <div className="ht-countdown">
                  <span className="ht-countdown-label">{countdown.label}</span>
                  <span className="ht-countdown-value">{countdown.value}</span>
                </div>
